function texteRapport(r, p, nomFichier) {
  const d = dimsSaisies();
  const etat = devisMemo[p.code] || { qte: 1, opts: [], coefs: [] };
  const dv = calculerDevis(p, r, d, etat);
  const l = [];
  l.push("IMPRIMERIE DE JARRY - RAPPORT DE CONTROLE FICHIER");
  l.push("=".repeat(62));
  l.push("Fichier  : " + (vues.nomAvant || nomFichier));
  l.push("Produit  : " + p.produit + " (" + p.code + ")");
  l.push("Format   : " + (d ? `${d.larg} x ${d.haut} cm` : p.regle_dim === "FIXE" ? `${p.larg_cm} x ${p.haut_cm} cm` : "libre"));
  const rOrig = vues.rAvant || r;
  l.push("Fichier remis : " + (vues.avant ? `${vues.avant.largCm.toFixed(1)} x ${vues.avant.hautCm.toFixed(1)} cm de page` : "-")
       + `, format fini ${rOrig.lp.toFixed(1)} x ${rOrig.hp.toFixed(1)} cm`);
  if (vues.apres) l.push("Apres correction : " + vues.apres.largCm.toFixed(1) + " x " + vues.apres.hautCm.toFixed(1) + " cm de page");
  l.push("Quantite : " + (etat.qte || 1));
  if (dv) l.push("Montant  : " + dv.total.toFixed(2) + " " + TARIFS.devise + " " + TARIFS.mention);
  l.push("Date     : " + new Date().toLocaleString("fr-FR"));
  l.push("");
  l.push("VERDICT  : " + r.verdict + " - " + LIB[r.verdict][1]);
  l.push("=".repeat(62));
  l.push("");
  for (const [n, t, cons, mes] of r.constats) {
    l.push("[" + n.padEnd(6) + "] " + t + (mes ? "  (" + mes + ")" : ""));
    if (cons) l.push("         -> " + cons);
  }
  for (const k of Object.keys(VERIFS)) {
    const v = VERIFS[k];
    l.push("[VERIF ] " + k + " : " + v.libelle + " (" + new Date(v.quand).toLocaleString("fr-FR") + ")");
  }
  if (dv) {
    l.push(""); l.push("-".repeat(62)); l.push("DETAIL DU MONTANT");
    for (const x of dv.lignes) l.push("  " + (x.lib + (x.methode ? " (" + x.methode + ")" : "")).padEnd(46) + x.montant.toFixed(2));
    l.push("  " + "TOTAL".padEnd(46) + dv.total.toFixed(2) + " " + TARIFS.devise);
  }
  return l.join("\n");
}

function afficherRapport(r, p, nomFichier) {
  const txt = texteRapport(r, p, nomFichier);
  $("calques").innerHTML = `
  <div class="modale" id="modaleRapport" role="dialog" aria-label="Rapport de contrôle">
    <div class="boite">
      <div class="tete"><h2>Rapport de contrôle</h2>

      <pre id="rapTexte">${txt.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]))}</pre>
    </div>
  </div>`;
  $("rapFermer").onclick = () => { $("calques").innerHTML = ""; };
  $("modaleRapport").onclick = (e) => { if (e.target.id === "modaleRapport") $("calques").innerHTML = ""; };
  $("rapCopier").onclick = () => {

}

/* Journal des travaux et statistiques                                 */
/* ------------------------------------------------------------------ */
const CLE_JOURNAL = "calage.journal";
const MAX_JOURNAL = 3000;
let JOURNAL = [];
let ligneCourante = null;

function chargerJournal() {
  chargerChutes();
  try { JOURNAL = JSON.parse(localStorage.getItem(CLE_JOURNAL) || "[]"); }
  catch (e) { JOURNAL = []; }
}
function sauverJournal() {
  try {
    if (JOURNAL.length > MAX_JOURNAL) JOURNAL = JOURNAL.slice(-MAX_JOURNAL);
    localStorage.setItem(CLE_JOURNAL, JSON.stringify(JOURNAL));
  } catch (e) {}
}

/* Une ligne par fichier reçu. Elle est créée au dépôt puis mise à jour :
   changement de produit, correction, édition d'un document. */
function ouvrirLigne(nomFichier) {
  ligneCourante = {
    id: Date.now() + "-" + Math.random().toString(36).slice(2, 7),
    date: new Date().toISOString(),
    fichier: nomFichier, code: "", produit: "", famille: "",
    verdict: "", verdictFinal: "", corrige: false, actes: [],
    largRecu: null, hautRecu: null, largCmd: null, hautCmd: null,
    qte: null, montant: null, defauts: [],
  };
  JOURNAL.push(ligneCourante);
  sauverJournal();
}

function majLigne(r, p, dims) {
  if (!ligneCourante) return;
  const l = ligneCourante;
  l.code = p.code; l.produit = p.produit; l.famille = p.famille;
  l.largRecu = +r.lp.toFixed(1); l.hautRecu = +r.hp.toFixed(1);
  if (dims) { l.largCmd = dims.larg; l.hautCmd = dims.haut; }
  if (!l.verdict) l.verdict = r.verdict;
  l.verdictFinal = r.verdict;
  l.defauts = r.constats.filter(([n]) => n === "ROUGE" || n === "ORANGE")
                        .map(([n, t]) => n + "|" + t.split(" : ")[0].split(".")[0]);
  const etat = devisMemo[p.code];
  if (etat) {
    const dv = calculerDevis(p, r, dims, etat);
    l.qte = etat.qte; l.montant = dv ? +dv.total.toFixed(2) : null;
  }
  sauverJournal();
}

function noterCorrection(actes) {
  if (!ligneCourante) return;
  ligneCourante.corrige = true;
  ligneCourante.actes = actes.slice();
  sauverJournal();
}

/* Classement d'un travail : ce que l'atelier a réellement dû faire. */
function typologie(l) {
  if (l.corrige) return l.verdictFinal === "ROUGE" ? "lourd" : "leger";
  if (l.verdict === "ROUGE") return "lourd";
  if (l.verdict === "ORANGE") return "leger";
  return "direct";
}

function statistiques(depuis) {
  const lignes = JOURNAL.filter(l => !depuis || new Date(l.date) >= depuis);
  const st = { total: lignes.length, direct: 0, leger: 0, lourd: 0,
               produits: {}, defauts: {}, ca: 0, premiere: null, derniere: null };
  for (const l of lignes) {
    st[typologie(l)]++;
    st.produits[l.code || "?"] = (st.produits[l.code || "?"] || 0) + 1;
    for (const d of (l.defauts || [])) {
      const [niv, lib] = d.split("|");
      const c = (st.defauts[lib] = st.defauts[lib] || { n: 0, niveau: niv });
      c.n++;
      if (niv === "ROUGE") c.niveau = "ROUGE";
    }
    if (l.montant) st.ca += l.montant;
    const t = new Date(l.date);
    if (!st.premiere || t < st.premiere) st.premiere = t;
    if (!st.derniere || t > st.derniere) st.derniere = t;
  }
  return st;
}

function journalCsv() {
  const cols = ["date","fichier","code","produit","famille","verdict","verdictFinal","typologie",
                "corrige","actes","largRecu","hautRecu","largCmd","hautCmd","qte","montant","defauts"];
  const esc = (v) => `"${String(v === null || v === undefined ? "" : v).replace(/"/g, '""')}"`;
  return [cols.join(";"), ...JOURNAL.map(l => cols.map(c =>
    esc(c === "typologie" ? typologie(l)
      : c === "actes" ? (l.actes || []).join(" | ")
      : c === "defauts" ? (l.defauts || []).join(" | ")
      : l[c])).join(";"))].join("\n");
}

/* ------------------------------------------------------------------ */
/* Dossier de dépôt (API File System Access, Chrome et Edge)           */
/* ------------------------------------------------------------------ */
let dossierSortie = null;

function idb(operation, valeur) {
  return new Promise((ok) => {
    if (!self.indexedDB) return ok(null);
    const req = indexedDB.open("calage", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("cfg");
    req.onerror = () => ok(null);
    req.onsuccess = () => {
      const db = req.result;
      const tx = db.transaction("cfg", operation === "get" ? "readonly" : "readwrite");
      const st = tx.objectStore("cfg");
      const q = operation === "get" ? st.get("dossier") : st.put(valeur, "dossier");
      q.onsuccess = () => ok(operation === "get" ? q.result : true);
      q.onerror = () => ok(null);
    };
  });
}

async function reprendreDossier() {
  try {
    const h = await idb("get");
    if (!h) return;
    if ((await h.queryPermission({ mode: "readwrite" })) === "granted") dossierSortie = h;
    else dossierSortie = h;                    // permission redemandée à la première écriture
    majEtatDossier();
  } catch (e) {}
}

async function choisirDossier() {
  if (!window.showDirectoryPicker) {
    alert("Le choix d'un dossier de dépôt n'est possible que sur Chrome ou Edge. "
        + "Sur Safari, les fichiers partent dans le dossier de téléchargements.");
    return;
  }
  try {
    const h = await window.showDirectoryPicker({ mode: "readwrite", id: "calage-sortie" });
    dossierSortie = h;
    await idb("put", h);
    majEtatDossier();
  } catch (e) {}
}

async function ecrireDansDossier(octets, nom) {
  if (!dossierSortie) return false;
  try {
    if ((await dossierSortie.queryPermission({ mode: "readwrite" })) !== "granted"
     && (await dossierSortie.requestPermission({ mode: "readwrite" })) !== "granted") return false;
    const f = await dossierSortie.getFileHandle(nom, { create: true });
    const w = await f.createWritable();
    await w.write(octets);
    await w.close();
    return true;
  } catch (e) { return false; }
}

function majEtatDossier() {
  const e = $("etatDossier");
  if (e) e.textContent = dossierSortie ? "dossier : " + dossierSortie.name : "dossier : téléchargements";
}

/* Interface                                                           */
/* ------------------------------------------------------------------ */
const $ = (id) => document.getElementById(id);
/* Le bandeau doit repondre a UNE question : est-ce que je lance ?
   « A SIGNALER » decrivait l'etat du fichier sans dire quoi faire.
   Les trois libelles portent maintenant la decision de production. */
const LIB = {
  VERT:   ["BON POUR IMPRESSION", "Le fichier peut partir en production",
           "Rien à signaler au client."],
  ORANGE: ["BON AVEC RÉSERVE", "Le fichier peut partir en production, après accord du client",
           "Prévenir le client des points ci-dessous, puis lancer."],
  ROUGE:  ["NE PAS IMPRIMER", "Le fichier ne donnera pas un résultat acceptable",
           "Le client refait son fichier, ou il passe par un service de reprise."],
};

const CLE_RECENTS = "calage.recents";
let recents = [];
const famFermees = {};
let filtreRail = "";

function chargerRecents() {
  try { recents = JSON.parse(localStorage.getItem(CLE_RECENTS) || "[]"); } catch (e) { recents = []; }
}
function noterRecent(code) {
  recents = [code, ...recents.filter(c => c !== code)].slice(0, 6);
  try { localStorage.setItem(CLE_RECENTS, JSON.stringify(recents)); } catch (e) {}
}

function gabarit(p) {
  return p.regle_dim === "FIXE" ? `${p.larg_cm}×${p.haut_cm}`
       : p.regle_dim === "MAXI" ? `max ${p.larg_max_cm}×${p.haut_max_cm}`
       : p.regle_dim === "MINI" ? `min ${p.larg_cm}×${p.haut_cm}` : "libre";
}

function peuplerSelect() {
  const sel = $("produit");
  const garde = sel.value;
  sel.innerHTML = "";
  for (const fam of ["IMPRIMERIE", "SIGNALETIQUE"]) {
    const g = document.createElement("optgroup");
    g.label = fam;
    for (const p of REF.filter(x => x.famille === fam)) {
      const o = document.createElement("option");
      o.value = p.code; o.textContent = p.produit;
      g.appendChild(o);
    }
    sel.appendChild(g);
  }
  if (garde && REF.some(p => p.code === garde)) sel.value = garde;
  $("nbProduits").textContent = REF.length + " produits";
  dessinerRail();
  majFiche();
}

/* Sans accents, sans casse : « etiquette » doit trouver « ETIQUETTES ». */
function sansAccents(t) {
  return String(t).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
}

function dessinerRail() {
  const sel = $("produit"), rail = $("rail");
  const q = sansAccents(filtreRail).trim();
  /* Tous les mots doivent etre presents, dans n'importe quel ordre :
     « roll std » trouve ROLL UP STANDARD. */
  const mots = q ? q.split(/\s+/) : [];
  const filtre = (p) => {
    if (!mots.length) return true;
    const foin = sansAccents(p.produit + " " + p.code);
    return mots.every((m) => foin.includes(m));
  };

  /* Le champ de recherche n'est PAS reconstruit a chaque frappe : le
     recreer faisait perdre le curseur, obligeait a un focus() de rattrapage,
     et cassait la saisie des caracteres accentues. Seule la liste change. */
  let liste = $("railListe");
  if (!liste) {
    rail.innerHTML = `<div class="chercher">
        <input id="chercheProduit" type="search" placeholder="Chercher un produit…" aria-label="Chercher un produit">
      </div><div id="railListe"></div>`;
    liste = $("railListe");
    const ch0 = $("chercheProduit");
    ch0.value = filtreRail;
    ch0.oninput = () => { filtreRail = ch0.value; dessinerRail(); };
    ch0.onkeydown = (e) => {
      if (e.key === "Escape") { ch0.value = ""; filtreRail = ""; dessinerRail(); return; }
      if (e.key !== "Enter") return;
      const prem = liste.querySelector("button.item");
      if (prem) prem.click();
    };
  }
  liste.innerHTML = "";

  const bouton = (p) => {
    const b = document.createElement("button");
    b.className = "item"; b.type = "button"; b.dataset.code = p.code;
    b.innerHTML = `<span>${p.produit}<br><span class="fmt">${gabarit(p)} cm</span></span><span class="code">${p.code}</span>`;
    b.onclick = () => {
      if (sel.value !== p.code) produitChange = true;
      sel.value = p.code; noterRecent(p.code);
      dessinerRail(); majFiche(); relancer();
    };
    return b;
  };

  const groupe = (cle, libelle, produits) => {
    if (!produits.length) return;
    const t = document.createElement("button");
    t.type = "button";
    t.className = "fam" + (cle === "recents" ? " recents" : "") + (famFermees[cle] && !q ? " ferme" : "");
    t.innerHTML = `<span>${libelle}</span><span class="nb">${produits.length}</span><span class="chev">▾</span>`;
    t.onclick = () => { famFermees[cle] = !famFermees[cle]; dessinerRail(); };
    liste.appendChild(t);
    if (famFermees[cle] && !q) return;
    for (const p of produits) liste.appendChild(bouton(p));
  };

  if (!q) {
    const rec = recents.map(c => REF.find(p => p.code === c)).filter(Boolean);
    groupe("recents", "Récents", rec);
  }
  /* Ordre alphabetique a l'interieur de chaque famille. localeCompare avec
     sensibilite "base" pour que les accents et la casse ne creent pas un
     ordre surprenant. Les recents gardent leur ordre d'usage. */
  const alpha = (a, b) => a.produit.localeCompare(b.produit, "fr", { sensitivity: "base", numeric: true });
  const parFamille = (f) => REF.filter(p => p.famille === f && filtre(p)).slice().sort(alpha);
  groupe("IMPRIMERIE", "Imprimerie", parFamille("IMPRIMERIE"));
  groupe("SIGNALETIQUE", "Signalétique", parFamille("SIGNALETIQUE"));

  if (q && !REF.some(filtre)) {
    const v = document.createElement("div");
    v.className = "vide2";
    v.textContent = `Aucun produit ne correspond à « ${filtreRail.trim()} ».`;
    liste.appendChild(v);
  }
  majRail();
}

function majRail() {
  const code = $("produit").value;
  for (const b of $("rail").querySelectorAll("button.item"))
    b.classList.toggle("actif", b.dataset.code === code);
}

function produitCourant() { return REF.find(p => p.code === $("produit").value); }

function orientationChoisie() {
  const p = produitCourant();
  return p ? (orientMemo[p.code] || "LIBRE") : "LIBRE";
}

/* Taille naturelle d'un fichier image.
   Une image n'a pas de dimension physique : on la deduit de ses pixels a
   la resolution visee par le produit. C'est la seule reference honnete,
   et c'est celle que l'operateur veut voir — pas le mini du produit. */
function tailleNaturelle(pxL, pxH, p) {
  const dpi = (p && p.dpi_cible > 0) ? p.dpi_cible : 150;
  const r = (px) => Math.round(px / dpi * 2.54 * 10) / 10;
  return { larg: r(pxL), haut: r(pxH) };
}

/* ==================================================================== */
/* FORMAT CIBLE — SOURCE UNIQUE                                         */
/* -------------------------------------------------------------------- */
/* La pastille d'orientation n'etait que DECLARATIVE : elle produisait le */
/* constat ORIENT sans jamais toucher au format vise. Le gabarit restait  */
/* en 15 x 21 alors que Paysage etait selectionne, et la rotation faisait */
/* tourner le visuel dans un cadre reste portrait, l'outil comblant les   */
/* vides. Ici, Paysage PERMUTE largeur et hauteur, et tout ce qui dessine */
/* un cadre, un trait de coupe ou une zone de securite lit cette          */
/* fonction — une seule, pour qu'une correction porte partout.           */
/* -------------------------------------------------------------------- */
/* Un produit peut imposer son sens (kakemono, roll-up : orientation      */
/* PORTRAIT au referentiel) : la commande ne peut alors rien y changer.   */
/* Sur un produit a dimensions saisies, c'est la saisie qui porte le      */
/* sens, pas la pastille.                                                */
/* ==================================================================== */
function orientationEffective(p, orient) {
  if (!p) return "LIBRE";
  if (p.orientation && p.orientation !== "LIBRE") return p.orientation;
  if (p.dim_saisie === "OUI") return "LIBRE";
  return orient || "LIBRE";
}

/* Retourne { larg, haut, permute } en cm, ou null si indeterminable. */
function formatCible(p, dims, orient) {
  if (!p) return null;
  let L, H;
  if (dims && dims.larg > 0 && dims.haut > 0) { L = dims.larg; H = dims.haut; }
  else if (p.regle_dim === "FIXE" && p.larg_cm > 0 && p.haut_cm > 0) { L = p.larg_cm; H = p.haut_cm; }
  else return null;
  const o = orientationEffective(p, orient === undefined ? orientationChoisie() : orient);
  if (o === "PAYSAGE" && H > L) return { larg: H, haut: L, permute: true };
  if (o === "PORTRAIT" && L > H) return { larg: H, haut: L, permute: true };
  return { larg: L, haut: H, permute: false };
}

/* Ecrit les dimensions commandees et memorise le rapport, pour que la
   saisie reste homothetique. */
let RATIO_FICHIER = null;
/* Dimension du fichier lui-meme, telle que mesuree au dernier controle.
   Sert au bouton de reprise : l'operateur ne retape rien. */
let DIMS_FICHIER = null;
function poserDims(larg, haut, code) {
  RATIO_FICHIER = (larg > 0 && haut > 0) ? larg / haut : null;
  const l = $("dLarg"), h = $("dHaut");
  const L = Math.round(larg * 10) / 10, H = Math.round(haut * 10) / 10;
  if (!(L > 0 && H > 0)) return;
  if (l && h) { l.value = L; h.value = H; }
  /* memorise, sinon le prochain rendu de la fiche efface la valeur */
  if (code) dimsMemo[code] = { larg: L, haut: H };
}

function dimsSaisies() {
  const l = $("dLarg"), h = $("dHaut");
  if (!l || !h) return null;
  const a = parseFloat((l.value || "").replace(",", ".")), b = parseFloat((h.value || "").replace(",", "."));
  return (a > 0 && b > 0) ? { larg: a, haut: b } : null;
}

function majFiche() {
  const p = produitCourant();
  if (!p) return;
  /* Le format fini affiché suit l'orientation commandée. Afficher
     « 15 × 21 cm » sous « Orientation : paysage » est une incohérence que
     l'opérateur voit avant même que la rotation ne parte de travers. */
  const fcF = formatCible(p, null);
  const dim = p.regle_dim === "FIXE" ? `${fcF ? fcF.larg : p.larg_cm} × ${fcF ? fcF.haut : p.haut_cm} cm`
            : p.regle_dim === "MAXI" ? `max ${p.larg_max_cm} × ${p.haut_max_cm} cm`
            : p.regle_dim === "MINI" ? `min ${p.larg_cm} × ${p.haut_cm} cm`
            : p.regle_dim === "PLAGE" ? `${p.larg_cm}×${p.haut_cm} à ${p.larg_max_cm}×${p.haut_max_cm} cm`
            : "libre";
  const note = p.note ? `<div class="note">${p.note}</div>` : "";
  const saisie = p.dim_saisie === "OUI" ? `
    <div class="pan saisie">
      <div class="tete">Dimensions commandées</div>
      <div class="corps">
        <input type="number" id="dLarg" placeholder="largeur" min="0.1" step="0.1" inputmode="decimal" aria-label="Largeur commandée en centimètres">
        <span class="x">×</span>
        <input type="number" id="dHaut" placeholder="hauteur" min="0.1" step="0.1" inputmode="decimal" aria-label="Hauteur commandée en centimètres">
        <span class="u">cm</span>
      </div>
      <label class="lien-dim"><input type="checkbox" id="dLien" checked>
        conserver les proportions du fichier</label>
      <div class="aide">Ces valeurs sont reprises du fichier déposé. Modifiez-les pour commander un autre format.</div>
      <div id="repriseDim"></div>
      <div class="verdict-dim" id="alerteDims"></div>
    </div>` : "";
  const orientChoisie = orientMemo[p.code] || "LIBRE";
  const seg = (v, lib, w, h) => `<button data-o="${v}" class="${orientChoisie === v ? "actif" : ""}">
      <span class="ico" style="width:${w}px;height:${h}px"></span>${lib}</button>`;
  const blocOrient = p.dim_saisie === "OUI"
    ? `<div class="pan"><div class="tete">Orientation</div><div class="corps">
         <div class="fixe">Elle découle des dimensions saisies : une largeur supérieure à la hauteur donne du paysage.</div></div></div>`
    : p.orientation !== "LIBRE"
      ? `<div class="pan"><div class="tete">Orientation</div><div class="corps">
           <div class="fixe">Imposée en <b>${p.orientation.toLowerCase()}</b> par le produit. Un fichier livré dans l'autre sens sera signalé et pivoté à la correction.</div></div></div>`
      : `<div class="pan"><div class="tete">Orientation commandée</div><div class="corps">
           <div class="seg" id="segOrient">
             ${seg("LIBRE", "Indifférent", 17, 13)}${seg("PORTRAIT", "Portrait", 13, 18)}${seg("PAYSAGE", "Paysage", 18, 13)}
           </div></div></div>`;

  $("fiche").innerHTML = `
    <div class="pan">
      <div class="tete">Spécifications ${p.code}</div>
      <div class="corps">
        <dl class="fiche">
          <dt>Format fini</dt><dd>${dim}</dd>
          <dt>Orientation</dt><dd>${p.dim_saisie === "OUI" ? "selon dimensions" : (p.orientation !== "LIBRE" ? p.orientation.toLowerCase() : orientChoisie === "LIBRE" ? "indifférente" : orientChoisie.toLowerCase())}</dd>
          <dt>Classe de tolérance</dt><dd>${p.classe} · ${
            p.classe === "P1" ? "lecture en main" : p.classe === "P2" ? "lecture à 1 ou 2 m" : "lecture à 3 m et plus"}</dd>
          <dt>Résolution mini</dt><dd>${p.dpi_mini} dpi</dd>
          <dt>Résolution cible</dt><dd>${p.dpi_cible} dpi</dd>
          <dt>Fond perdu</dt><dd>${p.fond_perdu_mm > 0 ? `${p.fond_perdu_mm} mm · ${p.fond_perdu_mm/2} /bord` : "aucun"}</dd>
          <dt>Marge de sécurité</dt><dd>${p.marge_secu_mm} mm</dd>
          <dt>Texte mini</dt><dd>${p.texte_mini_mm} mm</dd>
          ${p.plis ? `<dt>Volets</dt><dd>${String(p.plis).split(":")[1].split(",").join(" / ")} mm</dd>
          <dt>Marge au pli</dt><dd>${p.marge_pli_mm} mm</dd>` : ""}
        </dl>
        ${note}
      </div>
    </div>
    ${blocOrient}${saisie}`;

  if ($("segOrient")) {
    for (const b of $("segOrient").querySelectorAll("button")) b.onclick = () => {
      orientMemo[p.code] = b.dataset.o;
      majFiche();
      relancer();
    };
  }

  if ($("dLarg")) {
    if (dimsMemo[p.code]) { $("dLarg").value = dimsMemo[p.code].larg; $("dHaut").value = dimsMemo[p.code].haut; }
    else if (p.regle_dim === "FIXE" && p.larg_cm > 0 && p.haut_cm > 0) {
      $("dLarg").value = p.larg_cm; $("dHaut").value = p.haut_cm;
      dimsMemo[p.code] = { larg: p.larg_cm, haut: p.haut_cm };
    }
    /* Sur MINI, MAXI et LIBRE, larg_cm est un SEUIL, pas un format.
       Le pre-remplir imposait un vinyle de 3 x 3 cm a une image de 60 cm,
       sans que rien ne le signale. On laisse vide : c'est le fichier
       depose qui renseignera ces champs. */
    for (const id of ["dLarg", "dHaut"]) $(id).oninput = () => {
      const autre = id === "dLarg" ? $("dHaut") : $("dLarg");
      if ($("dLien") && $("dLien").checked && RATIO_FICHIER > 0) {
        const a = parseFloat(($(id).value || "").replace(",", "."));
        if (a > 0) autre.value = String(Math.round(
          (id === "dLarg" ? a / RATIO_FICHIER : a * RATIO_FICHIER) * 10) / 10);
      }
      const d = dimsSaisies();
      if (d) dimsMemo[p.code] = d;
      majAlerteDims(); majRepriseDim();
      relancer();
    };
    majAlerteDims(); majRepriseDim();
  }
}

/* Contrôle des dimensions dès la frappe, sans attendre le fichier. */
/* Bouton « reprendre la dimension du fichier ».
   Sur les supports signaletiques, le format commande EST celui du fichier
   neuf fois sur dix. Le retaper a la main est une saisie inutile, et une
   occasion de se tromper d'un centimetre. */
function majRepriseDim() {
  const z = $("repriseDim");
  if (!z) return;
  const p = produitCourant();
  if (!DIMS_FICHIER || p.regle_dim === "FIXE") { z.innerHTML = ""; return; }
  const d = dimsSaisies();
  const pareil = d && Math.abs(d.larg - DIMS_FICHIER.larg) < 0.05
                   && Math.abs(d.haut - DIMS_FICHIER.haut) < 0.05;
  if (pareil) {
    z.innerHTML = `<div class="repdim ok">Dimensions reprises du fichier.</div>`;
    return;
  }
  z.innerHTML = `<button class="repdim bt" id="btReprise">
    <span>Reprendre la dimension du fichier initial</span>
    <b>${DIMS_FICHIER.larg} × ${DIMS_FICHIER.haut} cm</b></button>`;
  $("btReprise").onclick = () => {
    poserDims(DIMS_FICHIER.larg, DIMS_FICHIER.haut, p.code);
    majAlerteDims(); majRepriseDim(); relancer();
  };
}

function majAlerteDims() {
  const zone = $("alerteDims");
  if (!zone) return;
  const p = produitCourant(), d = dimsSaisies();
  if (!d) { zone.innerHTML = ""; return; }

  const lignes = [];
  const m2 = d.larg * d.haut / 10000;
  lignes.push(`<div class="vd-ok">Surface : <b>${m2.toFixed(2)} m²</b></div>`);

  if (p.larg_max_cm && p.haut_max_cm) {
    const tient = (d.larg <= p.larg_max_cm && d.haut <= p.haut_max_cm)
               || (d.larg <= p.haut_max_cm && d.haut <= p.larg_max_cm);
    if (!tient) {
      const repli = plusGrandHomothetique(d.larg / d.haut, p.larg_max_cm, p.haut_max_cm);
      lignes.push(`<div class="vd-ko">Au-delà du maximum réalisable (<b>${p.larg_max_cm} × ${p.haut_max_cm} cm</b>). En conservant ces proportions, le plus grand possible est <b>${repli.larg} × ${repli.haut} cm</b>.</div>`);
    }
  }

  if (p.regle_dim === "MINI" && p.larg_cm && (d.larg < p.larg_cm || d.haut < p.haut_cm))
    lignes.push(`<div class="vd-info">Sous le format minimum du produit (<b>${p.larg_cm} × ${p.haut_cm} cm</b>).</div>`);

  if (p.mini_facturation_m2 && m2 < p.mini_facturation_m2)
    lignes.push(`<div class="vd-info">Minimum de facturation : <b>${p.mini_facturation_m2} m²</b>. La commande sera facturée sur cette base.</div>`);

  const lettre = p.famille === "SIGNALETIQUE" ? p.marge_secu_mm : p.marge_secu_mm;
  lignes.push(`<div class="vd-ok">Zone de sécurité minimale : <b>${lettre} mm</b>, relevée à la largeur d'une lettre si le visuel est plus grand.</div>`);

  zone.innerHTML = lignes.join("");
}

/* La zone 2 suit toujours le produit sélectionné. */
/* Une image est convertie en PDF au format commande AU MOMENT DU DEPOT.
   Changer de produit ensuite ne la reconvertissait pas : une image deposee
   sur une carte de visite restait enfermee dans une page 9 x 5,5 cm, et
   passer en banderole ne faisait qu'agrandir cette page — d'ou un visuel
   perdu au milieu de blanc. On reconvertit depuis l'image d'origine. */
async function reconvertirImage(p) {
  const o = ORIGINE;
  if (!o || o.type !== "image" || !o.brut) return false;
  /* L'image est TOUJOURS reconvertie a sa dimension native pour le produit
     courant. La mise au format commande est une correction de l'atelier,
     jamais un effet de bord du changement de produit. */
  const n = tailleNaturelle(o.pxL, o.pxH, p);
  const cL = n.larg, cH = n.haut;
  if (!(cL > 0 && cH > 0)) return false;
  if (Math.abs(cL - o.cibleL) < 0.05 && Math.abs(cH - o.cibleH) < 0.05) return false;

  o.natL = n.larg; o.natH = n.haut;
  o.cibleL = cL; o.cibleH = cH;
  source = await imageVersPdf(o.brut, o.genre, cL, cH);
  SOURCE_INIT = source;
  viderCachePdf();
  palette = await couleursDuVisuel(source);
  PALETTE_INIT = palette;
  vues.avant = await apercu(source, 1);
  vues.apres = null; vues.avantA = null; vues.apresA = null; vues.journal = null;
  ROT_MANU = 0;
  return true;
}

function relancer() {
  if (!source || !dernierNom) { reinit(); return; }
  /* Un fichier corrige pour une banderole 200 x 90 n'a plus de sens sur un
     kakemono : la vue « apres » restait affichee avec l'ancien format, et
     le comparateur montrait deux fois le meme fichier. */
  if (source !== SOURCE_INIT && SOURCE_INIT) {
    viderCachePdf();
    source = SOURCE_INIT; palette = PALETTE_INIT || palette; ROT_MANU = 0;
    apercu(source, 1).then((a) => { if (a) vues.avant = a; });
  }
  vues.apres = null; vues.apresA = null; vues.avantA = null;
  vues.journal = null; vues.rAvant = null; CURSEUR = 50;
  for (const k of Object.keys(devisMemo)) delete devisMemo[k].remiseChute;
  reinitVerifs();
  /* Un changement de produit, de dimensions ou d'orientation invalide
     l'analyse : le verdict affiché ne porterait plus sur la commande. */
  ANALYSE_DEMANDEE = false;
  if (ORIGINE && ORIGINE.type === "image") {
    /* l'image est reconvertie au nouveau format avant recontrole */
    const p = produitCourant();
    reconvertirImage(p).then(() => traiter(null));
    return;
  }
  traiter(null);
}

function pastilles(c) {
  if (!c) return "";
  const p = (col, lib) => `<span title="${lib}" style="display:inline-block;width:15px;height:15px;border-radius:2px;border:1px solid rgba(255,255,255,.18);background:rgb(${col.join(",")})"></span>`;
  return `<div style="display:flex;align-items:center;gap:7px;margin:2px 0 13px;font-size:12px;color:var(--texteFaible)">
    ${p(c.haut,"bord haut")}${p(c.droite,"bord droit")}${p(c.bas,"bord bas")}${p(c.gauche,"bord gauche")}
    <span>${c.uniforme ? "couleur dominante uniforme" : "couleurs relevées sur les quatre bords"}</span></div>`;
}

function atelier(r, p, couleurs) {
  const K = r.codes || new Set();
  const echelleKo = K.has("ECHELLE") || r.ratioKo;
  const orientKo  = K.has("ORIENT");
  const bleedKo   = (K.has("FP_ABSENT") || K.has("FP_INSUF")) && p.fond_perdu_mm > 0;
  const bloquants = r.constats.filter(([n,,,,c]) => n === "ROUGE"
    && c !== "ECHELLE" && c !== "RATIO" && !(echelleKo && c === "TEXTE_PETIT"));

  /* Un fichier dont le visuel est deja ampute ne se repare pas par une mise
     a l'echelle : la correction produirait un fichier propre en apparence,
     ampute en realite. On ne la propose pas, on dit pourquoi. */
  /* Le debordement AVERTIT, il ne bloque plus. Interdire toute correction
     privait l'operateur de la mise a l'echelle et du comblement de fond,
     qui restent utiles meme sur un visuel deja rogne. */
  const ampute = K.has("DEBORD");
  const avert = ampute ? `
    <p class="avert">Une partie du visuel est déjà coupée dans le fichier reçu : les corrections
    ci-dessous ne la ramèneront pas. Le fichier obtenu sera propre au format, mais amputé du même
    contenu. Pour le récupérer, il faut le fichier d'origine.</p>` : "";

  const oeil = posOeillets(p, dimsSaisies());
  /* Le decentrage n'est propose que s'il a ete MESURE : au-dela de 2 mm
     d'ecart entre les blancs opposes, sur le format fini. */
  const enc = r.bande && r.bande.encre;
  let decal = 0;
  if (enc) decal = Math.max(Math.abs(enc.gauche - enc.droite), Math.abs(enc.haut - enc.bas)) / 2;
  const decalMm = decal / 72 * 25.4 / (r.echelle || 1);
  const optCentre = (enc && decalMm > 1) ? `
    <div class="opt">
      <input type="checkbox" id="cCentrer">
      <label for="cCentrer">Recentrer le visuel dans le format
        <small>Le dessin n'est pas au milieu de sa page : il y a environ
        ${decalMm.toFixed(0)} mm de blanc en trop d'un côté. On décale le visuel
        pour qu'il tombe au centre du produit fini. Rien n'est réduit ni déformé.</small></label>
    </div>` : "";

  if (!echelleKo && !orientKo && !bleedKo && !r.fpIntegre && !oeil && !optCentre) return "";

  const optOeil = oeil ? `
    <div class="opt">
      <input type="checkbox" id="cOeillets">
      <label for="cOeillets">Marquer l'emplacement des ${oeil.nb} œillets sur le fichier
        <small>Cercle au diamètre de la perforation et croix de centrage, trait fin. Le poinçonnage
        l'enlève, la rondelle couvre le reste : rien ne se voit sur le produit fini.</small></label>
    </div>` : "";

  /* Une seule liste. « Préparation pour le RIP » sortait AVANT l'atelier et
     masquait les corrections : l'opérateur voyait deux écrans successifs et
     découvrait au second passage des options absentes au premier. */
  const optBoites = r.fpIntegre ? `
    <div class="opt">
      <input type="checkbox" id="cBoites" checked disabled>
      <label for="cBoites">Poser les traits de coupe à ${p.fond_perdu_mm / 2} mm des bords
        <small>Le fond perdu est déjà là. Le visuel n'est ni déplacé ni redimensionné :
        seules les TrimBox et BleedBox sont déclarées, pour éviter au RIP d'avoir à
        deviner où couper.</small></label>
    </div>` : "";

  /* RIEN N'EST COCHÉ D'AVANCE. Une case cochée par défaut est une correction
     que l'opérateur n'a pas décidée : elle part sans être lue, et elle n'est
     pas défendable sur un bon à tirer.
     Une option sans objet reste VISIBLE, grisée, avec sa raison : ce que
     l'outil a examiné compte autant que ce qu'il propose. */
  const opt = (id, actif, titre, detail, extra = "", raison = "") => `
    <div class="opt${actif ? "" : " off"}">
      <input type="checkbox" id="${id}"${actif ? "" : " disabled"}>
      <label for="${id}">${titre}<small>${detail}${
        actif ? "" : `<em class="sansobjet">${raison || "Sans objet sur ce fichier."}</em>`}</small></label>${extra}
    </div>`;

  const d = dimsSaisies();
  const cible = d ? `${d.larg} × ${d.haut} cm`
    : p.regle_dim === "FIXE" ? `${p.larg_cm} × ${p.haut_cm} cm` : "format reçu";

  return `
  <div class="atelier">
    ${avert}
    <h3>Corrections automatiques</h3>
    <p class="sous">Le visuel n'est jamais étiré ni déformé. Le vide créé autour est comblé par la couleur relevée sur ses bords.</p>
    ${r.proposition && r.proposition.adoptable ? `
    <div class="propo">
      <span class="val">${r.proposition.larg} × ${r.proposition.haut} cm</span>
      <span class="lib">Plus grand format réalisable sans déformer le visuel. Adopter ce format met à jour les dimensions commandées et relance le contrôle.</span>
      <button class="primaire" id="adopter">Adopter ce format</button>
    </div>` : ""}
    ${pastilles(couleurs)}
    ${opt("cMiseAuFormat", echelleKo,
          `Mettre au format fini (${cible})`,
          r.ratioKo
            ? "Le visuel garde ses proportions, il est centré à la plus grande taille possible dans le format, et le pourtour est comblé par la couleur de ses bords."
            : "Mise à l'échelle uniforme. Les vecteurs restent nets, les images conservent leurs pixels, donc leur résolution baisse d'autant. Le recontrôle l'affichera.",
          "", "Le fichier est déjà à l'échelle du format commandé.")}
    ${opt("cOrientation", orientKo,
          `Pivoter en ${(r.orientVoulue || p.orientation || "PORTRAIT").toLowerCase()}`,
          "Rotation de 90° du contenu. Le format commandé pivote avec : trait de coupe et zone de sécurité suivent.",
          "", "Le fichier est déjà dans le sens commandé.")}
    ${opt("cFondPerdu", bleedKo,
          `Ajouter le fond perdu : ${p.fond_perdu_mm / 2} mm par bord`,
          `La page passe au format fini plus ${p.fond_perdu_mm} mm en largeur et en hauteur. Le visuel garde sa taille exacte, la bande créée est comblée par la couleur du bord correspondant. TrimBox et BleedBox déclarées.`,
          "", p.fond_perdu_mm > 0 ? "Le fond perdu est déjà présent dans le fichier."
                                  : "Ce produit se livre sans fond perdu.")}
    ${optBoites}
    ${optCentre}
    ${optOeil}
    <div class="opt">
      <input type="checkbox" id="cMarge">
      <label for="cMarge">Dégager la marge de sécurité<small>Réduit le visuel pour éloigner son contenu du trait de coupe, et comble le pourtour de la même façon.</small></label>
      <input type="number" id="cMargeMm" value="${p.marge_secu_mm}" min="1" max="80" step="1" aria-label="Marge de sécurité en millimètres">
    </div>
    <div class="opt">
      <input type="checkbox" id="cBlanc"${CHOIX_BLANC ? " checked" : ""}>
      <label for="cBlanc">Combler en blanc plutôt qu'en couleur<small>À cocher si le support est destiné à rester blanc autour du visuel.</small></label>
    </div>
    ${bloquants.length ? `<div class="exclu"><b>Ce que la correction ne réglera pas :</b><br>${
      bloquants.map(([,t]) => "· " + t.split(".")[0] + ".").join("<br>")
    }</div>` : ""}
    <div class="actions" style="padding-left:0;padding-right:0;border-top:0;padding-bottom:0">
      <button class="primaire" id="appliquer">Appliquer et recontrôler</button>
    </div>
  </div>`;
}

/* Bandes interdites autour de chaque pli, en mm depuis le bord gauche de la
   page. Les deux conventions de montage sont matérialisées ensemble : le
   recto et le verso sont en miroir, un contenu doit dégager les deux. */
function bandesDePli(p, fpBordMm) {
  if (!p.plis) return null;
  const m = String(p.plis).match(/^([A-Z0-9]+):(.+)$/);
  if (!m) return null;
  const volets = m[2].split(",").map(Number).filter(v => v > 0);
  if (volets.length < 2) return null;
  const marge = p.marge_pli_mm || 5;

  const cumuls = (liste) => {
    const out = []; let c = 0;
    for (let i = 0; i < liste.length - 1; i++) { c += liste[i]; out.push(c); }
    return out;
  };
  const A = cumuls(volets), B = cumuls([...volets].reverse());

  const bandes = A.map((a, i) => {
    const axes = [a, B[i]].sort((x, y) => x - y);
    return { x0: fpBordMm + axes[0] - marge, x1: fpBordMm + axes[1] + marge,
             axes: axes.map(v => fpBordMm + v) };
  });
  return { volets, marge, bandes, total: volets.reduce((a, b) => a + b, 0) };
}

/* Les volets sont exprimés dans le format fini. Ils ne peuvent être tracés
   que sur un visuel effectivement à ce format, sinon les repères tombent
   hors de l'image. Ce contrôle sert à l'écran comme dans les PDF. */
function pliPertinent(p, largCm, fpBordMm) {
  const b = bandesDePli(p, fpBordMm);
  if (!b) return null;
  const attendu = b.total + 2 * fpBordMm;
  return Math.abs(largCm * 10 - attendu) <= Math.max(3, attendu * 0.02) ? b : null;
}

/* ==================================================================== */
/* OEILLETS — materialisation sur banderoles, baches et kakemonos       */
/* -------------------------------------------------------------------- */
/* Un oeillet perce le support : ce qui se trouve dessous disparait, et  */
/* le pourtour est plaque contre le mur ou la structure. Le client ne le */
/* voit jamais venir, et c'est un retirage complet.                      */
/* Regle d'atelier : un aux quatre coins, puis un tous les 50 cm au      */
/* maximum sur chaque cote, centre a 25 mm du bord.                      */
/* ==================================================================== */
/* Implantation reelle a l'atelier, donnee par JP :
     banderole 2 m -> 6 oeillets   (3 en haut, 3 en bas)
     banderole 3 m -> 8 oeillets   (4 en haut, 4 en bas)
     kakemono      -> 4 oeillets   (les quatre coins)
   Ni ourlet ni fourreau : l'oeillet est pose directement dans le support,
   donc rien ne protege ce qui se trouve dessous. */
const OEILLETS = {
  retraitMm: 25,        /* du bord au centre de l'oeillet */
  diamMm: 11,
  gardeMm: 20,          /* rondelle + serrage : zone a garder libre autour */
  entraxeCm: 100,       /* repli pour les formats non listes */
  parProduit: {
    "BAND-2M":    { cotes: "HB", parCote: 3 },
    "BAND-3M":    { cotes: "HB", parCote: 4 },
    /* Bache sur mesure : pourtour complet, un oeillet tous les metres
       environ. La repartition est reguliere entre les deux coins de chaque
       cote, donc les quatre coins sont toujours poses — y compris sur une
       petite bache ou l'entraxe reel tombe sous le metre. */
    "BACHE-MES":  { cotes: "POURTOUR", entraxeCm: 100 },
    "KAK-60":     { cotes: "COINS" },
    "KAK-80":     { cotes: "COINS" },
  },
};

/* Les oeillets sont poses sur le PRODUIT FINI, pas sur le fichier recu.
   Les calculer sur les cotes du fichier donnait des cercles enormes des que
   le fichier n'etait pas a l'echelle (9 x 5,5 cm depose sur un kakemono).
   On renvoie donc des fractions du format commande. */
/* Rotation manuelle du fichier, a la demande de l'operateur.
   La geometrie est reellement recomposee : un simple /Rotate serait ignore
   par la lecture des boites et fausserait toutes les mesures. */
/* Rotation manuelle du visuel.
   Deux regles, apprises a la dure :
   1. On repart TOUJOURS du fichier client d'origine et on applique l'angle
      cumule. Enchainer les rotations sur le resultat precedent reduisait le
      visuel a chaque clic (0,375 puis 0,14 puis 0,05) jusqu'a le faire
      disparaitre. Quatre clics ramenent maintenant au fichier de depart.
   2. Le visuel tourne DANS LE FORMAT COMMANDE, pas dans la page d'origine.
      Un visuel 75 x 200 tourne pour une banderole 200 x 90 doit occuper la
      largeur, pas etre replie dans un portrait. */
async function appliquerRotation(buffer, angle, p, dims, fond) {
  angle = ((angle % 360) + 360) % 360;
  if (!angle) return buffer;
  const src = await PDFLib.PDFDocument.load(buffer, { ignoreEncryption: true });
  const out = await PDFLib.PDFDocument.create();
  const embs = await out.embedPdf(src, src.getPageIndices());
  const MMPT = (cm) => cm / 2.54 * 72;
  const cible = (dims && dims.larg > 0 && dims.haut > 0)
    ? { L: MMPT(dims.larg), H: MMPT(dims.haut) }
    : (function () { const c = formatCible(p, null);
                     return c ? { L: MMPT(c.larg), H: MMPT(c.haut) } : null; })();

  for (const emb of embs) {
    const w = emb.width, h = emb.height;
    const quart = (angle === 90 || angle === 270);
    /* emprise du visuel une fois tourne */
    const vl = quart ? h : w, vh = quart ? w : h;
    /* page de destination : le format commande s'il est connu */
    const pl = cible ? cible.L : vl, ph = cible ? cible.H : vh;
    const k = Math.min(pl / vl, ph / vh);
    const ol = vl * k, oh = vh * k;
    const ox = (pl - ol) / 2, oy = (ph - oh) / 2;

    const pg = out.addPage([pl, ph]);
    pg.drawRectangle({ x: 0, y: 0, width: pl, height: ph,
                       color: (fond && fond.length === 3)
                         ? PDFLib.rgb(fond[0]/255, fond[1]/255, fond[2]/255)
                         : PDFLib.rgb(1, 1, 1) });
    const opts = { xScale: k, yScale: k, rotate: PDFLib.degrees(angle) };
    if (angle === 90)       pg.drawPage(emb, Object.assign({ x: ox + ol, y: oy }, opts));
    else if (angle === 180) pg.drawPage(emb, Object.assign({ x: ox + ol, y: oy + oh }, opts));
    else                    pg.drawPage(emb, Object.assign({ x: ox, y: oy + oh }, opts));
    pg.setMediaBox(0, 0, pl, ph);
  }
  const o = await out.save();
  return o.buffer.slice(o.byteOffset, o.byteOffset + o.byteLength);
}

function posOeillets(p, dims) {
  const fcO = formatCible(p, dims && dims.larg > 0 ? dims : null);
  const largCm = fcO ? fcO.larg : p.larg_cm;
  const hautCm = fcO ? fcO.haut : p.haut_cm;
  if (!p || !(largCm > 0 && hautCm > 0)) return null;
  const cfg = OEILLETS.parProduit[p.code];
  if (!cfg) return null;
  const r = OEILLETS.retraitMm / 10;
  const x0 = r, x1 = largCm - r, y0 = r, y1 = hautCm - r;
  const pts = [];

  if (cfg.cotes === "COINS") {
    pts.push({ x: x0, y: y0 }, { x: x1, y: y0 }, { x: x0, y: y1 }, { x: x1, y: y1 });
  } else if (cfg.cotes === "POURTOUR") {
    const e = cfg.entraxeCm || OEILLETS.entraxeCm;
    const jalons = (a, b2) => {
      const n = Math.max(1, Math.ceil((b2 - a) / e)), pas = (b2 - a) / n, out = [];
      for (let i = 0; i <= n; i++) out.push(a + i * pas);
      return out;
    };
    for (const x of jalons(x0, x1)) { pts.push({ x, y: y0 }); pts.push({ x, y: y1 }); }
    for (const y of jalons(y0, y1)) {
      if (y === y0 || y === y1) continue;
      pts.push({ x: x0, y }); pts.push({ x: x1, y });
    }
  } else {
    /* nombre par cote : impose s'il est connu, sinon un tous les entraxeCm */
    const n = cfg.parCote || Math.max(2, Math.round((x1 - x0) / OEILLETS.entraxeCm) + 1);
    const pas = (x1 - x0) / (n - 1);
    for (let i = 0; i < n; i++) {
      const x = x0 + i * pas;
      pts.push({ x, y: y0 }, { x, y: y1 });
    }
  }
  return {
    pts, nb: pts.length, largCm, hautCm,
    fx: (pt) => pt.x / largCm, fy: (pt) => pt.y / hautCm,
    fdx: OEILLETS.diamMm / 10 / largCm, fdy: OEILLETS.diamMm / 10 / hautCm,
    fgx: (OEILLETS.diamMm + 2 * OEILLETS.gardeMm) / 10 / largCm,
    fgy: (OEILLETS.diamMm + 2 * OEILLETS.gardeMm) / 10 / hautCm,
  };
}

/* Ce qu'on annonce sous l'apercu du fichier client doit etre la taille DU
   FICHIER, pas celle de la page qu'on a fabriquee autour de lui.
   Une image deposee est convertie dans une page au format commande : sans
   cette distinction, l'outil annoncait « fichier client 150 x 205 cm »
   pour un JPEG de 2560 x 640 px, ce qui est faux. */
/* ==================================================================== */
/* COMPARATEUR DEMANDE / FOURNI                                         */
/* -------------------------------------------------------------------- */
/* Une dimension en cm sur un fichier image est une CONVENTION, pas une  */
/* mesure : Photoshop lit le tag dpi du fichier (souvent 72) et annonce  */
/* 40 cm la ou l'outil annonce 9,6. Les deux ont raison, et le client    */
/* qui a ouvert son fichier conteste le verdict au comptoir.             */
/* On n'affiche donc plus aucune dimension du fichier fourni : uniquement */
/* l'ECART au produit commande, en langage de consequence.               */
/* ==================================================================== */
function compareDemandeFourni(r, p) {
  if (!r || !p) return "";
  const c = formatCible(p, dimsSaisies());
  const K = r.codes || new Set();
  const lignes = [];

  /* 1 — Format : proportions, et ce que la mise au format coûtera */
  if (c) {
    let fourni, ecart;
    if (K.has("ORIENT")) { fourni = "sens différent · à pivoter"; ecart = true; }
    else if (!r.ratioKo && !K.has("RATIO")) { fourni = "proportions identiques"; ecart = false; }
    else {
      ecart = true;
      const rf = r.lp / r.hp, rc = c.larg / c.haut;
      const large = rf > rc;
      const cote = large ? "la largeur" : "la hauteur";
      /* Part du visuel perdue en ajustant le fichier au format, à
         proportions conservées. */
      const perdu = 1 - (large ? rc / rf : rf / rc);
      /* Un écart faible se dit en mm sur le format fini : l'opérateur
         le montre au client avec une règle. Un écart important ne se dit
         PAS en mm — « 270 mm à rogner » sur un flyer de 150 mm de large
         est un chiffre juste et inexploitable. */
      if (perdu < 0.25) {
        const mm = Math.round((large ? (c.haut * rf - c.larg) : (c.larg / rf - c.haut)) * 10);
        fourni = mm > 0 ? `proportions différentes · ${mm} mm à rogner sur ${cote}`
                        : "proportions différentes";
      } else {
        fourni = `proportions très différentes · ${Math.round(perdu * 100)} % de ${cote} perdue`;
      }
    }
    lignes.push(["Format", `${c.larg} × ${c.haut} cm`, fourni, ecart]);
  }

  /* 2 — Couverture : le seul axe qui déclenche une action atelier */
  if (p.fond_perdu_mm > 0) {
    const parBord = p.fond_perdu_mm / 2;
    let fourni, ecart = true;
    if (K.has("FP_ABSENT")) fourni = "aucun fond perdu";
    else if (K.has("FP_INSUF")) {
      const manque = Math.max(0, Math.round((parBord - (r.fp || 0)) * 10) / 10);
      fourni = `il manque ${manque} mm par bord`;
    } else { fourni = "couvre le format et le fond perdu"; ecart = false; }
    lignes.push(["Couverture", `fond perdu ${parBord} mm par bord`, fourni, ecart]);
  } else if (K.has("DEBORD")) {
    lignes.push(["Couverture", "format exact, sans fond perdu",
                 "le visuel déborde de la page", true]);
  }

  /* 3 — Qualité : reprise de la pastille Netteté, jamais un second calcul */
  const n = noteNettete(r.nettete, p);
  if (n) {
    lignes.push(["Qualité", n.mini ? `${n.mini} dpi minimum` : "—",
                 `${n.utile} ${n.mesure ? "dpi utiles" : "dpi à la taille commandée"}`,
                 n.niveau !== "VERT"]);
  }

  if (!lignes.length) return "";
  return `<div class="cmpdf">
    <div class="cmpdf-tete"><span></span><span>DEMANDÉ</span><span>FOURNI</span></div>
    ${lignes.map(([t, d, f, e]) => `<div class="cmpdf-l">
      <span class="cmpdf-t">${t}</span><span class="cmpdf-d">${d}</span>
      <span class="cmpdf-f ${e ? "ecart" : "ok"}">${f}</span></div>`).join("")}
  </div>`;
}

/* ==================================================================== */
/* LA DIMENSION DU FICHIER CLIENT — UNE SEULE ECRITURE                  */
/* -------------------------------------------------------------------- */
/* Trois endroits la disaient autrement : la legende de la vignette, le  */
/* comparateur avant/apres et le constat. Tous divisaient les pixels par */
/* le dpi DU PRODUIT, ce qui donnait 9,6 x 13,5 cm la ou Photoshop       */
/* annonce 40,1 x 56,4. Le client lit Photoshop ; l'outil doit lire      */
/* comme lui. Un seul calcul, un seul libelle, partout.                  */
/* ==================================================================== */
function dimClient(court) {
  const o = ORIGINE;
  /* Sur un LOT, ORIGINE est nul : le fichier analyse est le PDF assemble.
     La dimension declaree de la page affichee est alors portee par
     LOT_PAGES — sinon l'outil retombait sur la taille de la page assemblee
     (9,6 x 13,5 cm) et contredisait Photoshop, exactement ce qu'on avait
     corrige sur le fichier unique. */
  if (!o && LOT_PAGES && LOT_PAGES.length) {
    const q = LOT_PAGES[Math.min(PAGE_VUE, LOT_PAGES.length) - 1];
    if (q && q.cm) return { L: 0, H: 0, cm: q.cm, dpi: q.dpi, px: q.px,
      complet: court ? q.cm : `${q.cm} · ${q.px} à ${q.dpi} dpi` };
  }
  if (!o || o.type !== "image" || !(o.pxL > 0)) return null;
  const dx = o.dpiX > 0 ? o.dpiX : 72, dy = o.dpiY > 0 ? o.dpiY : 72;
  const L = o.pxL / dx * 2.54, H = o.pxH / dy * 2.54;
  const cm = `${L.toFixed(1)} × ${H.toFixed(1)} cm`;
  return { L: L, H: H, cm: cm, dpi: Math.round(dx),
           px: `${o.pxL} × ${o.pxH} px`,
           complet: court ? cm : `${cm} · ${o.pxL} × ${o.pxH} px à ${Math.round(dx)} dpi` };
}

function dimAffichee(ap, titre) {
  const o = ORIGINE;
  const estClient = /client|remis/i.test(titre || "");
  /* Sur une IMAGE, on affiche la dimension TELLE QUE LE CLIENT LA VOIT :
     pixels divises par le dpi declare dans le fichier — exactement le calcul
     de Photoshop. Le client qui annonce « mon fichier fait 40 cm » lit le
     meme chiffre ici, et la discussion n'a plus lieu d'etre.
     Le verdict, lui, ne depend pas de ce chiffre : il porte sur le dpi a la
     taille commandee, affiche dans la pastille Nettete. */
  const dc = estClient ? dimClient() : null;
  if (dc) return `${dc.cm} <span class="px">${dc.px} à ${dc.dpi} dpi</span>`;
  return `${ap.largCm.toFixed(1)} × ${ap.hautCm.toFixed(1)} cm`;
}

function figureApercu(ap, titre, p, avecFondPerdu, echelleCommune, sous) {
  if (!ap) return "";
  sous = sous || "";
  /* Sur une FACE de cahier, les reperes sont deja cuits dans l'image, PAR
     PAGE. Les calques CSS ci-dessous raisonnent sur une page unique : sur
     une double page ils tracaient un trait de coupe autour du couple, ce
     qui est faux et trompeur. On les desactive. */
  if (ap.face) {
    const style = echelleCommune
      ? ` style="width:min(${(ap.largCm / echelleCommune.largMax * 100).toFixed(2)}%,`
        + ` ${(ap.largCm * 430 / echelleCommune.hautMax).toFixed(0)}px)"`
      : "";
    return `<figure>
      <div class="cadre"><span class="porte"${style}><img src="${ap.url}" alt="${titre}"></span></div>
      <figcaption><b>${titre}</b>${(() => { const dd = dimAffichee(ap, titre); return dd ? " · " + dd : ""; })()}</figcaption>
      ${sous}
    </figure>`;
  }
  const fpB = avecFondPerdu ? p.fond_perdu_mm / 2 : 0;
  const pcL = (mm) => (mm / 10 / ap.largCm * 100).toFixed(2);
  const pcH = (mm) => (mm / 10 / ap.hautCm * 100).toFixed(2);
  const pli = pliPertinent(p, ap.largCm, fpB);
  let guidesPli = "";
  if (pli) {
    const largMm = ap.largCm * 10;
    const pct = (mm) => (mm / largMm * 100);
    for (const b of pli.bandes) {
      guidesPli += `<span class="guide g-pli" style="left:${pct(b.x0).toFixed(2)}%;width:${pct(b.x1-b.x0).toFixed(2)}%;top:0;bottom:0"></span>`;
      for (const a of b.axes)
        guidesPli += `<span class="guide g-pliaxe" style="left:${pct(a).toFixed(2)}%;top:0;bottom:0"></span>`;
    }
    let d = fpB;
    pli.volets.forEach((v, i) => {
      guidesPli += `<span class="g-volet" style="left:${pct(d + v/2).toFixed(2)}%;transform:translateX(-50%)">V${i+1} ${v}</span>`;
      d += v;
    });
  }

  /* oeillets : cercle plein = la perforation, cercle clair = la zone
     ecrasee par la rondelle, ou rien d'important ne doit se trouver */
  let guidesOeil = "";
  const oe = posOeillets(p, dimsSaisies());
  if (oe) for (const pt of oe.pts) {
    const gx = (oe.fx(pt) * 100).toFixed(2), gy = (oe.fy(pt) * 100).toFixed(2);
    guidesOeil += `<span class="g-oeilgarde" style="left:${gx}%;top:${gy}%;width:${(oe.fgx*100).toFixed(2)}%;height:${(oe.fgy*100).toFixed(2)}%"></span>`
                + `<span class="g-oeil" style="left:${gx}%;top:${gy}%;width:${(oe.fdx*100).toFixed(2)}%;height:${(oe.fdy*100).toFixed(2)}%"></span>`;
  }

  const guides = guidesOeil + guidesPli +
    (fpB > 0 ? `<span class="guide g-trim" style="left:${pcL(fpB)}%;right:${pcL(fpB)}%;top:${pcH(fpB)}%;bottom:${pcH(fpB)}%"></span>` : "") +
    (p.marge_secu_mm > 0 ? `<span class="guide g-secu" style="left:${pcL(fpB+p.marge_secu_mm)}%;right:${pcL(fpB+p.marge_secu_mm)}%;top:${pcH(fpB+p.marge_secu_mm)}%;bottom:${pcH(fpB+p.marge_secu_mm)}%"></span>` : "");
  /* Les deux aperçus doivent être à la MÊME échelle : sinon un fichier
     corrigé quatre fois plus petit s'affiche aussi grand que l'original et
     l'opérateur ne voit pas la différence qu'il montre au client. */
  /* Un seul facteur cm -> pixels pour les deux vues. Le plafond de hauteur
     est calcule sur le PLUS GRAND des deux formats, sinon la vue la plus
     haute tapait la limite, se reduisait, et les deux n'etaient plus a la
     meme echelle — c'est ce qui donnait l'impression d'un decalage. */
  const style = echelleCommune
    ? ` style="width:min(${(ap.largCm / echelleCommune.largMax * 100).toFixed(2)}%,`
      + ` ${(ap.largCm * 430 / echelleCommune.hautMax).toFixed(0)}px)"`
    : "";
  return `<figure>
    <div class="cadre"><span class="porte"${style}><img src="${ap.url}" alt="${titre}">${guides}</span></div>
    <figcaption><b>${titre}</b>${(() => { const dd = dimAffichee(ap, titre); return dd ? " · " + dd : ""; })()}</figcaption>
    ${sous}
  </figure>`;
}

/* Repères cuits dans l'image.
   À l'écran les repères sont des calques CSS : ils ne suivent ni dans le
   comparateur, ni dans les PDF. Ici on les dessine dans le pixel, à partir
   de l'aperçu déjà rendu — pas besoin de relire le PDF. */
async function annoter(ap, p, avecFondPerdu, dims) {
  if (!ap || !ap.url) return ap;
  const im = await new Promise((ok, ko) => {
    const e = new Image();
    e.onload = () => ok(e); e.onerror = ko; e.src = ap.url;
  });
  const cv = document.createElement("canvas");
  cv.width = im.naturalWidth; cv.height = im.naturalHeight;
  const c = cv.getContext("2d");
  c.drawImage(im, 0, 0);

  const pxL = cv.width / ap.largCm, pxH = cv.height / ap.hautCm;   /* px par cm */
  const fpB = avecFondPerdu ? p.fond_perdu_mm / 2 : 0;
  const tx = fpB / 10 * pxL, ty = fpB / 10 * pxH;
  const tw = cv.width - 2 * tx, th = cv.height - 2 * ty;
  const trait = Math.max(1.6, cv.width * 0.0032);

  /* Trait de coupe. Sans fond perdu il tombe pile sur le bord de l'image :
     on le rentre d'un demi-trait pour qu'il reste visible a l'ecran. */
  c.lineWidth = trait; c.setLineDash([]); c.strokeStyle = "#B02020";
  c.strokeRect(tx + trait / 2, ty + trait / 2,
               Math.max(1, tw - trait), Math.max(1, th - trait));

  /* marge de sécurité */
  if (p.marge_secu_mm > 0) {
    const mx = p.marge_secu_mm / 10 * pxL, my = p.marge_secu_mm / 10 * pxH;
    c.strokeStyle = "#B5651D";
    c.setLineDash([cv.width * 0.012, cv.width * 0.009]);
    c.strokeRect(tx + mx, ty + my, tw - 2 * mx, th - 2 * my);
    c.setLineDash([]);
  }

  /* zones de pli d'un depliant : rien ne doit tomber dessus */
  const pli = pliPertinent(p, ap.largCm, fpB);
  if (pli) {
    const parMm = cv.width / (ap.largCm * 10);
    for (const b of pli.bandes) {
      c.fillStyle = "rgba(176,32,32,.12)";
      c.fillRect(b.x0 * parMm, 0, (b.x1 - b.x0) * parMm, cv.height);
      c.strokeStyle = "#B02020"; c.lineWidth = trait * 0.8;
      c.setLineDash([cv.width * 0.010, cv.width * 0.007]);
      for (const a2 of b.axes) {
        c.beginPath(); c.moveTo(a2 * parMm, 0); c.lineTo(a2 * parMm, cv.height); c.stroke();
      }
      c.setLineDash([]);
    }
  }

  /* œillets */
  const oe = posOeillets(p, dims);
  if (oe) {
    const r = OEILLETS.diamMm / 2 / 10 * pxL;
    for (const pt of oe.pts) {
      const cx = tx + oe.fx(pt) * tw, cy = ty + oe.fy(pt) * th;
      c.beginPath(); c.arc(cx, cy, Math.max(2, r), 0, Math.PI * 2);
      c.strokeStyle = "#1F6FB5"; c.lineWidth = trait; c.stroke();
    }
  }
  return Object.assign({}, ap, { url: cv.toDataURL("image/png"), annote: true });
}

/* Comparateur avant / après, à la manière d'un volet coulissant.
   Les deux états occupent EXACTEMENT le même cadre : c'est ce qui rend la
   comparaison lisible. Les mettre à leur taille physique relative, comme je
   l'avais fait, donnait une impression d'image compressée d'un côté et
   étirée de l'autre — on comparait deux cadrages différents.
   La différence de format, elle, se lit sur les deux aperçus au-dessus. */
let CURSEUR = 50;
let P_COURANT = null;   /* produit affiché, pour la légende du comparateur */

/* Etiquette d'une vue : face de cahier, recto/verso, ou simple page.
   Un recto verso doit pouvoir etre inspecte des DEUX cotes — c'est le
   cas le plus courant de l'atelier, et il n'etait pas navigable ici. */
function libelleVue(p, n, total) {
  if (estCahier(p, vues.nbPages)) {
    const o = imposer(vues.nbPages)[n - 1];
    return `feuille <b>${o.feuille}</b> · <b>${o.face}</b> · pages ${o.g} et ${o.d}`;
  }
  if (total === 2) return `<b>${n === 1 ? "recto" : "verso"}</b> · page ${n}`;
  return `page <b>${n}</b>`;
}

function nbVuesDe(p) {
  if (estCahier(p, vues.nbPages)) return imposer(vues.nbPages).length;
  return vues.nbPages || 1;
}

function navFaces(id) {
  const p = P_COURANT;
  if (!p) return "";
  const total = nbVuesDe(p);
  if (total < 2) return "";
  const n = Math.min(Math.max(1, PAGE_VUE), total);
  return `<div class="cmp-nav">
    <button id="${id}-p" ${n <= 1 ? "disabled" : ""} aria-label="Vue précédente">&#8592;</button>
    <span>${libelleVue(p, n, total)}<i>${n} / ${total}</i></span>
    <button id="${id}-s" ${n >= total ? "disabled" : ""} aria-label="Vue suivante">&#8594;</button>
  </div>`;
}

function corpsCompare(id, grand) {
  const av = vues.avantA || vues.avant, ap = vues.apresA || vues.apres;
  const ratio = ap.largCm / ap.hautCm;
  /* La largeur du cadre est CALCULEE, pas laissee au navigateur : avec une
     enveloppe en largeur automatique, le curseur et les libelles prenaient
     toute la largeur du panneau et l'image se retrouvait callee a gauche.
     En fixant la largeur, tout est aligne sur l'image et centre avec elle. */
  const dispo = Math.max(240, (grand ? window.innerWidth - 96 : $("zone") ? $("zone").clientWidth - 64 : 700));
  const hMax = grand ? Math.max(240, window.innerHeight - 250) : Math.min(520, window.innerHeight * 0.58);
  const hPx = Math.round(Math.min(hMax, dispo / ratio));
  const wPx = Math.round(hPx * ratio);
  return `
    <div class="cmp-enveloppe" id="${id}-zone" style="width:${wPx}px">
    ${navFaces(id)}
    <div class="cmp-boite" style="height:${hPx}px">
    <div class="cmp" id="${id}">
      <img class="cmp-av" src="${av.url}" alt="Fichier client">
      <img class="cmp-ap" src="${ap.url}" alt="Après correction"
           style="clip-path:inset(0 ${(100 - CURSEUR).toFixed(2)}% 0 0)">
      <span class="cmp-tir" style="left:${CURSEUR}%"></span>
    </div>
    </div>
    <input type="range" class="cmp-rg" id="${id}-rg" min="0" max="100" step="0.1" value="${CURSEUR}"
           aria-label="Comparer avant et après">
    <div class="cmp-pieds">
      <span>Votre fichier initial<br><b>${(dimClient(true) || {}).cm
        || `${av.largCm.toFixed(1)} × ${av.hautCm.toFixed(1)} cm`}</b></span>
      <span class="d">Le fichier après correction<br><b>${ap.largCm.toFixed(1)} × ${ap.hautCm.toFixed(1)} cm</b></span>
    </div>
    <p class="cmp-leg"><i class="lg-r"></i> trait de coupe
      ${P_COURANT && P_COURANT.marge_secu_mm > 0
        ? `<i class="lg-o"></i> marge de sécurité ${P_COURANT.marge_secu_mm} mm` : ""}
      ${P_COURANT && posOeillets(P_COURANT, dimsSaisies()) ? `<i class="lg-b"></i> œillets` : ""}</p>
    </div>`;
}

function blocCompare(r, p) {
  P_COURANT = p;
  if (!vues.avant || !vues.apres) return "";
  /* les versions annotées sont préparées en tâche de fond puis réaffichées */
  if (!vues.apresA) preparerAnnotes(r, p);
  return `
  <div class="pan compare">
    <div class="tete">Avant et après
      <button id="cmpGrand">Ouvrir en grand</button>
    </div>
    ${corpsCompare("cmp")}
  </div>`;
}

let ANNOTE_EN_COURS = false;
async function preparerAnnotes(r, p) {
  if (ANNOTE_EN_COURS || !vues.avant || !vues.apres) return;
  ANNOTE_EN_COURS = true;
  try {
    const d = dimsSaisies();
    vues.avantA = await annoter(vues.avant, p, r.fpIntegre || r.trim, d);
    vues.apresA = await annoter(vues.apres, p, p.fond_perdu_mm > 0, d);
    const c = $("cmp");
    if (c) {
      const a = c.querySelector(".cmp-av"), b = c.querySelector(".cmp-ap");
      if (a) a.src = vues.avantA.url;
      if (b) b.src = vues.apresA.url;
    }
  } catch (e) { /* sans repères, le comparateur reste utilisable */ }
  ANNOTE_EN_COURS = false;
}

/* Change de feuille SANS quitter le comparateur : les deux images sont
   re-rendues sur place, le curseur garde sa position. Le fichier client et
   le fichier corrige sont tous deux en memoire, il n'y a rien a relancer. */
async function allerFaceCompare(id, n) {
  const p = P_COURANT;
  if (!p) return;
  const total = nbVuesDe(p);
  if (n < 1 || n > total) return;
  const c = $(id);
  if (c) c.style.opacity = ".45";
  PAGE_VUE = n;
  const cahier = estCahier(p, vues.nbPages);
  const o = cahier ? imposer(vues.nbPages)[n - 1] : null;
  const client = SOURCE_INIT || source;
  const aCorrige = source !== client;
  const rendre = (buf) => o ? apercuFace(buf, o.g, o.d, 0, p) : apercu(buf, n);
  try {
    vues.avant = await rendre(client);
    vues.apres = aCorrige ? await rendre(source) : vues.apres;
    vues.avantA = null; vues.apresA = null;
    if (typeof preparerAnnotes === "function" && _dernierR) preparerAnnotes(_dernierR, p);
    const zone = $(id + "-zone") || (c && c.parentElement);
    if (zone) {
      zone.outerHTML = corpsCompare(id, id === "cmpBig");
      brancherUnCompare(id);
    }
  } catch (e) { if (c) c.style.opacity = "1"; }
}

function brancherUnCompare(id) {
  if ($(id + "-p")) $(id + "-p").onclick = () => allerFaceCompare(id, PAGE_VUE - 1);
  if ($(id + "-s")) $(id + "-s").onclick = () => allerFaceCompare(id, PAGE_VUE + 1);
  const c = $(id), rg = $(id + "-rg");
  if (!c) return;
  const ap = c.querySelector(".cmp-ap"), tir = c.querySelector(".cmp-tir");
  const place = (v) => {
    CURSEUR = Math.max(0, Math.min(100, v));
    /* on DECOUPE l'image du dessus, on ne la redimensionne pas : la
       redimensionner la comprimait à mesure que le volet se fermait */
    ap.style.clipPath = `inset(0 ${(100 - CURSEUR).toFixed(2)}% 0 0)`;
    tir.style.left = CURSEUR + "%";
    if (rg) rg.value = CURSEUR;
  };
  if (rg) rg.oninput = () => place(parseFloat(rg.value));
  let actif = false;
  const depuis = (ev) => {
    const b = c.getBoundingClientRect();
    const x = (ev.touches ? ev.touches[0].clientX : ev.clientX) - b.left;
    place(x / b.width * 100);
  };
  c.onmousedown = (ev) => { actif = true; depuis(ev); ev.preventDefault(); };
  c.ontouchstart = (ev) => { actif = true; depuis(ev); };
  const bouge = (ev) => { if (actif) depuis(ev); };
  const fin = () => { actif = false; };
  window.addEventListener("mousemove", bouge);
  window.addEventListener("touchmove", bouge);
  window.addEventListener("mouseup", fin);
  window.addEventListener("touchend", fin);
}

/* Plein ecran du seul fichier client.
   Le comparateur ne s'ouvrait que lorsqu'une correction avait ete produite :
   sur un fichier deja conforme — le cas le plus frequent — l'operateur
   n'avait aucun moyen de regarder le visuel en grand. */
function ouvrirApercuSeul(p) {
  const v = vues.avant;
  if (!v) return;
  $("calques").innerHTML = `
  <div class="pleinecran" id="apPlein">
    <div class="pe-tete">
      <h2>${p.produit} — fichier client</h2>
      <button id="apFermer">Fermer</button>
    </div>
    <div class="pe-corps pe-seul">
      <div class="cadre"><span class="porte"><img src="${v.url}" alt="Fichier client"></span></div>
      <p class="cmp-leg">${v.largCm.toFixed(1)} × ${v.hautCm.toFixed(1)} cm de page</p>
    </div>
  </div>`;
  const fermer = () => { $("calques").innerHTML = ""; document.onkeydown = null; };
  $("apFermer").onclick = fermer;
  document.onkeydown = (e) => { if (e.key === "Escape") fermer(); };
}

function ouvrirCompare(p) {
  if (!vues.avant || !vues.apres) return;
  $("calques").innerHTML = `
  <div class="pleinecran" id="cmpPlein">
    <div class="pe-tete">
      <h2>${p.produit} — avant et après</h2>
      <button id="cmpFermer">Fermer</button>
    </div>
    <div class="pe-corps">${corpsCompare("cmpBig", true)}</div>
  </div>`;
  brancherUnCompare("cmpBig");
  const fermer = () => { $("calques").innerHTML = ""; document.onkeydown = null; };
  $("cmpFermer").onclick = fermer;
  document.onkeydown = (e) => { if (e.key === "Escape") fermer(); };
}

function brancherCompare(r, p) {
  brancherUnCompare("cmp");
  if ($("cmpGrand")) $("cmpGrand").onclick = () => ouvrirCompare(p);
  for (const b of document.querySelectorAll("[data-vers]")) b.onclick = () => {
    const c = $(b.dataset.vers);
    if (!c) return;
    c.scrollIntoView({ behavior: "smooth", block: "center" });
    c.classList.add("surligne");
    setTimeout(() => c.classList.remove("surligne"), 1600);
  };
  if ($("apGrand")) $("apGrand").onclick = () =>
    (vues.apres ? ouvrirCompare(p) : ouvrirApercuSeul(p));
}

/* ==================================================================== */
/* SYNTHESE EN QUATRE AXES                                              */
/* -------------------------------------------------------------------- */
/* Avant de lire quinze constats, l'operateur doit savoir en trois       */
/* secondes ce qui cloche. Chaque constat est range dans un axe, et      */
/* l'axe prend le NIVEAU LE PIRE de ce qu'il contient. Le classement se  */
/* fait d'abord sur le code stable, et seulement a defaut sur le texte.  */
/* ==================================================================== */
/* L'ordre compte : le premier axe dont l'expression accroche l'emporte.
   La netteté passe AVANT les dimensions, sinon « trop peu définie pour ce
   format » tombait dans les dimensions a cause du mot « format ». */
const AXES = [
  { cle: "nettete", titre: "Netteté",
    codes: ["NET_OEIL"],
    mots: /résolution|dpi|définie|flou|piqué|netteté|trop petite|manqueront de/i,
    mot: { VERT: "nette", ORANGE: "juste", ROUGE: "insuffisante" } },
  /* Le mot « taille » nu attirait ici « Du texte est a la limite du lisible
     a cette taille », qui parle de corps de caractere et n'a rien a voir
     avec les dimensions du fichier : un kakemono parfaitement dimensionne
     s'affichait « a ajuster ». Les expressions doivent designer le FORMAT,
     jamais une taille au sens general. */
  { cle: "format", titre: "Dimensions",
    codes: ["ECHELLE", "RATIO", "ORIENT", "DEBORD", "PAGES4", "RECTOSEUL"],
    mots: /bonne taille|même taille|forme du produit|proportions|orientation|dépassent? de la page|plus grand que la page|format demandé|nombre de pages|multiple de 4|se monte par/i,
    mot: { VERT: "au format", ORANGE: "à ajuster", ROUGE: "incompatible" } },
  { cle: "bords", titre: "Bords et marges",
    codes: ["SECU", "GOUTTIERE", "FP_ABSENT", "FP_INSUF", "OEILLET", "TEXTE_PETIT"],
    mots: /bord|marge|coupe|pli|reliure|œillet|oeillet|sécurité|lisible|plus petit corps/i,
    mot: { VERT: "respectés", ORANGE: "limite", ROUGE: "à risque" } },
  { cle: "couleurs", titre: "Couleurs et structure",
    codes: ["RVB"],
    mots: /couleur|RVB|CMJN|surimpression|par-dessus|transparence|police|calque|formulaire|fusion/i,
    mot: { VERT: "conformes", ORANGE: "à signaler", ROUGE: "à revoir" } },
];

/* ==================================================================== */
/* NETTETE : DPI UTILES                                                 */
/* -------------------------------------------------------------------- */
/* Un pourcentage ne decide de rien — 40 % de quoi ? Et il ignorait le    */
/* produit : 40 % sur une carte lue en main et 40 % sur une banderole lue */
/* a trois metres ne sont pas la meme chose.                              */
/* On exprime la mesure en DPI UTILES, comparee aux seuils qui existent   */
/* deja dans le referentiel : dpi_mini et dpi_cible. Ces seuils encodent  */
/* la classe de tolerance, donc la distance de lecture. Une seule         */
/* grammaire pour les deux mesures : celle annoncee et celle reelle.      */
/* NET_REF : largeur de transition d'un contour franc.                    */
/* ==================================================================== */
const NET_REF = 1.3;

/* ==================================================================== */
/* NETTETE A DEUX ETAGES                                                */
/* -------------------------------------------------------------------- */
/* Etage 1 — dpi A LA TAILLE COMMANDEE. Arithmetique pure : pixels du    */
/*   client rapportes au format fini. Jamais en echec sur une image.     */
/*   C'est un PLAFOND : la nettete reelle ne peut pas le depasser.       */
/* Etage 2 — dpi UTILES, la mesure fine. Quand elle aboutit, elle        */
/*   remplace le verdict, toujours vers le bas. Quand elle n'aboutit     */
/*   pas, elle disparait en silence et l'etage 1 tient.                  */
/* « non mesurable » disparait de l'interface : ce n'etait pas une       */
/* information, et la nettete est centrale dans la decision.             */
/* ==================================================================== */
function barreNettete(utile, p) {
  const mini = (p && p.dpi_mini > 0) ? p.dpi_mini : 0;
  const cible = (p && p.dpi_cible > 0) ? p.dpi_cible : 0;
  const niveau = (mini && utile < mini) ? "ROUGE"
               : (cible && utile < cible) ? "ORANGE" : "VERT";
  let pos;
  if (!mini || !cible || cible <= mini) pos = Math.max(0, Math.min(100, utile / 3));
  else if (utile <= mini) pos = 33 * (utile / mini);
  else if (utile <= cible) pos = 33 + 33 * ((utile - mini) / (cible - mini));
  else pos = Math.min(100, 66 + 34 * Math.min(1, (utile - cible) / cible));
  return { utile: utile, mini: mini, cible: cible, niveau: niveau,
           pos: Math.max(0, Math.min(1, pos / 100)) };
}

/* Etage 1. Ne depend d'aucune mesure : uniquement des pixels du fichier
   client et du format cible, orientation comprise. */
function netteteCommandee(p) {
  const o = ORIGINE;
  if (!o || o.type !== "image" || !(o.pxL > 0 && o.pxH > 0)) return null;
  const c = formatCible(p, dimsSaisies());
  const L = c ? c.larg : o.natL, H = c ? c.haut : o.natH;
  if (!(L > 0 && H > 0)) return null;
  /* Le sens du fichier peut ne pas etre celui de la commande : on compare
     grand cote a grand cote, sinon un fichier a pivoter sortirait
     artificiellement bas. */
  const gp = Math.max(o.pxL, o.pxH), pp = Math.min(o.pxL, o.pxH);
  const gc = Math.max(L, H), pc = Math.min(L, H);
  const utile = Math.round(Math.min(gp / (gc / 2.54), pp / (pc / 2.54)));
  if (!(utile > 0)) return null;
  const b = barreNettete(utile, p);
  b.etage = 1; b.mesure = false;
  return b;
}

function noteNettete(n, p) {
  if (!n || !n.exploitable || n.bordTexte === null) return netteteCommandee(p);
  const t = n.bordTexte;
  if (!(t > 0) || !n.dpiPage) return netteteCommandee(p);
  const utile = Math.round(n.dpiPage * NET_REF / t);
  const mini = (p && p.dpi_mini > 0) ? p.dpi_mini : 0;
  const cible = (p && p.dpi_cible > 0) ? p.dpi_cible : 0;
  const niveau = (mini && utile < mini) ? "ROUGE"
               : (cible && utile < cible) ? "ORANGE" : "VERT";
  /* le seuil mini est place au tiers de la barre, la cible aux deux tiers :
     l'operateur lit sa marge d'un coup d'oeil, pas un pourcentage abstrait */
  let pos;
  if (!mini || !cible || cible <= mini) pos = Math.max(0, Math.min(100, utile / 3));
  else if (utile <= mini) pos = 33 * (utile / mini);
  else if (utile <= cible) pos = 33 + 33 * ((utile - mini) / (cible - mini));
  else pos = Math.min(100, 66 + 34 * Math.min(1, (utile - cible) / cible));
  /* La mesure fine ne peut que CONFIRMER ou ABAISSER l'étage 1 : elle mesure
     la définition réellement portée par les pixels, jamais davantage que ce
     qu'ils contiennent. Une valeur supérieure au plafond arithmétique est un
     artefact de mesure, pas une bonne nouvelle. */
  const plaf = netteteCommandee(p);
  if (plaf && utile > plaf.utile) return plaf;
  return { utile, mini, cible, niveau, transition: t, etage: 2, mesure: true,
           pos: Math.max(0, Math.min(1, pos / 100)) };
}

function syntheseAxes(r) {
  const rang = { VERT: 0, NOTE: 0, RELEVE: 0, ORANGE: 1, ROUGE: 2 };
  const etat = AXES.map(() => ({ niveau: "VERT", vu: false, pire: "" }));
  for (const c of (r.constats || [])) {
    const [niv, txt, , , code] = c;
    if (niv !== "ROUGE" && niv !== "ORANGE") continue;
    let i = code ? AXES.findIndex((a) => a.codes.includes(code)) : -1;
    if (i < 0) i = AXES.findIndex((a) => a.mots.test(txt));
    if (i < 0) i = AXES.length - 1;         /* structure, par defaut */
    const e = etat[i];
    e.vu = true;
    if (rang[niv] > rang[e.niveau]) { e.niveau = niv; e.pire = txt; }
  }
  /* Chaque pastille porte la RAISON de son etat. Sans elle, l'operateur lit
     « à ajuster » et doit descendre dans la liste des constats pour savoir
     de quoi il s'agit — ce qui annule le gain de la lecture en trois
     secondes. */
  const court = (t) => {
    if (!t) return "";
    const f = String(t).split(/(?<=[.:])\s/)[0];
    return f.length > 84 ? f.slice(0, 82).trim() + "…" : f;
  };
  const out = AXES.map((a, i) => ({
    titre: a.titre,
    niveau: etat[i].niveau,
    mot: a.mot[etat[i].niveau],
    detail: etat[i].pire,
    cause: court(etat[i].pire),
  }));
  /* La pastille Netteté porte la MESURE, pas l'absence de constat. Sans
     mesure exploitable elle le dit, au lieu d'afficher un vert trompeur. */
  const n = r.sansRaster ? null : noteNettete(r.nettete, P_COURANT);
  if (n) {
    out[0].niveau = rang[n.niveau] > rang[out[0].niveau] ? n.niveau : out[0].niveau;
    out[0].sous = n.mini ? `minimum ${n.mini}` : "";
    out[0].barre = n;
    if (n.mesure) {
      out[0].mot = `${n.utile} dpi utiles`;
      out[0].detail = `Contours étalés sur ${(n.transition || 0).toFixed(2)} px, soit environ `
        + `${n.utile} dpi réellement portés par les pixels`
        + (n.cible ? `. Minimum ${n.mini}, cible ${n.cible} pour ce produit.` : ".")
        + ` Estimation, pas une mesure directe.`;
    } else {
      /* Etage 1 : calcul direct, aucune mesure de contour. `transition`
         n'existe pas sur ce repli — l'afficher plantait l'analyse. */
      out[0].mot = `${n.utile} dpi à la taille commandée`;
      out[0].detail = `Les pixels du fichier rapportés au format commandé. C'est un `
        + `plafond : la netteté réelle ne peut pas dépasser cette valeur.`
        + (n.cible ? ` Minimum ${n.mini}, cible ${n.cible} pour ce produit.` : "")
        + ` La mesure fine des contours n'a pas abouti sur ce fichier.`;
    }
  } else {
    /* Un fichier vectoriel n'a pas de nettete a mesurer : ses contours sont
       parfaits par construction, la mesure n'a simplement pas d'objet.
       L'annoncer « non mesuree » laissait croire a une defaillance de
       l'outil sur un fichier pourtant irreprochable. */
    const m = (r.nettete && r.nettete.motif) || "";
    /* On ne DESCEND jamais le niveau d'un axe : un constat rouge deja classe
       ici — « image trop peu definie », par exemple — doit rester visible.
       L'ecraser en VERT donnait un bandeau « a reprendre » sans aucune
       pastille rouge, donc un ecran qui se contredit. */
    const rouge = out[0].niveau === "ROUGE", orange = out[0].niveau === "ORANGE";
    if (r.sansRaster || /vectoriel/i.test(m)) {
      out[0].mot = (rouge || orange) ? "tracés vectoriels" : "tracés vectoriels";
      out[0].sous = (rouge || orange) ? "voir le constat" : "net à toute dimension";
      out[0].barre = (rouge || orange) ? null : { pos: 1, mini: 0, cible: 0 };
      out[0].detail = "Le visuel est fait de tracés, pas de pixels : il n'a pas de résolution. "
        + "Agrandi dix fois ou réduit de moitié, ses contours restent aussi francs. "
        + "Aucune limite de taille de ce côté."
        + ((rouge || orange) ? " Un autre point reste signalé sur cet axe : voir le détail." : "");
    } else {
      /* Repli sur l'étage 1 : le dpi à la taille commandée est toujours
         calculable sur une image. « non mesurable » ne laissait rien à
         l'opérateur sur ce qui est pourtant l'axe le plus décisif. */
      const pl = netteteCommandee(P_COURANT);
      if (pl) {
        out[0].mot = pl.utile + " dpi à la taille commandée";
        out[0].sous = pl.mini ? "minimum " + pl.mini : "";
        out[0].barre = { pos: pl.pos, mini: pl.mini, cible: pl.cible };
        if (rang[pl.niveau] > rang[out[0].niveau]) out[0].niveau = pl.niveau;
        out[0].detail = "Calcul direct : les pixels du fichier rapportés au format commandé. "
          + "C'est un plafond — la netteté réelle ne peut pas dépasser cette valeur. "
          + "La mesure fine des contours n'a pas abouti sur ce fichier"
          + (m ? " (" + m + ")" : "") + " : vérifier à l'œil sur l'agrandissement.";
        out[0].vers = "verifOeil";
      } else {
        out[0].mot = "à vérifier à l'œil";
        out[0].vers = "verifOeil";
        out[0].sous = (rouge || orange) ? "voir le constat" : "";
        out[0].detail = (m || "mesure non exploitable sur ce fichier")
          + " — juger sur l'agrandissement de l'aperçu.";
      }
    }
  }
  return out;
}

function blocAxes(r) {
  const ax = syntheseAxes(r);
  return `<div class="axes">${ax.map((a) => {
    const b = a.barre;
    /* Le seuil mini est place au tiers de la barre : l'operateur voit d'un
       coup s'il est au-dessus ou au-dessous, sans lire le chiffre. */
    const jauge = b ? `<span class="ax-j">
      <i style="width:${(b.pos * 100).toFixed(0)}%"></i>
      ${b.mini ? `<u style="left:33%" title="minimum ${b.mini} dpi"></u>` : ""}
      ${b.cible ? `<u class="c" style="left:67%" title="cible ${b.cible} dpi"></u>` : ""}
    </span>` : "";
    /* Une pastille qui dit « à vérifier à l'œil » doit mener quelque part :
       elle devient un bouton qui amène au bloc de vérification. */
    const bal = a.vers ? "button" : "div", att = a.vers ? ` type="button" data-vers="${a.vers}"` : "";
    return `
    <${bal} class="axe n-${a.niveau}${a.vers ? " axe-cliq" : ""}"${att} ${a.detail ? `title="${a.detail.replace(/"/g, "'")}"` : ""}>
      <span class="ax-t">${a.titre}</span>
      <span class="ax-v">${a.mot}${a.sous ? ` <b class="ax-s">· ${a.sous}</b>` : ""}</span>
      ${jauge}
      ${a.cause ? `<span class="ax-c">${a.cause}</span>` : ""}
      ${a.vers ? `<span class="ax-go">Vérifier à l'œil →</span>` : ""}
    </${bal}>`;
  }).join("")}</div>`;
}

function blocApercus(r, p) {
  if (!vues.avant) return "";
  const duo = !!vues.apres;
