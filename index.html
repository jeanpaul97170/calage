<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calage · Imprimerie de Jarry</title>
<meta name="theme-color" content="#12151B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   Console de production. Structure empruntée aux stations de pilotage
   d'atelier : bandeau latéral sombre pour la navigation, zone de travail
   claire et dense, panneau d'inspection à droite.
   Couleurs et typographie : charte Imprimerie de Jarry.
   ===================================================================== */
:root{
  --marque:#CC2A2A; --barre:#1A1A1A; --barre2:#262626; --barreTexte:#E8E8E8;
  --fond:#F0F0F0; --panneau:#FFFFFF; --trait:#D8D8D8; --traitFort:#BFBFBF;
  --texte:#1A1A1A; --texteFaible:#6B6B6B; --accent:#CC2A2A;
  --vert:#1E7A46; --orange:#B5651D; --rouge:#B02020;
  --vertFond:#E7F3EB; --orangeFond:#FBF0E3; --rougeFond:#FAEAEA;
  --police-titre:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --police-donnees:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --r:3px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--fond);color:var(--texte);font-family:var(--police-titre);
  font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
.mono{font-family:var(--police-donnees);font-variant-numeric:tabular-nums}
button{font-family:var(--police-titre)}

/* ---------- barre de titre ---------- */
.chrome{display:flex;align-items:stretch;background:var(--barre);color:var(--barreTexte);height:46px}
.tuile{width:46px;background:var(--marque);display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:900;font-size:15px;letter-spacing:-.03em}
.chrome .nom{display:flex;align-items:center;gap:11px;padding:0 15px}
.chrome h1{font-size:14px;font-weight:700;margin:0;letter-spacing:.01em}
.chrome .ens{font-size:11px;color:#9a9a9a}
#logo{display:block;width:auto}
.chrome .droite{margin-left:auto;display:flex;align-items:center;gap:16px;padding:0 15px;font-size:11px;color:#9a9a9a}
.pastille{display:inline-block;width:7px;height:7px;border-radius:50%;background:#5a5a5a;margin-right:6px;vertical-align:middle}
.pastille.on{background:#39a05a}
.gamme{display:flex;height:3px;width:100%}
.gamme i{flex:1}

/* ---------- grille principale ---------- */
main{display:grid;grid-template-columns:236px minmax(0,1fr) 300px;height:calc(100vh - 49px)}
@media(max-width:1100px){main{grid-template-columns:210px minmax(0,1fr);height:auto}
  .inspecteur{grid-column:1/-1;border-left:0;border-top:1px solid var(--trait)}}
@media(max-width:720px){main{grid-template-columns:1fr;height:auto}
  .rail{max-height:none}}

/* ---------- bandeau latéral ---------- */
.rail{background:var(--barre);color:var(--barreTexte);overflow-y:auto;padding-bottom:18px;display:flex;flex-direction:column}
.rail .chercher{padding:12px 12px 8px;position:sticky;top:0;background:var(--barre);z-index:2}
.rail .chercher input{width:100%;background:#2a2a2a;border:1px solid #3a3a3a;border-radius:var(--r);
  color:#fff;padding:8px 10px;font-size:13px;outline:none}
.rail .chercher input::placeholder{color:#8c8c8c}
.rail .chercher input:focus{border-color:var(--marque);background:#333}
.rail .vide2{padding:14px 15px;color:#8c8c8c;font-size:12px}
.rail .sect{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:#7d7d7d;padding:16px 15px 7px}
.rail button.fam{display:flex;width:100%;align-items:center;gap:9px;font-size:11.5px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;color:#fff;padding:11px 15px;background:var(--marque);
  border:0;border-top:1px solid rgba(0,0,0,.25);cursor:pointer;text-align:left}
.rail button.fam:hover{filter:brightness(1.12)}
.rail button.fam .chev{margin-left:auto;font-size:10px;transition:transform .15s;color:rgba(255,255,255,.85)}
.rail button.fam.ferme .chev{transform:rotate(-90deg)}
.rail button.fam .nb{font-family:var(--police-donnees);font-weight:500;color:rgba(255,255,255,.75);
  background:rgba(0,0,0,.22);padding:1px 6px;border-radius:9px;font-size:10.5px;letter-spacing:0}
/* Les récents ne sont pas une famille : ils gardent le fond sombre pour que
   les deux sections métier restent les seuls repères rouges. */
.rail button.fam.recents{background:var(--barre2);color:#a8a8a8;letter-spacing:.1em;font-size:10.5px}
.rail button.fam.recents:hover{color:#fff;filter:none}
.rail button.fam.recents .nb{background:rgba(255,255,255,.08);color:#8c8c8c}
.rail button.item{display:flex;width:100%;text-align:left;align-items:baseline;gap:9px;
  background:none;border:0;border-left:3px solid transparent;color:#dcdcdc;
  padding:9px 15px 9px 12px;font-size:14px;line-height:1.25;cursor:pointer}
.rail button.item .fmt{font-family:var(--police-donnees);font-size:10px;color:#7d7d7d}
.rail button.item:hover{background:#232323;color:#fff}
.rail button.item.actif{background:#2c2c2c;color:#fff;border-left-color:var(--marque);font-weight:600}
.rail .code{margin-left:auto;font-family:var(--police-donnees);font-size:10px;color:#6e6e6e;opacity:0}
.rail button.item:hover .code,.rail button.item.actif .code{opacity:1}
.rail button.item.actif .code{color:#bdbdbd}
#produit{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

/* ---------- zone de travail ---------- */
.travail{overflow-y:auto;background:var(--fond)}
.bandeau{display:flex;align-items:center;gap:16px;padding:13px 18px;border-bottom:1px solid var(--trait);
  background:var(--panneau)}
.bandeau .etat{font-family:var(--police-donnees);font-size:12px;font-weight:600;letter-spacing:.08em;
  padding:5px 11px;border-radius:var(--r);text-transform:uppercase}
.b-VERT .etat{background:var(--vertFond);color:var(--vert);border:1px solid #bcdcc8}
.b-ORANGE .etat{background:var(--orangeFond);color:var(--orange);border:1px solid #e7cfa8}
.b-ROUGE .etat{background:var(--rougeFond);color:var(--rouge);border:1px solid #e9bfbf}
.b-VERT{border-left:4px solid var(--vert)} .b-ORANGE{border-left:4px solid var(--orange)}
.b-ROUGE{border-left:4px solid var(--rouge)}
.bandeau .quoi b{display:block;font-size:13.5px;font-weight:600}
.bandeau .quoi{font-size:12px;color:var(--texteFaible);line-height:1.35}
.bandeau .fic{margin-left:auto;font-family:var(--police-donnees);font-size:11px;color:var(--texteFaible);
  text-align:right;overflow-wrap:anywhere;max-width:340px;line-height:1.35}
/* le bouton suit le nom de fichier, sans s y coller */
.bandeau button.vertplein{margin-left:0}

.barreoutils{display:flex;gap:6px;padding:8px 14px;background:var(--panneau);
  border-bottom:1px solid var(--trait);flex-wrap:wrap;align-items:center}
.barreoutils button{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid transparent;
  border-radius:var(--r);padding:5px 9px;font-size:12px;color:var(--texte);cursor:pointer}
.barreoutils button:hover{background:#f4f4f4;border-color:var(--trait)}
.barreoutils button.primaire{background:var(--marque);color:#fff;border-color:var(--marque);font-weight:600}
.barreoutils button.primaire:hover{background:#b32424}
.barreoutils .sep{width:1px;height:20px;background:var(--trait);margin:0 3px}
.barreoutils svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7}

/* ---------- table des constats ---------- */
.tableau{background:var(--panneau);border-bottom:1px solid var(--trait)}
.tableau .entete{display:grid;grid-template-columns:96px 1fr 118px;gap:10px;padding:6px 14px;
  border-bottom:1px solid var(--trait);background:#fafafa;
  font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--texteFaible)}
.lignec{display:grid;grid-template-columns:96px 1fr 118px;gap:10px;padding:8px 14px;
  border-bottom:1px solid #ececec;font-size:12.5px;align-items:start}
.lignec:last-child{border-bottom:0}
.lignec:hover{background:#fafafa}
.etat-c{font-family:var(--police-donnees);font-size:10px;font-weight:600;letter-spacing:.06em;
  padding:2px 6px;border-radius:2px;justify-self:start}
.e-VERT{background:var(--vertFond);color:var(--vert)}
.e-ORANGE{background:var(--orangeFond);color:var(--orange)}
.e-ROUGE{background:var(--rougeFond);color:var(--rouge)}
.e-NOTE{background:#efefef;color:var(--texteFaible)}
.e-RELEVE{background:#efefef;color:var(--texteFaible)}
.synthese{margin:18px 16px 10px;padding:18px 22px 18px 20px;border-radius:8px;
  border-left:4px solid var(--traitFort);background:var(--panneau)}
.synthese.s-VERT{border-left-color:var(--vert);background:var(--vertFond)}
.synthese.s-ORANGE{border-left-color:var(--orange);background:var(--orangeFond)}
.synthese.s-ROUGE{border-left-color:var(--rouge);background:var(--rougeFond)}
.synthese h3{margin:0 0 9px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;opacity:.75}
.synthese p{margin:0;font-size:15px;line-height:1.5;font-weight:600}
.mes{color:var(--texteFaible);font-size:12.5px}
.cons{display:block;margin-top:4px;font-size:12.5px;color:var(--texteFaible);
  padding-left:9px;border-left:2px solid var(--trait)}
.okrepli{border-top:1px solid var(--trait)}
.okrepli summary{padding:10px 16px;font-size:13px;color:var(--texteFaible);cursor:pointer;user-select:none}
.okrepli summary:hover{color:var(--texte)}
.verifs{margin-top:14px}
.verif{padding:14px 16px;border-top:1px solid var(--trait)}
.verif h3{margin:0 0 8px;font-size:14px;font-weight:700}
.verif img{display:block;max-width:100%;border:1px solid var(--trait);border-radius:4px;background:#fff}
.vintro{margin:10px 16px 0;font-size:12.5px;color:var(--texteFaible)}
.vleg{margin:8px 0 0;font-size:12px;color:var(--texteFaible)}
.vq{margin:10px 0 8px;font-size:13.5px;font-weight:600}
.vbtn{display:flex;gap:8px;flex-wrap:wrap}
.vbtn button{padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;
  border:1px solid var(--traitFort);border-radius:6px;background:#fff}
.vbtn button:hover{border-color:var(--marque);color:var(--marque)}
.verif.tranche{padding:0;border-top:1px solid var(--trait)}
.verif.tranche summary{display:flex;align-items:center;gap:9px;padding:12px 16px;
  font-size:13.5px;font-weight:600;cursor:pointer;user-select:none}
.verif.tranche summary button{margin-left:auto;font-size:12px;font-weight:500;padding:5px 10px;
  cursor:pointer;border:1px solid var(--trait);border-radius:5px;background:#fff}
.verif.tranche img{margin:0 16px 14px}
.vpast{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.vpast.vok{background:var(--vert)} .vpast.vko{background:var(--orange)}
.vnav{display:flex;align-items:center;gap:12px;margin-bottom:9px}
.vnav button{width:34px;height:30px;font-size:15px;cursor:pointer;border:1px solid var(--traitFort);
  border-radius:6px;background:#fff;line-height:1}
.vnav button:hover{border-color:var(--marque);color:var(--marque)}
.vnav span{display:flex;gap:8px;font-size:12.5px;color:var(--texteFaible)}
.vnav b{font-weight:500} .vnav b.on{font-weight:700;color:var(--marque)}
.bandeau button.vertplein{flex:0 0 auto;display:inline-flex;align-items:center;
  gap:7px;padding:8px 16px;border:0;border-radius:6px;cursor:pointer;
  font-family:inherit;font-size:13px;font-weight:600;background:#1E7A46;color:#fff}
.bandeau button.vertplein:hover{background:#186139}
/* Un seul bouton plein a la fois : le telechargement est l'aboutissement du
   controle, « controler un autre » est une remise a zero. Les mettre au meme
   rang faisait hesiter l'operateur entre deux verts identiques. */
.bandeau button.vertplein.premier{padding:10px 20px;font-size:13.5px}
.bandeau button.bandeau-2{flex:0 0 auto;display:inline-flex;align-items:center;
  gap:7px;padding:8px 15px;border:1px solid var(--traitFort);border-radius:6px;
  cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;
  background:var(--panneau);color:var(--texte)}
.bandeau button.bandeau-2:hover{background:var(--fond);border-color:var(--texteFaible)}
.bandeau button.bandeau-2 svg{width:15px;height:15px;stroke:var(--texte);fill:none;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* le fill:none n'etait declare que pour .barreoutils : sorti de la barre,
   le SVG reprenait son fill noir par defaut, d'ou le disque plein */
.bandeau button.vertplein svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.navpage{display:flex;align-items:center;gap:12px;margin:0 0 10px}
.navpage button{width:34px;height:30px;font-size:15px;cursor:pointer;border:1px solid var(--traitFort);
  border-radius:6px;background:#fff;line-height:1}
.navpage button:disabled{opacity:.35;cursor:default}
.navpage button:not(:disabled):hover{border-color:var(--marque);color:var(--marque)}
.navpage span{font-size:12.5px;color:var(--texteFaible)}
.navpage .actu{margin-left:auto;display:inline-flex;align-items:center;gap:6px;
  padding:6px 13px;border:1px solid var(--traitFort);border-radius:6px;background:#fff;
  font-family:inherit;font-size:12.5px;font-weight:600;color:var(--texte);cursor:pointer;width:auto}
.navpage .actu:hover{border-color:var(--marque);color:var(--marque)}
.navpage .actu svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.navpage b{color:var(--texte);font-family:var(--police-donnees)}
.navpage .sur{margin-left:8px;opacity:.7}
.prog{padding:46px 32px;display:flex;flex-direction:column;gap:12px;align-items:center}
.progbar{width:100%;max-width:420px;height:5px;border-radius:3px;background:var(--trait);overflow:hidden}
.progbar i{display:block;height:100%;width:0;border-radius:3px;background:var(--marque);
  transition:width .28s ease}
.progtxt{font-size:12.5px;color:var(--texteFaible)}
.compare{margin-top:14px}
.compare .tete{display:flex;align-items:center;justify-content:space-between}
.compare .tete button{font-size:12px;font-weight:600;padding:6px 12px;cursor:pointer;
  border:1px solid var(--traitFort);border-radius:6px;background:#fff}
.compare .tete button:hover{border-color:var(--marque);color:var(--marque)}
/* les deux etats occupent le MEME cadre : c'est ce qui rend le volet lisible */
/* La boite epouse la forme du visuel et se centre : elle etait auparavant
   etiree sur toute la largeur du panneau, l'image se retrouvait posee dans
   un cadre bien plus large qu'elle et decalee sur la gauche. */
.cmp-enveloppe{max-width:calc(100% - 32px);margin:0 auto}
.cmp-boite{position:relative;width:100%;margin:14px auto 0}
.cmp{position:absolute;inset:0;background:#fff;border:1px solid var(--trait);
  border-radius:6px;overflow:hidden;cursor:ew-resize;user-select:none;touch-action:none}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.cmp-tir{position:absolute;top:0;bottom:0;width:2px;background:var(--marque);
  box-shadow:0 0 0 1px rgba(255,255,255,.85)}
.cmp-tir::after{content:"";position:absolute;top:50%;left:50%;width:30px;height:30px;
  transform:translate(-50%,-50%);border-radius:50%;background:var(--marque);
  box-shadow:0 0 0 3px #fff,0 2px 8px rgba(0,0,0,.25)}
.cmp-rg{display:block;width:100%;margin:14px 0 0;accent-color:var(--marque)}
.cmp-pieds{display:flex;justify-content:space-between;margin:8px 0 14px;
  font-size:12.5px;color:var(--texteFaible);line-height:1.4}
.cmp-pieds .d{text-align:right}
.cmp-nav{display:flex;align-items:center;gap:12px;margin:0 0 10px}
.cmp-nav button{width:32px;height:28px;font-size:15px;cursor:pointer;background:#fff;
  border:1px solid var(--traitFort);border-radius:6px;line-height:1}
.cmp-nav button:disabled{opacity:.35;cursor:default}
.cmp-nav span{font-size:12.5px;color:var(--texteFaible)}
.cmp-nav b{color:var(--texte);font-family:var(--police-donnees)}
.cmp-nav i{font-style:normal;margin-left:8px;opacity:.7}
.cmp-pieds b{color:var(--texte);font-family:var(--police-donnees);font-size:11.5px}
.cmp-leg{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0 16px;
  font-size:12px;color:var(--texteFaible)}
.cmp-leg i{display:inline-block;width:15px;height:0;border-top:2px solid;vertical-align:middle;margin-right:3px}
.cmp-leg i.lg-r{border-color:#B02020}
.cmp-leg i.lg-o{border-top-style:dashed;border-color:#B5651D}
.cmp-leg i.lg-b{border-color:#1F6FB5}
.pleinecran{position:fixed;inset:0;z-index:70;background:var(--fond);display:flex;flex-direction:column}
.pe-tete{display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px;border-bottom:1px solid var(--trait);background:var(--panneau)}
.pe-tete h2{margin:0;font-size:16px;font-weight:700}
.pe-tete button{font-size:13px;font-weight:600;padding:8px 16px;cursor:pointer;
  border:1px solid var(--traitFort);border-radius:6px;background:#fff}
.pe-corps{flex:1;overflow:auto;padding:18px 0}

.apercus .px{color:var(--texteFaible);margin-left:6px}
.grille th{vertical-align:bottom;line-height:1.25}
.grille th span{display:block}
.grille th em{display:block;margin-top:4px;max-width:200px;font-style:normal;font-weight:400;
  font-size:10.5px;line-height:1.35;letter-spacing:0;text-transform:none;color:var(--texteFaible)}
/* colonnes figees : code et produit restent lisibles au defilement */
.grille .fige{position:sticky;z-index:3;background:#fff}
table.grille tr:hover td.fige{background:#fafafa}
.grille thead .fige{z-index:5;background:var(--panneau)}
.grille .f0{left:0;min-width:118px}
.grille .f1{left:118px;min-width:190px;box-shadow:1px 0 0 var(--trait)}
.axes{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--trait);
  border-bottom:1px solid var(--trait)}
.axe{background:var(--panneau);padding:11px 16px;display:flex;flex-direction:column;gap:3px}
.ax-t{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--texteFaible)}
.ax-v{font-size:14.5px;font-weight:700}
.axe.n-VERT .ax-v{color:#1E7A46}
.axe.n-ORANGE .ax-v{color:#B5651D}
.axe.n-ROUGE .ax-v{color:#B02020}
.axe.n-ORANGE{background:var(--orangeFond)}
.axe.n-ROUGE{background:var(--rougeFond)}
.ax-s{font-weight:500;font-size:12px;color:var(--texteFaible)}
.ax-c{display:block;margin-top:6px;font-size:11.5px;line-height:1.35;font-weight:400;
  color:var(--texteFaible)}
.ax-j{position:relative;display:block;height:6px;margin-top:7px;border-radius:3px;
  background:rgba(0,0,0,.09);overflow:visible}
.ax-j i{display:block;height:100%;border-radius:3px;background:currentColor}
.axe.n-VERT .ax-j i{background:#1E7A46}
.axe.n-ORANGE .ax-j i{background:#B5651D}
.axe.n-ROUGE .ax-j i{background:#B02020}
.ax-j u{position:absolute;top:-3px;width:2px;height:12px;background:rgba(0,0,0,.42);
  border-radius:1px;transform:translateX(-1px)}
.ax-j u.c{background:rgba(0,0,0,.22)}
@media(max-width:900px){.axes{grid-template-columns:repeat(2,1fr)}}
/* auto-fit + 1fr etirait une vignette unique sur toute la largeur : un
   detail de 10 cm affiche sur 1600 px, soit le meme inconfort que la bande
   a faire defiler. La largeur est desormais bornee et les vignettes sont
   calees a gauche. */
.zgrille{display:flex;flex-wrap:wrap;gap:12px;margin:10px 0;align-items:flex-start}
.zgrille .zone{flex:0 1 300px;max-width:340px}
.zone{margin:0}
.zone img{width:100%;display:block;border:1px solid var(--trait);border-radius:6px;cursor:zoom-in;
  background:#fff}
.zone figcaption{margin-top:5px;font-size:11.5px;color:var(--texteFaible);
  font-family:var(--police-donnees)}
.chsaisie{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;
  border-bottom:1px solid var(--trait)}
.chsaisie input{width:104px;padding:8px 11px;border:1px solid var(--traitFort);border-radius:6px;
  font-family:var(--police-donnees);font-size:13px}
.chsaisie select{padding:8px 11px;border:1px solid var(--traitFort);border-radius:6px;
  font-family:inherit;font-size:13px;background:#fff;cursor:pointer}
.chx{color:var(--texteFaible)}
.chu{color:var(--texteFaible);font-family:var(--police-donnees);font-size:12.5px;margin-right:6px}
.chsaisie button{padding:8px 14px;border:1px solid var(--traitFort);border-radius:6px;background:#fff;
  font-family:inherit;font-size:12.5px;cursor:pointer}
.chtot{margin-left:auto;font-size:12.5px;color:var(--texteFaible)}
.chutes{margin:0 0 12px;padding:11px 13px;border-radius:7px;font-size:12.5px;line-height:1.45;
  display:flex;flex-direction:column;gap:6px}
.chutes.vide{background:var(--fond);color:var(--texteFaible)}
.chutes.ok{background:#E7F3EB;border:1px solid #B6DCC5}
.chutes.appro{background:var(--orangeFond);border:1px solid #EBD3AE}
.chutes b{font-size:13.5px}
.chutes .reste{font-family:var(--police-donnees);font-size:11.5px;color:var(--texteFaible)}
.chutes i{font-style:normal;font-size:11.5px;color:var(--texteFaible)}
.chutes button{align-self:flex-start;padding:7px 14px;border:0;border-radius:6px;cursor:pointer;
  font-family:inherit;font-size:12.5px;font-weight:600;background:#1E7A46;color:#fff}
.chutes.appro button{background:var(--marque)}
.rvchoix{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.rvchoix span{font-size:12.5px;color:var(--texteFaible)}
.rvchoix i{font-style:normal;font-size:11.5px;color:var(--texteFaible);opacity:.8;width:100%}
.rvb{padding:6px 12px;border:1px solid var(--traitFort);border-radius:6px;background:#fff;
  font-family:inherit;font-size:12.5px;cursor:pointer;color:var(--texte)}
.rvb.on{border-color:var(--marque);background:var(--rougeFond);color:var(--marque);font-weight:600}
.rvinfo{margin:0 0 12px;font-size:12.5px;color:var(--texteFaible)}
/* Filet general : sur un ecran etroit, aucun bloc ne doit deborder de sa
   colonne ni pousser la mise en page. Les mots trop longs se coupent, les
   elements souples peuvent retrecir sous leur contenu. */
.pan,.pan *,.bandeau,.bandeau *,.axe,.axe *{min-width:0}
.pan .corps,.spec,.constats,.synthese,.avert{overflow-wrap:anywhere}
.bandeau{flex-wrap:wrap;row-gap:8px}
.bandeau .quoi{flex:1 1 260px}
.barreoutils{flex-wrap:wrap;row-gap:8px}
.barreoutils button{white-space:nowrap}
.axes{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.ax-v{overflow-wrap:anywhere}
.navpage{flex-wrap:wrap;row-gap:8px}
.cmp-pieds{overflow-wrap:anywhere}
@media(max-width:1280px){
  .spec .l span:last-child{overflow-wrap:anywhere}
}
.repdim{display:block;width:calc(100% - 8px);margin:10px 4px 4px;padding:11px 14px;
  border-radius:7px;font-family:inherit;font-size:13px;text-align:left;line-height:1.35}
.repdim.bt{cursor:pointer;border:1px solid var(--marque);background:#fff;color:var(--marque)}
.repdim.bt span{display:block;font-weight:600}
.repdim.bt b{display:block;margin-top:3px;font-family:var(--police-donnees);
  font-size:11px;font-weight:500;opacity:.75}
.repdim.bt:hover{background:var(--rougeFond)}
.repdim.ok{border:1px solid var(--trait);background:var(--fond);color:var(--texteFaible);font-size:12.5px}
.lien-dim{display:flex;align-items:center;gap:7px;margin:8px 0 2px;
  font-size:12px;color:var(--texteFaible);cursor:pointer}
.lien-dim input{width:15px;height:15px;accent-color:var(--marque)}
.avert{margin:0 0 12px;padding:10px 13px;border-radius:6px;font-size:13px;line-height:1.45;
  background:var(--orangeFond);color:#7a4a12;border-left:3px solid var(--orange)}
.g-oeil{position:absolute;transform:translate(-50%,-50%);border-radius:50%;
  border:1.5px solid #1F6FB5;background:rgba(31,111,181,.28);pointer-events:none}
.g-oeilgarde{position:absolute;transform:translate(-50%,-50%);border-radius:50%;
  border:1px dashed rgba(31,111,181,.75);pointer-events:none}
.loupe{position:fixed;inset:0;z-index:60;background:rgba(20,20,20,.88);
  display:flex;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
.loupe img{max-width:100%;max-height:100%;background:#fff;border-radius:4px}
.loupe button{position:absolute;top:18px;right:18px;padding:9px 16px;font-size:13px;
  font-weight:600;cursor:pointer;border:0;border-radius:6px;background:#fff;color:var(--texte)}
.vrep{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;
  padding:9px 12px;border-radius:6px}
.vrep.vok{background:var(--vertFond);color:var(--vert)}
.vrep.vko{background:var(--orangeFond);color:var(--orange)}
.vrep button{margin-left:auto;font-size:12px;font-weight:500;padding:5px 10px;cursor:pointer;
  border:1px solid var(--trait);border-radius:5px;background:#fff;color:var(--texte)}
.lignec .pages{font-family:var(--police-donnees);font-size:10.5px;color:var(--texteFaible);text-align:right}

/* ---------- dépôt ---------- */
.depot{margin:18px;background:var(--panneau);border:1.5px dashed var(--traitFort);border-radius:var(--r);
  padding:52px 24px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.depot:hover,.depot.survol{border-color:var(--marque);background:#fdf6f6}
.depot h2{font-size:15px;font-weight:600;margin:0 0 5px}
.depot p{margin:0;color:var(--texteFaible);font-size:12.5px}
.depot.bloque{opacity:.45;pointer-events:none}
.vide{padding:44px;text-align:center;color:var(--texteFaible);font-size:12.5px}

/* ---------- atelier de corrections ---------- */
.atelier{background:var(--panneau);border-bottom:1px solid var(--trait);padding:14px 18px}
.atelier h3{margin:0 0 2px;font-size:13px;font-weight:600}
.atelier .sous{margin:0 0 12px;font-size:12px;color:var(--texteFaible)}
.opt{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid #ececec}
.opt:last-of-type{border-bottom:0}
.opt input[type=checkbox]{margin:2px 0 0;accent-color:var(--marque);width:14px;height:14px;flex:none}
.opt label{flex:1;font-size:12.5px;cursor:pointer}
.opt label small{display:block;color:var(--texteFaible);font-size:11.5px;margin-top:2px;line-height:1.4}
.opt input[type=number]{width:62px;background:#fff;color:var(--texte);border:1px solid var(--trait);
  border-radius:var(--r);padding:4px 7px;font-family:var(--police-donnees);font-size:12px;text-align:right}
.opt.off{opacity:.4;pointer-events:none}
.propo{margin:0 0 12px;padding:11px;border:1px solid var(--marque);border-radius:var(--r);
  background:#fdf4f4;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.propo .val{font-family:var(--police-donnees);font-size:16px;color:var(--marque);font-weight:600}
.propo .lib{font-size:12px;color:var(--texteFaible);flex:1;min-width:170px;line-height:1.4}
.exclu{margin-top:12px;padding:10px 12px;border-left:3px solid var(--rouge);background:var(--rougeFond);
  font-size:12px;color:#7a2020}
.actions{display:flex;gap:8px;padding:12px 18px;flex-wrap:wrap;background:var(--panneau)}
.actions button{background:#fff;border:1px solid var(--trait);border-radius:var(--r);padding:7px 13px;
  font-size:12.5px;cursor:pointer;color:var(--texte)}
.actions button:hover{border-color:var(--traitFort);background:#fafafa}
.actions button.primaire{background:var(--marque);border-color:var(--marque);color:#fff;font-weight:600}
.actions button.primaire:hover{background:#b32424}

/* ---------- inspecteur ---------- */
.inspecteur{background:var(--panneau);border-left:1px solid var(--trait);overflow-y:auto}
.pan{border-bottom:1px solid var(--trait)}
.pan>.tete{font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--texteFaible);padding:9px 14px;background:#fafafa;border-bottom:1px solid var(--trait)}
.pan>.corps{padding:12px 14px}
dl.fiche{margin:0;display:grid;grid-template-columns:1fr auto;gap:0 10px}
dl.fiche dt,dl.fiche dd{margin:0;padding:4px 0;font-size:12px;border-bottom:1px solid #f0f0f0}
dl.fiche dt{color:var(--texteFaible)}
dl.fiche dd{font-family:var(--police-donnees);text-align:right;font-size:11.5px}
dl.fiche>*:nth-last-child(-n+2){border-bottom:0}
.note{margin-top:10px;padding:9px 11px;border-left:3px solid var(--marque);background:#fdf4f4;
  font-size:11.5px;color:#6f3030;line-height:1.4}

.saisie .corps{display:flex;align-items:center;gap:8px}
.saisie input{width:100%;background:#fff;color:var(--texte);border:1px solid var(--trait);
  border-radius:var(--r);padding:7px 8px;font-family:var(--police-donnees);font-size:13.5px;text-align:right;outline:none}
.saisie input:focus{border-color:var(--marque);box-shadow:0 0 0 2px rgba(204,42,42,.15)}
.saisie .x,.saisie .u{color:var(--texteFaible);font-family:var(--police-donnees);font-size:12px}
.aide{padding:0 14px 11px;font-size:11.5px;color:var(--texteFaible);line-height:1.4}
.verdict-dim{padding:10px 14px;border-top:1px solid var(--trait);font-size:11.5px;line-height:1.45}
.verdict-dim div+div{margin-top:5px}
.vd-ok{color:var(--texteFaible)} .vd-info{color:var(--orange)} .vd-ko{color:var(--rouge);font-weight:500}
.vd-ko b,.vd-info b{font-family:var(--police-donnees)}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:8px 3px;font-size:11.5px;background:#fff;border:1px solid var(--trait);
  border-radius:var(--r);color:var(--texteFaible);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:5px}
.seg button .ico{display:block;border:1.5px solid currentColor;border-radius:1px}
.seg button.actif{border-color:var(--marque);color:var(--marque);background:#fdf4f4;font-weight:600}
.fixe{font-size:11.5px;color:var(--texteFaible);line-height:1.45}

/* ---------- aperçus, désormais au centre ---------- */
.scene{background:var(--panneau);border-bottom:1px solid var(--trait);padding:16px 18px}
.scene.flash{animation:flash .5s ease-out}
@keyframes flash{0%{background:#fdeaea}100%{background:var(--panneau)}}
.scene .entete{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.scene .entete h2{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em}
.scene .entete .fmt{font-family:var(--police-donnees);font-size:12px;color:var(--texteFaible)}
.scene .entete .maj{margin-left:auto;font-family:var(--police-donnees);font-size:10px;
  letter-spacing:.09em;text-transform:uppercase;color:#fff;background:var(--marque);padding:2px 7px;border-radius:2px}

/* ---------- devis ---------- */
.devis .corps{padding:12px 14px}
/* Quatre elements sur une seule ligne dans un panneau etroit : le menu se
   tronquait en « autr », le libelle « quantites vendues » passait a la
   ligne et recouvrait la suite. Le libelle prend sa propre ligne, les
   commandes gardent leur largeur. */
.qte{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.qte label{flex:1 0 100%;margin-bottom:1px}
.qte .mnt{margin-left:auto;white-space:nowrap}
.qte select{min-width:104px;flex:0 0 auto;
  background:#fff;border:1px solid var(--trait);border-radius:var(--r);padding:7px 26px 7px 8px;
  font-family:var(--police-donnees);font-size:14px;color:var(--texte);appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--texteFaible) 50%),
                   linear-gradient(135deg,var(--texteFaible) 50%,transparent 50%);
  background-position:calc(100% - 14px) 54%,calc(100% - 9px) 54%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.qte input{width:80px;flex:0 0 auto;background:#fff;border:1px solid var(--trait);border-radius:var(--r);
  padding:7px 8px;font-family:var(--police-donnees);font-size:14px;text-align:right;color:var(--texte)}
.qte label{font-size:12px;color:var(--texteFaible)}
.fin{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px}
.fin input{accent-color:var(--marque);width:13px;height:13px}
.fin .mnt{margin-left:auto;font-family:var(--police-donnees);font-size:11px;color:var(--texteFaible)}
.fin .nbu{width:52px;border:1px solid var(--trait);border-radius:var(--r);padding:3px 5px;
  font-family:var(--police-donnees);font-size:11.5px;text-align:right;color:var(--texte);background:#fff}
.fin .nbu:disabled{opacity:.35}
.total{margin-top:12px;border-top:2px solid var(--texte);padding-top:9px;
  display:flex;align-items:baseline;justify-content:space-between}
.total .lib{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--texteFaible)}
.total .val{font-family:var(--police-donnees);font-size:21px;font-weight:600;color:var(--marque)}
.total.vide .val{color:var(--texteFaible);font-size:13px}
.detail{margin-top:8px;font-size:11px;color:var(--texteFaible);line-height:1.5}
.detail span{display:flex;justify-content:space-between}

/* ---------- espace admin ---------- */
.admin{position:fixed;inset:0;background:rgba(26,26,26,.55);z-index:50;display:flex;align-items:stretch;
  justify-content:center;padding:16px}
.admin .boite{background:var(--panneau);width:100%;max-width:1400px;display:flex;flex-direction:column;
  border-radius:var(--r);overflow:hidden;min-width:0}
/* La barre porte huit boutons : sur un ecran de portable elle depassait a
   droite et « Enregistrer et fermer » se retrouvait coupe. Elle passe a la
   ligne au lieu de deborder, et rien n'est jamais hors de l'ecran. */
.admin .tete{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;
  padding:12px 16px;background:var(--barre);color:#fff}
.admin .tete h2{margin:0;font-size:14px;font-weight:700}
.admin .onglets{display:flex;flex-wrap:wrap;gap:4px;margin-left:4px}
.admin .onglets button{background:none;border:0;color:#bdbdbd;padding:6px 11px;font-size:12.5px;
  border-radius:var(--r);cursor:pointer}
.admin .onglets button.actif{background:var(--marque);color:#fff;font-weight:600}
.admin .tete .fin2{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px}
.admin .tete .fin2 button{background:#333;border:1px solid #4a4a4a;color:#eee;border-radius:var(--r);
  padding:6px 11px;font-size:12px;cursor:pointer;white-space:nowrap;line-height:1.25}
.admin .tete .fin2 button.primaire{background:var(--marque);border-color:var(--marque);color:#fff;font-weight:600}
.admin .contenu{flex:1;overflow:auto;padding:0}
table.grille{width:max-content;min-width:100%;border-collapse:collapse;font-size:12px}
table.grille td.txt{min-width:172px}
table.grille td.num{min-width:86px}
table.grille td.sel{min-width:124px}
table.grille td.lng{min-width:230px}
/* white-space:nowrap tronquait « Paliers recto verso » et les definitions.
   Les en-tetes s'enroulent, la largeur de colonne est garantie par un
   min-width sur les cellules. */
table.grille th{position:sticky;top:0;background:#fafafa;border-bottom:1px solid var(--trait);
  padding:7px 9px;text-align:left;font-size:10px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--texteFaible);white-space:normal;vertical-align:bottom;z-index:1;min-width:96px}
table.grille td{border-bottom:1px solid #ececec;padding:2px 4px}
table.grille tr:hover td{background:#fafafa}
table.grille input,table.grille select{width:100%;border:1px solid transparent;background:none;
  padding:5px 6px;font-size:12px;font-family:var(--police-donnees);color:var(--texte);border-radius:2px}
table.grille select{appearance:none;-webkit-appearance:none;padding-right:22px;
  background-image:linear-gradient(45deg,transparent 50%,var(--texteFaible) 50%),
                   linear-gradient(135deg,var(--texteFaible) 50%,transparent 50%);
  background-position:calc(100% - 12px) 52%,calc(100% - 7px) 52%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
table.grille td.act{min-width:44px;text-align:center}
table.grille button.sup{background:none;border:1px solid var(--trait);border-radius:2px;color:var(--rouge);
  cursor:pointer;padding:3px 8px;font-size:12px;line-height:1.1}
table.grille button.sup:hover{background:var(--rougeFond);border-color:var(--rouge)}
.admin .contenu{position:relative}
.admin .ajout{padding:10px 16px;background:#fafafa;border-top:1px solid var(--trait)}
.admin .ajout button{background:#fff;border:1px solid var(--trait);border-radius:var(--r);
  padding:6px 12px;font-size:12.5px;cursor:pointer;color:var(--texte)}
.admin .ajout button:hover{border-color:var(--marque);color:var(--marque)}
table.grille input:focus,table.grille select:focus{border-color:var(--marque);background:#fff;outline:none}
table.grille td.txt input{font-family:var(--police-titre)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;padding:16px}
.stats .carte{border:1px solid var(--trait);border-radius:var(--r);padding:13px}
.stats .k{display:block;font-family:var(--police-donnees);font-size:26px;font-weight:600;line-height:1.1}
.stats .l{display:block;font-size:11.5px;color:var(--texteFaible);margin:4px 0 8px}
.admin .aidepan{padding:11px 16px;background:#fafafa;border-bottom:1px solid var(--trait);
  font-size:12px;color:var(--texteFaible)}

/* ---------- rapport ---------- */
.modale{position:fixed;inset:0;background:rgba(26,26,26,.55);z-index:60;display:flex;
  align-items:center;justify-content:center;padding:24px}
.modale .boite{background:#fff;max-width:820px;width:100%;max-height:100%;display:flex;flex-direction:column;
  border-radius:var(--r);overflow:hidden}
.modale .tete{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--barre);color:#fff}
.modale .tete h2{margin:0;font-size:14px}
.modale .tete button{margin-left:auto;background:#333;border:1px solid #4a4a4a;color:#eee;
  border-radius:var(--r);padding:6px 11px;font-size:12px;cursor:pointer}
.modale pre{margin:0;padding:18px;overflow:auto;font-family:var(--police-donnees);font-size:11.5px;
  line-height:1.6;white-space:pre-wrap;color:var(--texte)}

/* ---------- aperçus ---------- */
.apercus{display:grid;gap:16px;padding:0}
.apercus.duo{grid-template-columns:1fr 1fr}
@media(max-width:1100px){.apercus.duo{grid-template-columns:1fr 1fr}}
.apercus figure{margin:0}
.apercus .cadre{position:relative;display:flex;align-items:center;justify-content:center;
  background:repeating-conic-gradient(#e6e6e6 0% 25%,#f4f4f4 0% 50%) 50%/14px 14px;
  border:1px solid var(--trait);padding:16px;min-height:230px}
.apercus .porte{position:relative;line-height:0;max-width:100%;overflow:hidden;margin:0 auto}
.apercus .porte img{width:100%;height:auto;max-height:none}
.apercus img{max-width:100%;width:auto;height:auto;display:block;
  box-shadow:0 1px 5px rgba(0,0,0,.22)}
.apercus .guide{position:absolute;pointer-events:none}
.g-trim{border:1px dashed rgba(0,0,0,.55)}
.g-secu{border:1px dotted rgba(181,101,29,.9)}
.g-pli{background:rgba(204,42,42,.14);border-left:1px solid rgba(204,42,42,.55);border-right:1px solid rgba(204,42,42,.55)}
.g-pliaxe{border-left:1px dashed rgba(204,42,42,.95)}
.g-volet{position:absolute;bottom:1px;font-family:var(--police-donnees);font-size:7.5px;color:#fff;
  background:rgba(204,42,42,.9);padding:1px 3px;border-radius:2px;white-space:nowrap}
.apercus figcaption{margin-top:8px;font-family:var(--police-donnees);font-size:10.5px;
  letter-spacing:.05em;color:var(--texteFaible);text-transform:uppercase}
.apercus figcaption b{color:var(--texte);font-weight:600}
.tete-apercus{display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin:0 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--texteFaible)}
.tete-apercus button{background:var(--panneau);border:1px solid var(--traitFort);
  border-radius:var(--r);font-family:var(--police-titre);font-weight:600;font-size:12.5px;
  letter-spacing:0;text-transform:none;color:var(--texte);padding:7px 14px;cursor:pointer}
.tete-apercus button:hover{background:var(--fond)}
/* Le fichier corrige est le livrable : il se distingue des exports annexes. */

<script>
/* ------------------------------------------------------------------ */
/* Moteur : pdf.js pour le contenu, pdf-lib pour la structure          */
/* ------------------------------------------------------------------ */
const VERSION = "2026-08-29j";
const CDN_PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/";
const CDN_PDFLIB = "https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js";
const PT_CM = 72 / 2.54;
const TOL_RATIO = 0.03;

let pdfjsLib = null, pret = false, source = null, palette = null, dernierNom = null;
/* Le fichier corrige remplace « source » : sans copie, l'original est perdu
   et l'operateur ne peut plus revenir en arriere. */
let SOURCE_INIT = null, PALETTE_INIT = null, NOM_INIT = null;
let _dernierR = null, produitChange = false;
const vues = { avant: null, apres: null, rAvant: null, nomAvant: null, journal: null };
const dimsMemo = {};
const orientMemo = {};
let REF = (typeof REFERENTIEL !== "undefined") ? REFERENTIEL.slice() : [];

/* Garde-fou de déploiement : si un des trois fichiers de données n'a pas été
   servi (upload partiel, fichier bloqué par Windows), l'application démarrait
   en mode dégradé silencieux. Elle le dit maintenant et se verrouille. */
(function controlerFichiers() {
  const manquants = [];
  if (typeof CHARTE === "undefined") manquants.push("charte.js");
  if (typeof TARIFS === "undefined") manquants.push("tarifs.js");
  if (typeof REFERENTIEL === "undefined") manquants.push("referentiel.js");
  if (!manquants.length) return;
  document.addEventListener("DOMContentLoaded", () => {
    document.body.innerHTML =
      '<div style="font:15px/1.6 Inter,system-ui,sans-serif;max-width:640px;margin:12vh auto;padding:28px;'
      + 'background:#fff;border-left:5px solid #B02020;border-radius:8px;color:#1A1A1A">'
      + '<h1 style="font-size:20px;margin:0 0 12px">Calage ne peut pas démarrer</h1>'
      + '<p>Fichier(s) de données absent(s) à côté de <code>index.html</code> :</p>'
      + '<p style="font-family:ui-monospace,monospace;color:#B02020;font-weight:700">'
      + manquants.join(" · ") + '</p>'
      + '<p>Déposer le contenu complet du dossier au même endroit, puis recharger la page. '
      + 'Sous Windows, si les fichiers viennent d\'une archive téléchargée : clic droit sur chaque '
      + 'fichier, Propriétés, cocher <b>Débloquer</b>.</p></div>';
  });
  throw new Error("Calage : fichiers de données manquants — " + manquants.join(", "));
})();

async function chargerMoteur() {
  pdfjsLib = await import(CDN_PDFJS + "pdf.min.mjs");
  pdfjsLib.GlobalWorkerOptions.workerSrc = CDN_PDFJS + "pdf.worker.min.mjs";
  await new Promise((ok, ko) => {
    const s = document.createElement("script");
    s.src = CDN_PDFLIB; s.onload = ok; s.onerror = ko;
    document.head.appendChild(s);
  });
  pret = true;
  document.getElementById("pastille").classList.add("on");
  document.getElementById("etatMoteur").textContent = "moteur prêt";
  document.getElementById("depot").classList.remove("bloque");
}

function mul(a, b) {
  return [a[0]*b[0]+a[2]*b[1], a[1]*b[0]+a[3]*b[1],
          a[0]*b[2]+a[2]*b[3], a[1]*b[2]+a[3]*b[3],
          a[0]*b[4]+a[2]*b[5]+a[4], a[1]*b[4]+a[3]*b[5]+a[5]];
}

async function lireImages(page) {
  const ops = await page.getOperatorList();
  const O = pdfjsLib.OPS;
  let ctm = [1,0,0,1,0,0];
  const pile = [], out = [];
  for (let i = 0; i < ops.fnArray.length; i++) {
    const fn = ops.fnArray[i], args = ops.argsArray[i];
    if (fn === O.save) pile.push(ctm.slice());
    else if (fn === O.restore) ctm = pile.pop() || [1,0,0,1,0,0];
    else if (fn === O.transform) ctm = mul(ctm, args);
    else if (fn === O.paintImageXObject || fn === O.paintJpegXObject ||
             fn === O.paintImageMaskXObject || fn === O.paintInlineImageXObject) {
      const lp = Math.hypot(ctm[0], ctm[1]), hp = Math.hypot(ctm[2], ctm[3]);
      let px = null, py = null;
      if (typeof args[1] === "number" && typeof args[2] === "number") { px = args[1]; py = args[2]; }
      else if (args[0] && args[0].width) { px = args[0].width; py = args[0].height; }
      if (px && lp > 0 && hp > 0) {
        // les quatre coins du carre unite transformes : robuste aux retournements
        const xs = [], ys = [];
        for (const [u, v] of [[0,0],[1,0],[0,1],[1,1]]) {
          xs.push(ctm[0]*u + ctm[2]*v + ctm[4]);
          ys.push(ctm[1]*u + ctm[3]*v + ctm[5]);
        }
        out.push({ dpi: Math.min(px/(lp/72), py/(hp/72)),
                   boite: { x0:Math.min(...xs), y0:Math.min(...ys),
                            x1:Math.max(...xs), y1:Math.max(...ys), quoi:"logo ou image", estImage:true } });
      }
    }
  }
  return out;
}

function lireBoites(page) {
  const n = page.node;
  const lire = (m) => {
    try {
      const a = n[m]();
      if (!a) return null;
      return [0,1,2,3].map(i => a.lookup(i, PDFLib.PDFNumber).asNumber());
    } catch (e) { return null; }
  };
  return { media: lire("MediaBox"), trim: lire("TrimBox"), bleed: lire("BleedBox") };
}

/* Les polices peuvent être imbriquées dans des XObjects de type Form :
   c'est le cas des PDF placés dans InDesign ou Illustrator, et de tout
   fichier passé par notre propre correction. On descend récursivement. */
function policesDeRes(res, ko, vus, prof) {
  if (!res || prof > 8) return;
  const N = PDFLib.PDFName.of.bind(PDFLib.PDFName);

  const fonts = res.lookupMaybe(N("Font"), PDFLib.PDFDict);
  if (fonts) for (const [cle] of fonts.entries()) {
    let d = fonts.lookupMaybe(cle, PDFLib.PDFDict);
    if (!d) continue;
    const bf = d.lookupMaybe(N("BaseFont"), PDFLib.PDFName);
    const nom = (bf ? bf.asString() : cle.asString()).replace(/^\//, "").replace(/^[A-Z]{6}\+/, "");
    const desc = d.lookupMaybe(N("DescendantFonts"), PDFLib.PDFArray);
    if (desc) d = desc.lookup(0, PDFLib.PDFDict) || d;
    const fd = d.lookupMaybe(N("FontDescriptor"), PDFLib.PDFDict);
    const inc = fd && ["FontFile","FontFile2","FontFile3"].some(k => fd.get(N(k)) !== undefined);
    if (!inc && !ko.includes(nom)) ko.push(nom);
  }

  const xo = res.lookupMaybe(N("XObject"), PDFLib.PDFDict);
  if (xo) for (const [cle] of xo.entries()) {
    const ref = xo.get(cle);
    const marque = ref && ref.toString ? ref.toString() : String(cle);
    if (vus.has(marque)) continue;
    vus.add(marque);
    const flux = xo.lookup(cle);
    const d = flux && flux.dict ? flux.dict : null;
    if (!d) continue;
    const st = d.lookupMaybe(N("Subtype"), PDFLib.PDFName);
    if (st && st.asString() === "/Form")
      policesDeRes(d.lookupMaybe(N("Resources"), PDFLib.PDFDict), ko, vus, prof + 1);
  }
}

function lirePolices(page) {
  try {
    const ko = [];
    policesDeRes(page.node.Resources(), ko, new Set(), 0);
    return ko;
  } catch (e) { return []; }
}

/* Plus petit corps de texte de la page, en points à l'échelle du fichier.
   La hauteur vient de la matrice de texte, pas de la métrique déclarée. */
function medianeBande(px, w, h, x0, y0, x1, y1) {
  const R = [], G = [], B = [];
  const pas = Math.max(1, Math.floor(((x1-x0) * (y1-y0)) / 4000));
  let n = 0;
  for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
    if (n++ % pas) continue;
    const i = (y * w + x) * 4;
    if (px[i+3] < 8) continue;
    R.push(px[i]); G.push(px[i+1]); B.push(px[i+2]);
  }
  if (!R.length) return [255, 255, 255];
  const med = (a) => { a.sort((u,v) => u-v); return a[Math.floor(a.length/2)]; };
  return [med(R), med(G), med(B)];
}

function echantillonner(px, w, h) {
  const eL = Math.max(2, Math.round(w * 0.03));
  const eH = Math.max(2, Math.round(h * 0.03));
  const bords = {
    haut:   medianeBande(px, w, h, 0, 0, w, eH),
    bas:    medianeBande(px, w, h, 0, h - eH, w, h),
    gauche: medianeBande(px, w, h, 0, 0, eL, h),
    droite: medianeBande(px, w, h, w - eL, 0, w, h),
  };
  const liste = Object.values(bords);
  let ecart = 0;
  for (const a of liste) for (const b of liste)
    ecart = Math.max(ecart, Math.hypot(a[0]-b[0], a[1]-b[1], a[2]-b[2]));
  const dominante = [0,1,2].map(i =>
    Math.round(liste.reduce((s, c) => s + c[i], 0) / liste.length));
  return { ...bords, dominante, uniforme: ecart < 26 };
}

/* ==================================================================== */
/* VERIFICATIONS VISUELLES                                              */
/* -------------------------------------------------------------------- */
/* Quand l'outil ne peut pas trancher, il ne devine pas : il montre la   */
/* zone et pose UNE question fermee. La reponse est horodatee et remonte */
/* dans le rapport et dans le BAT. Sans reponse, le doute subsiste.      */
/* ==================================================================== */
let VERIFS = {};
function reinitVerifs() { VERIFS = {}; }

/* ==================================================================== */
/* ZONE DE SECURITE SUR FICHIER APLATI — controle au pixel              */
/* -------------------------------------------------------------------- */
/* violationsZoneSecurite() ignore volontairement une image pleine page  */
/* (c'est le fond). Sur un fichier ou TOUT est aplati dans l'image —     */
/* export Canva, capture, visuel IA — plus rien n'est controle : le      */
/* numero de telephone colle au bord passe au vert.                      */
/* On regarde donc les pixels de la bande : du texte ou un filet ont peu */
/* de niveaux et beaucoup de transitions franches, une photo ou un       */
/* degrade ont l'inverse.                                                */
/* Banc : texte 33 blocs, filet 4, photo contrastee 0, degrade 0.        */
/* ==================================================================== */
const BANDE = { ecartMin: 10, contourMin: 0.05, niveauxMax: 24, minPx: 12, budgetPx: 2500000 };

/* Plafonds de decodage.
   BUDGET_DECODE : au-dela, l'image est decodee EN REDUIT pour l'affichage
   et la geometrie. 40 Mpx couvrent largement le plus gros produit du
   referentiel. Le fichier livre au RIP reste l'original, jamais
   reechantillonne : cette reduction ne sert qu'a regarder et a mesurer.
   PX_MAX : au-dela, aucun navigateur ne tient. On le dit au lieu de
   planter au troisieme changement de produit. */
const BUDGET_DECODE = 40000000;
const PX_MAX = 400000000;

function analyserBande(g, W, H, x0, y0, x1, y1, bandePx, S) {
  const T = Math.max(10, Math.min(32, Math.round(bandePx * 0.55)));
  const pas = Math.max(6, Math.round(T / 2));
  const cotes = { haut: 0, bas: 0, gauche: 0, droite: 0 };
  const points = [];
  let total = 0, structure = 0;

  const dansBande = (x, y) => {
    if (x < x0 || y < y0 || x + T > x1 || y + T > y1) return null;
    if (y - y0 < bandePx) return "haut";
    if (y1 - (y + T) < bandePx) return "bas";
    if (x - x0 < bandePx) return "gauche";
    if (x1 - (x + T) < bandePx) return "droite";
    return null;
  };

  for (let y = y0; y + T <= y1; y += pas) {
    for (let x = x0; x + T <= x1; x += pas) {
      const cote = dansBande(x, y);
      if (!cote) continue;
      total++;
      /* ecart type, contours horizontaux et verticaux, niveaux occupes */
      let s = 0, s2 = 0, ch = 0, cv = 0;
      const h = new Int32Array(256);
      for (let j = y; j < y + T; j++) {
        for (let i = x; i < x + T; i++) {
          const v = g[j * W + i];
          h[v]++; s += v; s2 += v * v;
          if (i > x && Math.abs(v - g[j * W + i - 1]) > 40) ch++;
          if (j > y && Math.abs(v - g[(j - 1) * W + i]) > 40) cv++;
        }
      }
      const n = T * T, moy = s / n;
      const ecart = Math.sqrt(Math.max(0, s2 / n - moy * moy));
      if (ecart < S.ecartMin) continue;
      const b = new Float64Array(32);
      for (let v = 0; v < 256; v++) b[v >> 3] += h[v];
      let niveaux = 0;
      for (let i = 0; i < 32; i++) if (b[i] / n > 0.005) niveaux++;
      const contours = (ch + cv) / (2 * T * (T - 1));
      /* une photo a beaucoup de niveaux et peu de transitions franches ;
         du texte ou un filet a peu de niveaux et beaucoup de transitions */
      if (contours > S.contourMin && niveaux <= S.niveauxMax) {
        structure++; cotes[cote]++;
        /* On garde OU se trouve le bloc : c'est ce qui permet ensuite de
           montrer a l'operateur les deux ou trois endroits litigieux au
           lieu de lui faire balayer quatre bandes entieres. */
        points.push({ x: x + T / 2, y: y + T / 2, cote });
      }
    }
  }
  return { total, structure, cotes, bloc: T, points };
}

/* Rend la page a une resolution juste suffisante pour lire la bande. */
async function zoneSecuriteAuPixel(buffer, refPt, margePt, noPage) {
  if (margePt <= 0) return null;
  const doc = await ouvrirPdf(buffer);
  const page = await doc.getPage(noPage || 1);
  const v1 = page.getViewport({ scale: 1 });
  let k = Math.min(200 / 72, Math.sqrt(BANDE.budgetPx / (v1.width * v1.height)));
  if (margePt * k < BANDE.minPx) k = BANDE.minPx / margePt;
  if (v1.width * k * v1.height * k > BANDE.budgetPx * 2.5) return null;   /* trop lourd */
  /* Passe par le cache : sur une banderole de 2 m, ce rendu decodait a
     nouveau les 55 Mpx du JPEG. Il n'y a plus qu'un reechantillonnage. */
  const rp = await rendrePage(buffer, Math.ceil(Math.max(v1.width, v1.height) * k), noPage || 1);
  const cv = rp.cv, ctx = rp.ctx, W = rp.w, H = rp.h;
  k = W / v1.width;                      /* echelle reellement obtenue */
  const px = ctx.getImageData(0, 0, W, H).data;
  const g = new Uint8Array(W * H);
  for (let i = 0, j = 0; j < g.length; i += 4, j++)
    g[j] = (px[i] * 77 + px[i+1] * 151 + px[i+2] * 28) >> 8;

  /* refPt est en points, origine en bas ; le canvas a l'origine en haut */
  const x0 = Math.max(0, Math.round(refPt[0] * k));
  const x1 = Math.min(W, Math.round(refPt[2] * k));
  const y0 = Math.max(0, Math.round((v1.height - refPt[3]) * k));
  const y1 = Math.min(H, Math.round((v1.height - refPt[1]) * k));
  const bandePx = margePt * k;
  if (bandePx < BANDE.minPx || x1 - x0 < bandePx * 3 || y1 - y0 < bandePx * 3) return null;
  const r = analyserBande(g, W, H, x0, y0, x1, y1, bandePx, BANDE);
  r.dpi = Math.round(k * 72);
  r.ref = refPt.slice();   /* pour situer coupe et securite dans les vignettes */

  /* Emprise reelle de l'encre dans la page. Sert a detecter un cadrage
     incoherent : du vide d'un cote, du contenu coupe de l'autre. */
  const seuilCol = 0.005;
  let ex0 = -1, ex1 = -1, ey0 = -1, ey1 = -1;
  for (let x = x0; x < x1; x++) {
    let n = 0;
    for (let y = y0; y < y1; y++) if (g[y * W + x] < 235) n++;
    if (n / (y1 - y0) > seuilCol) { if (ex0 < 0) ex0 = x; ex1 = x; }
  }
  for (let y = y0; y < y1; y++) {
    let n = 0;
    for (let x = x0; x < x1; x++) if (g[y * W + x] < 235) n++;
    if (n / (x1 - x0) > seuilCol) { if (ey0 < 0) ey0 = y; ey1 = y; }
  }
  if (ex0 >= 0 && ey0 >= 0) {
    /* retour en points page, origine en bas comme les boites PDF */
    r.encre = {
      gauche: (ex0 - x0) / k,
      droite: (x1 - ex1) / k,
      haut:   (ey0 - y0) / k,
      bas:    (y1 - ey1) / k,
    };
  }

  /* Decoupe du cote le plus charge, trait de coupe et ligne de securite
     traces par-dessus. L'outil ne peut pas mesurer la distance sur un
     fichier aplati : il montre la zone et laisse l'oeil trancher. */
  /* --- Les endroits litigieux, en clair -----------------------------
     Les blocs suspects sont regroupes par proximite, et on decoupe une
     vignette centree sur chaque groupe. L'operateur ne cherche plus : il
     juge deux ou trois images, chacune a un zoom lisible. */
  if (r.points && r.points.length) {
    const T = r.bloc, dmax = T * 3;
    const groupes = [];
    for (const pt of r.points) {
      let g2 = null;
      for (const q of groupes) {
        if (q.cote !== pt.cote) continue;
        if (Math.abs(q.cx - pt.x) < dmax && Math.abs(q.cy - pt.y) < dmax) { g2 = q; break; }
      }
      if (!g2) { groupes.push({ cote: pt.cote, cx: pt.x, cy: pt.y, n: 1,
                                x0: pt.x, x1: pt.x, y0: pt.y, y1: pt.y }); continue; }
      g2.n++;
      g2.x0 = Math.min(g2.x0, pt.x); g2.x1 = Math.max(g2.x1, pt.x);
      g2.y0 = Math.min(g2.y0, pt.y); g2.y1 = Math.max(g2.y1, pt.y);
      g2.cx = (g2.x0 + g2.x1) / 2; g2.cy = (g2.y0 + g2.y1) / 2;
    }
    groupes.sort((a, b2) => b2.n - a.n);
    const LIB = { haut: "bord haut", bas: "bord bas", gauche: "bord gauche", droite: "bord droite" };
    r.zones = [];
    for (const g2 of groupes.slice(0, 3)) {
      /* fenetre carree autour du groupe, jamais plus petite que 4 bandes */
      const demi = Math.max(bandePx * 2.2, (g2.x1 - g2.x0) / 2 + T, (g2.y1 - g2.y0) / 2 + T);
      let fx0 = Math.round(Math.max(x0, g2.cx - demi)), fx1 = Math.round(Math.min(x1, g2.cx + demi));
      let fy0 = Math.round(Math.max(y0, g2.cy - demi)), fy1 = Math.round(Math.min(y1, g2.cy + demi));
      const lw = fx1 - fx0, lh = fy1 - fy0;
      if (lw < 12 || lh < 12) continue;
      const ech = Math.min(4, Math.max(1.6, 320 / Math.max(lw, lh)));
      const c2 = document.createElement("canvas");
      c2.width = Math.round(lw * ech); c2.height = Math.round(lh * ech);
      const cx2 = c2.getContext("2d");
      cx2.imageSmoothingEnabled = false;
      cx2.fillStyle = "#fff"; cx2.fillRect(0, 0, c2.width, c2.height);
      cx2.drawImage(cv, fx0, fy0, lw, lh, 0, 0, c2.width, c2.height);
      /* trait de coupe et ligne de securite, aux bons endroits */
      const X = (v) => (v - fx0) * ech, Y = (v) => (v - fy0) * ech;
      cx2.lineWidth = Math.max(1.4, ech * 0.9);
      cx2.strokeStyle = "#B02020"; cx2.setLineDash([]);
      cx2.beginPath();
      cx2.moveTo(X(x0), Y(y0)); cx2.lineTo(X(x1), Y(y0)); cx2.lineTo(X(x1), Y(y1));
      cx2.lineTo(X(x0), Y(y1)); cx2.closePath(); cx2.stroke();
      cx2.strokeStyle = "#B5651D"; cx2.setLineDash([ech * 4, ech * 3]);
      cx2.strokeRect(X(x0 + bandePx), Y(y0 + bandePx),
                     (x1 - x0 - 2 * bandePx) * ech, (y1 - y0 - 2 * bandePx) * ech);
      /* position lisible : distance au coin le plus proche, en cm */
      const cmX = (g2.cx - x0) / k / 72 * 2.54, cmY = (g2.cy - y0) / k / 72 * 2.54;
      const cmL = (x1 - x0) / k / 72 * 2.54, cmH = (y1 - y0) / k / 72 * 2.54;
      const ou = (g2.cote === "haut" || g2.cote === "bas")
        ? `à ${(cmX <= cmL / 2 ? cmX : cmL - cmX).toFixed(0)} cm du coin ${cmX <= cmL / 2 ? "gauche" : "droit"}`
        : `à ${(cmY <= cmH / 2 ? cmY : cmH - cmY).toFixed(0)} cm du coin ${cmY <= cmH / 2 ? "haut" : "bas"}`;
      /* Largeur PHYSIQUE de la vignette sur le produit fini. Elle permet de
         reafficher le decoupe a l'echelle 1, seule facon de juger une
         nettete a l'oeil sans se laisser tromper par le zoom. */
      r.zones.push({ url: c2.toDataURL("image/png"), cote: g2.cote,
                     libelle: `${LIB[g2.cote]}, ${ou}`, n: g2.n,
                     mm: lw / k / 72 * 25.4 });
    }
  }

  if (r.structure >= 3) {
    /* Un apercu PAR COTE concerne : le texte peut etre coupe a plusieurs
       endroits, l'operateur doit pouvoir tous les inspecter. */
    r.apercus = [];
    const tries = ["haut", "bas", "gauche", "droite"]
      .filter((c) => r.cotes[c] > 0)
      .sort((a, b2) => r.cotes[b2] - r.cotes[a]);
    for (const cote of tries) {
      const ep = Math.round(bandePx * 3);
      let cx0 = x0, cy0 = y0, cx1 = x1, cy1 = y1;
      if (cote === "haut")   cy1 = Math.min(y1, y0 + ep);
      if (cote === "bas")    cy0 = Math.max(y0, y1 - ep);
      if (cote === "gauche") cx1 = Math.min(x1, x0 + ep);
      if (cote === "droite") cx0 = Math.max(x0, x1 - ep);
      const cw = cx1 - cx0, chh = cy1 - cy0;
      if (cw > 8 && chh > 8) {
        const zoom = Math.max(1, Math.min(4, 900 / cw));
        const c2 = document.createElement("canvas");
        c2.width = Math.round(cw * zoom); c2.height = Math.round(chh * zoom);
        const g2 = c2.getContext("2d");
        g2.imageSmoothingEnabled = false;
        g2.drawImage(cv, cx0, cy0, cw, chh, 0, 0, c2.width, c2.height);
        const bz = bandePx * zoom;
        g2.lineWidth = Math.max(1.5, zoom); g2.setLineDash([]);
        g2.strokeStyle = "#B02020";
        g2.beginPath();
        if (cote === "haut")   { g2.moveTo(0, 1); g2.lineTo(c2.width, 1); }
        if (cote === "bas")    { g2.moveTo(0, c2.height - 1); g2.lineTo(c2.width, c2.height - 1); }
        if (cote === "gauche") { g2.moveTo(1, 0); g2.lineTo(1, c2.height); }
        if (cote === "droite") { g2.moveTo(c2.width - 1, 0); g2.lineTo(c2.width - 1, c2.height); }
        g2.stroke();
        g2.setLineDash([6, 5]); g2.strokeStyle = "#B5651D";
        g2.beginPath();
        if (cote === "haut")   { g2.moveTo(0, bz); g2.lineTo(c2.width, bz); }
        if (cote === "bas")    { g2.moveTo(0, c2.height - bz); g2.lineTo(c2.width, c2.height - bz); }
        if (cote === "gauche") { g2.moveTo(bz, 0); g2.lineTo(bz, c2.height); }
        if (cote === "droite") { g2.moveTo(c2.width - bz, 0); g2.lineTo(c2.width - bz, c2.height); }
        g2.stroke();
        r.apercus.push({ url: c2.toDataURL("image/png"), cote, blocs: r.cotes[cote] });
      }
    }
    r.apercu = r.apercus[0] || null;
  }
  return r;
}

/* ==================================================================== */
/* SONDES STRUCTURELLES — des faits declares, pas des estimations        */
/* -------------------------------------------------------------------- */
/* Contrairement a la nettete, ces controles ne mesurent rien : ils      */
/* lisent ce que le fichier declare. Une surimpression est declaree ou   */
/* elle ne l'est pas. Aucun seuil, aucune calibration.                   */
/* Verifie au banc sur un PDF piege (tout detecte) et un PDF temoin      */
/* (rien detecte, zero faux positif).                                    */
/* ==================================================================== */
function sondesStructure(doc) {
  const R = {
    surimpression: false, surimpressionOPM: false,
    calques: [], calquesRepere: [], calquesMasques: [],
    espaces: {}, imagesRVB: 0, imagesCMJN: 0, imagesGris: 0, imagesAutre: 0,
    filetsFins: [], annotations: 0, champs: 0, chiffre: false,
  };
  const ctx = doc.context;
  const nom = (o) => (o && o.asString) ? o.asString() : String(o || "");
  /* un flux (image, contenu) porte son dictionnaire dans .dict :
     obj.get() y est absent, la sonde ne voyait aucune image */
  const dictDe = (o) => (o && o.dict && o.dict.get) ? o.dict : ((o && o.get) ? o : null);
  /* les noms de calques sont des chaines PDF, souvent en UTF-16BE :
     sans decodage, la recherche de "repere" ne trouve jamais rien */
  const texte = (o) => {
    if (!o) return "";
    if (o.decodeText) { try { return o.decodeText(); } catch (e) {} }
    if (o.asString) return o.asString();
    return String(o);
  };
  const estVrai = (v) => v && (v === PDFLib.PDFBool.True || nom(v) === "true"
                               || (v.value !== undefined && v.value === true));

  for (const [, brut] of ctx.enumerateIndirectObjects()) {
    const obj = dictDe(brut);
    if (!obj) continue;
    let type = "";
    try { type = nom(obj.get(PDFLib.PDFName.of("Type"))); } catch (e) { continue; }

    /* --- surimpression : /OP, /op, /OPM dans un ExtGState --- */
    if (type === "/ExtGState") {
      try {
        if (estVrai(obj.get(PDFLib.PDFName.of("OP")))) R.surimpression = true;
        if (estVrai(obj.get(PDFLib.PDFName.of("op")))) R.surimpression = true;
        const opm = obj.get(PDFLib.PDFName.of("OPM"));
        if (opm && opm.asNumber && opm.asNumber() === 1) R.surimpressionOPM = true;
      } catch (e) {}
    }

    /* --- calques optionnels --- */
    if (type === "/OCG") {
      try {
        const lib = texte(obj.get(PDFLib.PDFName.of("Name")));
        R.calques.push(lib);
        if (/rep[eè]re|gabarit|guide|template|marks?|crop|coupe|calage|fond perdu|bleed|safe/i.test(lib))
          R.calquesRepere.push(lib);
      } catch (e) {}
    }

    /* --- images : espace couleur declare --- */
    let sub = "";
    try { sub = nom(obj.get(PDFLib.PDFName.of("Subtype"))); } catch (e) {}
    if (sub === "/Image") {
      let cs = "";
      try {
        const c = obj.get(PDFLib.PDFName.of("ColorSpace"));
        cs = nom(c);
        if (cs === "" && c && c.get) cs = nom(c.get(0));
      } catch (e) {}
      R.espaces[cs] = (R.espaces[cs] || 0) + 1;
      if (/DeviceRGB|CalRGB/.test(cs)) R.imagesRVB++;
      else if (/DeviceCMYK/.test(cs)) R.imagesCMJN++;
      else if (/DeviceGray|CalGray/.test(cs)) R.imagesGris++;
      else R.imagesAutre++;
    }

    /* --- annotations et champs --- */
    if (type === "/Annot") {
      R.annotations++;
      let st = "";
      try { st = nom(obj.get(PDFLib.PDFName.of("Subtype"))); } catch (e) {}
      if (st === "/Widget") R.champs++;
    }
  }

  /* --- calques masques a l'ouverture --- */
  try {
    const cat = ctx.lookup(doc.catalog.get(PDFLib.PDFName.of("OCProperties")));
    const d = cat && cat.get ? ctx.lookup(cat.get(PDFLib.PDFName.of("D"))) : null;
    const off = d && d.get ? ctx.lookup(d.get(PDFLib.PDFName.of("OFF"))) : null;
    if (off && off.size) R.calquesMasques = new Array(off.size()).fill("masqué");
  } catch (e) {}

  try { R.chiffre = !!doc.isEncrypted; } catch (e) {}
  return R;
}

/* ==================================================================== */
/* INGESTION JPEG / PNG                                                 */
/* -------------------------------------------------------------------- */
/* Une image n'a aucune dimension physique : 3000 x 2000 px ne dit pas   */
/* si c'est une carte de visite ou une banderole. La dimension de        */
/* reference est donc celle du PRODUIT COMMANDE.                         */
/*                                                                       */
/* L'image est placee dans une page au format commande, a ses propres    */
/* proportions, centree, sans deformation ni recadrage. L'apercu montre  */
/* donc exactement ce que le client obtiendra, bandes vides comprises.   */
/* ==================================================================== */
let ORIGINE = null;

const MIME_IMAGE = { "image/jpeg": "jpg", "image/jpg": "jpg", "image/png": "png" };

function estImage(f) {
  if (!f) return false;
  if (MIME_IMAGE[f.type]) return true;
  return /\.(jpe?g|png)$/i.test(f.name || "");
}

function genreImage(f) {
  return (/\.png$/i.test(f.name || "") || f.type === "image/png") ? "png" : "jpg";
}

/* Profil colorimetrique incorpore : APP2/ICC_PROFILE en JPEG,
   chunk iCCP ou sRGB en PNG. APP14/Adobe signale un JPEG CMJN. */
function sondeProfil(octets, genre) {
  const u = new Uint8Array(octets);
  const res = { icc: false, cmjn: false };
  if (genre === "png") {
    const cherche = (mot) => {
      for (let i = 8; i < Math.min(u.length, 200000) - 4; i++)
        if (u[i] === mot.charCodeAt(0) && u[i+1] === mot.charCodeAt(1)
         && u[i+2] === mot.charCodeAt(2) && u[i+3] === mot.charCodeAt(3)) return true;
      return false;
    };
    res.icc = cherche("iCCP") || cherche("sRGB");
    return res;
  }
  let i = 2;
  while (i < u.length - 4) {
    if (u[i] !== 0xFF) { i++; continue; }
    const m = u[i+1];
    if (m === 0xD8 || m === 0x01 || (m >= 0xD0 && m <= 0xD7)) { i += 2; continue; }
    if (m === 0xDA) break;
    const lg = (u[i+2] << 8) | u[i+3];
    if (m === 0xE2) {
      let sig = "";
      for (let k = i + 4; k < Math.min(i + 16, u.length); k++) sig += String.fromCharCode(u[k]);
      if (sig.indexOf("ICC_PROFILE") === 0) res.icc = true;
    }
    if (m === 0xEE) res.cmjn = true;
    i += 2 + lg;
  }
  return res;
}

/* Dimensions lues dans l'EN-TETE, sans decoder un seul pixel.
   Un JPEG de 66 Mo porte environ 250 Mpx : le decoder pour connaitre sa
   taille materialise 1 Go en memoire et tue l'onglet. Le marqueur SOF du
   JPEG et le chunk IHDR du PNG donnent la reponse en quelques octets. */
function dimsEnTete(octets, genre) {
  const u = new Uint8Array(octets);
  if (genre === "png") {
    /* signature 8 o, longueur 4 o, type 4 o, puis largeur et hauteur en
       32 bits gros-boutiste. IHDR est toujours le premier chunk. */
    if (u.length < 24) return null;
    if (String.fromCharCode(u[12], u[13], u[14], u[15]) !== "IHDR") return null;
    const lire = (o) => ((u[o] << 24 | u[o+1] << 16 | u[o+2] << 8 | u[o+3]) >>> 0);
    const W = lire(16), H = lire(20);
    return (W > 0 && H > 0) ? { W: W, H: H } : null;
  }
  let i = 2;
  while (i < u.length - 8) {
    if (u[i] !== 0xFF) { i++; continue; }
    const m = u[i+1];
    if (m === 0xD8 || m === 0x01 || (m >= 0xD0 && m <= 0xD7)) { i += 2; continue; }
    if (m === 0xDA || m === 0xD9) break;
    const lg = (u[i+2] << 8) | u[i+3];
    /* SOF0 a SOF15, hors DHT (C4), JPG (C8) et DAC (CC) qui partagent la plage */
    if (m >= 0xC0 && m <= 0xCF && m !== 0xC4 && m !== 0xC8 && m !== 0xCC) {
      const H = (u[i+5] << 8) | u[i+6], W = (u[i+7] << 8) | u[i+8];
      return (W > 0 && H > 0) ? { W: W, H: H } : null;
    }
    if (!(lg > 0)) break;
    i += 2 + lg;
  }
  return null;
}

/* Resolution DECLAREE dans le fichier — le tag que Photoshop affiche.
   -------------------------------------------------------------------
   Ce tag ne dit rien de la qualite : Canva, Gemini et les captures ecran
   ecrivent presque toujours 72. Mais c'est ce que le client voit quand il
   ouvre son fichier, et lui opposer un autre chiffre au comptoir declenche
   la discussion que l'outil est cense supprimer. On affiche donc SA
   dimension ; le verdict, lui, porte sur le dpi a la taille commandee.
   JPEG : APP0/JFIF (unites + densites), puis EXIF XResolution.
   PNG  : chunk pHYs, en pixels par metre. */
function dpiEnTete(octets, genre) {
  const u = new Uint8Array(octets);
  const u32 = (o) => ((u[o] << 24 | u[o+1] << 16 | u[o+2] << 8 | u[o+3]) >>> 0);

  if (genre === "png") {
    let i = 8;
    while (i + 12 <= u.length) {
      const lg = u32(i), typ = String.fromCharCode(u[i+4], u[i+5], u[i+6], u[i+7]);
      if (typ === "pHYs") {
        const x = u32(i + 8), y = u32(i + 12), unite = u[i + 16];
        if (unite === 1 && x > 0 && y > 0) return { x: x * 0.0254, y: y * 0.0254 };
        return null;
      }
      if (typ === "IDAT" || typ === "IEND") return null;
      i += 12 + lg;
    }
    return null;
  }

  let i = 2;
  while (i < u.length - 8) {
    if (u[i] !== 0xFF) { i++; continue; }
    const m = u[i+1];
    if (m === 0xD8 || m === 0x01 || (m >= 0xD0 && m <= 0xD7)) { i += 2; continue; }
    if (m === 0xDA || m === 0xD9) break;
    const lg = (u[i+2] << 8) | u[i+3];

    if (m === 0xE0 && lg >= 14
        && String.fromCharCode(u[i+4], u[i+5], u[i+6], u[i+7]) === "JFIF") {
      const unite = u[i+11];
      const dx = (u[i+12] << 8) | u[i+13], dy = (u[i+14] << 8) | u[i+15];
      if (dx > 0 && dy > 0) {
        if (unite === 1) return { x: dx, y: dy };
        if (unite === 2) return { x: dx * 2.54, y: dy * 2.54 };
      }
    }

    if (m === 0xE1 && lg > 16
        && String.fromCharCode(u[i+4], u[i+5], u[i+6], u[i+7]) === "Exif") {
      const t = i + 10;
      const gros = u[t] === 0x4D;
      const r16 = (o) => gros ? ((u[o] << 8) | u[o+1]) : ((u[o+1] << 8) | u[o]);
      const r32 = (o) => gros ? u32(o)
                              : (((u[o+3] << 24 | u[o+2] << 16 | u[o+1] << 8 | u[o]) >>> 0));
      try {
        const ifd = t + r32(t + 4), n = r16(ifd);
        let xr = 0, yr = 0, unite = 2;
        for (let k = 0; k < n; k++) {
          const e = ifd + 2 + k * 12, tag = r16(e);
          if (tag === 0x011A || tag === 0x011B) {
            const o = t + r32(e + 8), num = r32(o), den = r32(o + 4);
            if (den > 0) { if (tag === 0x011A) xr = num / den; else yr = num / den; }
          } else if (tag === 0x0128) unite = r16(e + 8);
        }
        if (xr > 0) {
          const k = (unite === 3) ? 2.54 : 1;
          return { x: xr * k, y: (yr > 0 ? yr : xr) * k };
        }
      } catch (e) { /* EXIF illisible : on retombe sur le defaut */ }
    }
    if (!(lg > 0)) break;
    i += 2 + lg;
  }
  return null;
}

/* Cache du bitmap decode. Sans lui, chaque changement de produit redecode
   le fichier de zero : sur un gros JPEG c'est plusieurs secondes a chaque
   fois, et la memoire non liberee finit par faire tomber l'onglet. */
let BMP_CACHE = { buf: null, max: 0, res: null };
function viderCacheBmp() {
  if (BMP_CACHE.res && BMP_CACHE.res.bmp && BMP_CACHE.res.bmp.close) {
    try { BMP_CACHE.res.bmp.close(); } catch (e) {}
  }
  BMP_CACHE = { buf: null, max: 0, res: null };
}

/* maxPx : nombre de pixels au-dela duquel on decode en reduit.
   createImageBitmap avec resizeWidth decode DIRECTEMENT a la taille voulue,
   sans jamais materialiser l'image pleine. C'est ce qui evite le plantage.
   natW / natH restent les pixels REELS du client : toute la resolution
   annoncee en depend, elle ne doit jamais venir du bitmap reduit. */
async function decoderImage(octets, mime, maxPx) {
  const genre = (mime === "image/png") ? "png" : "jpg";
  if (maxPx > 0 && BMP_CACHE.buf === octets && BMP_CACHE.max === maxPx && BMP_CACHE.res)
    return BMP_CACHE.res;

  const blob = new Blob([octets], { type: mime || "image/jpeg" });
  const tete = dimsEnTete(octets, genre);
  let opts, natW = 0, natH = 0, reduit = false;
  if (tete && maxPx > 0 && tete.W * tete.H > maxPx) {
    natW = tete.W; natH = tete.H;
    const k = Math.sqrt(maxPx / (tete.W * tete.H));
    opts = { resizeWidth: Math.max(1, Math.round(tete.W * k)),
             resizeHeight: Math.max(1, Math.round(tete.H * k)),
             resizeQuality: "high" };
    reduit = true;
  }

  if (typeof createImageBitmap === "function") {
    let bmp;
    try { bmp = await createImageBitmap(blob, opts); }
    catch (e) { bmp = await createImageBitmap(blob); reduit = false; }
    const res = { bmp: bmp, W: bmp.width, H: bmp.height,
                  natW: natW || bmp.width, natH: natH || bmp.height, reduit: reduit };
    if (maxPx > 0) { viderCacheBmp(); BMP_CACHE = { buf: octets, max: maxPx, res: res }; }
    return res;
  }
  const url = URL.createObjectURL(blob);
  try {
    const im = await new Promise((ok, ko) => {
      const e = new Image();
      e.onload = () => ok(e); e.onerror = () => ko(new Error("image illisible"));
      e.src = url;
    });
    return { bmp: im, W: im.naturalWidth, H: im.naturalHeight,
             natW: im.naturalWidth, natH: im.naturalHeight, reduit: false };
  } finally { setTimeout(() => URL.revokeObjectURL(url), 2000); }
}

/* Fenetre decodee en PLEINE DEFINITION, sans decoder le reste de l'image.
   C'est ce qui permet de mesurer la nettete d'un JPEG de 250 Mpx. */
async function decoderCrop(octets, mime, sx, sy, sw, sh) {
  if (typeof createImageBitmap !== "function") return null;
  const blob = new Blob([octets], { type: mime || "image/jpeg" });
  try {
    const bmp = await createImageBitmap(blob, sx, sy, sw, sh);
    return { bmp: bmp, W: bmp.width, H: bmp.height };
  } catch (e) { return null; }
}

/* Trois fenetres prelevees au tiers, au centre et aux deux tiers : une
   seule fenetre centrale peut tomber sur un aplat et ne rien mesurer.
   Remplace le renoncement pur et simple au-dela de LOURD_MPX, qui privait
   de mesure exactement les fichiers qui en avaient le plus besoin. */
async function grisEchantillonne(octets, mime, natW, natH, budget) {
  const cote = Math.max(64, Math.floor(Math.sqrt(budget / 3)));
  const sw = Math.min(natW, cote), sh = Math.min(natH, cote);
  const vues = [];
  for (const a of [0.30, 0.50, 0.70]) {
    const sx = Math.max(0, Math.min(natW - sw, Math.round(natW * a - sw / 2)));
    const sy = Math.max(0, Math.min(natH - sh, Math.round(natH * a - sh / 2)));
    const d = await decoderCrop(octets, mime, sx, sy, sw, sh);
    if (!d) continue;
    const g = grisDeBitmap(d.bmp, d.W, d.H, budget);
    if (d.bmp.close) { try { d.bmp.close(); } catch (e) {} }
    vues.push({ g: g.g, W: g.W, H: g.H });
  }
  return vues.length ? vues : null;
}

/* Niveaux de gris NATIFS. Aucun reechantillonnage : ce qui entre en pixels
   ressort en pixels. C'est le seul chemin ou la mesure est exacte. */
function grisDeBitmap(bmp, W, H, budget) {
  let cw = W, ch = H, sx = 0, sy = 0;
  if (W * H > budget) {
    const cote = Math.floor(Math.sqrt(budget));
    cw = Math.min(W, cote); ch = Math.min(H, cote);
    sx = Math.floor((W - cw) / 2); sy = Math.floor((H - ch) / 2);
  }
  const cv = document.createElement("canvas");
  cv.width = cw; cv.height = ch;
  const ctx = cv.getContext("2d", { willReadFrequently: true });
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, cw, ch);
  ctx.drawImage(bmp, sx, sy, cw, ch, 0, 0, cw, ch);
  const px = ctx.getImageData(0, 0, cw, ch).data;
  const g = new Uint8Array(cw * ch);
  for (let i = 0, j = 0; j < g.length; i += 4, j++)
    g[j] = (px[i] * 77 + px[i+1] * 151 + px[i+2] * 28) >> 8;
  return { g, W: cw, H: ch, recadre: cw !== W || ch !== H };
}

async function imageVersPdf(octets, genre, cibleLcm, cibleHcm) {
  const doc = await PDFLib.PDFDocument.create();
  const Lpt = cibleLcm / 2.54 * 72, Hpt = cibleHcm / 2.54 * 72;
  let img = null;
  try {
    img = genre === "png" ? await doc.embedPng(octets) : await doc.embedJpg(octets);
  } catch (e) {
    const d = await decoderImage(octets, genre === "png" ? "image/png" : "image/jpeg");
    const cv = document.createElement("canvas");
    cv.width = d.W; cv.height = d.H;
    const ctx = cv.getContext("2d");
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, d.W, d.H);
    ctx.drawImage(d.bmp, 0, 0);
    img = await doc.embedPng(cv.toDataURL("image/png"));
  }
  const ri = img.width / img.height, rc = Lpt / Hpt;
  let w, h;
  if (ri > rc) { w = Lpt; h = Lpt / ri; } else { h = Hpt; w = Hpt * ri; }
  const pg = doc.addPage([Lpt, Hpt]);
  pg.drawRectangle({ x: 0, y: 0, width: Lpt, height: Hpt, color: PDFLib.rgb(1, 1, 1) });
  pg.drawImage(img, { x: (Lpt - w) / 2, y: (Hpt - h) / 2, width: w, height: h });
  return (await doc.save()).buffer;
}

/* Proportions, transposition comprise : une image en paysage pour un produit
   en portrait est une rotation, pas une incompatibilite. */
function jugerProportions(pxL, pxH, cibleL, cibleH) {
  const ri = pxL / pxH, rc = cibleL / cibleH;
  const ecart = Math.abs(ri - rc) / rc;
  const ecartT = Math.abs((1 / ri) - rc) / rc;
  if (ecart <= TOL_RATIO) return { cas: "conforme", ecart: ecart };
  if (ecartT <= TOL_RATIO) return { cas: "rotation", ecart: ecartT };
  return { cas: Math.min(ecart, ecartT) >= 0.25 ? "incompatible" : "approchant",
           ecart: Math.min(ecart, ecartT) };
}

/* ==================================================================== */
/* NETTETE REELLE — etalement des contours                              */
/* -------------------------------------------------------------------- */
/* Le dpi geometrique (pixels / centimetres) ne dit pas si l'image a ete */
/* agrandie apres coup. Un JPEG 150 dpi reechantillonne a 300 annonce    */
/* 300 dpi et sort baveux. On mesure donc la largeur de transition des   */
/* contours : serree sur un fichier sain, etalee sur un fichier agrandi. */
/*                                                                       */
/* DEUX VOIES DE MESURE, DEUX REFERENCES.                                */
/*   - voie « rendu »  : un PDF est rasterise par le navigateur, qui     */
/*     ajoute son propre lissage.                                        */
/*   - voie « natif »  : un JPEG ou un PNG est lu pixel par pixel, sans  */
/*     aucun rendu intermediaire.                                        */
/* Les deux ne produisent pas la meme valeur sur un meme visuel. Une     */
/* reference unique appliquee aux deux voies serait fausse sur l'une des */
/* deux. Elles sont donc calibrees separement.                           */
/*                                                                       */
/* Tant qu'une reference n'est pas calibree, la mesure sort en NOTE et   */
/* ne modifie aucun verdict.                                             */
/* ==================================================================== */
const NETTETE_DEFAUT = {
  bordRefRendu: null,   // px, voie PDF      — null = non calibre
  bordRefNatif: null,   // px, voie image    — null = non calibre
