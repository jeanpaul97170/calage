  bloc: 96,             // cote maximal du bloc de balayage
  blocMin: 32,          // cote minimal
  blocsVises: 300,      // en dessous, on reduit le bloc
  blocsMin: 15,         // sous ce nombre de blocs texte, mesure non concluante
  plancher: 1.05,       // au-dessous, le texte est vectoriel : mesure sans objet
  arretBlocs: 300,      // assez d'echantillons : on arrete de balayer
  ecartSepMin: 0.25,    // sous cet ecart texte/photo, les populations ne sont pas separees
  budgetPx: 4500000,    // plafond de pixels, reparti entre les fenetres
  fenetres: 4,          // zones echantillonnees quand la page depasse le budget
  contourTexte: 0.06,   // densite de contours au-dela de laquelle un bloc est du texte
  contourDense: 0.20,   // densite + bi-niveau : QR, code-barres, trame
  renduMax: 12,         // facteur de rendu maximal (72 dpi x 12 = 864 dpi)
};
let NETTETE = Object.assign({}, NETTETE_DEFAUT);
try {
  const _n = localStorage.getItem("idj_nettete");
  if (_n) NETTETE = Object.assign({}, NETTETE_DEFAUT, JSON.parse(_n));
} catch (e) { /* reglages par defaut */ }

function enregistrerNettete() {
  try { localStorage.setItem("idj_nettete", JSON.stringify(NETTETE)); } catch (e) {}
}

/* Histogramme 256 niveaux + ecart type d'un bloc, en un seul passage. */
function histoBloc(g, W, x0, y0, T) {
  const h = new Int32Array(256);
  let s = 0, s2 = 0;
  for (let y = y0; y < y0 + T; y++) {
    const base = y * W;
    for (let x = x0; x < x0 + T; x++) {
      const v = g[base + x];
      h[v]++; s += v; s2 += v * v;
    }
  }
  const nb = T * T, moy = s / nb;
  return { h: h, n: nb, ecart: Math.sqrt(Math.max(0, s2 / nb - moy * moy)) };
}

function percentileHisto(h, n, p) {
  const cible = p * n;
  let c = 0;
  for (let v = 0; v < 256; v++) { c += h[v]; if (c >= cible) return v; }
  return 255;
}

function contoursBloc(g, W, x0, y0, T) {
  let k = 0;
  for (let y = y0; y < y0 + T; y++) {
    const base = y * W;
    for (let x = x0 + 1; x < x0 + T; x++)
      if (Math.abs(g[base + x] - g[base + x - 1]) > 40) k++;
  }
  return k / (T * (T - 1));
}

function profilNiveaux(h, n) {
  const b = new Float64Array(32);
  for (let v = 0; v < 256; v++) b[v >> 3] += h[v];
  let niveaux = 0;
  for (let i = 0; i < 32; i++) { b[i] /= n; if (b[i] > 0.005) niveaux++; }
  const tri = Array.from(b).sort((a, z) => z - a);
  return { niveaux: niveaux, bimodal: tri[0] + tri[1] };
}

/* MOYENNE des longueurs de transition, pas mediane : la mediane d'entiers
   sature a 1 sur tout fichier net et ne laisse aucune marge entre « net »
   et « legerement mou ». La moyenne donne du sous-pixel. */
function largeurBord(g, W, x0, y0, T, h, n) {
  const lo = percentileHisto(h, n, 0.05), hi = percentileHisto(h, n, 0.95);
  if (hi - lo < 40) return null;
  const t10 = lo + 0.1 * (hi - lo), t90 = lo + 0.9 * (hi - lo);
  let somme = 0, nb = 0;
  for (let y = y0; y < y0 + T; y++) {
    const base = y * W;
    let r = 0;
    for (let x = x0; x < x0 + T; x++) {
      const v = g[base + x];
      if (v > t10 && v < t90) r++;
      else { if (r && r <= 12) { somme += r; nb++; } r = 0; }
    }
    /* le run qui touche le bord du bloc est tronque : on ne le compte pas */
  }
  if (nb < 15) return null;
  return somme / nb;
}

/* Le bloc s'adapte au rendu : un bloc de 96 px sur une carte de 8 x 12 cm
   rendue a 84 dpi ne laisse qu'une poignee de blocs, et la mesure sort
   « non concluante » sur les fichiers les plus interessants. */
function tailleBloc(W, H, cfg) {
  let T = cfg.bloc;
  while (T > cfg.blocMin && Math.floor(W / T) * Math.floor(H / T) < cfg.blocsVises) T -= 8;
  return Math.max(cfg.blocMin, T);
}

/* Trois populations : texte, photo, et structures denses (QR, code-barres,
   trames) ecartees des deux autres. Sans cette exclusion un QR net tire la
   mediane texte vers le bas et masque un agrandissement reel ; un QR issu
   d'une capture declenche a l'inverse un faux agrandissement. */
function scanBlocs(g, W, H, cfg, forceT) {
  const T = forceT || tailleBloc(W, H, cfg), txt = [], pho = [];
  let denses = 0, examines = 0;
  for (let y = 0; y + T <= H; y += T) {
    for (let x = 0; x + T <= W; x += T) {
      const hb = histoBloc(g, W, x, y, T);
      if (hb.ecart < 8) continue;
      examines++;
      const c = contoursBloc(g, W, x, y, T);
      const pn = profilNiveaux(hb.h, hb.n);
      /* ecarte AVANT la mesure : un QR a bords francs ne produit aucun run
         exploitable et serait sinon abandonne sans etre compte. */
      if (c > cfg.contourDense && pn.niveaux <= 8) { denses++; continue; }
      const e = largeurBord(g, W, x, y, T, hb.h, hb.n);
      if (e === null) continue;
      if (cfg.arretBlocs && txt.length >= cfg.arretBlocs && pho.length >= cfg.arretBlocs)
        return { txt: txt, pho: pho, denses: denses, examines: examines, bloc: T };
      const estTexte = (pn.bimodal > 0.45 && pn.niveaux <= 18)
                    || (c > cfg.contourTexte && pn.niveaux <= 24);
      (estTexte ? txt : pho).push(e);
    }
  }
  return { txt: txt, pho: pho, denses: denses, examines: examines, bloc: T };
}

/* Rend la page a sa PROPRE resolution, pas a celle de l'ecran.
   Quand la page depasse le budget, on n'echantillonne PAS le seul carre
   central : sur une banderole le centre est souvent un aplat. On rend
   plusieurs fenetres reparties sur la page et on cumule. */
async function rendreANatif(buffer, dpiPage, cfg, noPage) {
  const doc = await ouvrirPdf(buffer);
  const page = await doc.getPage(noPage || 1);
  const v1 = page.getViewport({ scale: 1 });
  const kVoulu = (dpiPage || 300) / 72;
  const k = Math.max(0.5, Math.min(kVoulu, cfg.renduMax));
  const plafonne = kVoulu > cfg.renduMax;
  const Wt = Math.ceil(v1.width * k), Ht = Math.ceil(v1.height * k);

  const dessiner = async (W, H, offX, offY) => {
    const vp = page.getViewport({ scale: k, offsetX: offX, offsetY: offY });
    const cv = document.createElement("canvas");
    cv.width = W; cv.height = H;
    const ctx = cv.getContext("2d", { willReadFrequently: true });
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, W, H);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    const px = ctx.getImageData(0, 0, W, H).data;
    const g = new Uint8Array(W * H);
    for (let i = 0, j = 0; j < g.length; i += 4, j++)
      g[j] = (px[i] * 77 + px[i+1] * 151 + px[i+2] * 28) >> 8;
    return { g: g, W: W, H: H };
  };

  if (Wt * Ht <= cfg.budgetPx)
    return { vues: [await dessiner(Wt, Ht, 0, 0)], k: k, plafonne: plafonne,
             recadre: false, fenetres: 1 };

  const nf = Math.max(1, cfg.fenetres);
  const cols = Math.ceil(Math.sqrt(nf)), lignes = Math.ceil(nf / cols);
  const cote = Math.floor(Math.sqrt(cfg.budgetPx / nf));
  const fw = Math.min(Wt, cote), fh = Math.min(Ht, cote);
  const vues = [];
  for (let r = 0; r < lignes && vues.length < nf; r++) {
    for (let c = 0; c < cols && vues.length < nf; c++) {
      const cx = Math.round((c + 0.5) / cols * Wt), cy = Math.round((r + 0.5) / lignes * Ht);
      const x = Math.max(0, Math.min(Wt - fw, cx - Math.floor(fw / 2)));
      const y = Math.max(0, Math.min(Ht - fh, cy - Math.floor(fh / 2)));
      vues.push(await dessiner(fw, fh, -x, -y));
    }
  }
  return { vues: vues, k: k, plafonne: plafonne, recadre: true, fenetres: vues.length };
}

/* Le bord se mesure en pixels du fichier. Encore faut-il que le fichier ait
   des pixels : une page vectorielle plafonne a 1,00 quoi qu'il arrive et n'a
   rien a faire dans une calibration. */
async function sondeRaster(pageJs) {
  const imgs = await lireImages(pageJs);
  const v1 = pageJs.getViewport({ scale: 1 });
  const aire = v1.width * v1.height;
  let couvert = 0;
  for (const i of imgs) {
    const b = i.boite;
    const l = Math.max(0, Math.min(b.x1, v1.width) - Math.max(b.x0, 0));
    const h = Math.max(0, Math.min(b.y1, v1.height) - Math.max(b.y0, 0));
    couvert += l * h;
  }
  return {
    nbImages: imgs.length,
    dpiImage: imgs.length ? Math.min.apply(null, imgs.map((x) => x.dpi)) : null,
    couverture: aire ? Math.min(1, couvert / aire) : 0,
  };
}

const medianeDe = (a) => {
  if (!a || !a.length) return null;
  const b = a.slice().sort((u, v) => u - v);
  return b[b.length >> 1];
};

/* natif : { g, W, H, recadre } quand la source est une image deja decodee. */
async function mesurerNettete(buffer, dpiPage, echelle, noPage, natif) {
  const cfg = NETTETE;
  const t0 = (performance && performance.now) ? performance.now() : Date.now();
  const voie = natif ? "natif" : "rendu";
  const rn = natif
    ? { vues: [{ g: natif.g, W: natif.W, H: natif.H }], k: (dpiPage || 0) / 72,
        recadre: !!natif.recadre, plafonne: false, fenetres: 1 }
    : await rendreANatif(buffer, dpiPage, cfg, noPage);

  const T = tailleBloc(rn.vues[0].W, rn.vues[0].H, cfg);
  const s = { txt: [], pho: [], denses: 0, examines: 0 };
  for (const v of rn.vues) {
    const u = scanBlocs(v.g, v.W, v.H, cfg, T);
    s.txt = s.txt.concat(u.txt); s.pho = s.pho.concat(u.pho);
    s.denses += u.denses; s.examines += u.examines;
  }
  const bordTexte = s.txt.length >= cfg.blocsMin ? medianeDe(s.txt) : null;
  const bordPhoto = s.pho.length >= 10 ? medianeDe(s.pho) : null;
  const ecartPT = (bordTexte !== null && bordPhoto !== null) ? bordPhoto - bordTexte : null;

  /* Trois raisons de ne pas se fier a la valeur :
     - la page n'a aucun raster : elle ne peut pas avoir ete agrandie
     - le rendu a tape le plafond : l'echelle n'est plus native
     - les deux populations se touchent : la separation texte/photo n'a pas
       eu lieu, la valeur ne mesure pas la nettete du texte */
  /* Le plancher a 1,00 n'est pas reserve aux pages entierement vectorielles :
     un texte vectoriel pose sur un fond raster y tombe aussi (banderole
     600x120, 64 % de couverture image, bord exactement 1,00). Ce n'est pas
     une mesure de nettete, c'est la limite de l'antialiasing du rendu. */
  const vectoriel = voie === "rendu" && (!dpiPage || (bordTexte !== null && bordTexte <= cfg.plancher));
  const nonSepare = ecartPT !== null && Math.abs(ecartPT) < cfg.ecartSepMin;
  const exploitable = bordTexte !== null && !vectoriel && !rn.plafonne && !nonSepare;
  const motif = bordTexte === null ? "mesure non concluante"
              : vectoriel ? (dpiPage ? "texte vectoriel (plancher de rendu)" : "page vectorielle")
              : rn.plafonne ? "rendu plafonne"
              : nonSepare ? "populations non separees" : "";

  const ref = voie === "natif" ? cfg.bordRefNatif : cfg.bordRefRendu;
  let facteur = null, dpiReel = null;
  if (exploitable && ref) {
    const brut = bordTexte / ref;
    facteur = brut >= 1.5 ? brut : 1.0;
    if (dpiPage) dpiReel = (dpiPage * (echelle || 1)) / facteur;
  }
  const t1 = (performance && performance.now) ? performance.now() : Date.now();
  return {
    voie: voie, bordTexte: bordTexte, bordPhoto: bordPhoto, ecartPhotoTexte: ecartPT,
    facteur: facteur, dpiReel: dpiReel, exploitable: exploitable, motif: motif,
    blocsTexte: s.txt.length, blocsPhoto: s.pho.length,
    blocsDenses: s.denses, blocsExamines: s.examines,
    dpiPage: dpiPage, echelleRendu: rn.k, recadre: rn.recadre, plafonne: rn.plafonne,
    fenetres: rn.fenetres, bloc: T, ms: Math.round(t1 - t0), calibre: !!ref,
  };
}

/* ==================================================================== */
/* IMPOSITION EN CAHIER PIQUE                                           */
/* -------------------------------------------------------------------- */
/* Le client livre des PAGES DE LECTURE. L'imprimerie les regroupe deux  */
/* par deux sur des feuilles pliees et emboitees.                        */
/* Feuille n : recto = (N+2-2n) a gauche, (2n-1) a droite                */
/*             verso = (2n)     a gauche, (N+1-2n) a droite              */
/* Verifie jusqu'a 20 pages : chaque page placee une fois et une seule.  */
/* ==================================================================== */
function imposer(nbPages) {
  if (!nbPages || nbPages % 4 !== 0) return null;
  const f = [];
  for (let n = 1; n <= nbPages / 4; n++) {
    f.push({ feuille: n, face: "recto", g: nbPages + 2 - 2 * n, d: 2 * n - 1 });
    f.push({ feuille: n, face: "verso", g: 2 * n, d: nbPages + 1 - 2 * n });
  }
  return f;
}

/* Le pli mange quelques millimetres : le bord interieur exige plus de
   marge que les bords exterieurs. La valeur est PAR PRODUIT, colonne
   marge_pli_mm de l'admin ; a defaut, marge exterieure + 3 mm. */
const GOUTTIERE_DEFAUT_MM = 3;

/* L'atelier est reconstruit a chaque rendu de la scene, et une case cochee
   disparaissait avec lui : l'operateur cochait « combler en blanc », un
   rendu intermediaire remettait la case a zero, et la correction comblait
   en couleur. Le choix est desormais garde hors du DOM. */
let CHOIX_BLANC = false;
let ZONES_EN_COURS = false;
function margeAuPli(p) {
  return (p.marge_pli_mm > 0) ? p.marge_pli_mm : (p.marge_secu_mm + GOUTTIERE_DEFAUT_MM);
}

function estCahier(p, nbPages) {
  return p && p.pages === "MULTIPLE4" && nbPages >= 4 && nbPages % 4 === 0;
}

/* Rend une FACE : deux pages cote a cote, pli au centre. */
async function apercuFace(buffer, g, d, maxPx, p) {
  maxPx = maxPx || largeurUtile(1.2);
  const doc = await ouvrirPdf(buffer);
  const rendre = async (no) => {
    const page = await doc.getPage(no);
    const v1 = page.getViewport({ scale: 1 });
    const k = Math.min(maxPx / (v1.width * 2), maxPx / v1.height, 6);
    const vp = page.getViewport({ scale: k });
    const cv = document.createElement("canvas");
    cv.width = Math.max(8, Math.ceil(vp.width)); cv.height = Math.max(8, Math.ceil(vp.height));
    const c = cv.getContext("2d");
    c.fillStyle = "#ffffff"; c.fillRect(0, 0, cv.width, cv.height);
    await page.render({ canvasContext: c, viewport: vp }).promise;
    return { cv, largCm: v1.width / 72 * 2.54, hautCm: v1.height / 72 * 2.54 };
  };
  const a = await rendre(g), b = await rendre(d);
  const H = Math.max(a.cv.height, b.cv.height);
  const cv = document.createElement("canvas");
  cv.width = a.cv.width + b.cv.width; cv.height = H;
  const c = cv.getContext("2d");
  c.fillStyle = "#ffffff"; c.fillRect(0, 0, cv.width, cv.height);
  c.drawImage(a.cv, 0, (H - a.cv.height) / 2);
  c.drawImage(b.cv, a.cv.width, (H - b.cv.height) / 2);
  const trait = Math.max(1, cv.width * 0.002);

  /* Reperes PAR PAGE : chaque page a son propre trait de coupe et sa propre
     zone de securite. Les tracer autour de la double page ferait croire que
     le couple est coupe d'un bloc. */
  if (p) {
    const pages = [{ x: 0, w: a.cv.width, cm: a.largCm }, { x: a.cv.width, w: b.cv.width, cm: b.largCm }];
    for (const pg2 of pages) {
      const pxCm = pg2.w / pg2.cm, pxCmH = H / Math.max(a.hautCm, b.hautCm);
      const fp = (p.fond_perdu_mm / 2) / 10;
      const tx = pg2.x + fp * pxCm, ty = fp * pxCmH;
      const tw = pg2.w - 2 * fp * pxCm, th = H - 2 * fp * pxCmH;
      c.setLineDash([]); c.strokeStyle = "#B02020"; c.lineWidth = trait;
      c.strokeRect(tx + trait / 2, ty + trait / 2, tw - trait, th - trait);
      if (p.marge_secu_mm > 0) {
        const mx = p.marge_secu_mm / 10 * pxCm, my = p.marge_secu_mm / 10 * pxCmH;
        c.strokeStyle = "#B5651D";
        c.setLineDash([Math.max(3, cv.width * 0.006), Math.max(2, cv.width * 0.004)]);
        c.strokeRect(tx + mx, ty + my, tw - 2 * mx, th - 2 * my);
        c.setLineDash([]);
      }
    }
  }

  /* La marge du pli, de part et d'autre. C'est la zone qui part dans la
     reliure : elle est plus large que la marge exterieure, et elle ne se
     voyait nulle part — l'operateur ne pouvait pas juger a l'oeil. */
  if (p && p.marge_secu_mm > 0) {
    const pxCm = a.cv.width / a.largCm;
    const gm = margeAuPli(p) / 10 * pxCm;
    c.fillStyle = "rgba(181,101,29,.10)";
    c.fillRect(a.cv.width - gm, 0, gm * 2, H);
    c.strokeStyle = "#B5651D";
    c.setLineDash([Math.max(4, cv.width * 0.007), Math.max(3, cv.width * 0.005)]);
    c.lineWidth = trait;
    c.beginPath();
    c.moveTo(a.cv.width - gm, 0); c.lineTo(a.cv.width - gm, H);
    c.moveTo(a.cv.width + gm, 0); c.lineTo(a.cv.width + gm, H);
    c.stroke();
  }

  /* le pli lui-meme, trait plein rouge au centre */
  c.setLineDash([]);
  c.strokeStyle = "rgba(176,32,32,.75)";
  c.lineWidth = Math.max(1.4, trait * 1.4);
  c.beginPath(); c.moveTo(a.cv.width, 0); c.lineTo(a.cv.width, H); c.stroke();
  return { url: cv.toDataURL("image/png"),
           largCm: a.largCm + b.largCm, hautCm: Math.max(a.hautCm, b.hautCm),
           face: true, g, d };
}

/* Rend la page 1 dans un canvas, sur fond blanc. */
/* ==================================================================== */
/* CACHE DE RASTERISATION                                               */
/* -------------------------------------------------------------------- */
/* Un fichier grand format porte souvent UNE image enorme : une banderole */
/* de 2 m contient un JPEG CMJN de 55 Mpx. Ce JPEG etait decode a CHAQUE  */
/* rendu — couleurs, apercu, bande de securite, nettete, vignettes — soit */
/* cinq decodages du meme visuel. Mesure sur ce fichier : 3,8 s pour le   */
/* premier rendu, contre 50 ms une fois l'image en cache.                 */
/* On rasterise donc UNE fois, au plus haut besoin, et on reechantillonne */
/* a la baisse pour tout le reste : redimensionner un canvas est          */
/* instantane, redecoder ne l'est pas.                                    */
/* ==================================================================== */
let RASTER = { buf: null, page: 0, cv: null, largCm: 0, hautCm: 0 };
function viderRaster() { RASTER = { buf: null, page: 0, cv: null, largCm: 0, hautCm: 0 }; }

function reduireDepuis(src, maxPx) {
  const k = Math.min(maxPx / src.width, maxPx / src.height, 1);
  const w = Math.max(8, Math.round(src.width * k)), h = Math.max(8, Math.round(src.height * k));
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  const ctx = cv.getContext("2d", { willReadFrequently: true });
  ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, w, h);
  ctx.drawImage(src, 0, 0, w, h);
  return { cv, ctx, w, h };
}

async function rendrePage(buffer, maxPx, noPage) {
  const np = noPage || 1;
  /* deja rasterise a une taille au moins egale : on redescend, sans redecoder */
  if (RASTER.cv && RASTER.buf === buffer && RASTER.page === np
      && Math.max(RASTER.cv.width, RASTER.cv.height) >= maxPx - 2) {
    const r = reduireDepuis(RASTER.cv, maxPx);
    return { cv: r.cv, ctx: r.ctx, w: r.w, h: r.h, largCm: RASTER.largCm, hautCm: RASTER.hautCm };
  }
  const doc = await ouvrirPdf(buffer);
  const page = await doc.getPage(np);
  const v0 = page.getViewport({ scale: 1 });
  const k = Math.min(maxPx / v0.width, maxPx / v0.height, 6);
  const vp = page.getViewport({ scale: k });
  const w = Math.max(8, Math.ceil(vp.width)), h = Math.max(8, Math.ceil(vp.height));
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  const ctx = cv.getContext("2d", { willReadFrequently: true });
  ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, w, h);
  await page.render({ canvasContext: ctx, viewport: vp }).promise;
  RASTER = { buf: buffer, page: np, cv, largCm: v0.width / PT_CM, hautCm: v0.height / PT_CM };
  return { cv, ctx, w, h, largCm: RASTER.largCm, hautCm: RASTER.hautCm };
}

/* Aperçu destiné à l'affichage. */
/* Rendu d'un coin, zoomé, avec le trait de coupe et la marge de sécurité
   TRACÉS DANS L'IMAGE. Les repères de l'écran sont des calques CSS : ils ne
   partent pas dans le PDF. Pour un BAT, il faut les cuire dans le pixel. */
function besoinRaster() {
  return Math.max(largeurUtile(1.2), Math.round(Math.sqrt(BANDE.budgetPx) * 1.6));
}

function largeurUtile(facteur) {
  const z = $("zone");
  const l = z ? z.clientWidth : 900;
  const d = Math.min(2, window.devicePixelRatio || 1);
  return Math.round(Math.max(700, Math.min(1400, l * d * (facteur || 1))));
}

async function apercu(buffer, noPage) {
  try {
    /* Rendre a la taille reellement affichee : 1400 px dans un cadre de
       500 px, c'est trois fois trop de pixels calcules pour rien. */
    const r = await rendrePage(buffer, largeurUtile(), noPage);
    return { url: r.cv.toDataURL("image/png"), largCm: r.largCm, hautCm: r.hautCm, page: noPage || 1 };
  } catch (e) {
    console.warn("aperçu indisponible :", e && e.message);
    return null;
  }
}

async function couleursDuVisuel(buffer) {
  try {
    const r = await rendrePage(buffer, 420);
    return echantillonner(r.ctx.getImageData(0, 0, r.w, r.h).data, r.w, r.h);
  } catch (e) {
    const blanc = [255, 255, 255];
    return { haut:blanc, bas:blanc, gauche:blanc, droite:blanc, dominante:blanc, uniforme:true };
  }
}

/* Transparence active : alpha, modes de fusion, masques.
   On la détecte pour informer, jamais pour la corriger. */
function transparenceDeRes(res, etat, vus, prof) {
  if (!res || prof > 8) return;
  const N = PDFLib.PDFName.of.bind(PDFLib.PDFName);
  const nom = (v) => (v && v.asString ? v.asString() : "");

  const gs = res.lookupMaybe(N("ExtGState"), PDFLib.PDFDict);
  if (gs) for (const [cle] of gs.entries()) {
    const d = gs.lookupMaybe(cle, PDFLib.PDFDict);
    if (!d) continue;
    for (const k of ["ca", "CA"]) {
      const a = d.lookupMaybe(N(k), PDFLib.PDFNumber);
      if (a && a.asNumber() < 1) etat.alpha = true;
    }
    const bm = d.get(N("BM"));
    if (bm) {
      const m = nom(bm.lookupMaybe ? bm : bm) || (bm.asString ? bm.asString() : "");
      if (m && !/Normal|Compatible/.test(m)) { etat.fusion = true; etat.modes.add(m.replace(/^\//, "")); }
    }
    const sm = d.get(N("SMask"));
    if (sm && nom(sm) !== "/None") etat.masque = true;
  }

  const xo = res.lookupMaybe(N("XObject"), PDFLib.PDFDict);
  if (xo) for (const [cle] of xo.entries()) {
    const ref = xo.get(cle);
    const marque = ref && ref.toString ? ref.toString() : String(cle);
    if (vus.has(marque)) continue;
    vus.add(marque);
    const flux = xo.lookup(cle);
    const d = flux && flux.dict ? flux.dict : null;
    if (!d) continue;
    if (d.get(N("SMask"))) etat.masque = true;
    const grp = d.lookupMaybe(N("Group"), PDFLib.PDFDict);
    if (grp && nom(grp.get(N("S"))) === "/Transparency") etat.groupe = true;
    if (nom(d.lookupMaybe(N("Subtype"), PDFLib.PDFName)) === "/Form")
      transparenceDeRes(d.lookupMaybe(N("Resources"), PDFLib.PDFDict), etat, vus, prof + 1);
  }
}

function lireTransparence(page) {
  const etat = { alpha:false, fusion:false, masque:false, groupe:false, modes:new Set() };
  try {
    const N = PDFLib.PDFName.of.bind(PDFLib.PDFName);
    const grp = page.node.lookupMaybe(N("Group"), PDFLib.PDFDict);
    if (grp) {
      const s = grp.get(N("S"));
      if (s && s.asString && s.asString() === "/Transparency") etat.groupe = true;
    }
    transparenceDeRes(page.node.Resources(), etat, new Set(), 0);
  } catch (e) {}
  etat.presente = etat.alpha || etat.fusion || etat.masque || etat.groupe;
  return etat;
}

/* Texte pâle ou en opacité réduite.
   Un texte noir posé à 25 % d'opacité reste parfaitement lisible sur un
   écran rétroéclairé, et ressort délavé sur papier. On le mesure au lieu
   de l'espérer. Densité = (1 - couche d'encre la plus faible) x opacité. */
async function analyserTexteFaible(page) {
  const O = pdfjsLib.OPS;
  const ops = await page.getOperatorList();
  let etat = { alpha: 1, rgb: [0, 0, 0], bm: "Normal" };
  const pile = [];
  const res = { mini: null, opacite: null, fusion: null, glyphesFaibles: 0, glyphesTotal: 0 };

  const densite = (e) => (1 - Math.min(e.rgb[0], e.rgb[1], e.rgb[2]) / 255) * e.alpha;
  const presqueBlanc = (e) => Math.min(e.rgb[0], e.rgb[1], e.rgb[2]) > 245;

  for (let i = 0; i < ops.fnArray.length; i++) {
    const fn = ops.fnArray[i], args = ops.argsArray[i];

    if (fn === O.save) pile.push({ ...etat, rgb: etat.rgb.slice() });
    else if (fn === O.restore) etat = pile.pop() || etat;
    else if (fn === O.setFillRGBColor) etat.rgb = [args[0], args[1], args[2]];
    else if (fn === O.setGState && Array.isArray(args[0])) {
      for (const paire of args[0]) {
        if (!Array.isArray(paire)) continue;
        const [cle, val] = paire;
        if (cle === "ca" && typeof val === "number") etat.alpha = val;
        if (cle === "BM") etat.bm = Array.isArray(val) ? String(val[0]) : String(val);
      }
    }
    else if (fn === O.showText || fn === O.showSpacedText ||
             fn === O.nextLineShowText || fn === O.nextLineSetSpacingShowText) {
      const n = Array.isArray(args[0]) ? args[0].filter(g => g && g.unicode && g.unicode.trim()).length : 1;
      if (!n) continue;
      res.glyphesTotal += n;

      /* Un texte franchement blanc est presque toujours posé sur un fond
         sombre : on ne peut pas trancher sans le fond, donc on s'abstient. */
      if (presqueBlanc(etat) && etat.alpha > 0.95) continue;

      const d = densite(etat);
      if (res.mini === null || d < res.mini) res.mini = d;
      if (etat.alpha < 0.98 && (res.opacite === null || etat.alpha < res.opacite)) res.opacite = etat.alpha;
      if (etat.bm && !/Normal|Compatible/i.test(etat.bm)) res.fusion = etat.bm.replace(/^\//, "");
      if (d < 0.35) res.glyphesFaibles += n;
    }
  }
  return res;
}

/* Analyse du texte : plus petit corps, largeur d'une lettre, et boîtes
   englobantes de chaque bloc, exprimées dans le repère de la page. */
async function analyserTexte(page) {
  const out = { corpsMin: null, largeurLettre: 0, boites: [] };
  try {
    const tc = await page.getTextContent();
    for (const it of tc.items) {
      const txt = (it.str || "").trim();
      if (!txt) continue;
      const t = it.transform;
      const corps = Math.hypot(t[2], t[3]);
      if (corps > 0.05 && (out.corpsMin === null || corps < out.corpsMin)) out.corpsMin = corps;
      const parLettre = it.width / Math.max(1, txt.length);
      if (parLettre > out.largeurLettre) out.largeurLettre = parLettre;
      const h = it.height || corps;
      out.boites.push({ x0: t[4], y0: t[5] - corps * 0.25, x1: t[4] + it.width, y1: t[5] + h * 0.78, quoi: "texte" });
    }
  } catch (e) {}
  return out;
}

/* Aucun texte et aucun logo ne doit entrer dans la zone de sécurité.
   Les visuels de fond, qui couvrent presque toute la page, en sont exclus :
   ils sont censés aller jusqu'au bord. */
function violationsZoneSecurite(boites, ref, margePt) {
  if (margePt <= 0) return { nb: 0, mini: null, quoi: [] };
  const [X0, Y0, X1, Y1] = ref;
  const aireePage = (X1 - X0) * (Y1 - Y0);
  const res = { nb: 0, mini: null, quoi: [], coupables: [] };

  for (const b of boites) {
    const aire = Math.max(0, b.x1 - b.x0) * Math.max(0, b.y1 - b.y0);
    if (b.estImage && aire > aireePage * 0.9) continue;
    const d = Math.min(b.x0 - X0, b.y0 - Y0, X1 - b.x1, Y1 - b.y1);
    if (d < margePt) {
      res.nb++;
      if (res.mini === null || d < res.mini) res.mini = d;
      if (!res.quoi.includes(b.quoi)) res.quoi.push(b.quoi);
      /* On garde la BOITE fautive, pas seulement le compte : c'est la
         mesure exacte, et c'est elle qui doit designer les vignettes. La
         sonde pixel ne sait pas distinguer un texte d'un feuillage
         decoratif, et le feuillage l'emportait au nombre de blocs. */
      const cote = (b.y1 - Y1 > -margePt) ? "haut"
                 : (Y0 - b.y0 > -margePt) ? "bas"
                 : (X0 - b.x0 > -margePt) ? "gauche" : "droite";
      res.coupables = res.coupables || [];
      res.coupables.push({ x0: b.x0, y0: b.y0, x1: b.x1, y1: b.y1,
                           quoi: b.quoi, d, cote });
    }
  }
  return res;
}

/* Plus grand format conservant les proportions du fichier et tenant dans
   une boîte donnée. La boîte est testée dans ses deux orientations, un
   panneau 240 x 120 pouvant se poser en 120 x 240. */
function plusGrandHomothetique(ratio, boiteL, boiteH) {
  if (!(ratio > 0) || !(boiteL > 0) || !(boiteH > 0)) return null;
  let best = null;
  for (const [BL, BH] of [[boiteL, boiteH], [boiteH, boiteL]]) {
    let L = BL, H = BL / ratio;
    if (H > BH) { H = BH; L = BH * ratio; }
    if (L > 0.01 && H > 0.01 && (!best || L * H > best.larg * best.haut))
      best = { larg: Math.round(L * 10) / 10, haut: Math.round(H * 10) / 10 };
  }
  return best;
}

/* Contrôles portant sur le CONTENU d'une page : polices, résolution,
   lisibilité, densité d'encre, zone de sécurité, plis, transparence.
   Appelée sur chaque page du document, pas seulement la première. */
async function controlerContenu(pageJs, pageLib, p, ctx) {
  const out = [];
  /* Un constat porte trois champs :
       t    = la CONSEQUENCE, ce que le client verra sur le papier — va partout
       cons = la CONSIGNE a l'operateur — ecran atelier + rapport atelier seulement
       mes  = la MESURE technique — entre parentheses, jamais chez le client */
  const dit = (n, t, cons, mes, code) => out.push([n, t, cons || "", mes || "", code || ""]);
  let coupables = [];
  const echelle = ctx.echelle;
  /* echelle = taille de la PAGE / taille FINALE (400 % => 4).
     Le dpi se multiplie par echelle quand on reduit (48 dpi -> 192).
     Une LONGUEUR fait l'inverse : elle se divise. Les conversions
     ci-dessous etaient inversees : sur un fichier a 400 %, la zone de
     securite etait controlee 16 fois trop large et les corps de texte
     annonces 16 fois trop gros. Invisible tant que le fichier est a 100 %. */
  const versFinalMm = (pt) => pt / echelle / 72 * 25.4;
  const versPagePt  = (mm) => mm / 25.4 * 72 * echelle;

  const polices = lirePolices(pageLib);
  const images = await lireImages(pageJs);
  /* Zero police NON incorporee ne veut pas dire « polices conformes » : ca
     peut vouloir dire qu'il n'y a AUCUN texte, tout etant aplati dans une
     image. C'est la signature d'un export Canva, d'une capture ou d'un
     visuel genere par IA. On affichait un vert sur un fichier sans texte. */
  let aTexte = false;
  try {
    const tc = await pageJs.getTextContent();
    aTexte = (tc.items || []).some((i) => (i.str || "").trim().length);
  } catch (e) { aTexte = true; }

  if (polices.length && aTexte)
    dit("ROUGE",
      `Une typographie du fichier n'est pas fournie. À l'impression elle sera remplacée par une autre : `
      + `les mots changeront d'aspect et la mise en page bougera.`,
      `Demander au client un PDF avec les polices incluses. Ne jamais vectoriser à sa place.`,
      `police manquante : ${polices.slice(0,4).join(", ")}`);
  /* Texte aplati dans l'image : c'est le mode de livraison souhaite par
     l'imprimerie, pas un defaut. Aucun constat. La variable aTexte reste
     utilisee en interne pour le controle des bords au pixel. */
  else if (!aTexte)
    dit("RELEVE", `Les textes sont aplatis dans l'image, comme demandé.`);
  else
    dit("VERT", `Les textes sortiront avec la bonne typo. Rien à installer.`);

  let ppiMesure = null;
  if (!images.length) {
    dit("VERT", "Aucune image raster : page vectorielle, résolution sans objet.");
  } else {
    const mesure = Math.min(...images.map(i => i.dpi));
    ppiMesure = mesure;
    const eff = mesure * echelle;
    const detail = Math.abs(echelle-1) > 0.005 ? ` (mesuré ${mesure.toFixed(0)} dpi, ramené au format fini)` : "";
    if (eff < p.dpi_mini - 0.5)
      dit("ROUGE",
        `L'image est trop peu définie pour ce format : elle sortira franchement floue, quelle que soit la distance de lecture.`,
        `Non récupérable automatiquement. Demander au client une image en haute définition.`,
        `${eff.toFixed(0)} dpi à taille finale${detail}, minimum ${p.dpi_mini}`);
    else if (eff < p.dpi_cible - 0.5)
      dit("ORANGE",
        `L'image est un peu juste pour ce format : les détails fins, les petits textes et les logos manqueront de piqué. `
        + `Les aplats et les photos passeront.`,
        `Imprimable avec réserve. Faire signer le bon à tirer avant de lancer.`,
        `${eff.toFixed(0)} dpi à taille finale${detail}, cible ${p.dpi_cible}`);
    else
      dit("VERT", `L'image est assez fine pour ce format : elle sortira nette.`, "",
        `${eff.toFixed(0)} dpi à taille finale, cible ${p.dpi_cible}`);
  }

  const at = await analyserTexte(pageJs);
  if (at.corpsMin !== null && p.texte_mini_mm) {
    const mm = versFinalMm(at.corpsMin), pt = at.corpsMin / echelle;
    const dist = p.classe === "P1" ? "en main" : p.classe === "P2" ? "à 1 ou 2 m" : "à 3 m et plus";
    if (mm < p.texte_mini_mm / 2)
      dit("ROUGE", `Du texte est trop petit pour être lu une fois imprimé. Il paraît correct à l'écran `
        + `uniquement parce que la page est affichée en grand.`,
        `Demander au client de grossir ce texte.`,
        `plus petit corps ${mm.toFixed(2)} mm, seuil ${p.texte_mini_mm} mm pour une lecture ${dist}`, "TEXTE_PETIT");
    else if (mm < p.texte_mini_mm)
      dit("ORANGE", `Du texte est à la limite du lisible à cette taille : il se lira difficilement sur le papier.`,
        `À signaler au client avant impression.`,
        `plus petit corps ${mm.toFixed(2)} mm, seuil ${p.texte_mini_mm} mm pour une lecture ${dist}`, "TEXTE_PETIT");
    else
      dit("VERT", `Texte lisible : le plus petit corps mesure ${mm.toFixed(2)} mm (${pt.toFixed(1)} pt) à taille finale.`);
  }

  const tf = await analyserTexteFaible(pageJs);
  if (tf.glyphesTotal > 0 && tf.mini !== null) {
    const pc = Math.round(tf.mini * 100), part = Math.round(tf.glyphesFaibles / tf.glyphesTotal * 100);
    if (tf.opacite !== null)
      dit(tf.mini < 0.15 ? "ROUGE" : "ORANGE", `Texte en opacité réduite : ${Math.round(tf.opacite*100)} % d'opacité, densité d'encre effective ${pc} %. Il paraît normal sur un écran rétroéclairé et ressortira délavé sur papier. Concerne ${part} % du texte de la page.`);
    else if (tf.mini < 0.15)
      dit("ROUGE",
        `Du texte est si pâle qu'il sera quasiment invisible sur le papier. Il se lit à l'écran, il ne se lira pas imprimé.`,
        `Demander au client de foncer ce texte.`,
        `densité d'encre ${pc} %, sur ${part} % du texte de la page`);
    else if (tf.mini < 0.35)
      dit("ORANGE",
        `Du texte est très pâle : lisible à l'écran, il ressortira délavé sur le papier.`,
        `Prévenir le client, ou lui proposer de foncer ce texte.`,
        `densité d'encre ${pc} %, sur ${part} % du texte de la page`);
    if (tf.fusion)
      dit("ORANGE", `Texte en mode de fusion ${tf.fusion}. Le rendu papier peut s'écarter fortement de l'écran.`);
  }

  /* zone de sécurité */
  const lettreMm = versFinalMm(at.largeurLettre);
  let margeMm = p.marge_secu_mm, origine = `${p.marge_secu_mm} mm`;
  if (p.famille === "SIGNALETIQUE" && lettreMm > margeMm) {
    margeMm = Math.round(lettreMm * 10) / 10;
    origine = `${margeMm} mm, soit la largeur d'une lettre du visuel`;
  }
  const boites = at.boites.concat(images.filter(i => i.boite).map(i => i.boite));

  /* DEBORDEMENT — le controle de zone de securite ecarte volontairement une
     image plus grande que la page (c'est un fond, il doit deborder). Mais
     quand le visuel ENTIER deborde, ce qui depasse est deja coupe dans le
     fichier : logo tronque, texte ampute. Personne ne le voyait. */
  let zoneKo = false;
  if (boites.length) {
    /* Ce qui depasse du trait de coupe SANS depasser la page, c'est du
       fond perdu : exactement ce qu'on demande au client. Mesurer le
       debordement sur le trait de coupe transformait un fichier bien
       prepare en defaut. La reference est la PAGE. */
    const [ZX0, ZY0, ZX1, ZY1] = ctx.refPage || ctx.refSecu;
    const enMm = versFinalMm;
    const tol = versPagePt(p.fond_perdu_mm / 2 + 1);   /* fond perdu + 1 mm */
    const d = { gauche: 0, droite: 0, haut: 0, bas: 0 };
    for (const b of boites) {
      d.gauche = Math.max(d.gauche, ZX0 - b.x0);
      d.droite = Math.max(d.droite, b.x1 - ZX1);
      d.bas    = Math.max(d.bas,    ZY0 - b.y0);
      d.haut   = Math.max(d.haut,   b.y1 - ZY1);
    }
    const debord = Object.keys(d).filter((c) => d[c] > tol);
    if (debord.length) {
      const pire = Math.max.apply(null, debord.map((c) => d[c]));
      const detail = debord.map((c) => `${enMm(d[c]) >= 10 ? (enMm(d[c])/10).toFixed(1) + " cm" : enMm(d[c]).toFixed(0) + " mm"} `
        + ({ gauche: "à gauche", droite: "à droite", haut: "en haut", bas: "en bas" })[c]).join(", ");
      if (!aTexte)
        dit("ROUGE",
          `Le visuel est plus grand que la page : ce qui dépasse est déjà coupé dans le fichier et ne sera pas `
          + `imprimé. Un logo ou du texte est probablement amputé sur les bords.`,
          `Le visuel a été composé pour un autre format. Demander le fichier d'origine, ou faire reprendre la mise en page.`,
          `dépasse de ${detail}`, "DEBORD");
      else
        dit("ORANGE",
          `Des éléments dépassent de la page : ce qui dépasse ne sera pas imprimé.`,
          `Vérifier qu'aucun élément important n'est concerné.`, `dépasse de ${detail}`);
      if (enMm(pire) > p.marge_secu_mm) zoneKo = true;

      /* COHERENCE DE CADRAGE — du contenu coupe d'un cote pendant qu'il
         reste du vide de l'autre : le visuel n'est pas centre dans sa page.
         Un simple decalage recupere une partie de ce qui est perdu. */
      const enc = ctx.bandePixel && ctx.bandePixel.encre;
      if (enc) {
        const oppose = { gauche: "droite", droite: "gauche", haut: "bas", bas: "haut" };
        const nom = { gauche: "à gauche", droite: "à droite", haut: "en haut", bas: "en bas" };
        for (const c of debord) {
          const vide = enMm(enc[oppose[c]] || 0);
          if (vide > 3) {
            dit("ORANGE",
              `Le visuel n'est pas centré dans sa page : il est coupé ${nom[c]} alors qu'il reste du vide ${nom[oppose[c]]}.`,
              `Le décaler récupère une partie de ce qui est perdu, sans rien déformer ni réduire. `
              + `À faire avant toute autre correction.`,
              `${vide >= 10 ? (vide/10).toFixed(1) + " cm" : vide.toFixed(0) + " mm"} de vide ${nom[oppose[c]]}`);
            break;
          }
        }
      }
    }
  }

  if (margeMm > 0) {
    const margePt = versPagePt(margeMm);
    const v = violationsZoneSecurite(boites, ctx.refSecu, margePt);
    if (v.nb) {
      zoneKo = true;
      /* remonte les coupables jusqu'a l'affichage : ils designeront les
         vignettes a montrer, a la place des blocs de la sonde pixel */
      coupables = (v.coupables || []).slice().sort((a, b2) => a.d - b2.d);
      const dMm = versFinalMm(Math.max(0, v.mini));
      /* Sans fond perdu, la piece est coupee a la main et non au massicot :
         le risque d'entamer est faible. Annoncer un rognage serait mentir.
         Ce qui reste vrai, c'est le confort visuel et la fixation. */
      if (p.fond_perdu_mm > 0)
        dit("ORANGE",
          `Du texte ou un logo arrive tout au bord, en ${v.quoi.join(" et ")}. La coupe n'étant jamais parfaite `
          + `au millimètre, il pourra être entamé sur une partie du tirage.`,
          `Prévenir le client. Il faut au moins ${origine} de marge.`,
          `au plus près : ${dMm.toFixed(1)} mm du bord`, "SECU");
      else
        dit("NOTE",
          `Du texte ou un logo arrive à ${dMm.toFixed(0)} mm du bord, en ${v.quoi.join(" et ")}. `
          + `Sur ce support la coupe est faite à la main : le risque de l'entamer est faible. `
          + `En revanche, si près du bord, il se remarque, et il peut passer sous une fixation ou un œillet.`,
          `Marge conseillée : ${origine}. À signaler si la pose est contrainte.`,
          `au plus près : ${dMm.toFixed(1)} mm du bord`, "SECU");
    } else if (!aTexte && ctx.bandePixel) {
      /* fichier aplati : aucun objet a mesurer, on regarde les pixels */
      const bp = ctx.bandePixel;
      const cotes = Object.keys(bp.cotes).filter((c) => bp.cotes[c] > 0);
      if (bp.structure >= 3 && cotes.length) {
        zoneKo = true;
        const ou = cotes.map((c) => ({ haut: "en haut", bas: "en bas", gauche: "à gauche", droite: "à droite" })[c]);
        dit(p.fond_perdu_mm > 0 ? "ORANGE" : "NOTE",
          p.fond_perdu_mm > 0
          ? `Du texte ou un trait fin arrive tout au bord du visuel, ${ou.join(" et ")}. La coupe n'étant jamais `
            + `parfaite au millimètre, il pourra être entamé sur une partie du tirage.`
          : `Du texte ou un trait fin arrive tout au bord du visuel, ${ou.join(" et ")}. Sur ce support la coupe `
            + `est faite à la main : le risque de l'entamer est faible, mais si près du bord il se remarque.`,
          `Tout est aplati dans l'image : la distance exacte n'est pas mesurable. Vérifier à l'œil ci-dessous. `
          + `Il faut au moins ${origine} de marge.`,
          `détecté au pixel sur le bord`);
      } else {
        dit("VERT", `Rien d'important ne touche le bord : rien ne sera coupé.`, "",
          `vérifié sur l'image, marge de ${origine}`);
      }
    } else if (!aTexte && images.length) {
      dit("NOTE", `Le bord du visuel n'a pas pu être vérifié automatiquement.`,
        `Tout est aplati dans l'image et le fichier est trop lourd pour être examiné. À regarder à l'œil avant de lancer.`,
        `analyse pixel non réalisable`);
    } else if (!boites.length) {
      dit("VERT", `Aucun texte ni logo dans la page : rien ne peut être coupé.`, "", `marge de ${origine}`);
    } else {
      dit("VERT", `Rien d'important ne touche le bord : rien ne sera coupé.`, "", `marge de sécurité ${origine}`);
    }
  }

  /* ---- gouttiere : le bord interieur disparait dans la reliure ----
     Page impaire : elle est a DROITE de la double page, son bord interieur
     est a gauche. Page paire : l'inverse. La marge y est plus exigeante que
     sur les bords exterieurs, le pli mange quelques millimetres. */
  if (ctx.cahier && p.marge_secu_mm > 0 && boites.length) {
    const besoin = margeAuPli(p);
    const seuil = versPagePt(besoin);
    const [GX0, , GX1] = ctx.refSecu;
    const interGauche = (ctx.noPage % 2) === 1;
    let mini = null;
    for (const bo of boites) {
      if (bo.estImage) continue;
      const d = interGauche ? (bo.x0 - GX0) : (GX1 - bo.x1);
      if (mini === null || d < mini) mini = d;
    }
    if (mini !== null && mini < seuil) {
      const mm = versFinalMm(Math.max(0, mini));
      dit("ORANGE",
        `Du texte ou un logo arrive à ${mm.toFixed(0)} mm du pli, `
        + `${interGauche ? "sur le bord gauche" : "sur le bord droit"} de cette page. `
        + `C'est le côté qui part dans la reliure : ce qui est si près devient difficile à lire, `
        + `voire disparaît quand on ouvre la brochure.`,
        `Il faut ${besoin} mm côté pli, soit ${(besoin - p.marge_secu_mm).toFixed(0)} mm de plus que sur les bords extérieurs. `
        + `Demander au client de reculer ce contenu.`,
        `au plus près : ${mm.toFixed(1)} mm du pli`, "GOUTTIERE");
    } else if (mini !== null) {
      dit("VERT", `Rien ne tombe dans la reliure : le contenu reste à bonne distance du pli.`, "",
        `marge au pli ${besoin} mm`);
    }
  }

  /* plis */
  const pl = analyserPlis(p, ctx.refSecu, boites, echelle);
  if (pl) dit(pl.niveau, pl.texte);

  const tr = lireTransparence(pageLib);
  if (tr.presente) {
    const quoi = [];
    if (tr.alpha) quoi.push("opacité partielle");
    if (tr.fusion) quoi.push("modes de fusion (" + [...tr.modes].join(", ") + ")");
    if (tr.masque) quoi.push("masques");
    if (!quoi.length && tr.groupe) quoi.push("groupe de transparence");
    dit("NOTE", `Le fichier contient des effets de transparence. Nos machines les gèrent : rien à faire.`,
      `À aplatir seulement si le fichier part chez un sous-traitant.`, `${quoi.join(", ")}`);
  }

  return { constats: out, ppiMesure, at, margeMm, zoneKo, coupables };
}

/* Volets d'un dépliant. Le PDF ne contient aucune information de pli :
   le découpage vient du référentiel. On contrôle les deux conventions de
   montage à la fois, l'écart entre elles n'étant que de quelques mm. */
function analyserPlis(p, ref, boites, echelle) {
  if (!p.plis) return null;
  const m = String(p.plis).match(/^([A-Z0-9]+):(.+)$/);
  if (!m) return null;
  const volets = m[2].split(",").map(Number).filter(v => v > 0);
  if (volets.length < 2) return null;

  const margePt = (p.marge_pli_mm || 5) / 25.4 * 72 * echelle;
  const X0 = ref[0], X1 = ref[2];
  const largeurPt = X1 - X0;
  const totalMm = volets.reduce((a, b) => a + b, 0);
  const k = largeurPt / (totalMm / 10 / 2.54 * 72);

  const positions = new Set();
  for (const sens of [volets, [...volets].reverse()]) {
    let c = 0;
    for (let i = 0; i < sens.length - 1; i++) {
      c += sens[i];
      positions.add(X0 + c / 10 / 2.54 * 72 * k);
    }
  }

  let touches = 0, mini = null;
  for (const b of boites) {
    if (b.estImage && (b.x1-b.x0)*(b.y1-b.y0) > largeurPt*(ref[3]-ref[1])*0.9) continue;
    for (const x of positions) {
      if (b.x0 < x + margePt && b.x1 > x - margePt) {
        touches++;
        const d = Math.min(Math.abs(b.x0 - x), Math.abs(b.x1 - x));
        if (mini === null || d < mini) mini = d;
        break;
      }
    }
  }

  const listeVolets = volets.join(" / ") + " mm";
  if (!boites.length) return { niveau: "VERT", texte: `Plis à ${listeVolets} : aucun contenu à vérifier sur cette page.` };
  if (!touches) return { niveau: "VERT", texte: `Plis respectés : volets de ${listeVolets}, aucun texte ni logo à moins de ${p.marge_pli_mm || 5} mm d'une ligne de pli.` };
  const dMm = (mini || 0) / echelle / 72 * 25.4;
  return { niveau: "ORANGE", texte: `Marge de pli non respectée : ${touches} élément${touches>1?"s":""} chevauche${touches>1?"nt":""} une ligne de pli ou passe${touches>1?"nt":""} à ${dMm.toFixed(1)} mm, pour ${p.marge_pli_mm || 5} mm requis. Volets de ${listeVolets}. Un texte à cheval sur un pli devient illisible.` };
}

/* ------------------------------------------------------------------ */
/* Décision                                                            */
/* ------------------------------------------------------------------ */
async function controler(buffer, p, dims, orientation) {
  const pourLib = new Uint8Array(buffer.slice(0));
  const constats = [];
  let verdict = "VERT", proposition = null;
  const rang = { VERT:0, ORANGE:1, ROUGE:2 };
  /* Le code est un identifiant STABLE. L'atelier de correction lisait le
     texte des constats en expression reguliere : reformuler une phrase
     desactivait silencieusement une correction. */
  const codes = new Set();
  const dire = (n, t, cons, mes, code) => { constats.push([n, t, cons || "", mes || "", code || ""]);
    if (code) codes.add(code);
    if (rang[n] > rang[verdict]) verdict = n; };

  const doc = await ouvrirPdf(buffer);
  const page = await doc.getPage(1);
  const nbPages = doc.numPages;
  const images = await lireImages(page);
  /* Fait objectif, independant de la mesure de nettete : une page sans
     aucune image ne contient que des traces. La detection passait par la
     mesure, qui echoue quand il y a trop peu d'echantillons — une banderole
     portant un mot et un trait n'a pas 15 blocs de texte a analyser, et se
     retrouvait annoncee « non mesurable » au lieu de « vectorielle ». */
  const sansRaster = images.length === 0;
  progres(58, "boîtes et images");

  const lib = await PDFLib.PDFDocument.load(pourLib, { updateMetadata:false, ignoreEncryption:true });
  const pl = lib.getPage(0);
  const b = lireBoites(pl);
  const polices = lirePolices(pl);

  const refPage = b.trim || b.media || [0,0,page.view[2],page.view[3]];
  const ref = refPage;
  let lp = Math.abs(ref[2]-ref[0]) / PT_CM;
  let hp = Math.abs(ref[3]-ref[1]) / PT_CM;
  const rot = ((page.rotate || 0) % 360 + 360) % 360;
  if (rot === 90 || rot === 270) { const t = lp; lp = hp; hp = t; }

  let fp = null;
  if (b.trim) {
    const env = b.bleed || b.media;
    if (env) fp = Math.min(b.trim[0]-env[0], b.trim[1]-env[1], env[2]-b.trim[2], env[3]-b.trim[3]) / PT_CM * 10;
  }

  let echelle = 1, horsMachine = false, ratioKo = false, boiteForcee = null;
  const tol = p.tolerance_mm / 10;
  const saisie = !!(dims && dims.larg > 0 && dims.haut > 0);
  const regle = saisie ? "FIXE" : p.regle_dim;
  /* Le format cible PERMUTE avec l'orientation commandée : sans cela, le
     contrôle mesure le fichier contre un gabarit que l'opérateur ne
     regarde plus. */
  const fc0 = formatCible(p, saisie ? dims : null, orientation);
  const cl0 = fc0 ? fc0.larg : (saisie ? dims.larg : p.larg_cm);
  const ch0 = fc0 ? fc0.haut : (saisie ? dims.haut : p.haut_cm);

  /* L'orientation voulue vient, dans l'ordre : du référentiel quand il
     l'impose, des dimensions saisies, du choix de l'opérateur. */
  const orientVoulue =
      (p.orientation && p.orientation !== "LIBRE") ? p.orientation
    : (p.dim_saisie === "OUI" && saisie) ? (ch0 >= cl0 ? "PORTRAIT" : "PAYSAGE")
    : (orientation && orientation !== "LIBRE") ? orientation
    : saisie ? (ch0 >= cl0 ? "PORTRAIT" : "PAYSAGE")
    : p.orientation;

  /* Un fichier livré au format fini PLUS le fond perdu est un fichier correct,
     même sans TrimBox. Sans cette reconnaissance, une carte 9,4 x 5,9 tomberait
     dans la tolérance de proportions et l'outil proposerait de la réduire à
     9 x 5,5, ce qui supprimerait le fond perdu. */
  const fpTotalCm = p.fond_perdu_mm / 10;
  let fpIntegre = false, pageL = lp, pageH = hp;
  if (!b.trim && fpTotalCm > 0 && cl0 && ch0 && regle === "FIXE") {
    const variantes = [[cl0 + fpTotalCm, ch0 + fpTotalCm]];
    if (orientVoulue === "LIBRE") variantes.push([ch0 + fpTotalCm, cl0 + fpTotalCm]);
    for (const [vl, vh] of variantes) {
      if (Math.abs(lp - vl) <= tol && Math.abs(hp - vh) <= tol) {
        fpIntegre = true;
        lp = vl - fpTotalCm; hp = vh - fpTotalCm;
        fp = p.fond_perdu_mm / 2;
        break;
      }
    }
  }

  /* Une seule phrase, dans l'ordre ou l'operateur raisonne : ce qu'il a
     recu, puis ce que ca donnera. Pas deux dimensions collees par une
     virgule, pas de « page physique », pas de « format fini » en tete. */
  let pageAffL = lp, pageAffH = hp, pageExcedentaire = null;
  if (b.trim && b.media) {
    const mL = Math.abs(b.media[2]-b.media[0]) / PT_CM, mH = Math.abs(b.media[3]-b.media[1]) / PT_CM;
    if (Math.abs(mL - lp) > 0.02 || Math.abs(mH - hp) > 0.02) {
      pageAffL = mL; pageAffH = mH;
      /* Une page beaucoup plus grande que le format fini n'est pas du fond perdu :
         c'est un recto verso monté côte à côte, ou un visuel posé sur une feuille. */
      const attenduL = lp + fpTotalCm, attenduH = hp + fpTotalCm;
      if (mL * mH > attenduL * attenduH * 1.35) pageExcedentaire = { mL, mH };
    }
  } else if (fpIntegre) {
    pageAffL = pageL; pageAffH = pageH;
  }

  const memeFormat = cl0 > 0 && ch0 > 0
    && Math.abs(lp - cl0) <= 0.15 && Math.abs(hp - ch0) <= 0.15;
  /* Le fichier attendu n'est PAS le format fini : il porte le fond perdu.
     Une carte de visite finie 9 x 5.5 se livre en 9.4 x 5.9. */
  const attL = cl0 + fpTotalCm, attH = ch0 + fpTotalCm;
  const coupe = Math.abs(pageAffL - lp) > 0.02 || Math.abs(pageAffH - hp) > 0.02;

  let releve = `Le client a envoyé ${nbPages > 1 ? nbPages + " pages de" : "une page de"} `
             + `${pageAffL.toFixed(1)} × ${pageAffH.toFixed(1)} cm`;
  releve += coupe
    ? `, qui ${nbPages > 1 ? "donneront" : "donnera"} ${lp.toFixed(1)} × ${hp.toFixed(1)} cm une fois ${nbPages > 1 ? "coupées" : "coupée"}.`
    : (fpTotalCm > 0 ? `. Il n'y a pas de marge de coupe autour.` : `.`);
  if (cl0 > 0 && ch0 > 0 && !memeFormat)
    releve += ` La commande est un ${cl0} × ${ch0} cm`
            + (fpTotalCm > 0 ? ` : le fichier devrait faire ${attL.toFixed(1)} × ${attH.toFixed(1)} cm, marge de coupe comprise.`
                             : `, sans marge de coupe.`);
  constats.push(["RELEVE", releve]);
  if (pageExcedentaire)
    dire("ORANGE",
      `La page est bien plus grande que le produit : seul ce qui est à l'intérieur des traits de coupe sera imprimé, `
      + `le reste sera perdu.`,
      `Souvent un recto et un verso posés côte à côte, ou un visuel placé sur une feuille plus grande. `
      + `À confirmer avec le client avant de lancer.`,
      `page de ${pageExcedentaire.mL.toFixed(1)} × ${pageExcedentaire.mH.toFixed(1)} cm pour un produit de ${lp.toFixed(1)} × ${hp.toFixed(1)} cm`);

  if (saisie) {
    dire("VERT", `Dimensions commandées : ${cl0} × ${ch0} cm fini`
      + (fpTotalCm > 0 ? `, fichier attendu ${(cl0+fpTotalCm).toFixed(1)} × ${(ch0+fpTotalCm).toFixed(1)} cm avec le fond perdu.` : ", sans fond perdu.")); 
    if (p.larg_max_cm && p.haut_max_cm) {
      const tient = (cl0 <= p.larg_max_cm && ch0 <= p.haut_max_cm) || (cl0 <= p.haut_max_cm && ch0 <= p.larg_max_cm);
      if (!tient) { horsMachine = true; dire("ROUGE", `Le format demandé dépasse ce que la machine sait produire : il ne peut pas être fabriqué en une seule pièce.`,
        `Proposer un format plus petit, ou un montage en plusieurs lés.`, `maximum ${p.larg_max_cm} × ${p.haut_max_cm} cm`); }
    }
  }

  if (regle === "FIXE" && cl0 && ch0) {
    const cand = [[cl0, ch0]];
    if (orientVoulue === "LIBRE") cand.push([ch0, cl0]);
    let best = null;
    for (const [cl, ch] of cand) {
      const er = Math.abs((lp/hp) - (cl/ch)) / (cl/ch);
      const f = ((lp/cl) + (hp/ch)) / 2;
      if (!best || er < best.er) best = { er, f, cl, ch };
    }
    if (Math.abs(lp-best.cl) <= tol && Math.abs(hp-best.ch) <= tol) {
      /* Un vert « bonne taille » a cote d'un orange « pas de marge de coupe »
         se contredisent pour l'operateur : le fichier attendu fait le format
         fini PLUS la marge. Tant qu'elle manque, la taille n'est pas bonne. */
      /* La marge de coupe manquante est deja dite par le constat de fond
         perdu, plus bas : deux oranges pour le meme defaut brouillent la
         lecture. Ici on constate seulement la taille finie. */
      const margeKo = fpTotalCm > 0 && !fpIntegre && !b.trim;
      if (margeKo)
        constats.push(["RELEVE", `La taille une fois coupé est la bonne (${best.cl} × ${best.ch} cm). `
          + `Avec la marge de coupe, le fichier devrait faire ${(best.cl+fpTotalCm).toFixed(1)} × ${(best.ch+fpTotalCm).toFixed(1)} cm.`, "", ""]);
      else
        dire("VERT", `Bonne taille : le fichier fait ${best.cl} × ${best.ch} cm une fois coupé`
          + (fpTotalCm > 0 ? `, avec la marge de coupe autour (${(best.cl+fpTotalCm).toFixed(1)} × ${(best.ch+fpTotalCm).toFixed(1)} cm au total)` : "") + `.`);
    } else if (best.er <= TOL_RATIO) {
      echelle = best.f;
      dire("ORANGE",
        `Le fichier n'est pas à la bonne taille, mais ses proportions sont bonnes : il suffit de le réduire ou `
        + `de l'agrandir, rien ne sera déformé.`,
        `Mise à l'échelle automatique vers ${best.cl} × ${best.ch} cm ci-dessous.`,
        `fichier à ${(best.f*100).toFixed(0)} % du format fini`, "ECHELLE");
    } else {
      ratioKo = true;
      dire("ROUGE",
        `Le fichier n'a pas la forme du produit commandé : il est trop large ou trop haut. Le mettre à la taille `
        + `voulue déformerait le visuel, et le recadrer couperait une partie de la composition.`,
        `Remontage nécessaire. Vérifier avec le client qu'il ne s'est pas trompé de produit ou de fichier.`,
        `${lp.toFixed(1)} × ${hp.toFixed(1)} cm reçu contre ${best.cl} × ${best.ch} cm attendu`, "RATIO");
    }
  } else if (regle === "MAXI") {
    const ok = (lp <= p.larg_max_cm+tol && hp <= p.haut_max_cm+tol) || (lp <= p.haut_max_cm+tol && hp <= p.larg_max_cm+tol);
    if (!ok) { ratioKo = true; boiteForcee = { l: p.larg_max_cm, h: p.haut_max_cm, motif: "la limite machine", adoptable: p.dim_saisie === "OUI" }; }
    dire(ok ? "VERT" : "ROUGE", ok
      ? `Dimensions dans les limites machine (max ${p.larg_max_cm} × ${p.haut_max_cm} cm).`
      : `Format supérieur au maximum réalisable (${p.larg_max_cm} × ${p.haut_max_cm} cm).`);
  } else if (regle === "MINI") {
    const ko = cl0 && (lp < cl0-tol || hp < ch0-tol);
    dire(ko ? "ORANGE" : "VERT", ko
      ? `Format inférieur au mini de ${cl0} × ${ch0} cm. À confirmer avec le client.`
      : "Dimensions au-dessus du mini.");
  } else if (regle === "PLAGE") {
    const ko = lp < cl0-tol || hp < ch0-tol || lp > p.larg_max_cm+tol || hp > p.haut_max_cm+tol;
    if (ko) { ratioKo = true; boiteForcee = { l: p.larg_max_cm, h: p.haut_max_cm, motif: "le format maximum du produit", adoptable: p.dim_saisie === "OUI" }; }
    dire(ko ? "ROUGE" : "VERT", ko
      ? `Format hors plage (${cl0} × ${ch0} cm mini, ${p.larg_max_cm} × ${p.haut_max_cm} cm maxi).`
      : "Dimensions dans la plage autorisée.");
  } else {
    dire("VERT", "Dimension libre pour ce produit, pas de contrôle de format.");
  }

  /* orientation */
  if (orientVoulue === "PORTRAIT" || orientVoulue === "PAYSAGE") {
    const reelle = hp >= lp ? "PORTRAIT" : "PAYSAGE";
    if (reelle !== orientVoulue) {
      const raison = saisie ? "les dimensions commandées imposent"
        : p.orientation !== "LIBRE" ? "le produit impose" : "la commande impose";
      dire("ORANGE",
      `Le fichier est en ${reelle.toLowerCase()} alors que le produit est en ${orientVoulue.toLowerCase()}. `
      + `Une simple rotation suffit, rien n'est perdu.`,
      `Rotation automatique possible ci-dessous.`, `${raison} le ${orientVoulue.toLowerCase()}`, "ORIENT");
    }
  }

  /* ------------------------------------------------------------------
     Contrôle du contenu, page par page. L'ancienne version n'analysait
     que la première : sur un dépliant recto verso ou une brochure, tout
     le reste passait au travers.
     ------------------------------------------------------------------ */
  const MAX_PAGES = 40;
  const PAGES_NETTETE = 8;
  const nbAnalyse = Math.min(nbPages, MAX_PAGES);
  const fpBordPt = (p.fond_perdu_mm / 2) / 25.4 * 72;
  const refSecuDe = (boites) => {
    if (boites.trim) return boites.trim;
    const base = boites.media || ref;
    return fpIntegre ? [base[0]+fpBordPt, base[1]+fpBordPt, base[2]-fpBordPt, base[3]-fpBordPt] : base;
  };

  const parPage = new Map();
  let ppiMesure = null, at = { corpsMin: null, largeurLettre: 0, boites: [] };
  let coupablesP1 = [];
  let bandeP1 = null;
  let margeMm = p.marge_secu_mm, zoneKo = false, formatsHeterogenes = null;

  for (let i = 1; i <= nbAnalyse; i++) {
    const pageI = i === 1 ? page : await doc.getPage(i);
    const libI = i === 1 ? pl : lib.getPage(i - 1);
    const bI = i === 1 ? b : lireBoites(libI);
    const refI = bI.trim || bI.media || ref;

    if (i > 1) {
      /* On compare les pages ENTRE ELLES, pas a `lp`. Quand le fond perdu
         est reconnu comme integre, `lp` a ete ramene au format fini — 29,7
         au lieu de 30,1 — et toutes les pages suivantes, mesurees en
         dimensions de page, paraissaient d'un autre format. Un depliant
         recto verso parfaitement homogene etait declare heterogene. */
      const lI = Math.abs(refI[2]-refI[0]) / PT_CM, hI = Math.abs(refI[3]-refI[1]) / PT_CM;
      const lRef = Math.abs(ref[2]-ref[0]) / PT_CM, hRef = Math.abs(ref[3]-ref[1]) / PT_CM;
      const pivot = (rot === 90 || rot === 270);
      const l0 = pivot ? hRef : lRef, h0 = pivot ? lRef : hRef;
      if (Math.abs(lI - l0) > 0.15 || Math.abs(hI - h0) > 0.15)
        formatsHeterogenes = `page ${i} en ${lI.toFixed(1)} × ${hI.toFixed(1)} cm`;
    }

    const refSecuI = refSecuDe(bI);
    let bandePixel = null;
    if (i === 1 && p.marge_secu_mm > 0) {
      try { bandePixel = await zoneSecuriteAuPixel(buffer, refSecuI, p.marge_secu_mm / 25.4 * 72 * echelle, 1); }
      catch (e) { bandePixel = null; }
      bandeP1 = bandePixel;
    }
    progres(60 + Math.round(14 * i / nbAnalyse), nbAnalyse > 1 ? `page ${i} sur ${nbAnalyse}` : "contenu de la page");
    const res = await controlerContenu(pageI, libI, p, {
      echelle, refSecu: refSecuI,
      refPage: bI.media || refSecuI,       /* pour le debordement reel */
      noPage: i, cahier: estCahier(p, nbPages),
      bandePixel });
    if (i === 1) { ppiMesure = res.ppiMesure; at = res.at; margeMm = res.margeMm; zoneKo = res.zoneKo;
                   coupablesP1 = res.coupables || []; }
    else { zoneKo = zoneKo || res.zoneKo; }

    for (const [n, t, cons, mes, code] of res.constats) {
      if (nbAnalyse > 1 && n === "VERT") continue;          // on ne répète pas les OK page par page
      const cle = n + "|" + t.split(" : ")[0];
      if (!parPage.has(cle)) parPage.set(cle, { niveau: n, texte: t, cons, mes, code, pages: [] });
      parPage.get(cle).pages.push(i);
    }
  }

  /* Un même défaut présent sur dix pages ne doit pas produire dix lignes. */
  const plage = (nums) => {
    const seq = [];
    for (const n of nums) {
      const d = seq[seq.length - 1];
      if (d && n === d[1] + 1) d[1] = n; else seq.push([n, n]);
    }
    return seq.map(([a, z]) => a === z ? `${a}` : `${a} à ${z}`).join(", ");
  };
  for (const { niveau, texte, cons, mes, code, pages } of parPage.values()) {
    let suffixe = "";
    if (nbAnalyse > 1)
      suffixe = pages.length === nbAnalyse ? `  [toutes les pages]`
              : `  [page${pages.length > 1 ? "s" : ""} ${plage(pages)}]`;
    if (niveau === "NOTE" || niveau === "RELEVE") constats.push([niveau, texte + suffixe, cons, mes, code]);
    else dire(niveau, texte + suffixe, cons, mes, code);
  }

  if (nbAnalyse > 1) {
    const pires = constats.filter(([n]) => n === "ROUGE" || n === "ORANGE").length;
    if (!pires) dire("VERT", `Contenu contrôlé sur les ${nbAnalyse} pages : aucun défaut relevé.`);
    else dire("VERT", `Contenu contrôlé sur les ${nbAnalyse} pages.`);
  }
  if (nbPages > MAX_PAGES)
    dire("ORANGE", `Le fichier compte ${nbPages} pages : les pages au-delà de la ${MAX_PAGES}e n'ont pas été vérifiées.`,
      `À contrôler à l'œil si le tirage est important.`, "");
  if (formatsHeterogenes)
    dire("ROUGE", `Les pages du fichier n'ont pas toutes la même taille : elles ne pourront pas être imprimées ni coupées ensemble.`,
      `Demander au client un fichier dont toutes les pages sont au même format.`,
      `${formatsHeterogenes} contre ${(Math.abs(ref[2]-ref[0])/PT_CM).toFixed(1)} × `
      + `${(Math.abs(ref[3]-ref[1])/PT_CM).toFixed(1)} cm en page 1`);


  /* proposition de format quand la commande ne peut pas être honorée */
  if (horsMachine || ratioKo) {
    const ratio = lp / hp;
    const boite = boiteForcee ? boiteForcee
      : (horsMachine && p.larg_max_cm && p.haut_max_cm)
        ? { l: p.larg_max_cm, h: p.haut_max_cm, motif: "la limite machine", adoptable: true }
        : { l: cl0, h: ch0,
            motif: saisie ? "les dimensions commandées" : "le format du produit",
            adoptable: saisie || p.dim_saisie === "OUI" };
    const prop = boite.l && boite.h ? plusGrandHomothetique(ratio, boite.l, boite.h) : null;
    if (prop && (Math.abs(prop.larg - lp) > 0.15 || Math.abs(prop.haut - hp) > 0.15)) {
      const k = prop.larg / lp;
      const bouts = [];
      if (ppiMesure !== null) {
        const d = ppiMesure / k;
        bouts.push(`résolution ${d.toFixed(0)} dpi` + (d < p.dpi_mini ? " (sous le mini)" : d < p.dpi_cible ? " (sous la cible)" : ""));
      }
      if (at.corpsMin !== null) {
        const mmT = at.corpsMin * k / 72 * 25.4;
        bouts.push(`plus petit texte ${mmT.toFixed(1)} mm` + (mmT < p.texte_mini_mm ? " (sous le seuil)" : ""));
      }
      proposition = { larg: prop.larg, haut: prop.haut, adoptable: boite.adoptable };
      const chute = boite.adoptable
        ? "Adopter ce format renseigne les dimensions et relance le contrôle. Pour occuper toute la surface commandée, il faudrait un recadrage du visuel chez l'infographiste."
        : `Le format du produit ne change pas : le visuel sera centré dans ${cl0} × ${ch0} cm et le pourtour comblé par la couleur de ses bords. Pour remplir tout le format, il faudrait un recadrage chez l'infographiste.`;
      dire("ORANGE", `${boite.adoptable ? "Format réalisable proposé" : "Surface occupée par le visuel"} : ${prop.larg} × ${prop.haut} cm. C'est le plus grand format conservant les proportions du fichier et tenant dans ${boite.motif}. ${bouts.length ? `À ce format : ${bouts.join(", ")}. ` : ""}${chute}`);
    }
  }

  /* fond perdu */
  const fpBord = p.fond_perdu_mm / 2;
  if (fpBord > 0) {
    const attendu = `${p.fond_perdu_mm} mm au format, soit ${fpBord} mm par bord`;
    if (fpIntegre)
      dire("VERT", `La couleur déborde bien du trait de coupe : pas de liséré blanc sur les bords.`, "",
        `${fpBord} mm par bord`);
    else if (!b.trim)
      dire("ORANGE",
      `La couleur du visuel s'arrête pile au trait de coupe. La coupe n'étant jamais parfaite, un liséré blanc `
      + `apparaîtra sur un ou plusieurs bords — et il se voit immédiatement, surtout sur fond sombre.`,
      `Ajout automatique possible ci-dessous.`,
      `marge de coupe attendue : ${attendu}` + (cl0 > 0 && ch0 > 0
        ? ` — le fichier devrait faire ${(cl0+fpTotalCm).toFixed(1)} × ${(ch0+fpTotalCm).toFixed(1)} cm` : ""), "FP_ABSENT");
    else if (fp === null || fp < fpBord - 0.25)
      dire("ORANGE",
      `La couleur ne déborde pas assez du trait de coupe : un liséré blanc peut apparaître sur un ou plusieurs bords.`,
      `Ajout automatique possible ci-dessous.`,
      `${(fp||0).toFixed(1)} mm par bord présent, ${fpBord} mm requis`, "FP_INSUF");
    else if (pageExcedentaire)
      dire("VERT", `La couleur déborde bien du trait de coupe : pas de liséré blanc sur les bords.`, "",
        `au moins ${fp.toFixed(1)} mm par bord`);
    else
      dire("VERT", `La couleur déborde bien du trait de coupe : pas de liséré blanc sur les bords.`, "",
        `${fp.toFixed(1)} mm par bord`);
  }

  /* pagination */
  const nb = nbPages;
  if (p.pages === "RECTO" && nb > 1)
    dire("ORANGE",
      `Ce produit s'imprime au recto seul, mais le fichier contient ${nb} pages : `
      + `seule la première sera imprimée, les autres seront perdues.`,
      `À confirmer avec le client : s'il attend un verso, ce n'est pas le bon produit.`,
      `${nb} pages fournies pour 1 attendue`, "RECTOSEUL");
  else if (p.pages === "RECTO" && nb === 1)
    dire("VERT", `Une seule page, comme attendu : ce produit s'imprime au recto seul.`, "", "recto seul");
  /* Un depliant ou une brochure livre en recto seul n'est pas une variante :
     c'est un fichier incomplet. L'imprimer donnerait un verso blanc, que le
     client n'a pas commande et ne decouvrirait qu'a la livraison. */
  else if (p.pages === "RV_OBLIGATOIRE" && nb < 2)
    dire("ROUGE",
      `Ce produit s'imprime obligatoirement en recto verso, et le fichier ne contient qu'une seule page : `
      + `il n'y a pas de verso à imprimer. Le lancer donnerait un dos entièrement blanc.`,
      `Le verso doit être la deuxième page du même fichier. Le demander au client avant de lancer.`,
      `1 page fournie pour 2 attendues`, "RECTOSEUL");
  else if (p.pages === "MULTIPLE4" && nb < 4)
    dire("ROUGE",
      `Une brochure s'imprime obligatoirement en recto verso, et se monte par feuilles pliées en deux : `
      + `il faut au moins 4 pages. Le fichier n'en contient que ${nb}`
      + `${nb === 1 ? " : c'est un recto seul, il n'y a rien à relier" : ""}.`,
      `Demander au client le fichier complet, pages blanches comprises.`,
      `${nb} page${nb > 1 ? "s" : ""} fournie${nb > 1 ? "s" : ""} pour 4 au minimum`, "RECTOSEUL");
  else if (p.pages === "MULTIPLE4" && nb % 4 !== 0)
    dire("ROUGE",
      `Une brochure se monte par feuilles pliées en deux : il faut un nombre de pages multiple de 4. `
      + `Avec ${nb} pages, le cahier ne peut pas être assemblé — il manque ${4 - nb % 4} page`
      + `${(4 - nb % 4) > 1 ? "s" : ""} pour aller à ${nb + (4 - nb % 4)}.`,
      `Demander au client d'ajouter les pages manquantes, pages blanches comprises.`,
      `${nb} pages fournies`, "PAGES4");
  else if (p.pages === "MULTIPLE4" && nb >= 4)
    dire("VERT", `Le compte tombe juste : ${nb} pages, soit ${nb / 4} feuille${nb / 4 > 1 ? "s" : ""} `
      + `pliée${nb / 4 > 1 ? "s" : ""} en deux.`, "",
      `imposition en cahier piqué, ${nb / 2} faces à imprimer`);
  else if (p.pages === "RV_OBLIGATOIRE" && nb === 2)
    dire("VERT", "Recto et verso fournis dans un seul fichier de 2 pages.", "", "recto verso complet");
  else if (p.pages === "RV_LIBRE" && nb === 1)
    dire("VERT", `Une seule page : le produit sera imprimé au recto seul, le verso restera vierge.`,
      "", "recto seul, admis sur ce produit");
  else if (p.pages === "RV_LIBRE" && nb === 2)
    dire("VERT", `Deux pages : le produit sera imprimé recto verso.`, "", "recto verso");
  /* Trou silencieux : un recto verso livre en 4 pages ne declenchait aucun
     constat. Le fichier partait en production avec deux pages ignorees. */
  else if (p.pages === "RV_OBLIGATOIRE" && nb > 2)
    dire("ROUGE", `Ce produit s'imprime en recto verso, soit 2 pages. Le fichier en contient ${nb} : `
      + `seules les deux premières seront imprimées, les autres seront perdues.`,
      `Vérifier avec le client quelles pages il veut. S'il s'agit d'un dépliant à plusieurs volets, `
      + `c'est un autre produit.`, `${nb} pages fournies pour 2 attendues`);
  else if (p.pages === "RV_LIBRE" && nb > 2)
    dire("ORANGE", `Ce produit s'imprime au recto ou en recto verso, soit 2 pages au maximum. `
      + `Le fichier en contient ${nb} : les suivantes ne seront pas imprimées.`,
      `À confirmer avec le client.`, `${nb} pages fournies`);



  /* ---- oeillets : ce qui passe dessous disparait ---- */
  try {
    const oe = posOeillets(p, dims);
    if (oe && at && at.boites && at.boites.length) {
      /* les positions sont des fractions du produit : on les projette sur la
         boite du fichier, quelle que soit son echelle */
      const [ZX0, ZY0, ZX1, ZY1] = refPage;
      const LP = ZX1 - ZX0, HP = ZY1 - ZY0;
      const rGarde = (OEILLETS.diamMm / 2 + OEILLETS.gardeMm) / 10 / oe.largCm * LP;
      const touches = [];
      for (const pt of oe.pts) {
        const cx = ZX0 + oe.fx(pt) * LP, cy = ZY1 - oe.fy(pt) * HP;
        for (const bo of at.boites) {
          if (bo.estImage) continue;
          if (bo.x1 > cx - rGarde && bo.x0 < cx + rGarde
           && bo.y1 > cy - rGarde && bo.y0 < cy + rGarde) { touches.push(pt); break; }
        }
      }
      if (touches.length)
        dire("ORANGE",
          `${touches.length === 1 ? "Un œillet tombe" : touches.length + " œillets tombent"} sur du texte ou un logo. `
          + `L'œillet perce le support : ce qui est dessous disparaît, et le pourtour est plaqué contre le mur.`,
          `Décaler le contenu, ou convenir avec le client d'une autre position d'œillets.`,
          `${oe.nb} œillets au total`, "OEILLET");
      else
        dire("VERT", `Les ${oe.nb} œillets ne tombent sur rien d'important.`, "",
          `pose directe dans le support, sans ourlet`);
    }
  } catch (e) { /* sans consequence sur le reste du controle */ }

  const orig = (ORIGINE && ORIGINE.type === "image") ? ORIGINE : null;

  /* ---- ce qui ne peut pas etre verifie sur une image ---- */
  if (orig) {
    dire("ORANGE",
      `Le client a envoyé une image de ${orig.pxL} × ${orig.pxH} pixels, soit `
      + `${(() => { const d = dimClient(true); return d ? d.cm : "—"; })()} telle qu'elle s'ouvre `
      + `dans un logiciel — pas un fichier d'impression. Une image ne porte ni trait de `
      + `coupe, ni texte : la marge de coupe et les couleurs ne peuvent pas être vérifiées, et aucun texte ne `
      + `pourra être corrigé.`,
      `C'est la commande qui fixe le format : ${orig.cibleL} × ${orig.cibleH} cm. `
      + `La prochaine fois, demander un PDF (dans Canva : Télécharger, puis PDF pour impression).`,
      `${orig.genre.toUpperCase()} ${orig.pxL} × ${orig.pxH} px`);

    const jp = jugerProportions(orig.pxL, orig.pxH, orig.cibleL, orig.cibleH);
    const pcEcart = (jp.ecart * 100).toFixed(0);
    if (jp.cas === "conforme")
      dire("VERT", `L'image a exactement la forme du produit commandé : elle remplira le format sans bande vide ni recadrage.`);
    else if (jp.cas === "rotation")
      dire("ORANGE",
        `L'image est en ${orig.pxL > orig.pxH ? "paysage" : "portrait"} alors que le produit est en `
        + `${orig.cibleL > orig.cibleH ? "paysage" : "portrait"}. Les proportions sont bonnes : une simple rotation suffit, rien n'est perdu.`,
        `Faire pivoter avant de lancer.`, "");
    else {
      const bandeCm = Math.abs(orig.cibleL - orig.cibleH * (orig.pxL / orig.pxH));
      const bande = bandeCm > 0.05
        ? `Placée sans déformation, elle laisse environ ${(bandeCm * 10).toFixed(0)} mm de vide au total sur un axe. `
        : "";
      if (jp.cas === "approchant")
        dire("ORANGE", `Proportions approchantes : ${pcEcart} % d'écart avec le format commandé. ${bande}`
          + `Deux issues, au choix du client : bandes vides conservées, ou recadrage — qui coupera une partie du visuel.`);
      else
        dire("ROUGE", `Proportions incompatibles : ${pcEcart} % d'écart avec le format commandé. `
          + `Ni le recadrage ni les bandes vides ne donneront un résultat présentable. `
          + `Vérifier avec le client qu'il ne s'est pas trompé de fichier ou de produit.`);
    }

    if (!orig.icc)
      constats.push(["NOTE", `Aucun profil colorimétrique dans l'image : la conversion vers l'encre se fera à l'estime. `
        + `Bleus vifs, verts saturés et orangés sont les plus exposés.`]);
    if (orig.cmjn)
      constats.push(["NOTE", `JPEG déclaré CMJN (marqueur Adobe). Rendu à surveiller sur l'aperçu.`]);
    if (Math.max(orig.pxL, orig.pxH) <= 1600)
      dire("ORANGE",
        `L'image est très petite : c'est probablement une copie dégradée, passée par une messagerie qui l'a `
        + `recompressée. L'imprimer reviendrait à imprimer une photocopie de photocopie.`,
        `Demander l'original en pièce jointe Document, jamais en photo.`,
        `${orig.pxL} × ${orig.pxH} px`);
  }

  progres(80, "structure du fichier");
  /* ---- sondes structurelles : des faits, pas des estimations ---- */
  try {
    const sd = sondesStructure(lib);

    if (sd.surimpression) {
      const blancs = images.length === 0 || sd.imagesGris > 0;
      dire("ORANGE",
        `Le fichier demande d'imprimer certains éléments « par-dessus ». Si l'un d'eux est blanc, il disparaîtra `
        + `complètement au tirage au lieu de recouvrir ce qui est dessous — invisible à l'écran, invisible sur un BAT écran.`,
        `Vérifier les éléments blancs du fichier avant de lancer.`, `surimpression déclarée`);
    }
    if (sd.calquesRepere.length)
      dire("ROUGE",
        `Les repères du gabarit n'ont pas été enlevés du fichier : les traits de coupe et les pointillés `
        + `s'imprimeront sur le produit fini.`,
        `Demander au client d'exporter sans le calque de repères.`,
        `calque : « ${sd.calquesRepere.join(" », « ")} »`);
    else if (sd.calques.length)
      constats.push(["NOTE", `Fichier à calques (${sd.calques.length}`
        + (sd.calquesMasques.length ? `, dont ${sd.calquesMasques.length} masqué${sd.calquesMasques.length > 1 ? "s" : ""} à l'ouverture` : "")
        + `). Ce qui est masqué à l'écran peut être imprimé selon le RIP : ${sd.calques.slice(0, 4).join(", ")}.`]);

    if (sd.imagesRVB && !sd.imagesCMJN)
      dire("ORANGE",
        `Les couleurs sont réglées pour l'écran, pas pour l'encre. À l'impression, les bleus vifs, les verts et `
        + `les orangés paraîtront plus ternes qu'à l'écran.`,
        `Réglage par défaut de Canva. Prévenir le client avant de lancer.`,
        `${sd.imagesRVB} image(s) en RVB, aucune en CMJN`, "RVB");
    else if (sd.imagesRVB && sd.imagesCMJN)
      constats.push(["NOTE", `Espaces couleur mélangés : ${sd.imagesRVB} image(s) RVB et ${sd.imagesCMJN} CMJN. `
        + `Rendu à surveiller sur l'aperçu.`]);

    if (sd.champs)
      dire("ORANGE",
        `Le fichier contient des champs de formulaire : ce qui a été saisi dedans peut ne pas s'imprimer.`,
        `Demander au client un PDF aplati.`, `${sd.champs} champ(s)`);
    else if (sd.annotations)
      constats.push(["NOTE", `${sd.annotations} annotation${sd.annotations > 1 ? "s" : ""} (commentaire, tampon, lien). `
        + `Certaines s'impriment, d'autres non, selon le RIP.`]);
  } catch (e) {
    constats.push(["NOTE", "Sondes structurelles indisponibles sur ce fichier."]);
  }

  progres(86, "netteté du visuel");
  /* Sur un fichier lourd, la mesure de nettete peut couter plusieurs
     secondes par page. Elle ne pilote AUCUN verdict : c'est une NOTE
     d'information. On la saute au-dela d'un seuil, et on le dit — mieux
     vaut un dépôt rapide et une ligne honnête qu'une attente de dix
     secondes pour un chiffre indicatif. */
  const LOURD_MPX = 24;
  const mpx = (b.media ? (b.media[2] - b.media[0]) * (b.media[3] - b.media[1]) : 0) / 72 / 72 * 300 * 300 / 1e6;
  const tropLourd = mpx > LOURD_MPX || (nbPages > 8);
  if (tropLourd) {
    constats.push(["NOTE", `Netteté non mesurée : le fichier est trop lourd pour cette mesure `
      + `(${Math.round(mpx)} Mpx à 300 dpi${nbPages > 8 ? `, ${nbPages} pages` : ""}). `
      + `C'est une information, pas un contrôle : aucun verdict n'en dépend. `
      + `Juger à l'œil sur l'aperçu.`]);
  }
  /* ---- nettete reelle : mesure seule, aucun verdict a ce stade ----
     Multipage : un depliant recto verso dont seul le verso est agrandi
     passerait au vert si on ne mesurait que la page 1. On retient la page
     la PIRE parmi celles mesurees, et le rapport dit laquelle.
     Plafond a PAGES_NETTETE : la mesure coute 60 a 750 ms par page. */
  let nettete = null;
  try {
    let mesures = [];
    if (tropLourd) throw new Error("mesure sautée");
    if (orig) {
      mesures.push(Object.assign({ page: 1 },
        await mesurerNettete(null, null, echelle, 1,
          { g: orig.gris, W: orig.W, H: orig.H, recadre: orig.recadre })));
    } else {
      const nbNet = Math.min(nbPages, PAGES_NETTETE);
      for (let i = 1; i <= nbNet; i++) {
        const pgI = i === 1 ? page : await doc.getPage(i);
        const imgI = i === 1 ? images : await lireImages(pgI);
        const dpiI = imgI.length ? Math.min.apply(null, imgI.map((x) => x.dpi)) : null;
        mesures.push(Object.assign({ page: i },
          await mesurerNettete(buffer, dpiI, echelle, i, null)));
      }
    }
    /* la pire page exploitable fait foi ; a defaut, la page 1 pour le detail */
    const utiles = mesures.filter((m) => m.exploitable);
    nettete = utiles.length
      ? utiles.reduce((a, m) => (m.bordTexte > a.bordTexte ? m : a))
      : mesures[0];
    nettete.pagesMesurees = mesures.length;
    nettete.pagesExploitables = utiles.length;
    nettete.detailPages = mesures.map((m) => ({
      page: m.page, bordTexte: m.bordTexte, bordPhoto: m.bordPhoto,
      exploitable: m.exploitable, motif: m.motif,
    }));
    const surPage = mesures.length > 1
      ? ` Mesure sur ${mesures.length} page${mesures.length > 1 ? "s" : ""}`
        + (utiles.length ? `, page ${nettete.page} retenue comme la moins nette` : ", aucune exploitable")
        + (nbPages > PAGES_NETTETE ? ` (document de ${nbPages} pages, ${PAGES_NETTETE} premières mesurées)` : "")
        + "."
      : "";
    const nb = `${nettete.blocsTexte} bloc${nettete.blocsTexte > 1 ? "s" : ""} de texte, ${nettete.blocsPhoto} de photo`
             + (nettete.blocsDenses ? `, ${nettete.blocsDenses} écarté${nettete.blocsDenses > 1 ? "s" : ""} (QR, code-barres ou trame)` : "");
    const ou = nettete.voie === "natif" ? "pixels natifs de l'image"
             : `rendu à ${(nettete.echelleRendu * 72).toFixed(0)} dpi`
               + (nettete.plafonne ? ", plafonné" : "") + (nettete.recadre ? `, ${nettete.fenetres} fenêtres` : "");
    if (nettete.bordTexte === null) {
