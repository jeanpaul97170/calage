      constats.push(["NOTE", `Netteté : mesure non concluante, ${nb}. Il en faut au moins ${NETTETE.blocsMin} pour que la médiane ait un sens (${ou}, ${nettete.ms} ms).${surPage}`]);
    } else {
      let t = `Netteté du texte : les contours s'étalent sur ${nettete.bordTexte.toFixed(1)} pixel${nettete.bordTexte >= 2 ? "s" : ""}`;
      if (nettete.bordPhoto !== null) t += `, et sur ${nettete.bordPhoto.toFixed(1)} pixels dans les images`;
      t += `. Repère : un fichier net tourne autour de 1 à 1,5 ; au-delà de 3, le rendu sera mou. `
         + `C'est une mesure, pas un verdict : elle est affichée pour information.`;
      constats.push(["NOTE", t + surPage]);
      if (bandeP1 && bandeP1.encre) {
        const e = bandeP1.encre, cm = (pt) => (pt / echelle / 72 * 25.4);
        constats.push(["NOTE", `Emprise réelle du visuel : blancs de `
          + `${cm(e.gauche).toFixed(0)} mm à gauche, ${cm(e.droite).toFixed(0)} à droite, `
          + `${cm(e.haut).toFixed(0)} en haut, ${cm(e.bas).toFixed(0)} en bas. `
          + `C'est sur cette emprise, et non sur les bords du fichier, que le `
          + `recentrage est calculé.`, "", ""]);
      }
      if (nettete.exploitable && nettete.ecartPhotoTexte !== null
          && nettete.ecartPhotoTexte >= 2 && nettete.blocsPhoto >= 25)
        constats.push(["NOTE", `Écart photo / texte de ${nettete.ecartPhotoTexte.toFixed(2)} px : les textes sont nets, une ou plusieurs images le sont nettement moins. Mesure informative.`]);
    }
  } catch (e) {
    constats.push(["NOTE", "Netteté : mesure indisponible sur ce fichier (" + (e && e.message ? e.message : "erreur de rendu") + ")."]);
  }

  if (p.note) constats.push(["NOTE", p.note]);

  return { verdict, constats, lp, hp, fp, echelle, trim: !!b.trim, margeMm, zoneKo, proposition, ratioKo, fpIntegre, orientVoulue, nettete, bande: bandeP1, coupables: coupablesP1, sansRaster, codes };
}

/* ------------------------------------------------------------------ */
/* Signature : le plan de coupe, à l'échelle                           */
/* ------------------------------------------------------------------ */
function planDeCoupe(r, p, dims) {
  const rd = (v) => Math.round(v * 10) / 10;
  const saisie = !!(dims && dims.larg > 0 && dims.haut > 0);
  /* Le plan de coupe dessine le format COMMANDE, orientation comprise. */
  const fcPC = formatCible(p, saisie ? dims : null);
  const cibleL = rd(fcPC ? fcPC.larg : r.lp);
  const cibleH = rd(fcPC ? fcPC.haut : r.hp);
  const maxDim = Math.max(cibleL, cibleH, r.lp, r.hp);
  const W = 620, H = 300, marge = 46;
  const k = Math.min((W-marge*2)/maxDim, (H-marge*2)/maxDim);

  const rect = (l, h, cls, attrs) => {
    const w = l*k, ht = h*k;
    return `<rect x="${(W-w)/2}" y="${(H-ht)/2}" width="${w}" height="${ht}" ${attrs}/>`;
  };

  // repères de coupe aux angles du format cible
  const w = cibleL*k, h = cibleH*k, x0 = (W-w)/2, y0 = (H-h)/2, d = 13, e = 5;
  let reperes = "";
  for (const [cx, cy, sx, sy] of [[x0,y0,-1,-1],[x0+w,y0,1,-1],[x0,y0+h,-1,1],[x0+w,y0+h,1,1]]) {
    reperes += `<line x1="${cx+sx*e}" y1="${cy}" x2="${cx+sx*(e+d)}" y2="${cy}" stroke="#8a8a8a" stroke-width="1"/>`;
    reperes += `<line x1="${cx}" y1="${cy+sy*e}" x2="${cx}" y2="${cy+sy*(e+d)}" stroke="#8a8a8a" stroke-width="1"/>`;
  }

  const couleur = r.verdict === "ROUGE" ? "#B02020" : r.verdict === "ORANGE" ? "#B5651D" : "#1E7A46";

  let plis = "";
  const bp = bandesDePli(p, 0);
  if (bp && Math.abs(bp.total / 10 - cibleL) < 0.5) {
    const gx = (mm) => x0 + (mm / 10) * k;
    for (const b of bp.bandes) {
      plis += `<rect x="${gx(b.x0)}" y="${y0}" width="${gx(b.x1) - gx(b.x0)}" height="${h}" fill="#CC2A2A" fill-opacity="0.16"/>`;
      for (const a of b.axes)
        plis += `<line x1="${gx(a)}" y1="${y0 - 6}" x2="${gx(a)}" y2="${y0 + h + 6}" stroke="#CC2A2A" stroke-width="1" stroke-dasharray="3 3"/>`;
    }
    let d = 0;
    for (const v of bp.volets) {
      plis += `<text x="${gx(d + v/2)}" y="${y0 + h - 7}" text-anchor="middle" fill="#CC2A2A" font-family="IBM Plex Mono, monospace" font-size="9">${v}</text>`;
      d += v;
    }
  }

  return `
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Plan de coupe comparant le fichier reçu au format commandé">
    ${rect(cibleL, cibleH, "", 'fill="none" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="5 4"')}
    ${reperes}
    ${rect(r.lp, r.hp, "", `fill="${couleur}" fill-opacity="0.12" stroke="${couleur}" stroke-width="1.5"`)}
    ${plis}
    ${r.margeMm > 0 && cibleL > r.margeMm/5 ? rect(cibleL - r.margeMm/5, cibleH - r.margeMm/5, "",
        `fill="none" stroke="${r.zoneKo ? "#B5651D" : "#8a8a8a"}" stroke-width="1" stroke-dasharray="2 3" opacity="${r.zoneKo ? 0.9 : 0.5}"`) : ""}
    <text x="${W/2}" y="${(H-cibleH*k)/2 - 22}" text-anchor="middle" fill="#8a8a8a"
          font-family="IBM Plex Mono, monospace" font-size="11">
      COMMANDÉ ${cibleL} × ${cibleH} cm
    </text>
    <text x="${W/2}" y="${(H+cibleH*k)/2 + 30}" text-anchor="middle" fill="${couleur}"
          font-family="IBM Plex Mono, monospace" font-size="11">
      REÇU ${r.lp.toFixed(1)} × ${r.hp.toFixed(1)} cm${Math.abs(r.echelle-1)>0.005 ? `  ·  ${(r.echelle*100).toFixed(0)} %` : ""}
    </text>
  </svg>
  <div class="legende">
    <span><i class="sw" style="border-color:#8a8a8a;border-top-style:dashed"></i>format commandé</span>
    <span><i class="sw" style="border-color:${couleur}"></i>fichier reçu</span>
    ${r.margeMm > 0 ? `<span><i class="sw" style="border-color:${r.zoneKo ? "#B5651D" : "#8a8a8a"};border-top-style:dotted"></i>zone de sécurité ${r.margeMm} mm</span>` : ""}
    <span>${p.fond_perdu_mm > 0 ? `fond perdu ${r.trim ? (r.fp||0).toFixed(1)+" mm/bord mesuré" : "non déclaré"} · requis ${p.fond_perdu_mm/2} mm/bord` : "sans fond perdu · zone de sécurité seule"}</span>
  </div>`;
}

/* ------------------------------------------------------------------ */
/* Corrections géométriques                                            */
/*                                                                     */
/* Ne touchent jamais aux pixels. On repositionne, on met à l'échelle,  */
/* on déclare les boîtes. Aucun rééchantillonnage, aucune invention     */
/* d'information : ce qui entre en pixels ressort en pixels.            */
/* ------------------------------------------------------------------ */
const MM = (mm) => mm * 72 / 25.4;
const RGB = (c) => PDFLib.rgb(c[0]/255, c[1]/255, c[2]/255);

/* Repere d'oeillet dans le fichier d'impression : cercle au diametre exact
   de la perforation, plus une petite croix de centrage. Trait de 0,25 pt.
   Ce qui n'est pas retire par le poinconnage passe sous la rondelle, donc
   rien ne reste visible sur le produit fini. Pas de cercle de garde. */
function marquerOeillets(pg, oeil, tx, ty, trimL, trimH) {
  const mmPt = 72 / 25.4;
  const rp = OEILLETS.diamMm / 2 * mmPt;
  const croix = 2.2 * mmPt;
  const noir = PDFLib.rgb(0, 0, 0);
  for (const pt of oeil.pts) {
    const cx = tx + oeil.fx(pt) * trimL;
    const cy = ty + trimH - oeil.fy(pt) * trimH;
    pg.drawCircle({ x: cx, y: cy, size: rp, borderWidth: 0.25, borderColor: noir, opacity: 0 });
    pg.drawLine({ start: { x: cx - croix, y: cy }, end: { x: cx + croix, y: cy }, thickness: 0.25, color: noir });
    pg.drawLine({ start: { x: cx, y: cy - croix }, end: { x: cx, y: cy + croix }, thickness: 0.25, color: noir });
  }
}

/* Marquage des oeillets sur un fichier qu'on ne corrige pas.
   Un fichier conforme partait sans ses reperes : le nommage etait la, les
   oeillets non. Ici la geometrie n'est pas touchee, on ajoute seulement les
   traces, dans la TrimBox si elle existe, sinon dans la page. */
async function marquerSeul(buffer, p, dims) {
  const oeil = posOeillets(p, dims);
  if (!oeil) return null;
  const doc = await PDFLib.PDFDocument.load(new Uint8Array(buffer.slice(0)), { ignoreEncryption: true });
  for (const pg of doc.getPages()) {
    const { width, height } = pg.getSize();
    let tx = 0, ty = 0, tl = width, th = height;
    try {
      const t = pg.getTrimBox();
      if (t && t.width > 0 && t.height > 0) { tx = t.x; ty = t.y; tl = t.width; th = t.height; }
    } catch (e) { /* pas de TrimBox : on prend la page */ }
    marquerOeillets(pg, oeil, tx, ty, tl, th);
  }
  const o = await doc.save();
  return { octets: o, nb: oeil.nb };
}

async function corriger(buffer, p, opt, couleurs, dims) {
  const src = await PDFLib.PDFDocument.load(new Uint8Array(buffer.slice(0)), { ignoreEncryption:true });
  const oeil = posOeillets(p, dims);

  /* Le fond perdu est déjà dans le fichier : on ne touche à rien, on se
     contente de déclarer les boîtes. Aucune mise à l'échelle, aucun
     repositionnement, le contenu reste octet pour octet à sa place. */
  if (opt.boitesSeules) {
    const d = MM(p.fond_perdu_mm / 2);
    const jrn = [`Traits de coupe déclarés à ${p.fond_perdu_mm / 2} mm des bords. Le visuel n'a pas été touché.`];
    for (const pg of src.getPages()) {
      const { width, height } = pg.getSize();
      pg.setMediaBox(0, 0, width, height);
      pg.setBleedBox(0, 0, width, height);
      pg.setTrimBox(d, d, width - 2*d, height - 2*d);
      pg.setArtBox(d, d, width - 2*d, height - 2*d);
      if (opt.oeillets && oeil)
        marquerOeillets(pg, oeil, d, d, width - 2*d, height - 2*d);
    }
    if (opt.oeillets && oeil) jrn.push(`Emplacement des ${oeil.nb} œillets marqué sur le fichier.`);
    return { octets: await src.save(), journal: jrn };
  }

  const out = await PDFLib.PDFDocument.create();
  const pages = await out.embedPdf(src, src.getPageIndices());

  const journal = [];
  const bleed = opt.fondPerdu ? MM(p.fond_perdu_mm / 2) : 0;   // valeur du référentiel = total, donc moitié par bord
  const marge = opt.margeSecu > 0 ? MM(opt.margeSecu) : 0;
  const blanc = [255, 255, 255];
  const c = opt.remplissage === "blanc"
    ? { haut:blanc, bas:blanc, gauche:blanc, droite:blanc, dominante:blanc, uniforme:true }
    : couleurs;

  const pagesSrc = src.getPages();
  for (let iP = 0; iP < pages.length; iP++) {
    const emb = pages[iP];
    const srcL = emb.width, srcH = emb.height;
    /* Si la page source déclare déjà un trait de coupe, c'est LUI le format
       fini, pas la page entière. Sans ça, une carte livrée en 9,4 x 5,9 avec
       sa TrimBox à 9 x 5,5 se retrouvait réduite à 9 x 5,5 puis re-margée :
       le visuel perdait 4 % et le fond perdu d'origine était écrasé. */
    let bsrc = null;
    try { bsrc = lireBoites(pagesSrc[iP]); } catch (e) { bsrc = null; }
    const trimSrc = (bsrc && bsrc.trim) ? bsrc.trim : null;
    /* Garde-fou : ne jamais pivoter un fichier dont le sens correspond deja
       a celui du produit. Une case restee cochee d'une correction a l'autre
       faisait tourner un portrait sur un produit portrait. */
    const sensSrc = srcH >= srcL ? "PORTRAIT" : "PAYSAGE";
    const fcC = formatCible(p, (dims && dims.larg > 0 && dims.haut > 0) ? dims : null,
                            opt.orientationCible);
    const sensCible = fcC ? (fcC.haut >= fcC.larg ? "PORTRAIT" : "PAYSAGE") : null;
    const pivote = opt.orientation && !(sensCible && sensSrc === sensCible);
    const effL = pivote ? srcH : srcL;
    const effH = pivote ? srcL : srcH;

    /* format fini visé */
    let trimL, trimH;
    const saisie = !!(dims && dims.larg > 0 && dims.haut > 0);
    if (opt.miseAuFormat && (saisie || p.regle_dim === "FIXE")) {
      const portrait = effH >= effL;
      /* fcC porte deja la permutation demandee : sur un produit dont le sens
         est impose ou commande, il n'y a plus rien a deviner ici. */
      const cl = fcC ? fcC.larg : (saisie ? dims.larg : p.larg_cm);
      const ch = fcC ? fcC.haut : (saisie ? dims.haut : p.haut_cm);
      const libre = !saisie && orientationEffective(p, opt.orientationCible) === "LIBRE";
      [trimL, trimH] = (libre && portrait !== (ch >= cl)) ? [MM(ch*10), MM(cl*10)] : [MM(cl*10), MM(ch*10)];
    } else {
      [trimL, trimH] = [effL, effH];
    }

    const pageL = trimL + 2*bleed, pageH = trimH + 2*bleed;

    /* Le visuel n'est jamais étiré dans le fond perdu : il garde ses
       proportions et sa taille de format fini, moins la marge demandée.
       Le vide créé autour est comblé par la couleur des bords du visuel. */
    let k, pageLf = pageL, pageHf = pageH;
    /* La mise a l'echelle sur la TrimBox source ne vaut QUE si le produit a
       du fond perdu : elle laisse volontairement deborder la page pour
       conserver le fond perdu d'origine. Sur un produit sans fond perdu
       (kakemono, banderole, roll-up), ce debordement faisait une page plus
       grande que le format commande : 61,6 x 160 au lieu de 60 x 160.
       Dans ce cas le visuel doit simplement tenir dans le format. */
    if (trimSrc && marge === 0 && bleed > 0) {
      /* On met à l'échelle le TRAIT DE COUPE source vers le format fini
         voulu. Le fond perdu déjà présent suit la même échelle. */
      const tL = Math.abs(trimSrc[2] - trimSrc[0]), tH = Math.abs(trimSrc[3] - trimSrc[1]);
      const effTL = pivote ? tH : tL, effTH = pivote ? tL : tH;
      k = Math.min(trimL / effTL, trimH / effTH);
      pageLf = Math.max(trimL + 2*bleed, effL*k);
      pageHf = Math.max(trimH + 2*bleed, effH*k);
    } else {
      const viseL = trimL - 2*marge, viseH = trimH - 2*marge;
      k = Math.min(viseL/effL, viseH/effH);
    }
    const posL = effL*k, posH = effH*k;
    let ox = (pageLf - posL)/2, oy = (pageHf - posH)/2;

    /* CENTRAGE SUR LE VISUEL, PAS SUR LA PAGE.
       Centrer la page ne centre pas l'encre : un export Canva a souvent
       des blancs inegaux autour du dessin, et le produit fini sort
       decale. On rattrape le decalage mesure sur les pixels, borne pour
       ne jamais pousser du contenu hors du format. */
    if (opt.centrerVisuel && opt.encre && !pivote) {
        const e = opt.encre;
        /* Ce qu'on centre, c'est l'ENCRE dans le format fini, pas la page.
           Le decalage utile est la moitie de l'ecart entre les deux blancs
           opposes. Il se borne par ces blancs eux-memes : on peut glisser
           de tout le blanc disponible d'un cote, jamais plus, sinon on
           pousserait du visuel hors du format.
           Borner par l'espace libre de la PAGE, comme je le faisais, donnait
           zero des que le visuel remplissait le format : la correction ne
           s'appliquait jamais. */
        const g = e.gauche * k, d = e.droite * k;
        const hh = e.haut * k, bb = e.bas * k;
        const bx = Math.max(-g, Math.min(d, (d - g) / 2));
        const by = Math.max(-bb, Math.min(hh, (hh - bb) / 2));
        ox += bx; oy += by;
        if (Math.abs(bx) > 1 || Math.abs(by) > 1)
          journal.push(`Visuel recentre dans le format : `
            + `${Math.abs(bx) > 1 ? (Math.abs(bx)/72*25.4).toFixed(1) + " mm horizontalement " : ""}`
            + `${Math.abs(by) > 1 ? (Math.abs(by)/72*25.4).toFixed(1) + " mm verticalement" : ""}`.trim() + ".");
    }

    const pg = out.addPage([pageLf, pageHf]);
    pg.drawRectangle({ x:0, y:0, width:pageLf, height:pageHf, color: RGB(c.dominante) });

    if (!c.uniforme && (bleed > 0 || marge > 0)) {
      const bandes = [
        [0, oy + posH, pageLf, pageHf - (oy + posH), c.haut],
        [0, 0, pageLf, oy, c.bas],
        [0, oy, ox, posH, c.gauche],
        [ox + posL, oy, pageLf - (ox + posL), posH, c.droite],
      ];
      for (const [x, y, w, h, col] of bandes)
        if (w > 0.5 && h > 0.5) pg.drawRectangle({ x, y, width:w, height:h, color: RGB(col) });
    }

    if (pivote) pg.drawPage(emb, { x: ox+posL, y: oy, xScale:k, yScale:k, rotate: PDFLib.degrees(90) });
    else pg.drawPage(emb, { x: ox, y: oy, xScale:k, yScale:k });

    pg.setMediaBox(0, 0, pageLf, pageHf);
    pg.setBleedBox(0, 0, pageLf, pageHf);
    const tx = (pageLf - trimL) / 2, ty = (pageHf - trimH) / 2;
    pg.setTrimBox(tx, ty, trimL, trimH);
    pg.setArtBox(tx + marge, ty + marge, trimL - 2*marge, trimH - 2*marge);

    /* Reperes d'oeillets dans le fichier d'impression.
       Trace au diametre exact de la perforation : le repere est retire par
       le poinconnage et ce qu'il en reste passe sous la rondelle. Pas de
       cercle de garde, pas de pointille : rien qui doive rester visible. */
    if (opt.oeillets && oeil) marquerOeillets(pg, oeil, tx, ty, trimL, trimH);
  }

  const nomCouleur = opt.remplissage === "blanc" ? "en blanc"
    : c.uniforme ? "par la couleur dominante du visuel"
    : "par les couleurs relevées sur chaque bord du visuel";

  if (opt.oeillets && oeil)
    journal.push(`Emplacement des ${oeil.nb} œillets marqué sur le fichier.`);
  if (opt.orientation) journal.push("Rotation de 90° pour respecter l'orientation du produit.");
  if (opt.miseAuFormat) {
    const d = formatCible(p, dims && dims.larg > 0 ? dims : null, opt.orientationCible)
           || { larg: p.larg_cm, haut: p.haut_cm };
    journal.push(`Mise à l'échelle vers le format fini ${d.larg} × ${d.haut} cm.`);
  }
  if (bleed > 0) journal.push(`Fond perdu ajouté sans étirement : ${p.fond_perdu_mm / 2} mm par bord, soit ${p.fond_perdu_mm} mm au format. Comblé ${nomCouleur}. TrimBox et BleedBox déclarées.`);
  if (marge > 0) journal.push(`Marge de sécurité de ${opt.margeSecu} mm dégagée, comblée ${nomCouleur}.`);
  if (!journal.length) journal.push("Boîtes de page redéclarées, contenu inchangé.");

  return { octets: await out.save(), journal };
}

/* pdf-lib écrit en WinAnsi : on ramène la typographie fine à du Latin-1. */
/* ==================================================================== */
/* DOCUMENTS PDF — generateur reecrit                                   */
/* -------------------------------------------------------------------- */
/* Regle unique : on RESERVE la hauteur d'un bloc avant de dessiner, ce  */
/* qui renvoie le haut du bloc. Rien n'est dessine ailleurs qu'entre ce  */
/* haut et le nouveau curseur, et le saut de page est automatique.       */
/* L'ancien generateur decrementait le curseur PUIS dessinait vers le    */
/* bas : chaque bloc mordait sur le suivant.                             */
/* Mise en page verifiee hors navigateur sur un BAT reel : 2 pages,      */
/* 45 blocs de texte, ZERO chevauchement, rien sous le pied de page.     */
/* ==================================================================== */
const DOC_C = {
  rouge: "#CC2A2A", noir: "#1A1A1A", gris: "#6B6B6B", trait: "#D8D8D8",
  fondg: "#F5F5F7", orange: "#B5651D", cut: "#B02020", fondo: "#FCF4E8",
};
const DOC_R = (h) => { const n = parseInt(h.slice(1), 16);
  return PDFLib.rgb((n >> 16 & 255)/255, (n >> 8 & 255)/255, (n & 255)/255); };

/* pdf-lib refuse les caracteres hors WinAnsi : on les remplace plutot que
   de laisser le document echouer a la generation. */
function wa2(t) {
  return String(t === null || t === undefined ? "" : t)
    .replace(/[\u0152]/g, "OE").replace(/[\u0153]/g, "oe")
    .replace(/[\u2018\u2019]/g, "'").replace(/[\u201C\u201D]/g, '"')
    .replace(/[\u2013\u2014]/g, "-").replace(/\u2026/g, "...")
    .replace(/[^\x00-\xFF]/g, "");
}

async function poserDocument(doc, d, reg, gras) {
  const A4 = [595.28, 841.89], M = 48, L = A4[0] - 2 * M;
  const BAS = 56;                       /* hauteur reservee au pied */

  let pg, y, page = 0;
  const zones = [];                     /* pour le controle automatique */

  const pied = () => {
    pg.drawRectangle({ x: 0, y: 34, width: A4[0], height: 1.4, color: DOC_R(DOC_C.rouge) });
    pg.drawRectangle({ x: 0, y: 0, width: A4[0], height: 34, color: DOC_R(DOC_C.fondg) });
    pg.drawText(d.pied, { x: M, y: 13, size: 7.5, font: reg, color: DOC_R(DOC_C.gris) });
    pg.drawText('page ' + page, { x: A4[0] - M - 34, y: 13, size: 7.5, font: reg, color: DOC_R(DOC_C.gris) });
  };

  const nouvellePage = () => {
    if (pg) pied();
    pg = doc.addPage(A4); page++; y = A4[1] - 40;
  };

  /* reserve h points, renvoie le haut du bloc, change de page si besoin */
  const reserver = (h, tag) => {
    if (y - h < BAS) nouvellePage();
    const haut = y; y -= h;
    if (tag) zones.push({ tag, page, y0: A4[1] - haut, y1: A4[1] - y });
    return haut;
  };
  const espace = (h) => { if (y - h > BAS) y -= h; };

  const lignes = (t, f, s, w) => {
    const mots = String(t).split(' '); let l = '', n = 1;
    for (const m of mots) { const e = l ? l + ' ' + m : m;
      if (f.widthOfTextAtSize(e, s) > w) { n++; l = m; } else l = e; }
    return n;
  };
  const poser = (t, x, haut, f, s, w, col) => {
    const mots = String(t).split(' '); let l = '', yy = haut - s;
    for (const m of mots) { const e = l ? l + ' ' + m : m;
      if (f.widthOfTextAtSize(e, s) > w) {
        pg.drawText(l, { x, y: yy, size: s, font: f, color: col }); yy -= s * 1.38; l = m;
      } else l = e; }
    if (l) pg.drawText(l, { x, y: yy, size: s, font: f, color: col });
  };
  /* un paragraphe qui ne tient pas est coupe proprement entre deux pages */
  const para = (t, o = {}) => {
    const s = o.size || 9.5, f = o.font || reg, x = o.x !== undefined ? o.x : M + 16;
    const w = o.w || L - 16, col = o.color || DOC_R(DOC_C.noir);
    const mots = String(t).split(' '); let bloc = [], l = '';
    for (const m of mots) { const e = l ? l + ' ' + m : m;
      if (f.widthOfTextAtSize(e, s) > w) { bloc.push(l); l = m; } else l = e; }
    if (l) bloc.push(l);
    for (const ligne of bloc) {
      const haut = reserver(s * 1.38);
      pg.drawText(ligne, { x, y: haut - s, size: s, font: f, color: col });
    }
  };
  const section = (t) => {
    const haut = reserver(30);
    pg.drawRectangle({ x: M, y: haut - 13, width: 20, height: 1.6, color: DOC_R(DOC_C.rouge) });
    pg.drawText(t.toUpperCase(), { x: M + 28, y: haut - 16, size: 8.5, font: gras, color: DOC_R(DOC_C.rouge) });
  };

  /* ---------- bandeau ---------- */
  nouvellePage();
  y = A4[1];
  { const h = 96, haut = reserver(h, 'bandeau');
    pg.drawRectangle({ x: 0, y: haut - h, width: A4[0], height: h, color: DOC_R(DOC_C.rouge) });
    pg.drawText('IMPRIMERIE DE JARRY', { x: M, y: haut - 32, size: 14, font: gras, color: PDFLib.rgb(1,1,1) });
    pg.drawText('Controle de fichier avant impression', { x: M, y: haut - 48, size: 8.5, font: reg, color: PDFLib.rgb(1,.86,.86) });
    pg.drawText(d.titre, { x: M, y: haut - 82, size: 21, font: gras, color: PDFLib.rgb(1,1,1) }); }

  /* ---------- cartouche ---------- */
  espace(16);
  { const it = d.ident, h = 20 + Math.ceil(it.length / 2) * 20, haut = reserver(h, 'cartouche');
    pg.drawRectangle({ x: M, y: haut - h, width: L, height: h, color: DOC_R(DOC_C.fondg) });
    it.forEach((o, i) => {
      const cx = M + 14 + (i % 2) * (L / 2), cy = haut - 16 - Math.floor(i / 2) * 20;
      pg.drawText(o[0].toUpperCase(), { x: cx, y: cy + 8, size: 6, font: gras, color: DOC_R(DOC_C.gris) });
      pg.drawText(String(o[1]).slice(0, 46), { x: cx, y: cy - 2, size: 9, font: reg, color: DOC_R(DOC_C.noir) });
    }); }

  /* ---------- encadre a lire avant de signer ---------- */
  if (d.reserves && d.reserves.length) {
    espace(10); section('A lire avant de signer');
    const wI = L - 64;
    let h = 20;
    for (const t of d.reserves) h += lignes(t, reg, 9.5, wI) * 9.5 * 1.38 + 12;
    /* si le bloc ne tient pas, on le pousse a la page suivante en entier :
       un encadre coupe en deux ne veut plus rien dire */
    if (y - h < BAS) { nouvellePage(); }
    const haut = reserver(h, 'encadre');
    pg.drawRectangle({ x: M, y: haut - h, width: L, height: h,
                       color: DOC_R(DOC_C.fondo), borderColor: DOC_R(DOC_C.orange), borderWidth: 1.1 });
    let yy = haut - 15;
    for (const t of d.reserves) {
      pg.drawRectangle({ x: M + 18, y: yy - 8, width: 9, height: 9, borderColor: DOC_R(DOC_C.noir), borderWidth: .8 });
      poser(t, M + 36, yy + 2, reg, 9.5, wI, DOC_R(DOC_C.noir));
      yy -= lignes(t, reg, 9.5, wI) * 9.5 * 1.38 + 12;
    }
  }

  /* ---------- visuels ---------- */
  if (d.visuels && d.visuels.length) {
    /* Le client valide UN fichier : celui qui part en production. Il doit
       donc le voir en grand, pleine largeur, avec les traits expliques.
       Le fichier qu'il a envoye vient apres, en petit, pour memoire — deux
       vignettes cote a cote de meme taille ne disaient pas laquelle
       engageait sa signature. */
    const aCorr = d.visuels.length > 1;
    const gros = aCorr ? d.visuels[1] : d.visuels[0];
    const petit = aCorr ? d.visuels[0] : null;

    espace(10);
    section(aCorr ? "Le fichier que vous validez" : "Votre fichier");
    espace(4);
    para(aCorr
      ? "C'est ce fichier qui partira en production, aux dimensions commandées. "
        + "Regardez-le en entier avant de signer."
      : "C'est ce fichier qui partira en production. Regardez-le en entier avant de signer.",
      { x: M, size: 9, color: DOC_R(DOC_C.gris), w: L });
    espace(6);

    /* pleine largeur, borne par la hauteur restante ; un visuel qui ne
       tient pas commence une page a lui, plutot que d'etre rapetisse */
    const dispo = () => y - BAS - 42;
    let k = Math.min(L / gros.w, dispo() / gros.h);
    if (gros.h * k < 210 && dispo() < 430) { nouvellePage(); k = Math.min(L / gros.w, dispo() / gros.h); }
    const iw = gros.w * k, ih = gros.h * k;
    const haut = reserver(ih + 22, 'visuel');
    const ix = M + (L - iw) / 2, iy = haut - ih;
    if (gros.png) pg.drawImage(gros.png, { x: ix, y: iy, width: iw, height: ih });
    pg.drawRectangle({ x: ix, y: iy, width: iw, height: ih,
                       borderColor: DOC_R(DOC_C.trait), borderWidth: .7 });
    pg.drawText(wa2(gros.lib + "   " + gros.dim), { x: M, y: iy - 13, size: 8,
      font: gras, color: DOC_R(DOC_C.gris) });

    espace(6);
    para(d.legendeVisuels, { x: M, size: 8.5, color: DOC_R(DOC_C.gris), w: L });

    if (petit) {
      espace(12);
      section("Pour mémoire, le fichier que vous nous avez envoyé");
      espace(4);
      const pw = Math.min(L * 0.30, 150);
      const kp = Math.min(pw / petit.w, 150 / petit.h);
      const pwi = petit.w * kp, phi = petit.h * kp;
      const hp2 = reserver(phi + 18, 'apercu-remis');
      const px2 = M, py2 = hp2 - phi;
      if (petit.png) pg.drawImage(petit.png, { x: px2, y: py2, width: pwi, height: phi });
      pg.drawRectangle({ x: px2, y: py2, width: pwi, height: phi,
                         borderColor: DOC_R(DOC_C.trait), borderWidth: .7 });
      pg.drawText(wa2(petit.lib + "   " + petit.dim), { x: px2, y: py2 - 12, size: 7.5,
        font: reg, color: DOC_R(DOC_C.gris) });
      /* le texte d'explication se pose a cote de la vignette */
      poser(d.explicationRemis || "Nous l'avons préparé pour l'impression : mise au format, "
        + "marge de coupe et repères. Le visuel n'a été ni étiré ni déformé.",
        px2 + pwi + 16, hp2, reg, 9, L - pwi - 16, DOC_R(DOC_C.noir));
    }
  }

  /* ---------- listes de constats ---------- */
  const liste = (titre, pts) => {
    if (!pts.length) return;
    espace(8); section(titre);
    for (const c of pts) {
      espace(5);
      const w = L - 32, h = lignes(c.t, reg, 9.5, w) * 9.5 * 1.38 + 2;
      const haut = reserver(h);
      pg.drawCircle({ x: M + 8, y: haut - 6, size: 2.6,
                      color: DOC_R(c.rouge ? DOC_C.cut : DOC_C.orange) });
      poser(c.t, M + 20, haut, reg, 9.5, w, DOC_R(DOC_C.noir));
      if (c.cons) para('-> ' + c.cons, { x: M + 20, size: 8.5, w: L - 32, color: DOC_R(DOC_C.gris) });
    }
  };
  liste(d.libPoints, d.points);
  if (d.corrections && d.corrections.length) {
    espace(8); section('Ce que nous avons corrige');
    for (const t of d.corrections) {
      espace(4);
      const haut = reserver(lignes(t, reg, 9.5, L - 32) * 9.5 * 1.38 + 2);
      pg.drawCircle({ x: M + 8, y: haut - 6, size: 2.6, color: DOC_R(DOC_C.rouge) });
      poser(t, M + 20, haut, reg, 9.5, L - 32, DOC_R(DOC_C.noir));
    }
  }
  liste(d.libRestants, d.restants);

  /* ---------- mesures, atelier seulement ---------- */
  if (d.mesures) { espace(8); section('Mesures'); espace(4);
    para(d.mesures, { size: 9, color: DOC_R(DOC_C.gris) }); }

  /* ---------- engagement ---------- */
  if (d.engagement) {
    espace(10); section('Engagement du client');
    for (const t of d.engagement) { espace(4); para(t, { size: 9 }); }
    espace(22);
    const haut = reserver(52, 'signature');
    pg.drawLine({ start: { x: M, y: haut - 30 }, end: { x: M + 210, y: haut - 30 },
                  thickness: .8, color: DOC_R(DOC_C.trait) });
    pg.drawLine({ start: { x: M + 250, y: haut - 30 }, end: { x: M + L, y: haut - 30 },
                  thickness: .8, color: DOC_R(DOC_C.trait) });
    pg.drawText('NOM ET QUALITE DU SIGNATAIRE', { x: M, y: haut - 42, size: 6.5, font: gras, color: DOC_R(DOC_C.gris) });
    pg.drawText('DATE ET SIGNATURE', { x: M + 250, y: haut - 42, size: 6.5, font: gras, color: DOC_R(DOC_C.gris) });
    espace(6);
    para('Mention manuscrite : « Bon a tirer, lu et approuve »', { x: M, size: 8, color: DOC_R(DOC_C.gris), w: L });
  }

  pied();
  return zones;
}

/* Assemble les donnees du controle pour le generateur ci-dessus.
   Trois documents, une seule mise en page : seul le CONTENU change.
   - bon a tirer : reserves + engagement, pas de mesures ni de consignes
   - rapport client : consequences seules
   - rapport atelier : tout, consignes et mesures comprises */
async function genererDoc(r, p, nomFichier, dims, mode) {
  const pourClient = mode === "client", atelier = mode === "atelier", bat = !mode;
  const doc = await PDFLib.PDFDocument.create();
  const reg = await doc.embedFont(PDFLib.StandardFonts.Helvetica);
  const gras = await doc.embedFont(PDFLib.StandardFonts.HelveticaBold);

  const rOrig = vues.rAvant || r;
  const corrige = !!vues.apres;
  const dim = (v) => v ? `${v.largCm.toFixed(1)} × ${v.hautCm.toFixed(1)} cm` : "";
  const o = ORIGINE;

  const ident = [
    ["Fichier", nomFichier],
    ["Produit", `${p.produit} — ${dims ? dims.larg + " × " + dims.haut : p.larg_cm + " × " + p.haut_cm} cm`],
    ["Référence", nommer(p, r, nomFichier)],
    ["Date", new Date().toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" })],
  ];
  if (o && o.type === "image")
    ident.push(["Fichier remis", (() => { const d = dimClient();
      return d ? d.complet : `${o.pxL} × ${o.pxH} px`; })()]);
  else if (vues.avant) ident.push(["Fichier remis", dim(vues.avant)]);
  if (corrige) ident.push(["Fichier corrigé", dim(vues.apres)]);

  const cons = (c) => (atelier && c[2]) ? c[2] : "";
  const mes  = (c) => (atelier && c[3]) ? ` (${c[3]})` : "";
  const conv = (liste) => liste
    .filter(([n]) => n === "ROUGE" || n === "ORANGE")
    .map((c) => ({ rouge: c[0] === "ROUGE",
                   t: c[1].replace(/\s\s\[.+?\]$/, "") + mes(c),
                   cons: cons(c) }));

  /* Les reserves du BAT : les points qui surprennent au deballage. */
  const SURPRISE = /flou|nette|définition|piqué|ternes|couleur|coupé|entamé|amputé|disparaîtra|liséré|remplacée|image/i;
  const reserves = bat
    ? (corrige ? r.constats : rOrig.constats)
        .filter(([n, t]) => (n === "ROUGE" || n === "ORANGE") && SURPRISE.test(t))
        .map(([, t]) => t.replace(/\s\s\[.+?\]$/, ""))
    : [];

  /* Visuels : on prefere les versions annotees, reperes compris. */
  const visuels = [];
  for (const [v, lib] of [[vues.avantA || vues.avant, "FICHIER REMIS"],
                          [vues.apresA || vues.apres, "APRÈS CORRECTION"]]) {
    if (!v) continue;
    try {
      const png = await doc.embedPng(v.url.split(",")[1]);
      visuels.push({ png, w: png.width, h: png.height, lib, dim: dim(v) });
    } catch (e) { /* un visuel manquant ne bloque pas le document */ }
  }

  const net = r.nettete;
  const mesures = (atelier && net && net.exploitable && net.bordTexte !== null)
    ? `Netteté des contours du texte : ${net.bordTexte.toFixed(2)} px de transition`
      + (net.bordPhoto !== null ? `, ${net.bordPhoto.toFixed(2)} px sur les images` : "")
      + `. Repère : un fichier net tourne autour de 1 à 1,5. Mesure objective, sans jugement.`
    : null;

  const d = {
    titre: bat ? "BON À TIRER AVEC RÉSERVES"
         : pourClient ? "CONTRÔLE DE VOTRE FICHIER" : "RAPPORT D'ATELIER",
    pied: `${CHARTE.nom} · ZI de Jarry, 97122 Baie-Mahault · 05 90 41 42 53 · contact@imprimeriedejarry.com`,
    ident, reserves, visuels,
    legendeVisuels: "Trait rouge : la coupe."
      + (p.marge_secu_mm > 0 ? `    Pointillés orange : la marge de sécurité de ${p.marge_secu_mm} mm.` : "")
      + (posOeillets(p, dims) ? "    Ronds bleus : les œillets." : ""),
    libPoints: pourClient ? "Ce qu'il faut savoir sur votre fichier" : "Points relevés sur le fichier remis",
    points: conv(rOrig.constats),
    corrections: corrige ? (vues.journal || []) : [],
    libRestants: pourClient ? "Ce qui reste à votre attention" : "Points subsistant après correction",
    restants: corrige ? conv(r.constats) : [],
    mesures,
    engagement: bat ? [
      "Le fichier a été contrôlé par l'imprimerie et le résultat soumis au client. Les points listés ci-dessus lui ont été portés à connaissance avant impression.",
      "Le client demande expressément l'impression du fichier en l'état et renonce à toute réclamation, demande de réimpression, d'avoir ou de remboursement fondée sur ces points.",
      "La présente réserve ne couvre que ces points. Imprimerie de Jarry demeure responsable de la conformité de sa production au fichier validé : qualité d'impression, quantités, support, finitions et délai convenus.",
    ] : null,
  };

  await poserDocument(doc, d, reg, gras);
  return await doc.save();
}

/* modeRapport : false = bon a tirer | "atelier" | "client" */
const devisMemo = {};            // quantité et options retenues par produit

/* Le prix du recto verso n'est pas le prix du recto multiplie par un
   coefficient : sur la grille papier, un A5 passe de 59 a 79 pour 100 ex
   (x1,34) mais de 69 a 89 pour 200 (x1,29). Il faut donc DEUX grilles.
   `paliers` = recto seul, `paliers_rv` = recto verso. Si la seconde est
   vide, la premiere sert dans les deux cas — c'est le comportement des
   produits toujours imprimes au recto verso, ou le prix est unique. */
function estRectoVerso(p, r, etat) {
  if (p.pages === "RECTO") return false;
  if (p.pages === "RV_OBLIGATOIRE" || p.pages === "MULTIPLE4") return true;
  if (etat && etat.rv !== undefined && etat.rv !== null) return !!etat.rv;
  return (r && r.nbPages > 1) || (vues.nbPages || 1) > 1;
}

/* ==================================================================== */
/* PALIERS DE SURFACE                                                   */
/* -------------------------------------------------------------------- */
/* Meme syntaxe et MEME SENS DE LECTURE que la colonne `paliers` :       */
/* « a partir de ». `0:399;0.25:199;0.5:179;0.99:159` se lit de 0 a      */
/* 0,25 m2 -> 399 EUR/m2, puis 199, puis 179, puis 159 au-dela.          */
/* La grille papier est ecrite dans l'autre sens (« sous 0,25 m2 ») :    */
/* la transcrire telle quelle donnerait une facturation inversee.        */
/* -------------------------------------------------------------------- */
/* C'est la SURFACE TOTALE DE LA COMMANDE qui decide du palier, pas la   */
/* surface d'un panneau : quatre panneaux de 0,2 m2 font 0,8 m2 et       */
/* tombent au tarif de 0,8 m2. Decision JP du 29 aout 2026.              */
/* ==================================================================== */
function paliersM2De(p, lamine) {
  const src = (lamine && String(p.paliers_m2_lam || "").trim())
    ? p.paliers_m2_lam : p.paliers_m2;
  if (!src) return [];
  return String(src).split(";").map(x => {
    const [s0, m] = x.split(":").map(v => parseFloat(String(v).replace(",", ".")));
    return (!isNaN(s0) && s0 >= 0 && !isNaN(m) && m > 0) ? { s: s0, m } : null;
  }).filter(Boolean).sort((a, b) => a.s - b.s);
}

/* Tarif au m2 applicable a une surface totale donnee. */
function tarifM2(p, surfaceTotale, lamine) {
  const pal = paliersM2De(p, lamine);
  if (!pal.length) return null;
  let choisi = pal[0];
  for (const x of pal) if (surfaceTotale >= x.s) choisi = x;
  return choisi;
}

function paliersDe(p, rv) {
  const src = (rv && String(p.paliers_rv || "").trim()) ? p.paliers_rv : p.paliers;
  if (!src) return [];
  return String(src).split(";").map(x => {
    const [q, m] = x.split(":").map(v => parseFloat(String(v).replace(",", ".")));
    return (q > 0 && !isNaN(m)) ? { q, m } : null;
  }).filter(Boolean).sort((a, b) => a.q - b.q);
}

function finitionsDe(p) {
  const t = (typeof TARIFS !== "undefined" && TARIFS.finitions) ? TARIFS.finitions : [];
  return t.filter(f => !f.familles || f.familles.includes(p.famille));
}

/* Renvoie le détail chiffré, ou null si le tarif n'est pas renseigné. */
function commandeChute(p, dims) {
  if (!p.matiere) return null;
  const d = dims && dims.larg > 0 ? dims
          : (p.regle_dim === "FIXE" ? { larg: p.larg_cm, haut: p.haut_cm } : null);
  if (!d) return null;
  return { matiere: p.matiere, epaisseur: p.epaisseur_mm, L: d.larg, H: d.haut };
}

function blocChutes(p, r) {
  const cmd = commandeChute(p, dimsSaisies());
  if (!cmd) return "";
  const m = apparierChutes(cmd);
  if (!m.length) {
    const ep = epaisseursDe(cmd.epaisseur);
    return `<div class="chutes vide">Aucune chute ${p.matiere}${ep.length ? " " + ep.join(" ou ") + " mm" : ""}
      exploitable pour ${cmd.L} × ${cmd.H} cm — plaque neuve.</div>`;
  }
  const b = m[0];
  const autres = m.length > 1 ? `<i>${m.length - 1} autre${m.length > 2 ? "s" : ""} chute${m.length > 2 ? "s" : ""} possible${m.length > 2 ? "s" : ""}</i>` : "";
  if (b.cas === "COUVRE") {
    const reste = resteDeCoupe(b.chute, cmd, b.pivote);
    return `<div class="chutes ok" data-ref="${b.chute.ref}" data-piv="${b.pivote ? 1 : 0}">
      <b>Chute ${b.chute.ref} — ${b.chute.L} × ${b.chute.H} cm · ${b.chute.matiere} ${b.chute.epaisseur || "?"} mm${b.pivote ? " · à pivoter" : ""}</b>
      <span>On coupe dedans : le client reçoit exactement sa commande.
        <u>Aucune remise</u>, c'est du matériau déjà payé.</span>
      <span class="reste">Reste après coupe : ${reste.length
        ? reste.map((x) => `${x.L} × ${x.H}${x.etroite ? " (étroite)" : ""}`).join(" et ")
        : "rien d'exploitable"}</span>
      <button type="button" id="chuteOk">Utiliser cette chute</button>${autres}</div>`;
  }
  return `<div class="chutes appro" data-ref="${b.chute.ref}" data-piv="${b.pivote ? 1 : 0}">
    <b>Chute ${b.chute.ref} — ${b.livre.L} × ${b.livre.H} cm · ${b.chute.matiere} ${b.chute.epaisseur || "?"} mm</b>
    <span>Un peu plus petite que les ${cmd.L} × ${cmd.H} demandés
      (manque ${b.manque.L} et ${b.manque.H} mm). <u>À proposer au client</u>
      avec ${CHUTES_REG.remisePct} % de remise. Sans son accord, plaque neuve.</span>
    <button type="button" id="chuteOk">Le client accepte</button>${autres}</div>`;
}

function calculerDevis(p, r, dims, etat) {
  const qte = Math.max(1, etat.qte || 1);
  const surface = (() => {
    const d = dims && dims.larg > 0 ? dims : (p.regle_dim === "FIXE" ? { larg: p.larg_cm, haut: p.haut_cm } : null);
    if (!d) return null;
    return Math.max(d.larg * d.haut / 10000, p.mini_facturation_m2 || 0);
  })();

  let base = null, methode = "";
  const rv = estRectoVerso(p, r, etat);
  if (p.mode_prix === "PALIER") {
    const grilleRv = rv && String(p.paliers_rv || "").trim();
    const pal = paliersDe(p, rv);
    if (pal.length) {
      let choisi = pal[0];
      for (const x of pal) if (qte >= x.q) choisi = x;
      base = choisi.m;
      methode = `palier ${choisi.q} ex · ${grilleRv ? "recto verso" : (rv ? "recto verso, grille unique" : "recto seul")}`;
    }
  } else if (p.mode_prix === "M2" && surface !== null) {
    /* Une grille de surface, si le produit en porte une, remplace le prix
       unique. Le palier est choisi sur la SURFACE TOTALE commandee. */
    const lamine = !!(etat.opts && etat.opts.includes("LAM"));
    const surfTot = surface * qte;
    const t = tarifM2(p, surfTot, lamine);
    if (t) {
      base = t.m * surfTot;
      const grille = (lamine && String(p.paliers_m2_lam || "").trim()) ? "laminé" : "non laminé";
      methode = `${t.m.toFixed(2)} ${TARIFS.devise}/m² · palier ${t.s} m² et plus · ${grille}`
              + ` × ${surfTot.toFixed(2)} m²${qte > 1 ? ` (${surface.toFixed(2)} × ${qte})` : ""}`;
    } else if (p.prix_m2 > 0) {
      base = p.prix_m2 * surface * qte;
      methode = `${p.prix_m2.toFixed(2)} ${TARIFS.devise}/m² × ${surface.toFixed(2)} m²${qte > 1 ? ` × ${qte}` : ""}`;
    } else {
      /* Ni grille ni prix unique : pas de tarif, pas de montant invente. */
      base = 0; methode = "";
    }
  } else if (p.mode_prix === "UNITE" && p.prix_unite > 0) {
    base = p.prix_unite * qte;
    methode = `${p.prix_unite.toFixed(2)} ${TARIFS.devise} × ${qte}`;
  }
  if (base === null) return null;

  const lignes = [{ lib: "Base", methode, montant: base }];
  let total = base;

  for (const c of (TARIFS.coefficients || [])) {
    if (!etat.coefs || !etat.coefs.includes(c.code)) continue;
    if (c.familles && !c.familles.includes(p.famille)) continue;
    const avant = total; total = base * c.coef;
    lignes.push({ lib: c.libelle, methode: `× ${c.coef}`, montant: total - avant });
  }

  for (const f of finitionsDe(p)) {
    if (!etat.opts || !etat.opts.includes(f.code)) continue;
    /* Quand le produit porte une grille laminee, cocher « Lamination » a
       DEJA change le tarif au m2. Ajouter la finition par-dessus la
       facturerait deux fois. */
    if (f.code === "LAM" && String(p.paliers_m2_lam || "").trim()) {
      lignes.push({ lib: f.libelle, methode: "inclus dans le tarif au m² laminé", montant: 0 });
      continue;
    }
    let m = 0;
    if (f.mode === "POURCENT") m = base * f.valeur / 100;
    else if (f.mode === "FIXE") m = f.valeur;
    else if (f.mode === "UNITE") m = f.valeur * (etat.nb && etat.nb[f.code] > 0 ? etat.nb[f.code] : 1) * qte;
    else if (f.mode === "M2") m = f.valeur * (surface || 0) * qte;
    total += m;
    const nbU = etat.nb && etat.nb[f.code] > 0 ? etat.nb[f.code] : 1;
    lignes.push({ lib: f.libelle,
      methode: f.mode === "POURCENT" ? `+ ${f.valeur} %`
             : f.mode === "UNITE" ? `${f.valeur} ${TARIFS.devise} × ${nbU}/ex × ${qte}`
             : f.mode === "M2" ? `${f.valeur} ${TARIFS.devise}/m² × ${(surface || 0).toFixed(2)}`
             : `${f.valeur} ${TARIFS.devise}`,
      montant: m });
  }

  /* --- Remise ---------------------------------------------------------
     La remise sur chute etait annoncee a l'operateur et jamais appliquee au
     prix : le client acceptait un format plus petit et payait plein tarif.
     Elle est desormais deduite, et PLAFONNEE par remiseMax — plafond qui
     etait declare dans tarifs.js depuis le debut sans etre lu nulle part. */
  const plafond = Number(TARIFS.remiseMax);
  const demande = Number(etat && etat.remiseChute) || 0;
  const taux = Math.max(0, Math.min(demande, isNaN(plafond) ? demande : plafond));
  if (taux > 0 && total > 0) {
    const m = -(total * taux / 100);
    lignes.push({ lib: `Remise chute ${taux} %`, methode: demande > taux
      ? `demandée ${demande} %, plafonnée à ${plafond} %` : "format légèrement réduit accepté",
      montant: m });
    total += m;
  }

  /* --- Frais de traitement --------------------------------------------
     Plancher de facturation. Une commande de deux stickers ne couvre pas
     le temps de calage, de decoupe et de comptoir : sous ce seuil, l'ecart
     est facture comme frais de traitement, ligne nommee sur le devis et
     sur la facture. Applique APRES remise, sinon la remise pourrait faire
     passer sous le plancher sans le declencher. */
  const plancher = Number(TARIFS.fraisTraitementMini);
  if (!isNaN(plancher) && plancher > 0 && total > 0 && total < plancher) {
    const m = plancher - total;
    lignes.push({ lib: "Frais de traitement",
                  methode: `commande sous le minimum de ${plancher.toFixed(2)} ${TARIFS.devise}`,
                  montant: m });
    total = plancher;
  }
  return { total, lignes, qte, surface, remise: taux };
}

function blocDevis(p, r) {
  /* La quantite par defaut etait 1. Sur un produit au palier, 1 ne
     correspond a AUCUNE quantite vendue : le menu s'ouvrait donc toujours
     sur « autre… » avec un champ libre a cote, alors que l'operateur veut
     voir une quantite reelle. On demarre sur le premier palier vendu. */
  if (!devisMemo[p.code]) {
    const pal0 = paliersDe(p, false);
    devisMemo[p.code] = { qte: (p.mode_prix === "PALIER" && pal0.length) ? pal0[0].q : 1,
                          opts: [], coefs: [], nb: {} };
  }
  const etat = devisMemo[p.code];
  const dv = calculerDevis(p, r, dimsSaisies(), etat);
  const fins = finitionsDe(p);
  const coefs = (TARIFS.coefficients || []).filter(c => !c.familles || c.familles.includes(p.famille));

  const opt = (id, code, lib, coche, mnt, unite) => `
    <label class="fin"><input type="checkbox" data-r="${id}" value="${code}" ${coche ? "checked" : ""}>
      <span>${lib}</span>
      ${unite ? `<input class="nbu" type="number" min="1" step="1" data-nb="${code}"
          value="${(etat.nb && etat.nb[code]) || 1}" title="nombre par exemplaire" ${coche ? "" : "disabled"}>` : ""}
      <span class="mnt">${mnt}</span></label>`;

  return `
  <div class="pan devis">
    <div class="tete">Devis</div>
    <div class="corps">
      ${blocChutes(p, r)}
      ${(() => {
        /* Le choix n'apparait que la ou il se pose : sur un produit qui
           accepte les deux, et quand une grille recto verso existe. Ailleurs
           on affiche l'etat, sans faire croire a un reglage. */
        const rv = estRectoVerso(p, r, etat);
        const deux = String(p.paliers_rv || "").trim();
        if (p.pages === "RECTO")
          return `<div class="rvinfo">Recto seul — imposé par le produit.</div>`;
        if (p.pages === "RV_OBLIGATOIRE" || p.pages === "MULTIPLE4")
          return `<div class="rvinfo">Recto verso — imposé par le produit.</div>`;
        return `<div class="rvchoix">
          <span>Impression</span>
          <button type="button" class="rvb ${rv ? "" : "on"}" data-rv="0">Recto seul</button>
          <button type="button" class="rvb ${rv ? "on" : ""}" data-rv="1">Recto verso</button>
          ${deux ? "" : `<i>grille unique : même prix des deux côtés</i>`}
        </div>`;
      })()}
      <div class="qte">
        <label for="qte">Quantité</label>
        ${(() => {
          const pal = paliersDe(p, estRectoVerso(p, r, etat));
          if (p.mode_prix === "PALIER" && pal.length) {
            const connue = pal.some(x => x.q === etat.qte);
            return `<select id="qte">
              ${pal.map(x => `<option value="${x.q}" ${x.q === etat.qte ? "selected" : ""}>${x.q} ex</option>`).join("")}
              <option value="autre" ${connue ? "" : "selected"}>autre quantité…</option>
            </select>${connue ? "" : `<input type="number" id="qteLibre" min="1" step="1" value="${etat.qte}" aria-label="Quantité libre">`}`;
          }
          return `<input type="number" id="qte" min="1" step="1" value="${etat.qte}">`;
        })()}
        <span class="mnt mono">${p.mode_prix === "M2" ? "au m²" : p.mode_prix === "UNITE" ? "à l'unité" : "quantités vendues"}</span>
      </div>
      ${coefs.map(c => opt("coef", c.code, c.libelle, (etat.coefs || []).includes(c.code), "× " + c.coef)).join("")}
      ${fins.map(f => opt("opt", f.code, f.libelle, (etat.opts || []).includes(f.code),
          f.mode === "POURCENT" ? "+" + f.valeur + " %" : f.valeur > 0 ? f.valeur + " " + TARIFS.devise + (f.mode === "M2" ? "/m²" : f.mode === "UNITE" ? "/u" : "") : "à tarifer",
          f.mode === "UNITE")).join("")}
      <div class="total ${dv ? "" : "vide"}">
        <span class="lib">${TARIFS.mention}</span>
        <span class="val" id="montant">${dv ? dv.total.toFixed(2) + " " + TARIFS.devise : "tarif non renseigné"}</span>
      </div>
      ${dv ? `<div class="detail">${dv.lignes.map(l =>
        `<span><span>${l.lib}${l.methode ? " · " + l.methode : ""}</span><span>${l.montant.toFixed(2)}</span></span>`).join("")}</div>`
        : `<div class="detail">Renseigner le tarif de ce produit dans l'espace admin.</div>`}
    </div>
  </div>`;
}

function brancherDevis(p, r) {
  const etat = devisMemo[p.code];
  const rafraichir = () => {
    const dv = calculerDevis(p, r, dimsSaisies(), etat);
    const bloc = $("inspection").querySelector(".devis");
    if (bloc) { bloc.outerHTML = blocDevis(p, r); brancherDevis(p, r); }
  };
  if ($("chuteOk")) $("chuteOk").onclick = () => {
    const z = $("chuteOk").closest(".chutes");
    const cmd = commandeChute(p, dimsSaisies());
    if (!z || !cmd) return;
    const ref = z.dataset.ref, piv = z.dataset.piv === "1";
    const appro = z.classList.contains("appro");
    const ajoutes = consommerChute(ref, cmd, piv);
    if (appro) { etat.remiseChute = CHUTES_REG.remisePct; devisMemo[p.code] = etat; }
    alert(`Chute ${ref} utilisée.`
      + (ajoutes && ajoutes.length
          ? `\n\nÉcrire au marqueur sur les morceaux restants :\n`
            + ajoutes.map((x) => `  ${x.ref}   ${x.L} × ${x.H} cm${x.etroite ? "  (étroite)" : ""}`).join("\n")
          : `\n\nAucun reste exploitable : rien à étiqueter.`));
    const bloc2 = $("inspection").querySelector(".devis");
    if (bloc2) { bloc2.outerHTML = blocDevis(p, r); brancherDevis(p, r); }
  };
  for (const b of document.querySelectorAll(".rvb")) b.onclick = () => {
    etat.rv = b.dataset.rv === "1";
    devisMemo[p.code] = etat;
    const bloc = $("inspection").querySelector(".devis");
    if (bloc) { bloc.outerHTML = blocDevis(p, r); brancherDevis(p, r); }
  };
  if ($("qte")) {
    const maj = () => {
      const v = $("qte").value;
      if (v === "autre") { etat.qte = etat.qte || 1; }
      else etat.qte = parseInt(v) || 1;
      rafraichir();
    };
    $("qte").oninput = maj; $("qte").onchange = maj;
  }
  if ($("qteLibre")) $("qteLibre").oninput = () => { etat.qte = parseInt($("qteLibre").value) || 1; rafraichir(); };
  for (const n of $("inspection").querySelectorAll(".fin .nbu")) n.oninput = () => {
    etat.nb = etat.nb || {};
    etat.nb[n.dataset.nb] = parseInt(n.value) || 1;
    rafraichir();
  };
  for (const c of $("inspection").querySelectorAll('.fin input[type=checkbox]')) {
    c.onchange = () => {
      const cle = c.dataset.r === "coef" ? "coefs" : "opts";
      etat[cle] = etat[cle] || [];
      etat[cle] = c.checked ? [...new Set([...etat[cle], c.value])] : etat[cle].filter(v => v !== c.value);
      rafraichir();
    };
  }
}

/* ------------------------------------------------------------------ */
/* Espace admin : spécifications, tarifs, finitions                    */
/* ------------------------------------------------------------------ */
const CLE_REF = "calage.referentiel", CLE_TAR = "calage.tarifs";
const CLE_REF_V = "calage.referentiel.version";
const CLE_HIST = "calage.referentiel.historique";

/* Historique des enregistrements admin : les 5 derniers etats, du plus
   recent au plus ancien. Permet de revenir en arriere apres une saisie
   malheureuse, sans avoir a tout ressaisir. */
function historiqueAdmin() {
  try { const h = JSON.parse(localStorage.getItem(CLE_HIST) || "[]");
        return Array.isArray(h) ? h : []; } catch (e) { return []; }
}
function poserHistorique(h) {
  try { localStorage.setItem(CLE_HIST, JSON.stringify(h.slice(0, 5))); } catch (e) {}
}
let instantaneAdmin = null;          // état des données à l'ouverture, pour pouvoir annuler

function prendreInstantane() {
  instantaneAdmin = { ref: JSON.parse(JSON.stringify(REF)), tar: JSON.parse(JSON.stringify(TARIFS)) };
}
let REF_LOCALE_ABANDONNEE = null;

/* Les reglages admin sont un CORRECTIF applique au referentiel publie, pas
   un remplacement. C'est la seule forme qui survit a une republication :
   un produit ajoute au fichier apparait toujours, meme si le poste a des
   reglages locaux ; un champ modifie en local reste modifie.
   La version precedente remplacait le referentiel entier, ce qui rendait
   tout nouveau produit invisible — et mon verrou d'empreinte, bugue, avait
   estampille des reglages perimes comme etant a jour. Un correctif fusionne
   n'a pas ce probleme, quelle que soit l'empreinte. */
function fusionnerReglages(publie, local) {
  const parCode = new Map(local.map((o) => [o.code, o]));
  const sortie = publie.map((ref) => {
    const loc = parCode.get(ref.code);
    if (!loc) return ref;
    parCode.delete(ref.code);
    const o = Object.assign({}, ref);
    for (const k of Object.keys(ref)) if (k !== "code" && loc[k] !== undefined) o[k] = loc[k];
    return o;
  });
  /* produits crees par l'operateur dans l'admin : ils restent */
  for (const reste of parCode.values()) sortie.push(reste);
  return sortie;
}

function chargerReglages() {
  try {
    const r = localStorage.getItem(CLE_REF);
    if (r) {
      const j = JSON.parse(r);
      if (Array.isArray(j) && j.length) {
        const avant = REF.length;
        REF = fusionnerReglages(REFERENTIEL, j);
        const ajoutes = REFERENTIEL.filter((p) => !j.some((q) => q.code === p.code));
        if (ajoutes.length) REF_LOCALE_ABANDONNEE = { ajoutes: ajoutes.map((p) => p.produit) };
      }
    }
    const t = localStorage.getItem(CLE_TAR);
    if (t && typeof TARIFS !== "undefined") Object.assign(TARIFS, JSON.parse(t));
  } catch (e) { console.warn("réglages illisibles :", e && e.message); }
}

function enregistrerReglages() {
  try {
    /* on empile l'etat qui etait enregistre AVANT, pas celui qu'on ecrit :
       c'est lui que « Version precedente » doit ramener */
    const ancien = localStorage.getItem(CLE_REF);
    if (ancien) {
      const h = historiqueAdmin();
      let tar = null;
      try { tar = JSON.parse(localStorage.getItem(CLE_TAR) || "null"); } catch (e) {}
      h.unshift({ quand: new Date().toISOString(), ref: JSON.parse(ancien), tar });
      poserHistorique(h);
    }
    localStorage.setItem(CLE_REF, JSON.stringify(REF));
    localStorage.setItem(CLE_TAR, JSON.stringify(TARIFS));
    if (typeof REFERENTIEL_VERSION !== "undefined")
      localStorage.setItem(CLE_REF_V, REFERENTIEL_VERSION);
    return true;
  } catch (e) { return false; }
}

/* ==================================================================== */
/* CSV — export et import du referentiel                                */
/* -------------------------------------------------------------------- */
/* Separateur point-virgule et BOM UTF-8 : c'est ce qu'Excel francais    */
/* ouvre sans poser de question. L'export porte TOUTES les colonnes,     */
/* pas seulement celles affichees, pour que l'aller-retour soit fidele.  */
/* ==================================================================== */
function versCsv(lignes) {
  if (!lignes.length) return "";
  const cles = [];
  for (const o of lignes) for (const k of Object.keys(o)) if (!cles.includes(k)) cles.push(k);
  const ech = (v) => {
    if (v === null || v === undefined) return "";
    const t = String(v);
    return /[";\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
  };
  const out = [cles.join(";")];
  for (const o of lignes) out.push(cles.map((k) => ech(o[k])).join(";"));
  return "\uFEFF" + out.join("\r\n") + "\r\n";
}

/* Analyseur tolerant : guillemets, separateur ; ou , detecte sur l'en-tete,
   fins de ligne Windows ou Unix. */
function depuisCsv(txt) {
  txt = String(txt).replace(/^\uFEFF/, "");
  const nl = txt.indexOf("\n");
  const tete = nl < 0 ? txt : txt.slice(0, nl);
  const sep = (tete.split(";").length > tete.split(",").length) ? ";" : ",";
  const lignes = [];
  let champ = "", ligne = [], q = false;
  for (let i = 0; i < txt.length; i++) {
    const c = txt[i];
    if (q) {
      if (c === '"') { if (txt[i + 1] === '"') { champ += '"'; i++; } else q = false; }
      else champ += c;
    } else if (c === '"') q = true;
    else if (c === sep) { ligne.push(champ); champ = ""; }
    else if (c === "\n") { ligne.push(champ); lignes.push(ligne); ligne = []; champ = ""; }
    else if (c !== "\r") champ += c;
  }
  if (champ !== "" || ligne.length) { ligne.push(champ); lignes.push(ligne); }
  if (!lignes.length) return [];
  const cles = lignes.shift().map((k) => k.trim());
  const nombre = (t) => {
    const v = t.replace(",", ".").trim();
    return v !== "" && !isNaN(Number(v)) ? Number(v) : null;
  };
  /* Les colonnes `paliers*` sont des GRILLES, pas des nombres. Sans cette
     exclusion, `paliers_m2` finit par « _m2 » et tombait dans la regle
     numerique : « 0:399;0.25:199 » devenait NaN, donc null, et l'import
     effacait silencieusement la grille tarifaire au m2. */
  const GRILLE = /^paliers/;
  const NUM = /_(cm|mm|m2)$|^dpi_|^tolerance|^prix_|^mini_/;
  return lignes.filter((l) => l.some((v) => String(v).trim() !== "")).map((l) => {
    const o = {};
    cles.forEach((k, i) => {
      const brut = (l[i] === undefined ? "" : String(l[i])).trim();
      o[k] = (!GRILLE.test(k) && NUM.test(k)) ? nombre(brut) : (brut === "" ? "" : brut);
    });
    return o;
  });
}

/* Les options ne sont pas un tableau plat : coefficients, finitions et
   reglages generaux cohabitent. On les met a plat sous une colonne `type`,
   ce qui rend le fichier lisible dans Excel et reconstructible sans perte. */
function optionsVersLignes() {
  const L = [];
  for (const c of (TARIFS.coefficients || []))
    L.push({ type: "COEFFICIENT", code: c.code, libelle: c.libelle, mode: "",
             valeur: c.coef, familles: (c.familles || []).join("|") });
  for (const f of (TARIFS.finitions || []))
    L.push({ type: "FINITION", code: f.code, libelle: f.libelle, mode: f.mode,
             valeur: f.valeur, familles: (f.familles || []).join("|") });
  L.push({ type: "REGLAGE", code: "remiseMax", libelle: "Remise maximale autorisée (%)",
           mode: "", valeur: TARIFS.remiseMax, familles: "" });
  L.push({ type: "REGLAGE", code: "fraisTraitementMini",
           libelle: "Frais de traitement — plancher de facturation (€)",
           mode: "", valeur: TARIFS.fraisTraitementMini, familles: "" });
  L.push({ type: "REGLAGE", code: "devise", libelle: "Devise", mode: "",
           valeur: TARIFS.devise, familles: "" });
  L.push({ type: "REGLAGE", code: "mention", libelle: "Mention du prix", mode: "",
           valeur: TARIFS.mention, familles: "" });
  return L;
}

function lignesVersOptions(L) {
  const coefs = [], fins = [];
  const nb = (v) => { const n = Number(String(v).replace(",", ".")); return isNaN(n) ? 0 : n; };
  for (const o of L) {
    const fam = String(o.familles || "").split("|").map((x) => x.trim()).filter(Boolean);
    if (o.type === "COEFFICIENT") coefs.push({ code: o.code, libelle: o.libelle, coef: nb(o.valeur), familles: fam });
    else if (o.type === "FINITION") fins.push({ code: o.code, libelle: o.libelle, mode: o.mode, valeur: nb(o.valeur), familles: fam });
    else if (o.type === "REGLAGE") {
      if (o.code === "remiseMax") TARIFS.remiseMax = nb(o.valeur);
      else if (o.code === "fraisTraitementMini") TARIFS.fraisTraitementMini = nb(o.valeur);
      else if (o.code === "devise") TARIFS.devise = String(o.valeur || "€");
      else if (o.code === "mention") TARIFS.mention = String(o.valeur || "");
    }
  }
  if (coefs.length) TARIFS.coefficients = coefs;
  if (fins.length) TARIFS.finitions = fins;
}

/* ==================================================================== */
/* FILET DE COHERENCE                                                   */
/* -------------------------------------------------------------------- */
/* Specifications et tarifs vivent sur la MEME ligne, cle = code : il ne */
/* peut donc pas y avoir d'orphelin. Ce qui reste possible, ce sont les  */
/* combinaisons impossibles a chiffrer, ou les seuils qui se croisent.   */
/* On les liste avant d'enregistrer, jamais apres.                       */
/* ==================================================================== */
function verifierCoherence(ref) {
  const pb = [];
  const vus = new Set();
  for (const p of ref) {
    const n = p.produit || p.code;
    if (!p.code) { pb.push(`Une ligne n'a pas de code.`); continue; }
    if (vus.has(p.code)) pb.push(`${p.code} apparaît deux fois : la dernière ligne écrasera la première.`);
    vus.add(p.code);

    /* le mode de prix et les montants doivent se répondre */
    if (p.mode_prix === "PALIER" && !String(p.paliers || "").trim())
      pb.push(`${n} : mode PALIER mais aucun palier saisi — aucun prix ne sortira.`);
    if (p.mode_prix === "M2" && !(p.prix_m2 > 0))
      pb.push(`${n} : mode M2 mais prix au m² vide — aucun prix ne sortira.`);
    if (p.mode_prix === "UNITE" && !(p.prix_unite > 0))
      pb.push(`${n} : mode UNITE mais prix à l'unité vide — aucun prix ne sortira.`);
    if (p.pages === "RECTO" && String(p.paliers_rv || "").trim())
      pb.push(`${n} : une grille recto verso est saisie sur un produit imprimé au recto seul.`);
    if (String(p.paliers_rv || "").trim() && !String(p.paliers || "").trim())
      pb.push(`${n} : grille recto verso saisie mais grille recto vide — le recto seul n'aura pas de prix.`);
    if (p.mode_prix !== "PALIER" && String(p.paliers || "").trim())
      pb.push(`${n} : des paliers sont saisis mais le mode est ${p.mode_prix || "vide"} — ils seront ignorés.`);

    /* un prix au m² suppose qu'une surface soit connaissable */
    if (p.mode_prix === "M2" && p.regle_dim !== "FIXE" && p.dim_saisie === "NON")
      pb.push(`${n} : prix au m² sans dimensions possibles (format libre et saisie interdite).`);

    /* paliers mal formés */
    if (String(p.paliers || "").trim()) {
      for (const bloc2 of String(p.paliers).split(";")) {
        if (!bloc2.trim()) continue;
        if (!/^\s*\d+(\.\d+)?\s*:\s*\d+(\.\d+)?\s*$/.test(bloc2))
          pb.push(`${n} : palier « ${bloc2.trim()} » mal formé, attendu quantité:montant.`);
      }
    }

    /* seuils qui se croisent */
    if (p.dpi_mini > 0 && p.dpi_cible > 0 && p.dpi_mini > p.dpi_cible)
      pb.push(`${n} : résolution mini (${p.dpi_mini}) supérieure à la cible (${p.dpi_cible}).`);
    if (p.larg_max_cm > 0 && p.larg_cm > p.larg_max_cm)
      pb.push(`${n} : largeur ${p.larg_cm} cm au-delà du maximum ${p.larg_max_cm} cm.`);
    if (p.haut_max_cm > 0 && p.haut_cm > p.haut_max_cm)
      pb.push(`${n} : hauteur ${p.haut_cm} cm au-delà du maximum ${p.haut_max_cm} cm.`);

    /* une marge de securite qui mange tout le format */
    const petit = Math.min(p.larg_cm || 0, p.haut_cm || 0) * 10;
    if (petit > 0 && p.marge_secu_mm > 0 && p.marge_secu_mm * 2 >= petit)
      pb.push(`${n} : marge de sécurité ${p.marge_secu_mm} mm sur un format de ${petit} mm — il ne reste rien.`);
    if (p.marge_pli_mm > 0 && p.marge_secu_mm > 0 && p.marge_pli_mm < p.marge_secu_mm)
      pb.push(`${n} : marge au pli (${p.marge_pli_mm}) inférieure à la marge extérieure (${p.marge_secu_mm}).`);

    /* coherences metier */
    if (p.matiere && !epaisseursDe(p.epaisseur_mm).length)
      pb.push(`${n} : matière ${p.matiere} déclarée sans épaisseur — aucune chute ne pourra être proposée.`);
    if (p.famille === "SIGNALETIQUE" && p.fond_perdu_mm > 0)
      pb.push(`${n} : fond perdu déclaré sur un support signalétique, coupé à la main.`);
    if (p.pages === "MULTIPLE4" && !(p.marge_pli_mm > 0))
      pb.push(`${n} : brochure sans marge au pli — la valeur par défaut sécurité + 3 mm sera utilisée.`);
  }
  for (const p of ref) {
    const n = p.code || "(sans code)";
    const g = String(p.paliers_m2 || "").trim(), gl = String(p.paliers_m2_lam || "").trim();
    const mal = (t) => t && !/^\s*\d+(\.\d+)?\s*:\s*\d+(\.\d+)?\s*(;\s*\d+(\.\d+)?\s*:\s*\d+(\.\d+)?\s*)*$/.test(t);
    if (mal(g))  pb.push(`${n} : paliers m² mal formés — attendu surface:tarif;… par exemple 0:399;0.25:199`);
    if (mal(gl)) pb.push(`${n} : paliers m² laminé mal formés — même format que la grille non laminée.`);
    if (gl && !g) pb.push(`${n} : grille m² laminée sans grille non laminée — un client qui ne prend pas la lamination ne serait pas chiffré.`);
    if (g && paliersM2De({ paliers_m2: g }, false).length && paliersM2De({ paliers_m2: g }, false)[0].s > 0)
      pb.push(`${n} : les paliers m² ne commencent pas à 0 — une petite surface ne serait pas chiffrée.`);
    if (g && p.mode_prix !== "M2")
      pb.push(`${n} : grille de paliers m² sur un produit en mode ${p.mode_prix} — elle ne sera jamais lue.`);
  }
  if (TARIFS.remiseMax === undefined || TARIFS.remiseMax === null || TARIFS.remiseMax === "")
    pb.push(`Remise maximale non renseignée dans les options.`);
  return pb;
}

/* ==================================================================== */
/* CHUTES — ecouler du materiau deja paye                               */
/* -------------------------------------------------------------------- */
/* Deux cas a ne JAMAIS confondre :                                     */
/*  - la chute couvre la commande : on coupe dedans, le client recoit    */
/*    exactement ce qu'il a commande, aucun accord, AUCUNE REMISE.       */
/*  - la chute est plus petite mais dans la tolerance : on livre un      */
/*    format different, accord du client obligatoire, remise fixe.       */
/* Les confondre revient a offrir une remise sur des commandes qui n'en  */
/* demandaient aucune.                                                   */
/* ==================================================================== */
const CLE_CHUTES = "calage.chutes";
const CHUTES_REG = {
  jeuCoupeMm: 5,        /* perte de lame et amorce, par coupe */
  ecartMaxMm: 30,       /* chute plus petite : ecart tolere par cote */
  ratioMaxPct: 10,      /* au-dela, geometriquement proche mais inutilisable */
  gardeMm: 200,         /* conserve sans reserve au-dessus de 20 cm de cote */
  etroitMm: 150,        /* entre 15 et 20 cm : conserve, marque « etroite » */
  remisePct: 5,
  rotation: true,
};
let CHUTES = [];

function chargerChutes() {
  try { const c = JSON.parse(localStorage.getItem(CLE_CHUTES) || "[]");
        CHUTES = Array.isArray(c) ? c : []; } catch (e) { CHUTES = []; }
}
function sauverChutes() {
  try { localStorage.setItem(CLE_CHUTES, JSON.stringify(CHUTES)); } catch (e) {}
}
function refChute() {
  let n = 1;
  for (const c of CHUTES) { const m = /^C-(\d+)$/.exec(c.ref || ""); if (m) n = Math.max(n, +m[1] + 1); }
  return "C-" + String(n).padStart(3, "0");
}

/* Un morceau se garde-t-il ? Deux seuils, pas un : au-dessus de 20 cm de
   cote c'est du stock franc ; entre 15 et 20 c'est une lamelle, utile pour
   une plaque de porte ou un bandeau, mais signalee comme telle ; en dessous
   de 15 c'est du dechet, et l'inscrire au stock le rendrait faux. */
function jugerMorceau(L, H) {
  const petit = Math.min(L, H) * 10;
  if (petit < CHUTES_REG.etroitMm) return null;
  return { L: Math.round(L * 10) / 10, H: Math.round(H * 10) / 10,
           etroite: petit < CHUTES_REG.gardeMm };
}

/* Liste d'epaisseurs acceptees par un produit, ex. "5|6" ou "3". */
function epaisseursDe(v) {
  return String(v === null || v === undefined ? "" : v)
    .split(/[|;,/]/).map((x) => parseFloat(String(x).replace(",", ".")))
    .filter((x) => x > 0);
}
function epaisseursOk(produit, chute) {
  const L = epaisseursDe(produit);
  if (!L.length) return true;            /* produit sans epaisseur declaree */
  const e = parseFloat(String(chute === null ? "" : chute).replace(",", "."));
  if (!(e > 0)) return false;            /* chute sans epaisseur : on ne devine pas */
  return L.some((x) => Math.abs(x - e) < 0.01);
}

function apparierChutes(cmd) {
  const reg = CHUTES_REG, j = reg.jeuCoupeMm / 10, out = [];
  if (!cmd || !cmd.matiere || !(cmd.L > 0 && cmd.H > 0)) return out;
  for (const c of CHUTES) {
    if (c.statut !== "dispo") continue;
    if (c.matiere !== cmd.matiere) continue;
    /* Un produit peut se faire dans plusieurs epaisseurs : le PVC est
       stocke en 5 et en 6 mm au meme tarif. La colonne accepte donc une
       liste « 5|6 ». En revanche on ne substitue JAMAIS une epaisseur a une
       autre : si la commande vise le 6, une chute de 5 n'est pas proposee. */
    if (!epaisseursOk(cmd.epaisseur, c.epaisseur)) continue;
    const sens = reg.rotation ? [[c.L, c.H, false], [c.H, c.L, true]] : [[c.L, c.H, false]];
    for (const [L, H, pivote] of sens) {
      if (L >= cmd.L + j && H >= cmd.H + j) {
        out.push({ chute: c, pivote, cas: "COUVRE", remise: 0 });
        break;
      }
      const dL = (cmd.L - L) * 10, dH = (cmd.H - H) * 10;
      if (dL >= 0 && dH >= 0 && dL <= reg.ecartMaxMm && dH <= reg.ecartMaxMm) {
        const ecartRatio = Math.abs((L / H) - (cmd.L / cmd.H)) / (cmd.L / cmd.H) * 100;
        if (ecartRatio <= reg.ratioMaxPct)
          out.push({ chute: c, pivote, cas: "APPROCHE", livre: { L, H },
                     manque: { L: dL, H: dH }, remise: reg.remisePct });
        break;
      }
    }
  }
  const aire = (o) => o.chute.L * o.chute.H;
  return out.sort((a, b) => (a.cas === b.cas ? aire(a) - aire(b) : a.cas === "COUVRE" ? -1 : 1));
}

/* Guillotine : deux decoupages possibles, on retient celui qui maximise le
   plus grand rectangle restant. */
function resteDeCoupe(chute, cmd, pivote) {
  const L = pivote ? chute.H : chute.L, H = pivote ? chute.L : chute.H;
  const j = CHUTES_REG.jeuCoupeMm / 10, l = cmd.L + j, h = cmd.H + j;
  const garder = (r) => r.map((x) => jugerMorceau(x.L, x.H)).filter(Boolean);
  const A = garder([{ L: L - l, H: H }, { L: l - j, H: H - h }]);
  const B = garder([{ L: L, H: H - h }, { L: L - l, H: h - j }]);
  const grand = (r) => r.reduce((m, x) => Math.max(m, x.L * x.H), 0);
  return grand(A) >= grand(B) ? A : B;
}

/* Consommation : la chute mere disparait, ses restes entrent au stock avec
   leur propre numero, a ecrire au marqueur. Une chute non etiquetee n'est
   pas retrouvable dans la pile. */
function consommerChute(ref, cmd, pivote) {
  const c = CHUTES.find((x) => x.ref === ref);
  if (!c) return null;
  const nes = resteDeCoupe(c, cmd, pivote);
  c.statut = "consommee";
  c.consommee_le = new Date().toISOString();
  const ajoutes = [];
  for (const m of nes) {
    const n = { ref: refChute(), matiere: c.matiere, epaisseur: c.epaisseur,
                L: m.L, H: m.H, statut: "dispo", etroite: !!m.etroite,
                mere: c.ref, cree_le: new Date().toISOString() };
    CHUTES.push(n); ajoutes.push(n);
  }
  sauverChutes();
  return ajoutes;
}

function celluleAdmin(obj, cle, type) {
  const v = obj[cle] === null || obj[cle] === undefined ? "" : obj[cle];
  if (typeof type === "string" && type.includes("|"))
    return `<select data-c="${cle}">${type.split("|").map(o => `<option ${o === v ? "selected" : ""}>${o}</option>`).join("")}</select>`;
  return `<input data-c="${cle}" type="${type === 1 ? "number" : "text"}" ${type === 1 ? 'step="any"' : ""} value="${String(v).replace(/"/g, "&quot;")}">`;
}

function grilleAdmin(colonnes, lignes, lecture) {
  /* Les deux premieres colonnes, code et produit, restent visibles quand on
     fait defiler vers la droite : sans elles, l'operateur ne sait plus
     quelle ligne il modifie. */
  const fige = (n) => n === 0 ? " fige f0" : n === 1 ? " fige f1" : "";
  return `<table class="grille"><thead><tr>${colonnes.map((c, n) =>
      `<th class="${fige(n).trim()}"><span>${c[1]}</span>${c[3] ? `<em>${c[3]}</em>` : ""}</th>`).join("")}<th></th></tr></thead><tbody>
    ${lignes.map((o, i) => `<tr data-i="${i}">${colonnes.map((c, n) => {
      const cl = c[2] === 1 ? "num" : (typeof c[2] === "string" && c[2].includes("|")) ? "sel"
               : (c[0] === "paliers" || c[0] === "plis") ? "lng" : "txt";
      return `<td class="${cl}${fige(n)}">${lecture.includes(c[0]) ? `<input value="${o[c[0]] === null || o[c[0]] === undefined ? "" : o[c[0]]}" readonly>` : celluleAdmin(o, c[0], c[2])}</td>`;
    }).join("")}<td class="act"><button class="sup" data-sup="${i}" title="Supprimer ce produit">×</button></td></tr>`).join("")}
  </tbody></table>`;
}

/* Instantané pris à l'ouverture de l'admin. Annuler y revient intégralement,
   y compris pour les lignes ajoutées ou supprimées. */
let snapAdmin = null;

function instantanerReglages() {
  snapAdmin = { ref: JSON.parse(JSON.stringify(REF)), tar: JSON.parse(JSON.stringify(TARIFS)) };
}

function restaurerReglages() {
  if (!snapAdmin) return;
  REF.length = 0; for (const o of snapAdmin.ref) REF.push(o);
  for (const k of Object.keys(TARIFS)) delete TARIFS[k];
  Object.assign(TARIFS, snapAdmin.tar);
  snapAdmin = null;
}

function fermerAdmin(enregistrer, lire) {
  if (typeof lire === "function") lire();      // toujours relire les champs avant de trancher
  if (enregistrer) {
    const pb = verifierCoherence(REF);
    if (pb.length && !confirm(`${pb.length} incohérence${pb.length > 1 ? "s" : ""} détectée`
      + `${pb.length > 1 ? "s" : ""} :\n\n· ${pb.slice(0, 12).join("\n· ")}`
      + (pb.length > 12 ? `\n… et ${pb.length - 12} autres.` : "")
      + `\n\nEnregistrer quand même ?`)) return;
    enregistrerReglages();
    snapAdmin = null;
  } else {
    const modifie = snapAdmin
      && JSON.stringify({ r: REF, t: TARIFS }) !== JSON.stringify({ r: snapAdmin.ref, t: snapAdmin.tar });
    if (modifie && !confirm("Fermer sans enregistrer ? Les modifications seront perdues.")) return;
    restaurerReglages();
  }
  $("calques").innerHTML = "";
  document.onkeydown = null;
  peuplerSelect(); relancer();
}

/* ------------------------------------------------------------------ */
/* Calibration de la nettete — deux voies, deux references             */
/* -------------------------------------------------------------------- */
/* Le seuil de reference d'Ernest (1,5 px) est mesure sur les pixels    */
/* natifs extraits par PyMuPDF. Ici il y a DEUX chemins de mesure qui   */
/* ne produisent pas la meme valeur sur un meme visuel : un PDF passe   */
/* par un rendu navigateur qui ajoute son lissage, une image est lue    */
/* pixel par pixel sans aucun rendu. Chaque voie a donc sa reference.   */
/* ------------------------------------------------------------------ */
let CALIB = [];

async function mesurerUnFichier(f) {
  const buf = await f.arrayBuffer();
  if (estImage(f)) {
    const genre = genreImage(f);
    const dec = await decoderImage(buf, genre === "png" ? "image/png" : "image/jpeg");
    const gr = grisDeBitmap(dec.bmp, dec.W, dec.H, NETTETE.budgetPx);
    const m = await mesurerNettete(null, null, 1, 1,
      { g: gr.g, W: gr.W, H: gr.H, recadre: gr.recadre });
    return Object.assign({ nom: f.name, source: genre.toUpperCase(),
                           nbImages: 1, dpiImage: null, couverture: 1,
                           pxL: dec.W, pxH: dec.H }, m);
  }
  const doc = await pdfjsLib.getDocument({ data: new Uint8Array(buf.slice(0)) }).promise;
  const pg = await doc.getPage(1);
  const sr = await sondeRaster(pg);
  const m = await mesurerNettete(buf, sr.dpiImage, 1);
  return Object.assign({ nom: f.name, source: "PDF" }, sr, m);
}

  const etendue = (a) => a.length > 1
    ? Math.max.apply(null, a) / Math.min.apply(null, a) : null;

/* Les matieres proposees a la saisie sont exactement celles que portent les
   produits. Une liste ecrite en dur finirait par diverger du referentiel, et
   comme le filtre matiere est strict, une chute saisie « ALU » au lieu de
   « ALUPANEL » ne serait proposee nulle part sans qu'on comprenne pourquoi. */
function matieresDuReferentiel() {
  const vues = new Map();
  for (const p of REF) {
    if (!p.matiere) continue;
    const eps = epaisseursDe(p.epaisseur_mm);
    if (!eps.length) { const c = p.matiere + "|";
      if (!vues.has(c)) vues.set(c, { matiere: p.matiere, epaisseur: null,
        libelle: p.matiere.charAt(0) + p.matiere.slice(1).toLowerCase() }); continue; }
    for (const e of eps) { const c = p.matiere + "|" + e;
      if (!vues.has(c)) vues.set(c, { matiere: p.matiere, epaisseur: e,
        libelle: p.matiere.charAt(0) + p.matiere.slice(1).toLowerCase() + " " + e + " mm" }); }
  }
  return [...vues.values()].sort((a, b) => a.libelle.localeCompare(b.libelle, "fr"));
}

function ouvrirChutes() {
  const dispo = CHUTES.filter((c) => c.statut === "dispo");
  const mats = matieresDuReferentiel();
  const parMat = {};
  for (const c of dispo) parMat[c.matiere] = (parMat[c.matiere] || 0) + 1;
  $("admContenu").innerHTML = `
    <div class="aidepan">Largeur, hauteur, matière. Entrée valide et repart sur la largeur.

      <th>Largeur</th><th>Hauteur</th><th>Surface</th><th>Origine</th><th></th></tr></thead><tbody>
      ${dispo.slice().sort((a, b) => b.L * b.H - a.L * a.H).map((c) => `<tr>
        <td class="txt"><input value="${c.ref}" readonly></td>
        <td class="txt"><input value="${c.matiere}" readonly></td>
        <td class="num"><input value="${c.epaisseur || ""}" readonly></td>

        <td class="act"><button class="sup" data-ch="${c.ref}" title="Retirer du stock">×</button></td>
      </tr>`).join("")}
    </tbody></table>`;

  const ajouter = () => {
    const L = parseFloat(String($("chL").value).replace(",", "."));
    const H = parseFloat(String($("chH").value).replace(",", "."));
    const m = mats[+$("chMat").value];
    if (!(L > 0 && H > 0)) { alert("Largeur et hauteur sont attendues, en centimètres."); $("chL").focus(); return; }
    if (!m) { alert("Aucune matière disponible : renseigner la colonne Matière des produits rigides."); return; }
    CHUTES.push({ ref: refChute(), matiere: m.matiere, epaisseur: m.epaisseur,
                  L, H, statut: "dispo", cree_le: new Date().toISOString() });
    sauverChutes();
    const garde = $("chMat").value;      /* on enchaine sur la meme matiere */
    ouvrirChutes();
    $("chMat").value = garde;
    $("chL").focus();
  };
  $("chAdd").onclick = ajouter;
  for (const id of ["chL", "chH", "chMat"])
    $(id).onkeydown = (e) => {
      if (e.key !== "Enter") return;
      if (id === "chL" && $("chH").value === "") { $("chH").focus(); return; }
      ajouter();
    };
  $("chCsv").onclick = () => telecharger(new TextEncoder().encode(versCsv(CHUTES)),
    `chutes-idj-${new Date().toISOString().slice(0, 10)}.csv`);
  for (const b of $("admContenu").querySelectorAll("button.sup")) b.onclick = () => {
    const c = CHUTES.find((x) => x.ref === b.dataset.ch);
    if (!c || !confirm(`Retirer ${c.ref} (${c.L} × ${c.H} ${c.matiere}) du stock ?`)) return;
    c.statut = "retiree"; sauverChutes(); ouvrirChutes();
  };
  $("chL").focus();
}
