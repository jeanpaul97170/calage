  /* Un document a plusieurs pages : l'operateur doit toutes les voir.
     Fleches de navigation, la page affichee est rendue a la demande. */
  const nbP = vues.nbPages || 1;
  const faces = estCahier(p, nbP) ? imposer(nbP) : null;
  const nbVues = faces ? faces.length : nbP;
  let etiq = `page <b>${PAGE_VUE}</b> sur ${nbP}`;
  if (faces) {
    const f = faces[Math.min(PAGE_VUE, nbVues) - 1];
    etiq = `feuille <b>${f.feuille}</b> · <b>${f.face}</b> · pages ${f.g} et ${f.d}`
         + ` <span class="sur">${PAGE_VUE} / ${nbVues} faces</span>`;
  }
  const navP = `
  <div class="navpage">
    ${nbVues > 1 ? `
    <button id="pgPrec" ${PAGE_VUE <= 1 ? "disabled" : ""} aria-label="Précédent">&#8592;</button>
    <span>${etiq}</span>
    <button id="pgSuiv" ${PAGE_VUE >= nbVues ? "disabled" : ""} aria-label="Suivant">&#8594;</button>` : ""}
    <button id="actualiser" class="actu" title="Relancer l'analyse avec le produit et les dimensions actuels">
      ${ico(ICO.autre)}Actualiser</button>
  </div>`;
  const fpAvant = r.fpIntegre || r.trim;
  const bp = bandesDePli(p, p.fond_perdu_mm / 2);
  const attendu = bp ? (bp.total + p.fond_perdu_mm) / 10 : 0;
  const pliVisible = !!pliPertinent(p, vues.avant.largCm, p.fond_perdu_mm / 2);
  const ech = duo ? { largMax: Math.max(vues.avant.largCm, vues.apres.largCm),
                      hautMax: Math.max(vues.avant.hautCm, vues.apres.hautCm) } : null;
  return `
  ${navP}
  <div class="tete-apercus">
    <span>${duo ? "Fichier client et fichier corrigé" : "Fichier client"}</span>
    <button id="apGrand">Ouvrir en grand</button>
  </div>
  <div class="apercus${duo ? " duo" : ""}">
    ${figureApercu(vues.avant, "Fichier client", p, fpAvant, ech, compareDemandeFourni(r, p))}
    ${duo ? figureApercu(vues.apres, "Après correction", p, p.fond_perdu_mm > 0, ech) : ""}
  </div>
  <div class="leg">
    ${p.fond_perdu_mm > 0 ? `<span>— — trait de coupe</span>` : ""}
    ${p.marge_secu_mm > 0 ? `<span style="color:#B5651D">· · · zone de sécurité ${p.marge_secu_mm} mm</span>` : ""}
    ${(vues.avant && vues.avant.face) ? `<span style="color:#B02020">— pli</span>
      <span style="color:#B5651D">· · · marge au pli ${margeAuPli(p)} mm de chaque côté</span>` : ""}
    ${(() => { const o = posOeillets(p, dimsSaisies());
      return o ? `<span style="color:#1F6FB5">◉ ${o.nb} œillets · rien d'important dans le cercle clair</span>` : ""; })()}
    ${p.plis ? `<span style="color:var(--marque)">zone de pli interdite, ${p.marge_pli_mm} mm de part et d'autre · volets ${String(p.plis).split(":")[1].split(",").join(" / ")} mm</span>` : ""}
    ${p.plis && !pliVisible ? `<span>repères de pli masqués : le fichier n'est pas au format ${attendu.toFixed(1)} cm de large</span>` : ""}
    <span>le damier représente le hors-format</span>
  </div>`;
}

/* CODE-MONTANT-NOM, par exemple KAK-60-71.00-affiche_client.pdf */
function nommer(p, r, nomFichier) {
  const etat = devisMemo[p.code];
  const dv = etat ? calculerDevis(p, r, dimsSaisies(), etat) : null;
  const montant = dv ? dv.total.toFixed(2) : "SANSTARIF";
  /* Quel que soit le format d'entree, ce qui sort est un PDF : une image
     deposee est convertie des le depot. Le nom doit le dire. */
  const propre = String(nomFichier)
    .replace(/\.(pdf|jpe?g|png)$/i, "")
    .replace(/[\\/:*?"<>|]/g, "-").replace(/\s+/g, "_");
  return `${p.code}-${montant}-${propre}.pdf`;
}

async function telecharger(octets, nom) {
  if (await ecrireDansDossier(octets, nom)) {
    const e = $("etatDossier");
    if (e) { const l = e.textContent; e.textContent = "écrit : " + nom; setTimeout(() => e.textContent = l, 2600); }
    return;
  }
  /* Le type etait fige sur application/pdf : un CSV telecharge sous cette
     etiquette est ouvert de travers par le systeme, quand il n'est pas
     bloque. On le deduit de l'extension. */
  const ext = String(nom).split(".").pop().toLowerCase();
  const type = ext === "csv" ? "text/csv;charset=utf-8"
             : ext === "json" ? "application/json"
             : ext === "js" ? "text/javascript"
             : "application/pdf";
  const url = URL.createObjectURL(new Blob([octets], { type }));
  const a = document.createElement("a");
  a.href = url; a.download = nom; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function ico(d) {
  return `<svg viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
}
const ICO = {
  copier: '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>',
  bat:    '<path d="M14 3v5h5"/><path d="M19 8v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7z"/><path d="M9 15h6"/>',
  telech: '<path d="M12 4v11"/><path d="M8 11l4 4 4-4"/><path d="M4 19h16"/>',
  autre:  '<path d="M4 12a8 8 0 1 1 2.3 5.6"/><path d="M4 20v-5h5"/>',
};


/* Bloc « À vérifier à l'œil » — au plus trois questions, deux réponses chacune. */
/* Bloc « À vérifier à l'œil ». Un aperçu par côté concerné, avec des flèches
   pour passer de l'un à l'autre : le texte peut être coupé à plusieurs
   endroits, l'opérateur doit pouvoir tous les inspecter avant de trancher. */
let VUE_COTE = 0;
let PAGE_VUE = 1;
let ROT_MANU = 0;          /* angle cumule applique au fichier client */

/* Vignettes decoupees sur les BOITES fautives, pas sur les blocs de la
   sonde pixel. La sonde ne distingue pas un texte d'un feuillage decoratif,
   et sur un fichier charge le feuillage l'emportait au nombre de blocs :
   l'operateur recevait trois vues de fleurs et jamais l'adresse collee au
   bord. Ici on part de la mesure exacte, triee par distance au bord. */
async function zonesDesCoupables(buffer, r, p, noPage) {
  const co = (r.coupables || []).filter((c) => c.quoi !== "image");
  if (!co.length || !r.bande) return [];
  try {
    const doc = await ouvrirPdf(buffer);
    const page = await doc.getPage(noPage || 1);
    const v1 = page.getViewport({ scale: 1 });
    /* regroupement : deux textes voisins ne font qu'une vignette */
    const k = 2;                       /* base de calcul des fenetres */
    const W = v1.width * k, H = v1.height * k;
    const grp = [];
    for (const x of co) {
      const g = grp.find((q) => q.cote === x.cote
        && !(x.x1 < q.x0 - 40 || x.x0 > q.x1 + 40 || x.y1 < q.y0 - 40 || x.y0 > q.y1 + 40));
      if (!g) { grp.push({ cote: x.cote, x0: x.x0, x1: x.x1, y0: x.y0, y1: x.y1, d: x.d, quoi: x.quoi }); continue; }
      g.x0 = Math.min(g.x0, x.x0); g.x1 = Math.max(g.x1, x.x1);
      g.y0 = Math.min(g.y0, x.y0); g.y1 = Math.max(g.y1, x.y1);
      g.d = Math.min(g.d, x.d);
    }
    grp.sort((a, b) => a.d - b.d);

    const [RX0, RY0, RX1, RY1] = r.bande.ref || [0, 0, v1.width, v1.height];
    const marge = versPagePtDe(p, r);
    const LIB = { haut: "bord haut", bas: "bord bas", gauche: "bord gauche", droite: "bord droit" };
    const out = [];
    for (const g of grp.slice(0, 3)) {
      /* fenetre : la boite fautive, plus une respiration de 3 marges */
      /* Assez de contexte pour juger : le coupable seul, sorti de son
         entourage, ne dit pas si le texte est volontairement a fond perdu
         ou s'il a debordé. On prend six marges autour, au moins 2 cm. */
      const air = Math.max(marge * 6, 57);
      const px = (v) => v * k, py = (v) => (v1.height - v) * k;
      let fx0 = Math.max(0, px(g.x0 - air)), fx1 = Math.min(W, px(g.x1 + air));
      let fy0 = Math.max(0, py(g.y1 + air)), fy1 = Math.min(H, py(g.y0 - air));
      const lw = fx1 - fx0, lh = fy1 - fy0;
      if (lw < 10 || lh < 10) continue;
      /* On RE-RESTITUE la zone a la bonne echelle au lieu d'agrandir des
         pixels deja rendus. Un agrandissement ne cree aucun detail : les
         vignettes etaient tirees d'un rendu a 108 dpi puis etirees x4. */
      /* Rendu a environ deux fois la taille d'affichage, pour rester net
         sur un ecran a forte densite sans calculer des pixels inutiles. */
      const ech = Math.min(6, Math.max(1.2, 660 / Math.max(lw, lh)));
      const c2 = document.createElement("canvas");
      c2.width = Math.round(lw * ech); c2.height = Math.round(lh * ech);
      const x2 = c2.getContext("2d");
      x2.fillStyle = "#fff"; x2.fillRect(0, 0, c2.width, c2.height);
      await page.render({ canvasContext: x2,
        viewport: page.getViewport({ scale: k * ech,
                                     offsetX: -fx0 * ech, offsetY: -fy0 * ech }) }).promise;
      const X = (v) => (px(v) - fx0) * ech, Y = (v) => (py(v) - fy0) * ech;
      x2.lineWidth = Math.max(1.4, ech);
      x2.strokeStyle = "#B02020"; x2.setLineDash([]);
      x2.strokeRect(X(RX0), Y(RY1), (RX1 - RX0) * k * ech, (RY1 - RY0) * k * ech);
      x2.strokeStyle = "#B5651D"; x2.setLineDash([ech * 4, ech * 3]);
      x2.strokeRect(X(RX0 + marge), Y(RY1 - marge),
                    (RX1 - RX0 - 2 * marge) * k * ech, (RY1 - RY0 - 2 * marge) * k * ech);
      const mm = (v) => (v / 72 * 25.4 / (r.echelle || 1));
      out.push({ url: c2.toDataURL("image/png"), cote: g.cote,
                 libelle: `${LIB[g.cote]} · ${g.quoi} à ${mm(g.d).toFixed(1)} mm du bord` });
    }
    return out;
  } catch (e) { return []; }
}

function versPagePtDe(p, r) {
  return (p.marge_secu_mm / 25.4 * 72) * (r.echelle || 1);
}

/* ==================================================================== */
/* VERIFICATION A L'OEIL DE LA NETTETE                                  */
/* -------------------------------------------------------------------- */
/* Posee UNIQUEMENT quand la mesure fine n'a pas abouti : la poser sur   */
/* tous les fichiers serait un geste ajoute.                             */
/* La reponse est horodatee, journalisee, versee aux reserves du bon a   */
/* tirer : le verdict devient une declaration d'operateur datee,         */
/* opposable en litige. AUCUN APPRENTISSAGE : les seuils ne derivent pas */
/* tout seuls, ils se modifient dans l'admin, avec une date et un motif. */
/* ==================================================================== */
/* Question de nettete, rendue A L'INTERIEUR du panneau unique. */
function questionNettete(r, p) {
  if (r.sansRaster) return "";
  const n = noteNettete(r.nettete, p);
  if (n && n.mesure) return "";
  const rep = VERIFS.nettete;
  const intro = n
    ? `Le calcul donne <b>${n.utile} dpi à la taille commandée</b>${
        n.mini ? `, pour un minimum de ${n.mini}` : ""}. C'est un plafond :
       la mesure fine des contours n'a pas abouti.`
    : `La mesure automatique de netteté n'a pas abouti sur ce fichier.${
        p.dpi_mini ? ` Le minimum pour ce produit est de ${p.dpi_mini} dpi.` : ""}`;
  if (rep) return `
    <div class="verif tranche">
      <h3><span class="vpast ${rep.reponse === "flou" ? "vko" : "vok"}"></span>
        La netteté — ${rep.libelle}
        <button data-vid="nettete" data-rep="">Revenir dessus</button></h3>
    </div>`;
  return `
    <div class="verif">
      <h3>La netteté</h3>
      <p class="vleg">${intro} <b>Cliquer une vignette ci-dessus</b> : elle s'ouvre à la
        taille d'impression, celle à laquelle le client verra le tirage. Le bouton
        « Agrandi » permet ensuite d'aller chercher un détail.</p>
      <p class="vq">Le texte est-il net à la taille d'impression ?</p>
      <div class="vbtn">
        <button data-vid="nettete" data-rep="net">Net</button>
        <button data-vid="nettete" data-rep="limite">Acceptable, à signaler</button>
        <button data-vid="nettete" data-rep="flou">Flou</button>
      </div>
    </div>`;
}

/* Panneau AUTONOME de nettete : uniquement quand blocVerifs n'a rien
   affiche, sinon la question serait posee deux fois. */
function blocVerifNettete(r, p) {
  if (r.sansRaster) return "";                    /* page vectorielle */
  const zonesLa = (r.bande && ((r.bande.zones && r.bande.zones.length)
                 || (r.bande.apercus && r.bande.apercus.length) || r.bande.apercu));
  if (zonesLa) return "";                         /* deja dans blocVerifs */
  const n = noteNettete(r.nettete, p);
  if (n && n.mesure) return "";                   /* mesure fine aboutie */
  /* n peut etre NUL — un PDF n'a pas d'etage 1 arithmetique. La pastille
     disait alors « a verifier a l'oeil » sans rien proposer au clic. */
  const zs = (r.bande && r.bande.zonesTexte && r.bande.zonesTexte.length)
    ? r.bande.zonesTexte : [];
  const rep = VERIFS.nettete;
  const vig = zs.length
    ? `<figure class="zone"><img src="${zs[0].url}" alt="" data-zoom="net"${
        zs[0].mm ? ` data-mm="${zs[0].mm.toFixed(1)}"` : ""}>
         <figcaption>${zs[0].libelle}</figcaption></figure>`
    : "";
  const corps = `
    ${vig}
    <p class="vleg">${n
      ? `Le calcul donne <b>${n.utile} dpi à la taille commandée</b>${
          n.mini ? `, pour un minimum de ${n.mini}` : ""}. C'est un plafond : la mesure
         fine des contours n'a pas abouti sur ce fichier.`
      : `La mesure automatique de netteté n'a pas abouti sur ce fichier.${
          p.dpi_mini ? ` Le minimum pour ce produit est de ${p.dpi_mini} dpi.` : ""}`}
      ${vig ? "<b>Cliquer sur la vignette : elle s'ouvre à la taille d'impression.</b>"
            : "Ouvrir l'aperçu en grand pour juger."}</p>`;
  if (rep) return `<div class="pan verifs" id="verifOeil">
    <div class="tete">Netteté vérifiée à l'œil</div>
    <details class="okrepli"><summary>Vérifié : <b>${rep.libelle}</b>
      <button data-vid="nettete" data-rep="">Revenir dessus</button></summary>
      ${corps}</details></div>`;
  return `<div class="pan verifs" id="verifOeil">
    <div class="tete">Netteté — à vérifier à l'œil</div>
    ${corps}
    <p class="vq"><b>Le texte est-il net à la taille d'impression ?</b></p>
    <div class="vrep">
      <button data-vid="nettete" data-rep="net">Net</button>
      <button data-vid="nettete" data-rep="limite">Acceptable, à signaler</button>
      <button data-vid="nettete" data-rep="flou">Flou</button>
    </div></div>`;
}

function blocVerifs(r, p) {
  /* Priorite aux vignettes construites sur le texte mesure ; celles de la
     sonde pixel ne servent que sur un fichier entierement aplati. */
  const zones = (r.bande && r.bande.zonesTexte && r.bande.zonesTexte.length)
    ? r.bande.zonesTexte
    : ((r.bande && r.bande.zones) ? r.bande.zones : []);
  const ap = (r.bande && r.bande.apercus) ? r.bande.apercus
           : (r.bande && r.bande.apercu ? [r.bande.apercu] : []);
  if (!zones.length && !ap.length) return "";

  /* Quand la mesure sait OU ca coince, on ne fait plus balayer quatre bandes
     entieres : on montre deux ou trois vignettes centrees sur les endroits
     litigieux, chacune a un zoom lisible et nommee. La bande complete reste
     le repli quand la localisation n'est pas possible. */
  if (zones.length) {
    const rep0 = VERIFS.bande;
    const cotes = [...new Set(zones.map((z) => z.cote))];
    const corpsZ = `
      <div class="zgrille">${zones.map((z, i) => `
        <figure class="zone">
          <img src="${z.url}" alt="" data-zoom="z${i}"${z.mm ? ` data-mm="${z.mm.toFixed(1)}"` : ""}>
          <figcaption>${z.libelle}</figcaption>
        </figure>`).join("")}</div>
      <p class="vleg">Trait rouge : la coupe. Pointillés orange : la limite de sécurité
        (${p.marge_secu_mm} mm). ${zones.length > 1 ? "Ces " + zones.length + " endroits sont les seuls"
        : "Cet endroit est le seul"} où l'outil a vu du texte ou un filet dans la bande.
        <b>Cliquer pour agrandir.</b></p>`;
    if (rep0) {
      return `<div class="pan verifs" id="verifOeil">
        <div class="tete">À vérifier à l'œil</div>
        <details class="okrepli"><summary>Le bord du visuel — <b>${rep0.libelle}</b>
          <button data-vid="bande" data-rep="">Revenir dessus</button></summary>
          ${corpsZ}</details>
        ${questionNettete(r, p)}</div>`;
    }
    return `<div class="pan verifs" id="verifOeil">
      <div class="tete">À vérifier à l'œil</div>
      <p class="vintro">L'app ne peut pas mesurer ce point toute seule. Elle a repéré
        ${zones.length === 1 ? "l'endroit concerné" : "les " + zones.length + " endroits concernés"} :
        regardez et répondez. Votre réponse est enregistrée, datée, et reprise dans le rapport.</p>
      <div class="verif">
        <h3>${cotes.length > 1 ? "Le bord du visuel — " + cotes.length + " côtés concernés"
             : "Le bord du visuel"}</h3>
        ${corpsZ}
        <p class="vq">Est-ce que quelque chose d'important touche ou dépasse les pointillés ?</p>
        <div class="vbtn">
          <button data-vid="bande" data-rep="oui" data-cotes="${cotes.join(",")}">Oui, ça risque d'être coupé</button>
          <button data-vid="bande" data-rep="non" data-cotes="${cotes.join(",")}">Non, c'est convenable</button>
        </div>
      </div>
      ${questionNettete(r, p)}</div>`;
  }
  const NOM = { haut: "en haut", bas: "en bas", gauche: "à gauche", droite: "à droite" };
  if (VUE_COTE >= ap.length) VUE_COTE = 0;
  const v = ap[VUE_COTE];
  const rep = VERIFS.bande;
  const nav = ap.length > 1 ? `
      <div class="vnav">
        <button data-cote="${(VUE_COTE - 1 + ap.length) % ap.length}" aria-label="Côté précédent">&#8592;</button>
        <span>${ap.map((a, i) => `<b class="${i === VUE_COTE ? "on" : ""}">${NOM[a.cote]}</b>`).join("")}</span>
        <button data-cote="${(VUE_COTE + 1) % ap.length}" aria-label="Côté suivant">&#8594;</button>
      </div>` : "";
  const titre = ap.length > 1
    ? `Le bord du visuel — ${ap.length} côtés à vérifier`
    : `La coupe ${NOM[v.cote]} du visuel`;

  const corps = `
      ${nav}
      <img src="${v.url}" alt="" data-zoom="bande">
      <p class="vleg">Trait rouge : la coupe. Pointillés orange : la limite de sécurité (${p.marge_secu_mm} mm).
        Tout ce qui dépasse les pointillés vers le rouge risque d'être entamé.
        <b>Cliquer sur l'image pour l'agrandir.</b></p>`;

  if (rep) return `<div class="pan verifs" id="verifOeil">
    <div class="tete">À vérifier à l'œil</div>
    ${questionNettete(r, p)}
    <details class="verif tranche">
      <summary><span class="vpast ${rep.reponse === "oui" ? "vko" : "vok"}"></span>
        ${titre} — ${rep.libelle}
        <button data-vid="bande" data-rep="">Revenir dessus</button></summary>
      ${corps}
    </details>
  </div>`;

  return `<div class="pan verifs" id="verifOeil">
    <div class="tete">À vérifier à l'œil</div>
    <p class="vintro">L'app ne peut pas mesurer ce point toute seule. Regardez l'image et répondez :
      votre réponse est enregistrée, datée, et reprise dans le rapport.</p>
    <div class="verif">
      <h3>${titre}</h3>
      ${corps}
      <p class="vq">Est-ce que quelque chose d'important touche ou dépasse les pointillés${ap.length > 1 ? ", sur l'un des côtés" : ""} ?</p>
      <div class="vbtn">
        <button data-vid="bande" data-rep="oui">Oui, ça risque d'être coupé</button>
        <button data-vid="bande" data-rep="non">Non, c'est convenable</button>
      </div>
    </div>
    ${questionNettete(r, p)}
  </div>`;
}

function brancherVerifs(r, p, nomFichier, corrige) {
  /* plein écran pour vérifier à l'œil nu, fermé par clic ou Échap */
  /* Agrandissement, avec bascule TAILLE D'IMPRESSION.
     Juger une nettete sur une vignette zoomee n'a aucun sens : tout parait
     flou. A l'echelle 1, l'operateur voit ce que le client verra. La largeur
     physique de la vignette est portee par `data-mm`. */
  for (const im of document.querySelectorAll("img[data-zoom]")) {
    im.onclick = () => {
      const mm = parseFloat(im.dataset.mm || "0");
      const d = document.createElement("div");
      d.className = "loupe";
      d.innerHTML = `<img src="${im.src}" alt="">
        <div class="loupe-barre">
          ${mm > 0 ? `<button class="lp-t on" data-mode="reel">Taille d'impression</button>
                      <button class="lp-t" data-mode="zoom">Agrandi</button>` : ""}
          <button class="lp-f">Fermer</button>
        </div>`;
      const img = d.querySelector("img");
      /* Ouverture DIRECTE a la taille d'impression : c'est la seule taille a
         laquelle un jugement de nettete a un sens. « Agrandi » reste a un
         clic pour aller chercher un detail. */
      if (mm > 0) {
        img.style.width = mm + "mm"; img.style.maxWidth = "none";
        img.style.maxHeight = "none"; img.style.imageRendering = "auto";
      }
      const fermer = () => { d.remove(); document.onkeydown = null; };
      d.onclick = (e) => { if (e.target === d) fermer(); };
      d.querySelector(".lp-f").onclick = fermer;
      for (const b of d.querySelectorAll(".lp-t")) b.onclick = (e) => {
        e.stopPropagation();
        for (const x of d.querySelectorAll(".lp-t")) x.classList.remove("on");
        b.classList.add("on");
        if (b.dataset.mode === "reel") {
          img.style.width = mm + "mm"; img.style.maxWidth = "none";
          img.style.maxHeight = "none"; img.style.imageRendering = "auto";
        } else {
          img.style.width = ""; img.style.maxWidth = "";
          img.style.maxHeight = ""; img.style.imageRendering = "";
        }
      };
      document.onkeydown = (e) => { if (e.key === "Escape") fermer(); };
      document.body.appendChild(d);
    };
  }
  const allerPage = async (n) => {
    const nbP = vues.nbPages || 1;
    const faces = estCahier(p, nbP) ? imposer(nbP) : null;
    const total = faces ? faces.length : nbP;
    if (n < 1 || n > total || n === PAGE_VUE) return;
    PAGE_VUE = n;
    /* La vue « client » se rend depuis le FICHIER CLIENT, la vue « apres »
       depuis le fichier corrige. Rendre les deux depuis `source` affichait
       le corrige sous le libelle « fichier client » des qu'on changeait de
       feuille, et faisait disparaitre la correction. */
    const client = SOURCE_INIT || source;
    const aCorrige = !!corrige && source !== client;
    const rendre = async (buf) => faces
      ? await apercuFace(buf, faces[n - 1].g, faces[n - 1].d, 0, p)
      : await apercu(buf, n);
    const a = await rendre(client);
    const b2 = aCorrige ? await rendre(source) : null;
    if (a) { vues.avant = a; vues.apres = b2; vues.avantA = null; vues.apresA = null; }
    afficher(r, p, nomFichier, corrige);
  };
  if ($("cBlanc")) $("cBlanc").onchange = () => { CHOIX_BLANC = $("cBlanc").checked; };
  if ($("actualiser")) $("actualiser").onclick = () => { PAGE_VUE = 1; relancer(); };
  if ($("pgPrec")) $("pgPrec").onclick = () => allerPage(PAGE_VUE - 1);
  if ($("pgSuiv")) $("pgSuiv").onclick = () => allerPage(PAGE_VUE + 1);

  for (const b of document.querySelectorAll("[data-cote]")) {
    b.onclick = (ev) => {
      ev.preventDefault(); ev.stopPropagation();
      VUE_COTE = parseInt(b.dataset.cote, 10) || 0;
      afficher(r, p, nomFichier, corrige);
    };
  }
  for (const b of document.querySelectorAll("[data-vid]")) {
    b.onclick = (ev) => {
      ev.preventDefault(); ev.stopPropagation();
      const id = b.dataset.vid, rep = b.dataset.rep;
      if (!rep) delete VERIFS[id];
      else VERIFS[id] = { reponse: rep, libelle: b.textContent, quand: new Date(),
                          cotes: (b.dataset.cotes || "").split(",").filter(Boolean) };
      afficher(r, p, nomFichier, corrige);
    };
  }
}

/* ==================================================================== */
/* LA REPONSE DE L'OPERATEUR PILOTE LE CONSTAT                          */
/* -------------------------------------------------------------------- */
/* Jusqu'ici les deux reponses laissaient exactement le meme ecran : on  */
/* demandait a l'operateur de trancher, et on ignorait sa reponse.       */
/*  - « c'est convenable » : la mesure s'est alarmee pour rien, le       */
/*    passe au vert et porte la trace de qui a tranche et quand.         */
/*  - « ca risque d'etre coupe » : le risque est confirme, le constat    */
/*    reste orange et alimente les reserves du bon a tirer.              */
/* Idempotent : l'etat d'origine est conserve, retirer la reponse remet  */
/* le constat exactement comme il etait.                                 */
/* ==================================================================== */
function appliquerVerifs(r) {
  if (!r || !Array.isArray(r.constats)) return r;
  /* Netteté jugée à l'œil : la réponse devient un constat daté. C'est la
     trace opposable, à la place d'une pastille restée muette. */
  const vn = VERIFS.nettete;
  if (vn && !r.constats.some((c) => c[4] === "NET_OEIL")) {
    const qn = new Date(vn.quand);
    const hn = `${qn.toLocaleDateString("fr-FR")} à ${qn.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}`;
    const niv = vn.reponse === "flou" ? "ROUGE" : vn.reponse === "limite" ? "ORANGE" : "VERT";
    const txt = vn.reponse === "flou"
        ? `Netteté jugée insuffisante à l'œil par l'opérateur le ${hn}. Fichier à reprendre auprès du client.`
      : vn.reponse === "limite"
        ? `Netteté jugée acceptable avec réserve à l'œil par l'opérateur le ${hn}. À signaler au client avant tirage.`
        : `Netteté jugée correcte à l'œil par l'opérateur le ${hn}.`;
    r.constats.push([niv, txt, "", "", "NET_OEIL"]);
    if (r.codes && r.codes.add) r.codes.add("NET_OEIL");
  }
  const rep = VERIFS.bande && VERIFS.bande.reponse;
  const q = VERIFS.bande ? new Date(VERIFS.bande.quand) : null;
  const heure = q ? `${q.toLocaleDateString("fr-FR")} à ${q.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}` : "";
  for (const c of r.constats) {
    if (c[4] !== "SECU") continue;
    if (c.orig === undefined) c.orig = [c[0], c[1], c[2]];
    if (rep === "non") {
      c[0] = "VERT";
      c[1] = `Le bord du visuel a été vérifié à l'écran : c'est convenable, rien d'important n'arrive `
           + `au bord. Contrôlé par l'opérateur le ${heure}.`;
      c[2] = `La mesure automatique avait signalé ce point ; la vérification visuelle l'a levé.`;
    } else if (rep === "oui") {
      c[0] = "ORANGE";
      c[1] = c.orig[1] + ` Confirmé à l'écran par l'opérateur le ${heure} : le risque est réel.`;
      c[2] = c.orig[2];
    } else {
      c[0] = c.orig[0]; c[1] = c.orig[1]; c[2] = c.orig[2];
    }
  }
  /* le verdict global se recalcule : sinon l'ecran resterait « a signaler »
     alors que le seul point orange vient d'etre leve */
  const rang = { VERT: 0, NOTE: 0, RELEVE: 0, ORANGE: 1, ROUGE: 2 };
  let pire = 0;
  for (const c of r.constats) pire = Math.max(pire, rang[c[0]] || 0);
  r.verdict = pire === 2 ? "ROUGE" : pire === 1 ? "ORANGE" : "VERT";
  return r;
}

function afficher(r, p, nomFichier, corrige) {
  PROG_ON = false;
  appliquerVerifs(r);
  /* vignettes construites sur les boites fautives, en tache de fond */
  if (r.coupables && r.coupables.length && r.bande && !r.bande.zonesTexte && !ZONES_EN_COURS) {
    ZONES_EN_COURS = true;
    zonesDesCoupables(SOURCE_INIT || source, r, p, PAGE_VUE).then((z) => {
      ZONES_EN_COURS = false;
      if (z && z.length) { r.bande.zonesTexte = z; afficher(r, p, nomFichier, corrige); }
      else if (r.bande) r.bande.zonesTexte = [];
    }).catch(() => { ZONES_EN_COURS = false; });
  }
  /* format fini du fichier recu : c'est ce que le client obtiendra */
  if (r && r.lp > 0 && r.hp > 0) {
    /* En signaletique la coupe se fait a la main, il n'y a pas de fond
       perdu : ce que le client commande, c'est la piece telle qu'elle est
       livree, page comprise. En imprimerie au contraire on commande un
       format FINI, la marge de coupe part au massicot. */
    const surMesure = p && p.fond_perdu_mm === 0 && vues.avant;
    const lF = surMesure ? vues.avant.largCm : r.lp;
    const hF = surMesure ? vues.avant.hautCm : r.hp;
    DIMS_FICHIER = { larg: Math.round(lF * 10) / 10, haut: Math.round(hF * 10) / 10 };
    if (!RATIO_FICHIER) RATIO_FICHIER = DIMS_FICHIER.larg / DIMS_FICHIER.haut;
    setTimeout(majRepriseDim, 0);
  }
  _dernierR = r;
  const [code, quoi, aide] = LIB[r.verdict];

  const outils = `
    <div class="barreoutils">
      <button class="primaire" id="rapport">${ico(ICO.copier)}Afficher le rapport</button>
      <button id="copier">${ico(ICO.telech)}Rapport atelier</button>
      <button id="rapClient">${ico(ICO.telech)}Rapport client</button>
      ${r.verdict !== "VERT" ? `<button id="bat">${ico(ICO.bat)}Éditer le bon à tirer</button>` : ""}

      ${(SOURCE_INIT && source !== SOURCE_INIT)
          ? `<button id="revenir">Revenir au fichier client</button>` : ""}
      <button id="pivoter">Pivoter le fichier 90°</button>
    </div>`;

  const ligne = ([n, t, cons, mes]) => {
    const m = t.match(/\s\s\[(.+?)\]$/);
    const pages = m ? m[1] : "";
    const texte = m ? t.slice(0, m.index) : t;
    return `<div class="lignec"><span class="etat-c e-${n}">${n}</span><span>${texte}`
      + (mes ? ` <span class="mes">(${mes})</span>` : "")
      + (cons ? `<span class="cons">${cons}</span>` : "")
      + `</span><span class="pages">${pages}</span></div>`;
  };
  /* Les conformes sont repliés : cinq lignes vertes noient la seule qui compte. */
  const conformes = r.constats.filter(([n]) => n === "VERT");
  const autres = r.constats.filter(([n]) => n !== "VERT");
  const lignes = autres.map(ligne).join("")
    + (conformes.length ? `<details class="okrepli"><summary>${conformes.length} contrôle${conformes.length > 1 ? "s" : ""} conforme${conformes.length > 1 ? "s" : ""}</summary>${conformes.map(ligne).join("")}</details>` : "");

  /* Synthèse : la phrase que l'opérateur lit au client. Elle se construit
     à partir des conséquences, pas d'un libellé technique. */
  const pires = r.constats.filter(([n]) => n === "ROUGE" || n === "ORANGE");
  const phrase = !pires.length
    ? "Le fichier passe tous les contrôles. Rien à signaler au client."
    : pires.map(([, t]) => t.split(/\.\s/)[0].replace(/\s\s\[.+?\]$/, "")).slice(0, 4).join(". ") + ".";
  const synth = `<div class="synthese s-${r.verdict}">
      <h3>Si on imprime comme ça</h3>
      <p>${phrase}</p>
    </div>`;

  const d = dimsSaisies();
  const fmt = d ? `${d.larg} × ${d.haut} cm`
    : p.regle_dim === "FIXE" ? `${p.larg_cm} × ${p.haut_cm} cm` : "format libre";

  $("zone").innerHTML = `
    <div class="bandeau b-${r.verdict}">
      <span class="etat">${code}</span>
      <span class="quoi"><b>${quoi}</b>${aide}</span>
      <span class="fic mono">${nomFichier}</span>
      <!-- Un fichier conforme se telecharge AUSSI : il est renomme
           CODE-MONTANT-NOM, et c'est ce nom qui fait la jonction entre
           l'email, le RIP et la facture. Le reserver aux fichiers corriges
           cassait la chaine sur le cas le plus frequent — celui ou tout
           va bien. -->
      <button id="telecharger" class="vertplein premier">${ico(ICO.telech)}${
        corrige ? "Télécharger le fichier corrigé" : "Télécharger le fichier renommé"}</button>
      <button id="autre" class="bandeau-2">${ico(ICO.autre)}Contrôler un autre fichier</button>
    </div>
    ${blocAxes(r)}
    ${outils}
    <div class="scene" id="scene">
      <div class="entete">
        <h2>${p.produit}</h2>
        <span class="fmt">${fmt} · ${p.classe} · ${p.dpi_cible} dpi · fond perdu ${p.fond_perdu_mm} mm · sécurité ${p.marge_secu_mm} mm</span>
        <span class="maj" id="badgeProduit" hidden>produit changé</span>
      </div>
      ${blocApercus(r, p)}
    </div>
    ${blocCompare(r, p)}
    ${synth}
    <div class="tableau constats">
      <div class="entete"><span>État</span><span>Constat</span><span>Pages</span></div>
      ${lignes}
    </div>
    ${blocVerifs(r, p)}
    ${blocVerifNettete(r, p)}   <!-- repli : aucune bande a montrer -->
    ${atelier(r, p, palette)}`;

  $("inspection").innerHTML = `
    ${blocDevis(p, r)}
    <div class="pan"><div class="tete">Plan de coupe</div>
      <div class="plan">${planDeCoupe(r, p, d)}</div></div>`;
  brancherDevis(p, r);
  brancherVerifs(r, p, nomFichier, corrige);
  brancherCompare(r, p);

  if (produitChange) {
    produitChange = false;
    const sc = $("scene"), bd = $("badgeProduit");
    if (sc) { sc.classList.add("flash"); setTimeout(() => sc.classList.remove("flash"), 600); }
    if (bd) { bd.hidden = false; setTimeout(() => { if ($("badgeProduit")) $("badgeProduit").hidden = true; }, 2600); }
  }

  $("autre").onclick = reinit;

  if ($("adopter")) $("adopter").onclick = () => {
    if (!$("dLarg")) return;
    $("dLarg").value = r.proposition.larg;
    $("dHaut").value = r.proposition.haut;
    dimsMemo[p.code] = { larg: r.proposition.larg, haut: r.proposition.haut };
    majAlerteDims();
    relancer();
  };

  if ($("appliquer")) $("appliquer").onclick = async () => {
    /* Les cases doivent etre LUES AVANT de vider la zone : la barre de
       progression remplacait le DOM, donc $("cMiseAuFormat") renvoyait null
       et toutes les options passaient a false. La correction ne faisait
       plus rien, sans la moindre erreur. */
    const choix = {
      boitesSeules: !!r.fpIntegre,
      miseAuFormat: !!($("cMiseAuFormat") && $("cMiseAuFormat").checked),
      orientation:  !!($("cOrientation") && $("cOrientation").checked),
      fondPerdu:    !!($("cFondPerdu")   && $("cFondPerdu").checked),
      margeSecu:    $("cMarge") && $("cMarge").checked ? parseFloat($("cMargeMm").value) || 0 : 0,
      oeillets:     !!($("cOeillets") && $("cOeillets").checked),
      centrerVisuel:!!($("cCentrer") && $("cCentrer").checked),
      encre:        r.bande && r.bande.encre ? r.bande.encre : null,
      remplissage:  ($("cBlanc") ? $("cBlanc").checked : CHOIX_BLANC) ? "blanc" : "couleur",
      orientationCible: r.orientVoulue,
    };
    const dimsAv = dimsSaisies(), orientAv = orientationChoisie();
    PROG_ON = true; $("zone").innerHTML = ""; progres(15, "correction du fichier"); await souffler();
    try {
      const { octets, journal } = await corriger(source, p, choix, palette, dimsAv);
      source = octets.buffer.slice(octets.byteOffset, octets.byteOffset + octets.byteLength);
      viderCachePdf();
      palette = await couleursDuVisuel(source);
      {
        /* Comparer une double page a une page seule n'a aucun sens : la vue
           « apres » doit etre la MEME face, recomposee sur le fichier corrige. */
        const fA = estCahier(p, vues.nbPages) ? imposer(vues.nbPages) : null;
        const f = fA ? fA[Math.min(PAGE_VUE, fA.length) - 1] : null;
        vues.apres = f ? await apercuFace(source, f.g, f.d, 0, p)
                       : await apercu(source);
      }
      vues.journal = journal;
      noterCorrection(journal);
      const r2 = await controler(source, p, dimsAv, orientAv);
      r2.constats.unshift(["NOTE", "Fichier corrigé : " + journal.join(" ")]);
      afficher(r2, p, nomFichier.replace(/\.(pdf|jpe?g|png)$/i, "") + "_CORRIGE.pdf", octets);
    } catch (e) {
      PROG_ON = false;
      alert("Correction impossible : " + e.message);
    }
  };

  if ($("bat")) $("bat").onclick = async () => {
    const b = $("bat");
    const libelle = b.innerHTML;
    b.textContent = "génération…";
    try {
      const octets = await genererDoc(r, p, nomFichier, dimsSaisies());
      telecharger(octets, "BAT-" + nommer(p, r, nomFichier));
      b.innerHTML = libelle;
    } catch (e) { b.textContent = "génération impossible : " + e.message; }
  };

  /* Un fichier conforme doit pouvoir partir en production sous le nom
     CODE-MONTANT-NOM, sans avoir ete modifie : c'est le nommage qui fait la
     jonction email / RIP / facture, pas la correction. */
  if ($("telecharger")) $("telecharger").onclick = async () => {
    if (corrige) return telecharger(corrige, nommer(p, r, nomFichier));
    const b = $("telecharger"), l = b.innerHTML;
    try {
      const m = await marquerSeul(source, p, dimsSaisies());
      telecharger(m ? m.octets : new Uint8Array(source.slice(0)), nommer(p, r, nomFichier));
    } catch (e) {
      telecharger(new Uint8Array(source.slice(0)), nommer(p, r, nomFichier));
      b.innerHTML = l;
    }
  };

  if ($("pivoter")) $("pivoter").onclick = async () => {
    const dimsAv = dimsSaisies(), orientChoix = orientationChoisie();   /* lus avant que la barre vide le DOM */
    PROG_ON = true; $("zone").innerHTML = ""; progres(20, "rotation du visuel"); await souffler();
    try {
      ROT_MANU = (ROT_MANU + 90) % 360;
      source = await appliquerRotation(SOURCE_INIT, ROT_MANU, p, dimsAv,
                                       PALETTE_INIT && PALETTE_INIT.dominante);
      viderCachePdf();
      palette = await couleursDuVisuel(source);
      PAGE_VUE = 1; VUE_COTE = 0; reinitVerifs();
      vues.avant = await apercu(source, 1);
      vues.apres = null; vues.journal = null;
      const r2 = await controler(source, p, dimsAv, orientChoix);
      r2.constats.unshift(["RELEVE", ROT_MANU
        ? `Visuel pivoté de ${ROT_MANU}° par l'opérateur, à partir du fichier client.`
        : "Visuel remis dans son sens d'origine.", "", ""]);
      afficher(r2, p, nomFichier, false);
    } catch (e) { PROG_ON = false; alert("Rotation impossible : " + e.message); }
  };

  if ($("revenir")) $("revenir").onclick = async () => {
    const dimsAv = dimsSaisies(), orientAv = orientationChoisie();
    PROG_ON = true; $("zone").innerHTML = ""; progres(20, "retour au fichier client"); await souffler();
    try {
      /* Retour a l'etat de depart, quelles que soient les modifications :
         correction, rotation, verifications tranchees, page affichee. */
      viderCachePdf();
      source = SOURCE_INIT; palette = PALETTE_INIT;
      PAGE_VUE = 1; VUE_COTE = 0; ROT_MANU = 0; CURSEUR = 50;
      reinitVerifs();
      vues.avant = await apercu(source, 1);
      vues.apres = null; vues.journal = null; vues.rAvant = null;
      vues.avantA = null; vues.apresA = null;
      const r0 = await controler(source, p, dimsAv, orientAv);
      afficher(r0, p, NOM_INIT || nomFichier, false);
    } catch (e) { PROG_ON = false; alert("Retour impossible : " + e.message); }
  };

  $("rapport").onclick = () => afficherRapport(r, p, nomFichier);

  $("copier").onclick = async () => {
    const b = $("copier"), l = b.innerHTML;
    b.textContent = "génération…";
    try {
      const octets = await genererDoc(r, p, nomFichier, dimsSaisies(), "atelier");
      telecharger(octets, "RAPPORT-" + nommer(p, r, nomFichier));
      b.innerHTML = l;
    } catch (e) { b.textContent = "échec : " + e.message; }
  };

  if ($("rapClient")) $("rapClient").onclick = async () => {
    const b = $("rapClient"), l = b.innerHTML;
    b.textContent = "génération…";
    try {
      const octets = await genererDoc(r, p, nomFichier, dimsSaisies(), "client");
      telecharger(octets, "CLIENT-" + nommer(p, r, nomFichier));
      b.innerHTML = l;
    } catch (e) { b.textContent = "échec : " + e.message; }
  };
}

/* Un abandon silencieux serait pire que le probleme : on le dit. */
function signalerAbandonLocal() {
  if (!REF_LOCALE_ABANDONNEE) return "";
  /* lire AVANT de remettre a zero : l'inverse levait une TypeError, et
     comme cette fonction construit la zone de depot, l'ecran restait vide */
  const a = REF_LOCALE_ABANDONNEE.ajoutes || [];
  REF_LOCALE_ABANDONNEE = null;
  if (!a.length) return "";
  return `<div class="avert" style="margin:14px 16px">Le référentiel publié contient
    ${a.length} produit${a.length > 1 ? "s" : ""} que ce poste n'avait pas :
    <b>${a.join(", ")}</b>. Ils ont été ajoutés ; vos réglages sur les autres produits
    sont conservés.</div>`;
}

function reinit() {
  vues.avant = null; vues.apres = null; vues.rAvant = null; vues.nomAvant = null; vues.journal = null;
  vues.nbPages = 1; PAGE_VUE = 1; VUE_COTE = 0;
  SOURCE_INIT = null; PALETTE_INIT = null; NOM_INIT = null; ROT_MANU = 0; CHOIX_BLANC = false;
  ORIGINE = null; ANALYSE_DEMANDEE = false;
  viderCacheBmp();
  reinitVerifs();
  let bandeau = "";
  try { bandeau = signalerAbandonLocal(); } catch (e) { bandeau = ""; }
  $("zone").innerHTML = bandeau + `
    <div class="depot${pret ? "" : " bloque"}" id="depot" tabindex="0" role="button" aria-label="Déposer le fichier client">
      <h2>Déposer le fichier du client ici</h2><p>PDF, JPEG ou PNG — ou cliquer pour choisir</p>
    </div>`;
  $("inspection").innerHTML = "";
  brancherDepot();
}

/* Barre de progression. L'analyse dure de 200 ms a plusieurs secondes selon
   le format : sans retour visuel, l'operateur croit que rien ne se passe et
   redepose le fichier. Les paliers sont des reperes de deroulement, pas une
   mesure de temps restant. */
let PROG_ON = false;
/* Un fichier de 10 Mo etait re-copie et re-analyse a chaque etape :
   couleurs, apercu, comptage des pages, controle, bande de securite, puis
   une fois PAR PAGE pour la nettete. Sur un 8 pages, plus de dix analyses
   completes du meme document. On ouvre une fois et on garde la main. */
let PDF_CACHE = { buf: null, doc: null };
async function ouvrirPdf(buffer) {
  if (PDF_CACHE.buf === buffer && PDF_CACHE.doc) return PDF_CACHE.doc;
  if (PDF_CACHE.doc) { try { await PDF_CACHE.doc.destroy(); } catch (e) {} }
  const doc = await pdfjsLib.getDocument({
    data: new Uint8Array(buffer.slice(0)), isEvalSupported: false }).promise;
  PDF_CACHE = { buf: buffer, doc };
  return doc;
}
function viderCachePdf() {
  viderRaster();
  if (PDF_CACHE.doc) { try { PDF_CACHE.doc.destroy(); } catch (e) {} }
  PDF_CACHE = { buf: null, doc: null };
}

function progres(pct, texte) {
  if (!PROG_ON) return;
  const z = $("zone");
  if (!z) return;
  let b = document.getElementById("prog");
  if (!b) {
    z.innerHTML = `<div class="prog" id="prog"><div class="progbar"><i></i></div>
      <span class="progtxt mono"></span></div>`;
    b = document.getElementById("prog");
  }
  const i = b.querySelector("i"), t = b.querySelector(".progtxt");
  if (i) i.style.width = Math.max(0, Math.min(100, pct)) + "%";
  if (t) t.textContent = texte || "";
}

async function souffler() { return new Promise((r) => setTimeout(r, 0)); }

/* Le fichier est depose et affiche, mais rien n'est analyse ni corrige
   tant que l'operateur n'a pas demande le controle. */
let ANALYSE_DEMANDEE = false;

/* ==================================================================== */
/* PAGES D'UN LOT — ce qui ne va pas ensemble, et quoi faire             */
/* -------------------------------------------------------------------- */
/* Deux JPEG pour un recto verso, l'un en portrait, l'autre en paysage.  */
/* L'outil le constatait apres l'analyse, en fin de parcours, sans dire  */
/* QUELLE page pivoter. La decision se prend ici, AVANT l'analyse, page  */
/* par page, et l'assemblage est rejoue depuis les fichiers d'origine.   */
/* ==================================================================== */
function blocLot(p) {
  if (!LOT_PAGES || LOT_PAGES.length < 2) return "";
  const d = diagnosticLot(LOT_PAGES);
  const c = formatCible(p, dimsSaisies());
  const sensVoulu = c ? (c.haut >= c.larg ? "PORTRAIT" : "PAYSAGE") : null;
  const alerte = !d ? "" :
      d.reparableParRotation
        ? `Ces pages ont la même taille mais pas le même sens. Pivoter celle qui
           ne va pas suffit à les rendre imprimables ensemble.`
    : d.taillesMelees && d.sensMeles
        ? `Ces pages n'ont ni la même taille ni le même sens. Un recto verso
           s'imprime sur une seule feuille : elles ne pourront être ni imprimées
           ni coupées ensemble. Pivoter aligne les sens, mais l'écart de taille
           restera — il faudra redemander un fichier au client.`
    : d.taillesMelees
        ? `Ces pages n'ont pas la même taille. Elles ne pourront être ni imprimées
           ni coupées ensemble : redemander un fichier au client.`
        : `Ces pages n'ont pas le même sens. Pivoter celle qui ne va pas les
           rendra imprimables ensemble.`;

  return `
    <div class="lot ${d ? "lot-ko" : "lot-ok"}">
      <div class="lot-tete">${d ? "Ces pages ne vont pas ensemble" : "Pages assemblées"}</div>
      ${alerte ? `<p class="lot-txt">${alerte}</p>` : ""}
      <div class="lot-lignes">
        ${LOT_PAGES.map((q, i) => {
          const faux = sensVoulu && q.sens !== sensVoulu;
          return `
          <div class="lot-l${faux ? " ko" : ""}">
            <span class="lot-n">Page ${q.no}</span>
            <span class="lot-f">${q.nom}</span>
            <img class="lot-v" id="lotv${i}" alt="Page ${q.no}">
            <span class="lot-d">${q.cm || `${q.largCm.toFixed(1)} × ${q.hautCm.toFixed(1)} cm`}
              · ${q.sens.toLowerCase()}${q.rot ? ` · pivotée ${q.rot}°` : ""}</span>
            <button class="lot-b" data-rot="${i}">${q.rot ? "Remettre d'aplomb" : "Pivoter 90°"}</button>
          </div>`;
        }).join("")}
      </div>
      ${sensVoulu ? `<p class="lot-txt lot-cible">Le produit demande des pages
        en ${sensVoulu.toLowerCase()}.</p>` : ""}
    </div>`;
}

/* Petites vues de chaque page du lot assemble, rendues une par une. */
async function vignettesLot() {
  const buf = SOURCE_INIT;
  if (!buf || !LOT_PAGES) return;
  for (let i = 0; i < LOT_PAGES.length; i++) {
    const im = $("lotv" + i);
    if (!im) continue;
    try {
      const r = await rendrePage(buf, 96, i + 1);
      im.src = r.cv.toDataURL("image/png");
      im.classList.add("on");
    } catch (e) { /* une vignette manquante ne bloque rien */ }
    await souffler();
  }
}

function ecranAttente(p) {
  const c = formatCible(p, dimsSaisies());
  const cible = c ? `${c.larg} × ${c.haut} cm` : "format libre";
  $("zone").innerHTML = `
    <div class="attente">
      <div class="attente-quoi">
        <b>${dernierNom || "fichier déposé"}</b>
        ${LOT_NOMS && LOT_NOMS.length > 1
          ? `<span class="attente-lot">${LOT_NOMS.length} fichiers assemblés</span>` : ""}
        <!-- Le produit se change ICI, avant l'analyse. Le rail est loin du
             bouton, et se tromper de produit invalide tout le controle : le
             choix doit etre a portee de regard du fichier. -->
        <div class="attente-prod">
          <label for="prodAttente">Produit commandé</label>
          <select id="prodAttente">
            ${["IMPRIMERIE", "SIGNALETIQUE"].map((fam) => `
              <optgroup label="${fam}">
                ${REF.filter((x) => x.famille === fam).map((x) => `
                  <option value="${x.code}"${x.code === p.code ? " selected" : ""}>${x.produit}</option>`).join("")}
              </optgroup>`).join("")}
          </select>
          <span class="attente-fmt">${cible}${c && c.permute ? " · pivoté selon l'orientation commandée" : ""}</span>
        </div>
      </div>
      <div class="attente-tete">
        <button id="lancerAnalyse" class="cta-analyse">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6"/></svg>Analyser le fichier</button>
        <button id="autre2" class="cta-secondaire">Contrôler un autre fichier</button>
      </div>
      ${blocLot(p)}
      <p class="attente-aide">Le fichier est affiché tel qu'il a été reçu. Rien n'a été
      recadré, redimensionné ni recentré. Vérifiez le produit et les dimensions à droite,
      puis lancez l'analyse.</p>
      <div class="apercus">
        ${figureApercu(vues.avant, "Fichier client", p, false, null)}
      </div>
    </div>`;
  $("inspection").innerHTML = "";
  $("lancerAnalyse").onclick = () => { ANALYSE_DEMANDEE = true; traiter(null); };
  $("autre2").onclick = reinit;
  /* Le meme chemin que le rail : on ecrit dans le select maitre et on
     declenche son onchange, pour ne pas dupliquer la logique de changement
     de produit — image reconvertie, reperes redessines, analyse invalidee. */
  for (const b of document.querySelectorAll(".lot-b")) b.onclick = () => {
    const i = Number(b.dataset.rot);
    LOT_ROT[i] = LOT_ROT[i] ? 0 : 90;
    rassembler();
  };
  /* Vignette de chaque page du lot : l'operateur pivote ce qu'il VOIT.
     Rendue en tache de fond, apres l'affichage, pour ne pas retarder
     l'ecran d'attente. */
  if (LOT_PAGES && LOT_PAGES.length > 1 && SOURCE_INIT) vignettesLot();
  if ($("prodAttente")) $("prodAttente").onchange = (e) => {
    $("produit").value = e.target.value;
    $("produit").dispatchEvent(new Event("change"));
  };
}

/* ==================================================================== */
/* PLUSIEURS FICHIERS POUR UNE SEULE COMMANDE                           */
/* -------------------------------------------------------------------- */
/* Le comptoir recoit un recto et un verso en deux JPEG, ou huit pages   */
/* de brochure en huit fichiers. Le moteur sait deja tout faire en       */
/* multi-page — pagination, imposition en cahier, controle page par page */
/* — c'est l'ENTREE qui n'acceptait qu'un fichier.                       */
/* Chaque fichier devient une page, dans l'ordre de selection. Melange   */
/* PDF / JPEG / PNG accepte : c'est le cas reel du comptoir.             */
/* Conversion SEQUENTIELLE, jamais en parallele : sur des gros JPEG, huit */
/* decodages simultanes font tomber l'onglet.                            */
/* ==================================================================== */
async function assemblerFichiers(liste, p, rot) {
  const doc = await PDFLib.PDFDocument.create();
  const pages = [];
  let n = 0;
  for (const f of liste) {
    const brut = await f.arrayBuffer();
    const debut = doc.getPageCount();
    let meta = { nom: f.name, cm: "", px: "", dpi: 0 };
    if (estImage(f)) {
      const genre = genreImage(f);
      const mime = genre === "png" ? "image/png" : "image/jpeg";
      const dec = await decoderImage(brut, mime, BUDGET_DECODE);
      const pxL = dec.natW || dec.W, pxH = dec.natH || dec.H;
      if (pxL * pxH > PX_MAX)
        throw new Error(` : « ${f.name} » fait ${Math.round(pxL * pxH / 1e6)} Mpx, au-delà de ce qu'un navigateur peut traiter`);
      /* Meme regle qu'en fichier unique : dimension NATIVE, aucune
         correction silencieuse au depot. */
      const nat = tailleNaturelle(pxL, pxH, p);
      const un = await imageVersPdf(brut, genre, nat.larg, nat.haut);
      const src = await PDFLib.PDFDocument.load(un);
      for (const pg of await doc.copyPages(src, src.getPageIndices())) doc.addPage(pg);
      /* Dimension DECLAREE, celle que Photoshop affiche : elle sert
         uniquement a parler au client, jamais au controle geometrique. */
      const dres = dpiEnTete(brut, genre);
      const dx = dres ? dres.x : 72, dy = dres ? dres.y : 72;
      meta = { nom: f.name, dpi: Math.round(dx), px: `${pxL} × ${pxH} px`,
               cm: `${(pxL / dx * 2.54).toFixed(1)} × ${(pxH / dy * 2.54).toFixed(1)} cm` };
    } else {
      let src;
      try { src = await PDFLib.PDFDocument.load(brut, { ignoreEncryption: true }); }
      catch (e) { throw new Error(` : « ${f.name} » n'est pas un PDF lisible`); }
      for (const pg of await doc.copyPages(src, src.getPageIndices())) doc.addPage(pg);
    }
    /* Rotation demandee par l'operateur, page par page. */
    for (let k = debut; k < doc.getPageCount(); k++) {
      const pg = doc.getPage(k);
      if (rot && rot[n]) pg.setRotation(PDFLib.degrees(((rot[n] % 360) + 360) % 360));
      const t = pg.getSize(), q = (rot && rot[n]) % 180 === 90;
      const L = q ? t.height : t.width, H = q ? t.width : t.height;
      pages.push(Object.assign({}, meta, {
        no: n + 1, rot: (rot && rot[n]) || 0,
        largCm: L / 72 * 2.54, hautCm: H / 72 * 2.54,
        sens: H >= L ? "PORTRAIT" : "PAYSAGE" }));
      n++;
    }
    await souffler();          /* la barre de progression respire */
  }
  if (!doc.getPageCount()) throw new Error(" : aucun contenu exploitable dans ces fichiers");
  return { octets: (await doc.save()).buffer, pages: pages,
           noms: pages.map((x) => x.nom), nb: doc.getPageCount() };
}

/* Les pages vont-elles ensemble ?
   Un recto verso s'imprime sur UNE feuille : deux pages de sens ou de
   format differents ne peuvent etre ni imprimees ni coupees ensemble.
   L'outil le constatait deja, mais sans dire QUOI FAIRE. Ici on nomme la
   page fautive et on propose de la pivoter. */
function diagnosticLot(pages) {
  if (!pages || pages.length < 2) return null;
  const sens = [...new Set(pages.map((x) => x.sens))];
  const fmt = [...new Set(pages.map((x) =>
    `${x.largCm.toFixed(1)}x${x.hautCm.toFixed(1)}`))];
  /* Deux pages de sens opposes ont, par construction, des formats
     differents : ne pas compter deux fois le meme probleme. */
  const memeFormatApresRotation = fmt.length > 1 && sens.length > 1
    && new Set(pages.map((x) => [x.largCm, x.hautCm].sort((a, b) => a - b)
        .map((v) => v.toFixed(1)).join("x"))).size === 1;
  if (sens.length === 1 && fmt.length === 1) return null;
  return { sensMeles: sens.length > 1,
           taillesMelees: fmt.length > 1 && !memeFormatApresRotation,
           reparableParRotation: sens.length > 1 && memeFormatApresRotation };
}

/* Point d'entree unique. Un seul fichier suit le chemin d'origine ; a
   partir de deux, on assemble d'abord puis on repart sur ce chemin. */
async function traiterLot(liste) {
  const fs = [...liste].filter(Boolean);
  if (!fs.length) return;
  if (fs.length === 1) return traiter(fs[0]);

  const p = produitCourant();
  const max = plafondPages(p);
  if (max && fs.length > max) {
    alert(`${p.produit} accepte au plus ${max} page${max > 1 ? "s" : ""}.\n`
        + `${fs.length} fichiers ont été déposés.`);
    return;
  }
  LOT_FICHIERS = fs;
  /* Indexe par PAGE, pas par fichier : un PDF de quatre pages compte pour
     quatre. Tant que les pages ne sont pas connues, le tableau est vide et
     assemblerFichiers lit 0 partout. */
  LOT_ROT = [];
  return rassembler();
}

/* Assemble (ou reassemble) le lot courant avec les rotations demandees.
   Rejoue depuis les fichiers d'origine : une rotation n'est jamais
   appliquee par-dessus la precedente. */
async function rassembler() {
  const fs = LOT_FICHIERS;
  if (!fs || fs.length < 2) return;
  const p = produitCourant();
  try {
    if (!pret) { alert("Le moteur n'est pas encore prêt, réessayez dans un instant."); return; }
    PROG_ON = true; progres(8, `assemblage de ${fs.length} fichiers`);
    const lot = await assemblerFichiers(fs, p, LOT_ROT);
    /* Premier assemblage : on connait enfin le nombre de pages. */
    while (LOT_ROT.length < lot.pages.length) LOT_ROT.push(0);
    const nom = fs[0].name.replace(/\.[^.]+$/, "") + `-et-${fs.length - 1}-autre${fs.length > 2 ? "s" : ""}.pdf`;
    LOT_NOMS = lot.noms;
    LOT_PAGES = lot.pages;
    ASSEMBLAGE_EN_COURS = true;
    await traiter(new File([lot.octets], nom, { type: "application/pdf" }));
  } catch (e) {
    PROG_ON = false;
    LOT_NOMS = null; LOT_PAGES = null; LOT_FICHIERS = null;
    alert("Ces fichiers n'ont pas pu être assemblés" + (e.message || "") + ".");
  }
}

/* Plafond de pages porte par le produit, jamais code en dur. */
function plafondPages(p) {
  if (!p) return 0;
  if (p.pages === "RECTO") return 1;
  if (p.pages === "RV_LIBRE" || p.pages === "RV_OBLIGATOIRE") return 2;
  return 0;                    /* MULTIPLE4 et le reste : pas de plafond */
}

let LOT_NOMS = null;
let LOT_PAGES = null;        /* une entree par page : nom, dimension declaree, sens */
let LOT_FICHIERS = null;     /* les fichiers d'origine, pour rejouer l'assemblage */
let LOT_ROT = null;          /* rotation demandee par page, en degres */
let ASSEMBLAGE_EN_COURS = false;

async function traiter(f) {
  const p = produitCourant();
  if (!p || !pret) return;
  if (f) dernierNom = f.name;
  if (!f && !source) { reinit(); return; }
  $("zone").innerHTML = "";
  $("inspection").innerHTML = "";
  PROG_ON = true;
  progres(4, "lecture de " + dernierNom);
  await souffler();
  try {
    if (f) {
      ANALYSE_DEMANDEE = false;
      /* Un depot direct efface la trace d'un lot precedent : le bandeau ne
         doit jamais annoncer des fichiers qui ne sont plus la. */
      if (!ASSEMBLAGE_EN_COURS) {
        LOT_NOMS = null; LOT_PAGES = null; LOT_FICHIERS = null; LOT_ROT = null;
      }
      ASSEMBLAGE_EN_COURS = false;
      ouvrirLigne(f.name);
      const brut = await f.arrayBuffer();
      if (estImage(f)) {
        const genre = genreImage(f);
        const mime = genre === "png" ? "image/png" : "image/jpeg";
        const dec = await decoderImage(brut, mime, BUDGET_DECODE);
        /* pxL / pxH sont les pixels REELS du client, jamais ceux du bitmap
           reduit pour l'affichage. */
        const pxL = dec.natW || dec.W, pxH = dec.natH || dec.H;
        if (pxL * pxH > PX_MAX)
          throw new Error(` : image de ${Math.round(pxL * pxH / 1e6)} Mpx, au-delà de ce qu'un navigateur peut traiter. Demander au client une version réduite`);
        /* Sur un produit a dimension libre, c'est le FICHIER qui donne la
           taille. Prendre le mini du produit transformait une image de
           60 cm en vinyle de 3 x 3 cm sans rien dire. */
        const nat = tailleNaturelle(pxL, pxH, p);
        if (p.regle_dim !== "FIXE") poserDims(nat.larg, nat.haut, p.code);
        /* L'image est convertie A SA DIMENSION NATIVE, jamais au format
           commande. La mise au format, le recentrage et le comblement sont
           des CORRECTIONS : elles passent par l'atelier, elles sont nommees
           et validees sur le bon a tirer. Une modification faite au depot
           n'apparait nulle part et n'est pas defendable en litige. */
        const cibleL = nat.larg, cibleH = nat.haut;
        if (!(cibleL > 0 && cibleH > 0))
          throw new Error(" dimensions indéterminables pour ce fichier");
        /* La nettete se mesure sur les PIXELS DU CLIENT. */
        let gr;
        if (dec.reduit) {
          const vues = await grisEchantillonne(brut, mime, pxL, pxH, NETTETE.budgetPx);
          gr = vues ? { g: vues[0].g, W: vues[0].W, H: vues[0].H, recadre: true, vues: vues }
                    : grisDeBitmap(dec.bmp, dec.W, dec.H, NETTETE.budgetPx);
        } else {
          gr = grisDeBitmap(dec.bmp, dec.W, dec.H, NETTETE.budgetPx);
        }
        const prof = sondeProfil(brut, genre);
        /* 72 dpi par defaut : c'est ce que fait Photoshop quand le fichier
           ne declare rien. L'operateur doit lire le meme chiffre que le client. */
        const dres = dpiEnTete(brut, genre);
        ORIGINE = { type: "image", nom: f.name, genre: genre, pxL: pxL, pxH: pxH,
                    dpiX: dres ? dres.x : 72, dpiY: dres ? dres.y : 72,
                    dpiDeclare: !!dres,
                    natL: nat.larg, natH: nat.haut, brut: brut,
                    icc: prof.icc, cmjn: prof.cmjn, gris: gr.g, W: gr.W, H: gr.H,
                    recadre: gr.recadre, vues: gr.vues || null, reduit: !!dec.reduit,
                    cibleL: cibleL, cibleH: cibleH };
        source = await imageVersPdf(brut, genre, cibleL, cibleH);
      } else {
        ORIGINE = null;
        source = brut;
        /* Meme principe pour un PDF sur produit a dimension libre : la
           page du client fait foi, l'operateur ajuste ensuite. */
        if (p.regle_dim !== "FIXE" && !dimsSaisies()) {
          try {
            const d0 = await pdfjsLib.getDocument({ data: new Uint8Array(brut.slice(0)) }).promise;
            const v0 = (await d0.getPage(1)).getViewport({ scale: 1 });
            poserDims(v0.width / 72 * 2.54, v0.height / 72 * 2.54, p.code);
            await d0.destroy();
          } catch (e) { /* on laisse l'operateur saisir */ }
        }
      }
      viderCachePdf();
      progres(22, "couleurs du visuel");
      await souffler();
      /* On rasterise d'emblee a la resolution du plus gros besoin de la
         chaine : les etapes suivantes n'auront plus qu'a reechantillonner. */
      try { await rendrePage(source, besoinRaster(), 1); } catch (e) {}
      palette = await couleursDuVisuel(source);
      SOURCE_INIT = source; PALETTE_INIT = palette; NOM_INIT = f.name;
      progres(36, "aperçu");
      await souffler();
      PAGE_VUE = 1; VUE_COTE = 0; ROT_MANU = 0;
      vues.apres = null; vues.avantA = null; vues.apresA = null;
      try {
        const d0 = await ouvrirPdf(source);
        vues.nbPages = d0.numPages;
      } catch (e) { vues.nbPages = 1; }
      const fcs = estCahier(p, vues.nbPages) ? imposer(vues.nbPages) : null;
      vues.avant = fcs ? await apercuFace(source, fcs[0].g, fcs[0].d, 0, p)
                       : await apercu(source, 1);
    }
    /* Au changement de produit, l'apercu doit changer de nature : une
       brochure se regarde par FACE, un flyer par page. Sans ce basculement,
       le passage en brochure gardait la page 1 seule a l'ecran. */
    try {
      const fcs = estCahier(p, vues.nbPages) ? imposer(vues.nbPages) : null;
      if (fcs && (!vues.avant || !vues.avant.face)) {
        PAGE_VUE = 1;
        vues.avant = await apercuFace(source, fcs[0].g, fcs[0].d, 0, p);
        vues.avantA = null;
      } else if (!fcs && vues.avant && vues.avant.face) {
        PAGE_VUE = 1;
        vues.avant = await apercu(source, 1);
        vues.avantA = null;
      }
    } catch (e) { /* l'apercu reste celui d'avant */ }

    /* ---------------------------------------------------------------- */
    /* VERROU D'ANALYSE                                                   */
    /* L'analyse ne part que sur clic. Un « Appliquer et recontrôler » qui */
    /* révèle des options absentes au premier passage est le pire cas au  */
    /* comptoir : l'opérateur croit avoir fini, il valide, et l'outil lui  */
    /* dit après coup qu'il restait du travail.                           */
    /* ---------------------------------------------------------------- */
    if (!ANALYSE_DEMANDEE) { PROG_ON = false; ecranAttente(p); return; }

    progres(50, "contrôle du fichier");
    await souffler();
    const r = await controler(source, p, dimsSaisies(), orientationChoisie());
    progres(96, "mise en page du résultat");
    await souffler();
    if (!vues.apres) { vues.rAvant = r; vues.nomAvant = dernierNom; }
    majLigne(r, p, dimsSaisies());
    afficher(r, p, dernierNom);
  } catch (e) {
    PROG_ON = false;
    $("zone").innerHTML = `<div class="bandeau b-ROUGE">
        <span class="etat">Illisible</span>
        <span class="quoi"><b>Le fichier n'a pas pu être analysé</b>${e.message}. Formats acceptés : PDF, JPEG, PNG. Pour tout le reste (Word, Publisher, Photoshop, Illustrator), demander au client un export PDF.</span>
      </div><div class="actions"><button id="autre">Contrôler un autre fichier</button></div>`;
    $("inspection").innerHTML = "";
    $("autre").onclick = reinit;
  }
}

function brancherDepot() {
  const d = $("depot");
  if (!d) return;
  if (!pret) d.classList.add("bloque");
  d.onclick = () => $("fichier").click();
  d.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("fichier").click(); } };
  ["dragenter","dragover"].forEach(ev => d.addEventListener(ev, e => { e.preventDefault(); d.classList.add("survol"); }));
  ["dragleave","drop"].forEach(ev => d.addEventListener(ev, e => { e.preventDefault(); d.classList.remove("survol"); }));
  d.addEventListener("drop", e => { if (e.dataTransfer.files.length) traiterLot(e.dataTransfer.files); });
}

/* Import d'un referentiel mis a jour, depuis le pied de page.
   -------------------------------------------------------------------
   CORRIGE : cette fonction decoupait la ligne sur `split(";")` sans tenir
   compte des guillemets. Or la colonne `paliers` contient elle-meme des
   points-virgules — « 100:19;200:38;300:49 » — et l'export les entoure de
   guillemets, comme le veut le format CSV.
   Consequence : des qu'une grille tarifaire etait saisie, l'import par ce
   bouton decalait TOUTES les colonnes a partir de `paliers`. Les prix
   atterrissaient dans `note`, les paliers dans `prix_m2`, en silence.
   L'import de l'admin, lui, passait deja par `depuisCsv`, qui gere les
   guillemets. Il n'y a aucune raison d'avoir deux analyseurs : on garde
   le bon. */
function parserCsv(txt) { return depuisCsv(txt); }

/* ---------------------------------------------------------------------
   Verrou de l'administration.
   Empêche une modification involontaire du référentiel ou des tarifs
   depuis un poste d'atelier. Ce n'est pas un secret : le code est lisible
   dans la source. C'est un garde-fou, pas une protection.
   POUR CHANGER LE CODE : modifier la ligne ci-dessous, rien d'autre.
   --------------------------------------------------------------------- */
const CODE_ADMIN = "1234";

function adminDeverrouille() {
  if (sessionStorage.getItem("calage.admin") === "ok") return true;
  const saisi = prompt("Code d'accès à l'administration");
  if (saisi === null) return false;                 // annulation
  if (saisi.trim() === CODE_ADMIN) {
    sessionStorage.setItem("calage.admin", "ok");   // oublié à la fermeture de l'onglet
    return true;
  }
  alert("Code incorrect.");
  return false;
}

$("ouvrirAdmin").onclick = () => { if (adminDeverrouille()) ouvrirAdmin("specs"); };
$("choisirDossier").onclick = () => choisirDossier();
$("importCsv").onclick = () => $("csv").click();
$("csv").onchange = async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    REF = parserCsv(await f.text());
    peuplerSelect();
  } catch (err) { alert("Référentiel illisible : " + err.message); }
};

$("produit").onchange = () => { produitChange = true; majRail(); majFiche(); relancer(); };
$("fichier").onchange = (e) => { if (e.target.files.length) traiterLot(e.target.files); };

/* charte graphique : une seule source, le fichier charte.js */
function appliquerCharte() {
  if (typeof CHARTE === "undefined") return;
  const r = document.documentElement.style;
  const c = CHARTE.couleurs || {};
  const map = { marque:"--marque", barre:"--barre", barre2:"--barre2", barreTexte:"--barreTexte",
                fond:"--fond", panneau:"--panneau", trait:"--trait", traitFort:"--traitFort",
                texte:"--texte", texteFaible:"--texteFaible", accent:"--accent" };
  for (const [k, v] of Object.entries(map)) if (c[k]) r.setProperty(v, c[k]);

  const pol = CHARTE.polices || {};
  if (pol.googleFonts) {
    const l = document.createElement("link");
    l.rel = "stylesheet"; l.href = pol.googleFonts;
    document.head.appendChild(l);
  }
  if (pol.titre) r.setProperty("--police-titre", pol.titre);
  if (pol.donnees) r.setProperty("--police-donnees", pol.donnees);

  if (CHARTE.nom) $("enseigne").textContent = CHARTE.nom;
  if (CHARTE.titre) $("titre").textContent = CHARTE.titre;
  if (CHARTE.gamme && CHARTE.gamme.length) {
    document.querySelector(".gamme").innerHTML =
      CHARTE.gamme.map(x => `<i style="background:${x}"></i>`).join("");
  }
  if (CHARTE.logo) {
    const img = $("logo");
    img.onload = () => { img.hidden = false; $("titre").style.display = CHARTE.logoRemplaceTitre ? "none" : ""; };
    img.onerror = () => { img.remove(); };
    img.src = CHARTE.logo;
    img.alt = CHARTE.nom || "";
    img.style.height = (CHARTE.hauteurLogo || 22) + "px";
    if (CHARTE.nom) $("tuile").textContent = CHARTE.nom.split(/\s+/).map(m => m[0]).join("").slice(0,3).toUpperCase();
  }
  if (CHARTE.nom) document.title = "Contrôle fichier · " + CHARTE.nom;
}

$("version").textContent = "v" + VERSION;
appliquerCharte();
chargerReglages();
chargerJournal();
chargerRecents();
peuplerSelect();
reinit();
reprendreDossier();
chargerMoteur().catch(() => {
  $("etatMoteur").textContent = "moteur indisponible, vérifier la connexion";
});

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
